# Static conformance of the documentation tree.
#
# check-docs-links covers docs/ and examples/ in every locale, plus the
# English-only pages a reader still follows links out of; check-docs-facts
# pins the plugin API guides to the phase schema and public headers, and pins
# the release guides to the Android release implementation and examples.  The
# paths below have to list everything the checkers read, or a page can be
# broken by a commit that never triggers this workflow -- so check-docs-links
# holds the list to the tree, and a file that grows a link without appearing
# here is reported rather than left to be discovered.  Both are
# registered as CTest cases (DocsNavigation, PluginDocsFacts) under the
# "plugin-meta" label, but no workflow reaches them: plugin-conformance runs
# `ctest -R PluginConformance`, and plugin-sanitizers excludes the label with
# `-LE plugin-meta`.  They need no build at all, so they run here on their own
# instead of riding along with a multi-hour compiler build.
name: lint-docs

on:
  push:
    paths:
      - 'docs/**'
      - 'examples/**/README*.md'
      - 'examples/android-kernel-*/Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - 'development.md'
      - 'LICENSE'
      - 'pluginsdk/**'
      - 'neverc/include/neverc/Plugin/**'
      - 'neverc/include/neverc/DynCode/**'
      - 'neverc/include/neverc/Invoke/**'
      - 'neverc/include/neverc/Foundation/AndroidKernelModuleSymbolPolicy.h'
      - 'neverc/include/neverc/Linker/Core/Driver/Dispatcher.h'
      - 'neverc/lib/Emit/**'
      - 'neverc/lib/Foundation/Core/AndroidKernelModuleReleaseNames.cpp'
      - 'neverc/lib/Invoke/Core/Driver.cpp'
      - 'neverc/lib/Invoke/ToolChains/CommonArgs.cpp'
      - 'neverc/lib/Invoke/ToolChains/NeverC.cpp'
      - 'neverc/lib/Plugin/Link/AndroidKernelReleaseIdentitySeal.cpp'
      - 'neverc/lib/Plugin/Link/BuiltinObjectMergeAdapter.cpp'
      - 'neverc/lib/Plugin/Link/LinkExecutionHooksBridge.cpp'
      - 'neverc/lib/Plugin/Core/PluginPhaseExecutor.cpp'
      - 'neverc/lib/Plugin/Object/ObjectPhaseHooks.cpp'
      - 'neverc/lib/Plugin/Object/ObjectWriterProvider.cpp'
      - 'llvm/LICENSE.TXT'
      - 'llvm/include/llvm/CodeGen/NeverCCallConv.h'
      - 'llvm/include/llvm/IR/Intrinsic*'
      - 'llvm/lib/Target/X86/**'
      - 'tests/**'
      - 'utils/plugin-api/**'
      - '.github/workflows/lint-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**/README*.md'
      - 'examples/android-kernel-*/Makefile'
      - 'README.md'
      - 'SECURITY.md'
      - 'development.md'
      - 'LICENSE'
      - 'pluginsdk/**'
      - 'neverc/include/neverc/Plugin/**'
      - 'neverc/include/neverc/DynCode/**'
      - 'neverc/include/neverc/Invoke/**'
      - 'neverc/include/neverc/Foundation/AndroidKernelModuleSymbolPolicy.h'
      - 'neverc/include/neverc/Linker/Core/Driver/Dispatcher.h'
      - 'neverc/lib/Emit/**'
      - 'neverc/lib/Foundation/Core/AndroidKernelModuleReleaseNames.cpp'
      - 'neverc/lib/Invoke/Core/Driver.cpp'
      - 'neverc/lib/Invoke/ToolChains/CommonArgs.cpp'
      - 'neverc/lib/Invoke/ToolChains/NeverC.cpp'
      - 'neverc/lib/Plugin/Link/AndroidKernelReleaseIdentitySeal.cpp'
      - 'neverc/lib/Plugin/Link/BuiltinObjectMergeAdapter.cpp'
      - 'neverc/lib/Plugin/Link/LinkExecutionHooksBridge.cpp'
      - 'neverc/lib/Plugin/Core/PluginPhaseExecutor.cpp'
      - 'neverc/lib/Plugin/Object/ObjectPhaseHooks.cpp'
      - 'neverc/lib/Plugin/Object/ObjectWriterProvider.cpp'
      - 'llvm/LICENSE.TXT'
      - 'llvm/include/llvm/CodeGen/NeverCCallConv.h'
      - 'llvm/include/llvm/IR/Intrinsic*'
      - 'llvm/lib/Target/X86/**'
      - 'tests/**'
      - 'utils/plugin-api/**'
      - '.github/workflows/lint-docs.yml'

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  check-docs-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify every locale is present and every jump resolves
        run: |
          python3 utils/plugin-api/check-docs-links.py
          echo ""
          echo "If this step fails, a guide is missing a locale, a language bar"
          echo "entry, or a link/reference definition that the other locales have."

  check-docs-facts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify the guides agree with the schema, headers and release implementation
        run: |
          python3 utils/plugin-api/check-docs-facts.py
          echo ""
          echo "If this step fails, a guide disagrees with the schema, public"
          echo "headers, SDK, Android release implementation, or example profiles."
