name: lint-test-deps

on:
  push:
    paths:
      - 'std/manifest.json'
      - 'neverc/include/neverc/Foundation/Std/StdModuleMethods.def'
      - 'neverc/lib/Foundation/Std/StdModule.cpp'
      - 'neverc/lib/Analyze/Expr/SemaExprMember.cpp'
      - 'std/include/**/*.h'
      - 'std/src/**/*.c'
      - 'tests/neverc/std/test_*.c'
      - 'tests/neverc/StdLibTests.cpp'
      - 'utils/lint/check-test-deps.py'
      - 'utils/lint/test_check_test_deps.py'
      - 'utils/lint/gen_std_module_methods.py'
      - 'utils/lint/test_gen_std_module_methods.py'
      - '.github/workflows/lint-test-deps.yml'
  pull_request:
    paths:
      - 'std/manifest.json'
      - 'neverc/include/neverc/Foundation/Std/StdModuleMethods.def'
      - 'neverc/lib/Foundation/Std/StdModule.cpp'
      - 'neverc/lib/Analyze/Expr/SemaExprMember.cpp'
      - 'std/include/**/*.h'
      - 'std/src/**/*.c'
      - 'tests/neverc/std/test_*.c'
      - 'tests/neverc/StdLibTests.cpp'
      - 'utils/lint/check-test-deps.py'
      - 'utils/lint/test_check_test_deps.py'
      - 'utils/lint/gen_std_module_methods.py'
      - 'utils/lint/test_gen_std_module_methods.py'
      - '.github/workflows/lint-test-deps.yml'

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  check-test-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test standard-library registration validator
        run: |
          python3 -m unittest \
            utils/lint/test_check_test_deps.py \
            utils/lint/test_gen_std_module_methods.py

      - name: Verify generated std dot-method dispatch table
        run: python3 utils/lint/gen_std_module_methods.py --check

      - name: Validate standard-library registration and test deps
        run: |
          python3 utils/lint/check-test-deps.py
          echo ""
          echo "Fix the reported manifest, API, or STD_TEST dependency gap."
