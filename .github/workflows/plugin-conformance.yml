# Host / target / object-format cross-platform conformance.
#
# For every native host it builds the shipped compiler plus the standalone
# PluginConformanceTests and the plugin SDK, then:
#   * runs the install-tree conformance suite (ABI negotiation, lifecycle,
#     per-domain replacement, handle/failure) through the public CLI/ABI;
#   * cross-generates a relocatable object for x86_64/aarch64 x elf/coff/macho
#     and a raw dyncode image for the built-in dyncode triples, verifying each
#     artifact with a format check (cross artifacts are parsed, never executed);
#   * re-checks the capability bindings and phase inventory of the built binary.
#
# All five native hosts run the identical steps with the same build recipe as
# the per-OS release workflows.  On Windows the fixtures are built by MSVC
# itself, so the run also proves the SDK's __declspec(dllexport) / __cdecl path
# against a non-GNU driver.
name: plugin-conformance

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "neverc/lib/Plugin/**"
      - "neverc/include/neverc/Plugin/**"
      - "neverc/lib/DynCode/**"
      - "neverc/lib/Linker/**"
      - "neverc/include/neverc/Linker/**"
      - "neverc/lib/Emit/Backend/BackendUtil.cpp"
      - "neverc/include/neverc/Emit/Backend/BackendUtil.h"
      - "neverc/include/neverc/Foundation/Core/LLVMTimeTraceRootLease.h"
      - "neverc/lib/Foundation/Core/LLVMTimeTraceRootLease.cpp"
      - "neverc/lib/Foundation/Core/ProcessResourceBroker.cpp"
      - "neverc/lib/Merge/Common/MergerCommon.h"
      - "llvm/include/**"
      - "tests/plugin-conformance/**"
      - "utils/plugin-api/**"
      - "pluginsdk/**"
      - ".github/scripts/install-llvm-windows.ps1"
      - ".github/workflows/plugin-conformance.yml"

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  conformance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runs-on: ubuntu-22.04
            python: python3
            module: .so
          - host: linux-arm64
            runs-on: ubuntu-22.04-arm
            python: python3
            module: .so
          - host: macos-arm64
            runs-on: macos-15
            python: python3
            module: .so
          - host: windows-x64
            # Same class as python-plugin-bindings: RelWithDebInfo, LTO off.
            runs-on: windows-2022
            python: python
            exe: .exe
            module: .dll
            msvc-arch: x64
            cmake-extra: >-
              -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
              -DCMAKE_LINKER=C:/LLVM/bin/lld-link.exe
              -DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO="/debug:symtab /opt:ref /opt:icf /incremental:no"
              -DLLVM_ENABLE_LLD:BOOL=ON
              -DLLVM_PARALLEL_COMPILE_JOBS=2
              -DLLVM_PARALLEL_LINK_JOBS=1
          - host: windows-arm64
            runs-on: windows-11-arm
            python: python
            exe: .exe
            module: .dll
            msvc-arch: arm64
            cmake-extra: >-
              -DCMAKE_SYSTEM_PROCESSOR=ARM64
              -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
              -DCMAKE_LINKER=C:/LLVM/bin/lld-link.exe
              -DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO="/debug:symtab /opt:ref /opt:icf /incremental:no"
              -DLLVM_ENABLE_LLD:BOOL=ON
              -DLLVM_PARALLEL_COMPILE_JOBS=2
              -DLLVM_PARALLEL_LINK_JOBS=1
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      LLVM_WINDOWS_VER: "22.1.8"
      LLVM_WINDOWS_SHA256: "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake p7zip-full
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Select latest stable Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      # CMake is pinned to the arm64 runner's version: 4.4's
      # gtest_discover_tests only appends to the generated CTest file, where
      # 3.31 truncated it first, so a target whose POST_BUILD discovery runs
      # twice registers its tests twice.
      - name: Setup build deps (Windows x64)
        if: matrix.host == 'windows-x64'
        shell: pwsh
        run: |
          choco install ninja -y

          $cmakeVer = '3.31.11'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-x86_64\bin"

      # windows-11-arm has no chocolatey packages for these; fetch the
      # ARM64-native archives the way the arm64 release workflow does.
      - name: Setup build deps (Windows arm64)
        if: matrix.host == 'windows-arm64'
        shell: pwsh
        run: |
          $cmakeVer = '3.31.11'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-arm64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-arm64\bin"

          $ninjaVer = '1.13.1'
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v$ninjaVer/ninja-winarm64.zip" -OutFile ninja.zip
          Expand-Archive ninja.zip C:\tools\ninja -Force
          Add-Content $env:GITHUB_PATH "C:\tools\ninja"

      # The strict PE gate needs both an inspecting toolchain and a linker that
      # can retain the image's complete COFF static symbol table.  One pinned
      # x64 LLVM install serves both matrices: Windows-on-Arm executes these
      # tools through x64 emulation, while LLVM tools themselves are
      # cross-architecture and understand ARM64 COFF.
      - name: Cache LLVM PE audit toolchain (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: plugin-pe-audit-llvm-${{ env.LLVM_WINDOWS_VER }}-${{ env.LLVM_WINDOWS_SHA256 }}-win64

      - name: Setup LLVM PE audit toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LLVM_VER: ${{ env.LLVM_WINDOWS_VER }}
          LLVM_SHA256: ${{ env.LLVM_WINDOWS_SHA256 }}
          LLVM_TOOLS_ONLY: "1"
        run: |
          & neverc/.github/scripts/install-llvm-windows.ps1

          $llvmBin = 'C:\LLVM\bin'
          foreach ($tool in @('lld-link.exe', 'llvm-readobj.exe')) {
            $path = Join-Path $llvmBin $tool
            if (-not (Test-Path -LiteralPath $path)) {
              throw "required PE audit tool is missing: $path"
            }
            $version = (& $path --version) -join "`n"
            if ($LASTEXITCODE -ne 0) {
              throw "$tool --version failed with exit code $LASTEXITCODE"
            }
            if ($version -notmatch [regex]::Escape($env:LLVM_VER)) {
              throw "unexpected $tool version: $version"
            }
          }

      # Puts cl.exe on PATH, which is also the system C compiler the
      # conformance harness builds its fixtures with on Windows.
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Configure
        # Git Bash otherwise rewrites /debug:* and /opt:* as MSYS paths before
        # native cmake.exe receives the Windows linker flags.
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cmake -GNinja -Bbuild \
            ${CC:+-DCMAKE_C_COMPILER=$CC} \
            ${CXX:+-DCMAKE_CXX_COMPILER=$CXX} \
            ${{ matrix.cmake-extra }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_STRIP_BINARY=OFF \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Verify Windows PE audit link contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Get-Content -LiteralPath build/CMakeCache.txt -Raw
          if ($cache -notmatch '(?im)^CMAKE_LINKER:[^=]+=C:[/\\]LLVM[/\\]bin[/\\]lld-link\.exe\r?$') {
            throw 'CMake did not retain the pinned lld-link path'
          }
          if ($cache -notmatch '(?im)^LLVM_ENABLE_LLD:BOOL=ON\r?$') {
            throw 'LLVM_ENABLE_LLD is not enabled for the PE audit build'
          }
          if ($cache -notmatch '(?im)^CMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO:[^=]+=.*?/debug:symtab') {
            throw 'RelWithDebInfo is not configured to retain the COFF symbol table'
          }
          if ($cache -notmatch '(?im)^CMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO:[^=]+=.*?/opt:ref') {
            throw 'RelWithDebInfo does not restore live-section elimination'
          }

          $linkCommands = @(& ninja -C build -t commands neverc |
            Select-String -Pattern '(?i)lld-link(?:\.exe)?')
          if ($linkCommands.Count -eq 0) {
            throw 'generated neverc build has no lld-link command'
          }
          $linkText = ($linkCommands | ForEach-Object { $_.Line }) -join "`n"
          if ($linkText -notmatch '(?i)/debug:symtab') {
            throw 'generated neverc link command omits /debug:symtab'
          }
          if ($linkText -notmatch '(?i)/opt:ref') {
            throw 'generated neverc link command omits /opt:ref'
          }

      - name: Build compiler, conformance suite and SDK
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc
            cmake --build build --config ${{ env.BUILD_TYPE }} \
              --target neverc-plugin-conformance
            cmake --build build --config ${{ env.BUILD_TYPE }} \
              --target neverc-pluginsdk
          else
            cmake --build build --config ${{ env.BUILD_TYPE }} \
              --target neverc neverc-plugin-conformance neverc-pluginsdk
          fi

      - name: Capability bindings and phase inventory
        run: |
          ${{ matrix.python }} neverc/utils/plugin-api/check-capability-bindings.py \
            --compiler build/bin/neverc${{ matrix.exe }}
          ${{ matrix.python }} neverc/utils/plugin-api/check-phase-inventory.py \
            --compiler build/bin/neverc${{ matrix.exe }} \
            > plugin-phase-inventory-${{ matrix.host }}.txt
          build/bin/neverc${{ matrix.exe }} --print-plugin-capabilities=json \
            > plugin-capabilities-${{ matrix.host }}.json

      # Runs here rather than through CTest because the gate needs the linked
      # compiler, and the CTest case carrying it is labelled "plugin-meta",
      # which no workflow reaches (see lint-docs.yml for the same trap).
      # Windows is deliberately not a source-only exception: pinned
      # llvm-readobj plus the system DbgHelp undecorator audit the lld-link
      # COFF symbol table, including one external and one local-static
      # completeness sentinel.
      # --strict is required, not optional: the binary layer leaves thread-local
      # storage to the source scan, so without it a new undocumented
      # thread_local would pass unnoticed on every host.
      - name: Plugin global state
        run: |
          ${{ matrix.python }} neverc/utils/plugin-api/check-global-state.py \
            --build-dir build --strict

      - name: Run plugin conformance suite
        run: ctest --test-dir build -R PluginConformance --output-on-failure

      # --object-plugin re-runs every route through the ObjectGraph
      # read/rewrite/write round trip, which the plain routes never touch.
      - name: Cross-target object / image matrix
        run: |
          ${{ matrix.python }} neverc/utils/plugin-api/run-cross-target-matrix.py \
            --compiler build/bin/neverc${{ matrix.exe }} \
            --baseline-current-targets \
            --targets x86_64,aarch64 \
            --formats elf,coff,macho \
            --object-plugin build/neverc/pluginsdk/examples/host/ObjectRewritePlugin${{ matrix.module }} \
            --output cross-target-summary-${{ matrix.host }}.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-conformance-${{ matrix.host }}
          path: |
            cross-target-summary-${{ matrix.host }}.json
            plugin-capabilities-${{ matrix.host }}.json
            plugin-phase-inventory-${{ matrix.host }}.txt
