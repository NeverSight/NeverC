# Host / target / object-format cross-platform conformance.
#
# For every native host it builds the shipped compiler plus the standalone
# PluginConformanceTests and the plugin SDK, then:
#   * runs the install-tree conformance suite (ABI negotiation, lifecycle,
#     per-domain replacement, handle/failure) through the public CLI/ABI;
#   * cross-generates a relocatable object for x86_64/aarch64 x elf/coff/macho
#     and a raw dyncode image for the built-in dyncode triples, verifying each
#     artifact with a format check (cross artifacts are parsed, never executed);
#   * re-checks the capability bindings and phase inventory of the built binary.
#
# All five native hosts run the identical steps with the same build recipe as
# the per-OS release workflows.  On Windows the fixtures are built by MSVC
# itself, so the run also proves the SDK's __declspec(dllexport) / __cdecl path
# against a non-GNU driver.
name: plugin-conformance

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "neverc/lib/Plugin/**"
      - "neverc/include/neverc/Plugin/**"
      - "neverc/lib/DynCode/**"
      - "tests/plugin-conformance/**"
      - "utils/plugin-api/**"
      - "pluginsdk/**"
      - ".github/workflows/plugin-conformance.yml"

jobs:
  conformance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runs-on: ubuntu-22.04
            python: python3
            module: .so
          - host: linux-arm64
            runs-on: ubuntu-22.04-arm
            python: python3
            module: .so
          - host: macos-arm64
            runs-on: macos-15
            python: python3
            module: .so
          - host: windows-x64
            runs-on: windows-latest
            python: python
            exe: .exe
            module: .dll
            msvc-arch: x64
          - host: windows-arm64
            runs-on: windows-11-arm
            python: python
            exe: .exe
            module: .dll
            msvc-arch: arm64
            cmake-extra: -DCMAKE_SYSTEM_PROCESSOR=ARM64
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake p7zip-full
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Select latest stable Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      # CMake is pinned to the arm64 runner's version: 4.4's
      # gtest_discover_tests only appends to the generated CTest file, where
      # 3.31 truncated it first, so a target whose POST_BUILD discovery runs
      # twice registers its tests twice.
      - name: Setup build deps (Windows x64)
        if: matrix.host == 'windows-x64'
        shell: pwsh
        run: |
          choco install ninja -y

          $cmakeVer = '3.31.11'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-x86_64\bin"

      # windows-11-arm has no chocolatey packages for these; fetch the
      # ARM64-native archives the way the arm64 release workflow does.
      - name: Setup build deps (Windows arm64)
        if: matrix.host == 'windows-arm64'
        shell: pwsh
        run: |
          $cmakeVer = '3.31.11'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-arm64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-arm64\bin"

          $ninjaVer = '1.13.1'
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v$ninjaVer/ninja-winarm64.zip" -OutFile ninja.zip
          Expand-Archive ninja.zip C:\tools\ninja -Force
          Add-Content $env:GITHUB_PATH "C:\tools\ninja"

      # Puts cl.exe on PATH, which is also the system C compiler the
      # conformance harness builds its fixtures with on Windows.
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Configure
        run: |
          cmake -GNinja -Bbuild \
            ${CC:+-DCMAKE_C_COMPILER=$CC} \
            ${CXX:+-DCMAKE_CXX_COMPILER=$CXX} \
            ${{ matrix.cmake-extra }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_STRIP_BINARY=OFF \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build compiler, conformance suite and SDK
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} \
            --target neverc neverc-plugin-conformance neverc-pluginsdk

      - name: Capability bindings and phase inventory
        run: |
          ${{ matrix.python }} neverc/utils/plugin-api/check-capability-bindings.py \
            --compiler build/bin/neverc${{ matrix.exe }}
          ${{ matrix.python }} neverc/utils/plugin-api/check-phase-inventory.py \
            --compiler build/bin/neverc${{ matrix.exe }} \
            > plugin-phase-inventory-${{ matrix.host }}.txt
          build/bin/neverc${{ matrix.exe }} --print-plugin-capabilities=json \
            > plugin-capabilities-${{ matrix.host }}.json

      # Runs here rather than through CTest because the gate needs the linked
      # compiler, and the CTest case carrying it is labelled "plugin-meta",
      # which no workflow reaches (see lint-docs.yml for the same trap).  On
      # Windows the binary layer skips itself -- it cannot classify a PE image
      # -- so only the source scan runs there.
      # --strict is required, not optional: the binary layer leaves thread-local
      # storage to the source scan, so without it a new undocumented
      # thread_local would pass unnoticed on every host, and on Windows nothing
      # would be gated at all.
      - name: Plugin global state
        run: |
          ${{ matrix.python }} neverc/utils/plugin-api/check-global-state.py \
            --build-dir build --strict

      - name: Run plugin conformance suite
        run: ctest --test-dir build -R PluginConformance --output-on-failure

      # --object-plugin re-runs every route through the ObjectGraph
      # read/rewrite/write round trip, which the plain routes never touch.
      - name: Cross-target object / image matrix
        run: |
          ${{ matrix.python }} neverc/utils/plugin-api/run-cross-target-matrix.py \
            --compiler build/bin/neverc${{ matrix.exe }} \
            --baseline-current-targets \
            --targets x86_64,aarch64 \
            --formats elf,coff,macho \
            --object-plugin build/neverc/pluginsdk/examples/host/ObjectRewritePlugin${{ matrix.module }} \
            --output cross-target-summary-${{ matrix.host }}.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-conformance-${{ matrix.host }}
          path: |
            cross-target-summary-${{ matrix.host }}.json
            plugin-capabilities-${{ matrix.host }}.json
            plugin-phase-inventory-${{ matrix.host }}.txt
