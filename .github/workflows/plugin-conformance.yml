# Volume 6 task 22: host / target / object-format cross-platform conformance.
#
# For every native host it builds the shipped compiler plus the standalone
# PluginConformanceTests and the plugin SDK, then:
#   * runs the install-tree conformance suite (ABI negotiation, lifecycle,
#     per-domain replacement, handle/failure) through the public CLI/ABI;
#   * cross-generates a relocatable object for x86_64/aarch64 x elf/coff/macho
#     and a raw dyncode image for the built-in dyncode triples, verifying each
#     artifact with a format check (cross artifacts are parsed, never executed);
#   * re-checks the capability bindings and phase inventory of the built binary.
#
# The POSIX hosts (Linux x86_64, macOS arm64) are covered here with the same
# proven build recipe as the per-OS build workflows; linux-arm64 and the Windows
# DLL export / cdecl path run the identical steps on their native runners and
# can be added to the matrix as capacity allows.
name: plugin-conformance

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "neverc/lib/Plugin/**"
      - "neverc/include/neverc/Plugin/**"
      - "neverc/lib/DynCode/**"
      - "tests/plugin-conformance/**"
      - "utils/plugin-api/**"
      - "pluginsdk/**"
      - ".github/workflows/plugin-conformance.yml"

jobs:
  conformance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runs-on: ubuntu-22.04
          - host: macos-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake p7zip-full
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Select latest stable Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Configure
        run: |
          cmake -GNinja -Bbuild \
            ${CC:+-DCMAKE_C_COMPILER=$CC} \
            ${CXX:+-DCMAKE_CXX_COMPILER=$CXX} \
            -DCMAKE_INSTALL_PREFIX=install \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_STRIP_BINARY=OFF \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build compiler, conformance suite and SDK
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} \
            --target neverc neverc-plugin-conformance neverc-pluginsdk

      - name: Capability bindings and phase inventory
        run: |
          python3 neverc/utils/plugin-api/check-capability-bindings.py \
            --compiler build/bin/neverc
          python3 neverc/utils/plugin-api/check-phase-inventory.py \
            --compiler build/bin/neverc \
            > plugin-phase-inventory-${{ matrix.host }}.txt
          build/bin/neverc --print-plugin-capabilities=json \
            > plugin-capabilities-${{ matrix.host }}.json

      - name: Run plugin conformance suite
        run: ctest --test-dir build -R PluginConformance --output-on-failure

      - name: Cross-target object / image matrix
        run: |
          python3 neverc/utils/plugin-api/run-cross-target-matrix.py \
            --compiler build/bin/neverc \
            --baseline-current-targets \
            --targets x86_64,aarch64 \
            --formats elf,coff,macho \
            --output cross-target-summary-${{ matrix.host }}.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-conformance-${{ matrix.host }}
          path: |
            cross-target-summary-${{ matrix.host }}.json
            plugin-capabilities-${{ matrix.host }}.json
            plugin-phase-inventory-${{ matrix.host }}.txt
