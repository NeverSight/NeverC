name: Native Linux ARM64 STL check
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  stl-arm64:
    name: Native Linux ARM64 bitset and optional C23
    runs-on: ubuntu-22.04-arm
    env:
      BUILD_TYPE: RelWithDebInfo
      NEVERC_PCG_STRICT: '1'
      LLVM_APT_VER: '22'
    timeout-minutes: 180
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc
    - name: Set up CPython 3.12.10 for official artifacts
      id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - name: Setup build deps
      run: 'bash neverc/.github/scripts/configure-apt-ubuntu.sh

        sudo apt-get update && sudo apt-get install -y ninja-build cmake p7zip-full
        gdb elfutils openssl patchelf

        '
    - name: Create swap
      run: "if ! swapon --show | grep -q /mnt/swapfile; then\n  sudo swapoff /mnt/swapfile\
        \ 2>/dev/null || true\n  sudo rm -f /mnt/swapfile\n  sudo fallocate -l 4G\
        \ /mnt/swapfile\n  sudo chmod 600 /mnt/swapfile\n  sudo mkswap /mnt/swapfile\n\
        \  sudo swapon /mnt/swapfile\nfi\nfree -h\n"
    - name: Install Clang (apt.llvm.org, non-PGO)
      run: 'wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh

        chmod +x /tmp/llvm.sh

        sudo /tmp/llvm.sh "$LLVM_APT_VER"

        echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"

        echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

        clang-${LLVM_APT_VER} --version

        '
    - name: Build neverc
      run: 'cmake -GNinja -Bbuild \

        -DCMAKE_C_COMPILER=$CC \

        -DCMAKE_CXX_COMPILER=$CXX \

        -DCMAKE_INSTALL_PREFIX=install \

        -DLLVM_ENABLE_ASSERTIONS=OFF \

        -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \

        -DNEVERC_INCLUDE_TESTS=ON \

        -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \

        -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \

        -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \

        -DNEVERC_STRIP_BINARY=OFF \

        -DNEVERC_ENABLE_LTO=OFF \

        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \

        -C neverc/neverc/cmake/caches/NeverC.cmake \

        neverc/llvm

        time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc neverc-translate-tests

        '
    - name: Run the selected ARM64 STL translation tests
      id: stl_native
      run: '"${{ steps.python.outputs.python-path }}" -I -B neverc/utils/ci/check-cpp-stl-linux-arm64-native.py
        --repo neverc --compiler build/bin/neverc --tests build/bin/neverc-translate-tests
        --output "${{ runner.temp }}/stl-arm64-native"'
    - name: Upload bounded ARM64 STL text evidence
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.stl_native.outcome != 'skipped' }}
      with:
        name: stl-arm64-native-text-${{ github.sha }}
        path: '${{ runner.temp }}/stl-arm64-native/results.json

          ${{ runner.temp }}/stl-arm64-native/stl-arm64.xml

          ${{ runner.temp }}/stl-arm64-native/gtest.log'
        if-no-files-found: error
        retention-days: 14
