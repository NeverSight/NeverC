name: VBS enclave ARM64 artifact replay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# This manual replay validates fixed existing images, not a fresh compiler build.
concurrency:
  group: vbs-arm64-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference:
    name: Native ARM64 differential artifact replay
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout fixed static-source inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: c46e3a4cc4b3732823a7241a43bca6c44b0f0b74
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/neverc/Inputs/VBSEnclave/
            /utils/ci/new-vbs-enclave-test-certificate.ps1
            /utils/ci/verify-vbs-enclave-pe.py
            /utils/ci/verify-vbs-enclave-runtime.py
            /runtime/windows/arm64/msvc/crt/lib/enclave/
            /runtime/windows/arm64/msvc/sdk/lib/ucrt_enclave/
            /runtime/windows/arm64/msvc/sdk/lib/um/vertdll.lib
            /runtime/windows/arm64/msvc/sdk/lib/um/bcrypt.lib

      - name: Read native architecture, VBS and current signing configuration
        timeout-minutes: 2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "vbs-arm64-replay-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          "VBS_REPLAY_ROOT=$root" | Add-Content $env:GITHUB_ENV
          $result = [ordered]@{
            scope = 'neverc-arm64-artifact-replay'
            status = 'NOT_VALIDATED'
            stage = 'Preflight'
            architecture = 'arm64'
            harness_sha = $env:GITHUB_SHA
            artifact_source_sha = 'c46e3a4cc4b3732823a7241a43bca6c44b0f0b74'
            reference_source_sha = 'c46e3a4cc4b3732823a7241a43bca6c44b0f0b74'
            fresh_neverc_build = $false
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            message = 'No runtime reference has been executed.'
          }
          $result | ConvertTo-Json | Set-Content (Join-Path $root 'result.json')
          try {
            if ($env:GITHUB_REF -cne 'refs/heads/dev') { throw 'Dispatch this probe on dev.' }
            $checkedOut = & git rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $checkedOut -cne 'c46e3a4cc4b3732823a7241a43bca6c44b0f0b74') {
              throw 'Reference inputs must be checked out at the fixed static source.'
            }
            $osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            $processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            $os = Get-CimInstance Win32_OperatingSystem
            $environment = [ordered]@{
              runner = $env:RUNNER_NAME
              runner_arch = $env:RUNNER_ARCH
              image_os = $env:ImageOS
              image_version = $env:ImageVersion
              os_caption = $os.Caption
              os_version = $os.Version
              os_build = $os.BuildNumber
              os_architecture = $osArchitecture
              process_architecture = $processArchitecture
            }
            try {
              $guard = Get-CimInstance Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard
              $environment['device_guard'] = $guard | Select-Object VirtualizationBasedSecurityStatus, SecurityServicesConfigured, SecurityServicesRunning
            } catch {
              $environment['device_guard_error'] = $_.Exception.Message
            }
            $boot = & bcdedit.exe /enum '{current}' 2>&1
            $bootExit = $LASTEXITCODE
            $boot | Tee-Object -FilePath (Join-Path $root 'boot-configuration.txt') | Out-Host
            $environment['boot_query_exit_code'] = $bootExit
            $environment['testsigning_configured'] = [bool](@($boot | Where-Object { "$_" -cmatch '^testsigning\s+Yes\s*$' }).Count -eq 1)
            # Telemetry and BCD configuration alone are not execution evidence.
            $environment | ConvertTo-Json -Depth 5 | Tee-Object -FilePath (Join-Path $root 'environment.json') | Out-Host
            if ($osArchitecture -cne 'Arm64' -or $processArchitecture -cne 'Arm64') {
              throw 'Native ARM64 OS and PowerShell are required; emulated x64 is not ARM64 evidence.'
            }
            if ([int]$os.BuildNumber -lt 26100) { throw 'The runner OS is below the VBS enclave baseline.' }
            if ($bootExit -ne 0 -or -not $environment.testsigning_configured) {
              throw 'Test-signing configuration was not confirmed. No boot or security setting will be changed.'
            }
            Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          public static class VbsArm64Availability {
            [DllImport("kernel32.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool IsEnclaveTypeSupported(uint enclaveType);
          }
          '@
            $supported = [VbsArm64Availability]::IsEnclaveTypeSupported(0x10)
            $environment['vbs_enclave_type_supported'] = $supported
            $environment | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $root 'environment.json')
            if (-not $supported) { throw 'The native runner reports VBS enclaves unavailable.' }
            $result.stage = 'BuildPending'
            $result.message = 'Read-only preflight passed; runtime execution remains unvalidated.'
          } catch {
            $result.message = $_.Exception.Message
            throw
          } finally {
            $result | ConvertTo-Json | Set-Content (Join-Path $root 'result.json')
          }

      - name: Set up native ARM64 MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64

      - name: Set up ARM64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: arm64

      - name: Stage fixed input validator definitions
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $resultPath = Join-Path $env:VBS_REPLAY_ROOT 'result.json'
          $inputResult = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          $inputResult.stage = 'StaticInputProvenance'
          $inputResult.message = 'Fixed static artifact provenance has not yet been verified.'
          $inputResult | ConvertTo-Json | Set-Content -LiteralPath $resultPath
          $validator = @'
          import hashlib, io, json, os, pathlib, re, stat, struct, sys, threading, time, zipfile
          import urllib.error, urllib.parse, urllib.request

          REPO = 'NeverSight/NeverC'
          SOURCE = 'c46e3a4cc4b3732823a7241a43bca6c44b0f0b74'
          RUN, ATTEMPT, JOB, ARTIFACT = 34474526502, 2, 102865970474, 10159292986
          ZIP_SIZE = 294884
          ZIP_HASH = 'b078877bce7690ba8751af9c080c19cb193417387b061fc2ae791a6a35f9e771'
          SELECTED = frozenset((
              'unsigned/neverc-msvc-arm64.dll', 'unsigned/neverc-neverc-arm64.dll',
              'runtime/neverc-msvc-arm64.dll', 'runtime/neverc-neverc-arm64.dll',
              'maps/neverc-msvc-arm64.map', 'maps/neverc-neverc-arm64.map',
              'bundled-runtime-assets.txt'))
          LIBRARIES = {
              'arm64_vertdll': 'sdk/lib/um/vertdll.lib',
              'arm64_bcrypt': 'sdk/lib/um/bcrypt.lib',
              'arm64_enclave_libcmt': 'crt/lib/enclave/libcmt.lib',
              'arm64_enclave_libvcruntime': 'crt/lib/enclave/libvcruntime.lib',
              'arm64_enclave_ucrt': 'sdk/lib/ucrt_enclave/ucrt.lib'}
          LIMIT, TOTAL, COUNT = 4 * 1024**2, 16 * 1024**2, 256

          class Invalid(Exception):
              pass

          def require(condition, message):
              if not condition:
                  raise Invalid(message)

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'Duplicate JSON key')
                  result[key] = value
              return result

          def invalid_constant(value):
              raise Invalid('Non-finite JSON value')

          def read_json(data):
              return json.loads(data.decode('utf-8'), object_pairs_hook=unique,
                                parse_constant=invalid_constant)

          def exact_integer(value, expected, label):
              require(type(value) is int and value == expected, 'Invalid ' + label)

          def check_run(data):
              exact_integer(data.get('id'), RUN, 'source run')
              exact_integer(data.get('run_attempt'), ATTEMPT, 'source attempt')
              require(data.get('path') == '.github/workflows/vbs-enclave.yml' and
                      data.get('event') == 'push' and data.get('head_sha') == SOURCE and
                      data.get('head_branch') == 'dev' and data.get('status') == 'completed' and
                      data.get('conclusion') == 'success', 'Source run provenance mismatch')
              for key in ('repository', 'head_repository'):
                  require(data.get(key, {}).get('full_name') == REPO, 'Source repository mismatch')

          def check_jobs(data):
              jobs = data.get('jobs')
              require(type(jobs) is list and type(data.get('total_count')) is int and
                      len(jobs) == data['total_count'] <= 100, 'Incomplete attempt job metadata')
              matches = [j for j in jobs if j.get('id') == JOB]
              require(len(matches) == 1, 'Exact static job missing or duplicated')
              job = matches[0]
              exact_integer(job.get('id'), JOB, 'static job')
              exact_integer(job.get('run_id'), RUN, 'static job run')
              require(job.get('name') == 'Static PE and Microsoft-reference gate' and
                      job.get('status') == 'completed' and job.get('conclusion') == 'success' and
                      job.get('head_sha') == SOURCE, 'Static job did not pass at fixed source')

          def check_artifact(data):
              exact_integer(data.get('id'), ARTIFACT, 'artifact ID')
              require(data.get('name') == 'vbs-enclave-static' and data.get('expired') is False,
                      'Artifact name/availability mismatch')
              owner = data.get('workflow_run', {})
              exact_integer(owner.get('id'), RUN, 'artifact source run')
              require(owner.get('head_sha') == SOURCE and owner.get('head_branch') == 'dev',
                      'Artifact source mismatch')
              # These REST fields are recorded independently, never used as an
              # unpacked-size budget. A semantic mismatch requires review.
              exact_integer(data.get('size_in_bytes'), ZIP_SIZE, 'API artifact size versus pinned upload ZIP size')
              require(data.get('digest') == 'sha256:' + ZIP_HASH, 'API artifact digest mismatch or missing')

          def read_text(data):
              text = data.decode('utf-8-sig')
              require('\ufeff' not in text and all(ord(c) >= 32 or c in '\t\r\n' for c in text) and
                      not any(127 <= ord(c) < 160 for c in text), 'Invalid text encoding or control character')
              return text

          def parse_libraries(data):
              text = read_text(data)
              result = {}
              for line in text.splitlines():
                  parts = line.split('\t')
                  require(len(parts) == 4 and all(parts), 'Malformed library manifest record')
                  key, old_path, size, digest = parts
                  require(key not in result, 'Duplicate library manifest key')
                  require(re.fullmatch(r'[1-9][0-9]*', size) is not None and len(size) <= 12 and
                          re.fullmatch(r'[0-9A-Fa-f]{64}', digest) is not None, 'Invalid library identity')
                  result[key] = (int(size), digest.lower())
              require(LIBRARIES.keys() <= result.keys(), 'Required ARM64 library identity missing')
              return result

          def pe_machine(data):
              require(len(data) >= 64 and data[:2] == b'MZ', 'Invalid PE DOS header')
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              require(64 <= offset <= len(data) - 26, 'Invalid PE header bounds')
              require(data[offset:offset+4] == b'PE\0\0' and
                      struct.unpack_from('<H', data, offset+4)[0] == 0xaa64 and
                      struct.unpack_from('<H', data, offset+24)[0] == 0x20b,
                      'Expected pure ARM64 PE32+ image')
              return '0xAA64'

          def check_verdict(verdict):
              require(type(verdict) is dict and verdict.get('status') == 'PASS' and
                      verdict.get('stage') == 'Complete' and type(verdict.get('error')) is int and
                      verdict['error'] == 0 and type(verdict.get('message')) is str and
                      bool(verdict['message']), 'Runtime verdict is not a strict complete PASS')

          def check_library_identity(actual, expected, key):
              require(actual == expected, 'Bundled library identity mismatch: ' + key)

          def archive_entries(data, required=SELECTED):
              require(data.startswith(b'PK\x03\x04'), 'ZIP prefix is not a local header')
              end = data.rfind(b'PK\x05\x06')
              require(end >= 0 and end + 22 <= len(data), 'Missing ZIP EOCD')
              _, disk, central_disk, disk_count, count, central_size, central_offset, comment = struct.unpack_from('<4s4H2LH', data, end)
              require(disk == central_disk == 0 and disk_count == count and
                      end + 22 + comment == len(data) and central_offset + central_size == end,
                      'Unsupported or trailing ZIP structure')
              require(0 < count <= COUNT, 'ZIP entry count limit')
              payloads, names, folded, actual_total, declared_total = {}, set(), set(), 0, 0
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  infos = archive.infolist()
                  require(len(infos) == count, 'ZIP central directory count mismatch')
                  for info in infos:
                      name = info.filename
                      require(name == info.orig_filename and name.isascii() and '\\' not in name and
                              '\x00' not in name and not name.startswith('/') and ':' not in name,
                              'Unsafe ZIP member name')
                      clean = name[:-1] if name.endswith('/') else name
                      parts = clean.split('/')
                      require(all(p not in ('', '.', '..') and p == p.strip() and
                                  not p.endswith('.') and not re.fullmatch(r'(?i)(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\..*)?', p)
                                  for p in parts), 'Unsafe Windows ZIP path')
                      require(clean.casefold() not in folded, 'Duplicate ZIP member name')
                      folded.add(clean.casefold())
                      names.add(name)
                      mode = info.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR) and
                              not (info.external_attr & 0x400) and not (info.flag_bits & 1),
                              'ZIP link, reparse or encrypted member')
                      if name in required:
                          require(stat.S_IFMT(mode) in (0, stat.S_IFREG) and
                                  not (info.external_attr & 0x10) and not info.is_dir(),
                                  'Required ZIP input is not a regular file')
                      if info.is_dir():
                          require(stat.S_IFMT(mode) in (0, stat.S_IFDIR) and info.file_size == 0,
                                  'ZIP directory attributes conflict with its name')
                      else:
                          require(stat.S_IFMT(mode) != stat.S_IFDIR and not (info.external_attr & 0x10),
                                  'ZIP file has directory attributes')
                      require(info.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED), 'Unsupported compression method')
                      require(0 <= info.header_offset < central_offset and 0 <= info.file_size <= LIMIT,
                              'ZIP member declared size or offset limit')
                      declared_total += info.file_size
                      require(declared_total <= TOTAL, 'ZIP declared total size limit')
                      chunks, actual = [], 0
                      # Drain every entry, including ignored files, to enforce
                      # actual total limits and CRC/EOF without extracting them.
                      with archive.open(info) as stream:
                          while True:
                              chunk = stream.read(65536)
                              if not chunk:
                                  break
                              actual += len(chunk)
                              actual_total += len(chunk)
                              require(actual <= LIMIT and actual_total <= TOTAL, 'ZIP actual decompression size limit')
                              if name in required:
                                  chunks.append(chunk)
                      require(actual == info.file_size, 'ZIP member length/EOF mismatch')
                      if name in required:
                          require(not info.is_dir(), 'Required ZIP input is a directory')
                          payloads[name] = b''.join(chunks)
              require(set(payloads) == set(required), 'Fixed ZIP inputs missing')
              return payloads

          def storage_url(location):
              parsed = urllib.parse.urlsplit(location)
              require(parsed.scheme == 'https' and parsed.username is None and parsed.password is None and
                      parsed.port in (None, 443) and not parsed.fragment and
                      re.fullmatch(r'productionresultssa[0-9]+\.blob\.core\.windows\.net', parsed.hostname or '') is not None,
                      'Artifact storage redirect needs explicit review')
              return location
          '@
          # Keep the original LF separator without adding a Windows newline here.
          Set-Content -LiteralPath (Join-Path $env:VBS_REPLAY_ROOT 'validate-inputs.py') -Value ($validator + "`n`n") -Encoding utf8 -NoNewline

      - name: Verify fixed static provenance and stage seven inputs
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $resultPath = Join-Path $env:VBS_REPLAY_ROOT 'result.json'
          $inputResult = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          $validator = @'
          def self_test():
              count = 0
              def rejected(operation):
                  nonlocal count
                  try:
                      operation()
                  except (Invalid, ValueError, KeyError, TypeError, zipfile.BadZipFile, UnicodeError):
                      count += 1
                  else:
                      raise Invalid('A rejection self-test unexpectedly passed')
              for value in (b'{"a":1,"a":2}', b'{"a":NaN}', b'\xff'):
                  rejected(lambda v=value: read_json(v))
              for value in (b'a\x00b', b'a\x01b', b'\xff', b'\xef\xbb\xbf\xef\xbb\xbf'):
                  rejected(lambda v=value: read_text(v))
              rejected(lambda: exact_integer(True, 1, 'synthetic boolean'))
              rejected(lambda: check_run({'id': RUN + 1}))
              rejected(lambda: check_jobs({'total_count': 0, 'jobs': []}))
              rejected(lambda: check_artifact({'id': ARTIFACT + 1}))
              verdict = {'status': 'PASS', 'stage': 'Complete', 'error': 0, 'message': 'synthetic'}
              check_verdict(verdict)
              for key, value in (('status', 'SKIP'), ('stage', 'CreateEnclave'),
                                 ('error', False), ('error', '0'), ('error', 0.0), ('message', '')):
                  bad = dict(verdict, **{key: value})
                  rejected(lambda v=bad: check_verdict(v))
              for url in ('http://productionresultssa0.blob.core.windows.net/a',
                          'https://productionresultssa0.blob.core.windows.net.evil/a',
                          'https://user@productionresultssa0.blob.core.windows.net/a',
                          'https://127.0.0.1/a'):
                  rejected(lambda u=url: storage_url(u))
              manifest = ''.join(k + '\tignored\t1\t' + '0'*64 + '\n' for k in LIBRARIES).encode()
              require(len(parse_libraries(manifest)) == 5, 'Synthetic manifest baseline failed')
              for bad in (b'', manifest + manifest, manifest.replace(b'\t1\t', b'\t0\t', 1), b'\xff'):
                  rejected(lambda m=bad: parse_libraries(m))
              rejected(lambda: check_library_identity((1, '1'*64), (1, '0'*64), 'synthetic'))
              rejected(lambda: check_library_identity((2, '0'*64), (1, '0'*64), 'synthetic'))
              header = bytearray(90)
              header[:2] = b'MZ'
              struct.pack_into('<I', header, 0x3c, 64)
              header[64:68] = b'PE\0\0'
              struct.pack_into('<H', header, 68, 0xaa64)
              struct.pack_into('<H', header, 88, 0x20b)
              require(pe_machine(header) == '0xAA64', 'Inert ARM64 header baseline failed')
              for machine in (0x8664, 0xa641, 0xa64e):
                  wrong = bytearray(header)
                  struct.pack_into('<H', wrong, 68, machine)
                  rejected(lambda data=wrong: pe_machine(data))
              def small_zip(entries):
                  output = io.BytesIO()
                  with zipfile.ZipFile(output, 'w') as archive:
                      for name, payload in entries:
                          archive.writestr(name, payload)
                  return output.getvalue()
              good = small_zip([('a.txt', b'abc')])
              require(archive_entries(good, {'a.txt'}) == {'a.txt': b'abc'}, 'Synthetic ZIP baseline failed')
              for entries in ([('../a.txt', b'x')], [('A.txt', b'x'), ('a.txt', b'y')],
                              [('C:a.txt', b'x')], [('a.txt ', b'x')], [('NUL.txt', b'x')]):
                  rejected(lambda e=entries: archive_entries(small_zip(e), {'a.txt'}))
              rejected(lambda: archive_entries(good, {'missing.txt'}))
              rejected(lambda: archive_entries(good + b'x', {'a.txt'}))
              rejected(lambda: archive_entries(good[:-1], {'a.txt'}))
              for attributes in ((stat.S_IFDIR | 0o755) << 16, 0x10):
                  output = io.BytesIO()
                  with zipfile.ZipFile(output, 'w') as container:
                      entry = zipfile.ZipInfo('a.txt')
                      entry.external_attr = attributes
                      container.writestr(entry, b'abc')
                  rejected(lambda data=output.getvalue(): archive_entries(data, {'a.txt'}))
              crc_bad = bytearray(good)
              crc_bad[35] ^= 1
              rejected(lambda: archive_entries(crc_bad, {'a.txt'}))
              global LIMIT, TOTAL, COUNT
              saved = LIMIT, TOTAL, COUNT
              try:
                  LIMIT = 2
                  rejected(lambda: archive_entries(good, {'a.txt'}))
                  LIMIT, TOTAL = 4, 2
                  rejected(lambda: archive_entries(good, {'a.txt'}))
                  TOTAL, COUNT = 16, 1
                  rejected(lambda: archive_entries(small_zip([('a.txt', b'x'), ('b.txt', b'y')]), {'a.txt'}))
              finally:
                  LIMIT, TOTAL, COUNT = saved
              print('PASS: ARM64 replay inert-input rejection cases: %d' % count)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          class InputDeadline:
              def __enter__(self):
                  # Socket timeouts do not bound a read making slow progress.
                  # No certificate exists in this phase; exit 124 is handled
                  # explicitly by the parent, without printing a signed URL.
                  self.timer = threading.Timer(120, lambda: os._exit(124))
                  self.timer.daemon = True
                  self.timer.start()
                  return self

              def __exit__(self, *unused):
                  self.timer.cancel()

          def main():
              self_test()
              root = pathlib.Path(os.environ['VBS_REPLAY_ROOT'])
              checkout = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              token = os.environ['GH_TOKEN']
              opener = urllib.request.build_opener(NoRedirect())
              deadline = time.monotonic() + 120

              def request(url, authenticated=False, redirect=False, limit=1024**2):
                  require(time.monotonic() < deadline, 'Artifact acquisition deadline exceeded')
                  headers = {'User-Agent': 'NeverC-ARM64-CI'}
                  if authenticated:
                      require(url.startswith('https://api.github.com/repos/' + REPO + '/actions/'), 'Unexpected authenticated endpoint')
                      headers.update({'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      response = opener.open(urllib.request.Request(url, headers=headers), timeout=20)
                  except urllib.error.HTTPError as error:
                      if redirect and error.code == 302:
                          location = error.headers.get('Location', '')
                          error.close()
                          return storage_url(location)
                      raise Invalid('GitHub/storage request returned HTTP %d' % error.code) from None
                  except Exception:
                      raise Invalid('GitHub/storage request failed; signed URLs are not logged') from None
                  with response:
                      require(response.status == 200 and not redirect, 'Unexpected artifact response status')
                      chunks, size = [], 0
                      while True:
                          require(time.monotonic() < deadline, 'Artifact acquisition deadline exceeded')
                          try:
                              chunk = response.read(min(65536, limit + 1 - size))
                          except Exception:
                              raise Invalid('Artifact response could not be read completely') from None
                          if not chunk:
                              break
                          size += len(chunk)
                          require(size <= limit, 'Artifact response byte limit exceeded')
                          chunks.append(chunk)
                      return b''.join(chunks)

              base = 'https://api.github.com/repos/' + REPO + '/actions/'
              run = read_json(request(base + 'runs/' + str(RUN), True))
              check_run(run)
              jobs = read_json(request(base + 'runs/%d/attempts/%d/jobs?per_page=100' % (RUN, ATTEMPT), True))
              check_jobs(jobs)
              artifact = read_json(request(base + 'artifacts/' + str(ARTIFACT), True))
              check_artifact(artifact)
              location = request(base + 'artifacts/%d/zip' % ARTIFACT, True, True)
              # A fresh request has no token; never follow further redirects.
              archive = request(location)
              require(len(archive) == ZIP_SIZE and hashlib.sha256(archive).hexdigest() == ZIP_HASH,
                      'Downloaded ZIP differs from the pinned upload length/digest')
              payloads = archive_entries(archive)
              for name in ('maps/neverc-msvc-arm64.map', 'maps/neverc-neverc-arm64.map'):
                  read_text(payloads[name])
              library_records = parse_libraries(payloads['bundled-runtime-assets.txt'])
              libraries = []
              for key, relative in LIBRARIES.items():
                  path = checkout / 'runtime/windows/arm64/msvc' / relative
                  data = path.read_bytes()
                  identity = (len(data), hashlib.sha256(data).hexdigest())
                  check_library_identity(identity, library_records[key], key)
                  libraries.append({'key': key, 'path': relative, 'size': identity[0], 'sha256': identity[1]})
              stage = root / 'static-inputs'
              stage.mkdir()
              selected = []
              for name in sorted(SELECTED):
                  data = payloads[name]
                  path = stage / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  for parent in (stage, path.parent):
                      attrs = getattr(parent.lstat(), 'st_file_attributes', 0)
                      require(not parent.is_symlink() and not (attrs & 0x400), 'Extraction directory is a reparse point')
                  with path.open('xb') as output:
                      output.write(data)
                  item = {'path': name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
                  if name.endswith('.dll'):
                      item['machine'] = pe_machine(data)
                      item['pe_magic'] = '0x20B'
                  selected.append(item)
              evidence = {'schema_version': 1, 'scope': 'neverc-arm64-artifact-replay',
                          'artifact_source_sha': SOURCE, 'reference_source_sha': SOURCE,
                          'harness_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                          'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'fresh_neverc_build': False,
                          'source_run': RUN, 'source_attempt': ATTEMPT, 'source_job': JOB,
                          'artifact_id': ARTIFACT, 'api_size_in_bytes': artifact['size_in_bytes'],
                          'api_digest': artifact['digest'], 'zip_size': len(archive), 'zip_sha256': ZIP_HASH,
                          'selected_inputs': selected, 'bundled_libraries': libraries}
              (root / 'static-input-manifest.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
              print(json.dumps(evidence, indent=2))

          def validate_verdict(path):
              data = pathlib.Path(path).read_bytes()
              require(len(data) <= 65536, 'Runtime verdict byte limit')
              # PowerShell UTF-8 output may have a single BOM. All other JSON
              # parsing still rejects duplicate keys and non-finite values.
              if data.startswith(b'\xef\xbb\xbf'):
                  data = data[3:]
              verdict = read_json(data)
              check_verdict(verdict)
              print(json.dumps(verdict))

          try:
              if len(sys.argv) == 3 and sys.argv[1] == 'verdict':
                  validate_verdict(sys.argv[2])
              elif len(sys.argv) == 1:
                  with InputDeadline():
                      main()
              else:
                  raise Invalid('Unexpected validator arguments')
          except Exception as error:
              # No raw exception/traceback: network exceptions may hold SAS URLs.
              message = str(error) if isinstance(error, Invalid) else type(error).__name__
              print('ARM64_REPLAY_INPUTS=FAIL: ' + message, file=sys.stderr)
              sys.exit(1)
          '@
          $validator | Add-Content -LiteralPath (Join-Path $env:VBS_REPLAY_ROOT 'validate-inputs.py') -Encoding utf8
          # -I ignores PYTHONPATH/PYTHONHOME, user site and the script directory;
          # -B avoids bytecode writes. No artifact-supplied Python is executed.
          & python.exe -I -B (Join-Path $env:VBS_REPLAY_ROOT 'validate-inputs.py')
          if ($LASTEXITCODE -ne 0) {
            $inputResult.message = if ($LASTEXITCODE -eq 124) {
              'Static input validation exceeded its hard 120-second process deadline.'
            } else { 'Fixed ARM64 static inputs were not validated; see the input-validation log output.' }
            $inputResult | ConvertTo-Json | Set-Content -LiteralPath $resultPath
            throw $inputResult.message
          }
          $inputResult.stage = 'BuildPending'
          $inputResult.message = 'Fixed static inputs verified. Fresh reference build and native runtime execution remain pending.'
          $inputResult | ConvertTo-Json | Set-Content -LiteralPath $resultPath

      - name: Build reference and execute all three ARM64 images
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = $env:VBS_REPLAY_ROOT
          $resultPath = Join-Path $root 'result.json'
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json

          function Invoke-Bounded {
            param([string]$File, [string[]]$Arguments, [string]$Log,
                  [int]$Seconds = 120, [switch]$AllowFailure,
                  [string]$StdoutPath = '')
            $command = "COMMAND: $File $($Arguments -join ' ')"
            $command | Set-Content -LiteralPath $Log
            Write-Host $command
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $File
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $Arguments) { [void]$start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            try {
              if (-not $process.Start()) { throw "Cannot start $File" }
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit($Seconds * 1000)) {
                try { $process.Kill($true) } catch { Write-Warning $_.Exception.Message }
                [void]$process.WaitForExit(5000)
                $exitCode = 124
                "PROCESS_TIMEOUT_SECONDS=$Seconds" | Add-Content -LiteralPath $Log
              } else {
                $process.WaitForExit()
                $exitCode = $process.ExitCode
              }
              # Descendants can inherit pipes after the parent exits. Bound EOF
              # collection independently, including after a process-tree kill.
              $drained = $false
              try {
                $readers = [Threading.Tasks.Task]::WhenAll([Threading.Tasks.Task[]]@($stdout, $stderr))
                $drained = $readers.Wait(5000)
              } catch {
                "PROCESS_OUTPUT_ERROR=$($_.Exception.Message)" | Add-Content -LiteralPath $Log
              }
              if (-not $drained) {
                $exitCode = 124
                'PROCESS_OUTPUT_DRAIN_TIMEOUT_SECONDS=5' | Add-Content -LiteralPath $Log
                $process.StandardOutput.Dispose()
                $process.StandardError.Dispose()
              } else {
                $outputText = $stdout.GetAwaiter().GetResult()
                $outputText | Tee-Object -FilePath $Log -Append | Out-Host
                $stderr.GetAwaiter().GetResult() | Tee-Object -FilePath $Log -Append | Out-Host
                if ($StdoutPath) { $outputText | Set-Content -LiteralPath $StdoutPath }
              }
            } finally {
              $process.Dispose()
            }
            if ($exitCode -ne 0 -and -not $AllowFailure) { throw "$File exited $exitCode; see $Log" }
            return [int]$exitCode
          }

          function Require-File([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "Missing input: $Path" }
            return (Resolve-Path -LiteralPath $Path).Path
          }

          function Assert-Arm64Image([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes((Require-File $Path))
            if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5a4d) {
              throw "Invalid DOS header: $Path"
            }
            $pe = [long][BitConverter]::ToUInt32($bytes, 0x3c)
            if ($pe -lt 64 -or $pe -gt $bytes.Length - 26 -or
                [BitConverter]::ToUInt32($bytes, [int]$pe) -ne 0x4550 -or
                [BitConverter]::ToUInt16($bytes, [int]$pe + 4) -ne 0xaa64 -or
                [BitConverter]::ToUInt16($bytes, [int]$pe + 24) -ne 0x20b) {
              throw "Expected a pure ARM64 PE32+ image, not x64/ARM64EC/ARM64X: $Path"
            }
            [ordered]@{path=$Path; machine='0xAA64'; pe_magic='0x20B'; size=$bytes.Length; sha256=(Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash} |
              ConvertTo-Json -Compress | Out-Host
          }

          function Invoke-VbsSignTool([string[]]$Arguments, [string]$Verb, [string]$Log) {
            $code = Invoke-Bounded $script:signTool $Arguments $Log -Seconds 60 -AllowFailure
            if ($code -eq 0) { return }
            $lines = @(Get-Content -LiteralPath $Log | ForEach-Object { $_.Trim() })
            $warning = 'SignTool Warning: Note that VBS enclave support is changing and updating your VBS enclave may cause you to lose support on older OSes. Please visit https://go.microsoft.com/fwlink/?linkid=2312918 for details.'
            $warnings = @($lines | Where-Object { $_ -clike 'SignTool Warning:*' })
            if ($code -ne 2 -or $warnings.Count -ne 1 -or $warnings[0] -cne $warning -or
                @($lines | Where-Object { $_ -clike 'SignTool Error:*' }).Count -ne 0 -or
                @($lines | Where-Object { $_ -ceq "Successfully $($Verb.ToLowerInvariant()): $script:signed" }).Count -ne 1 -or
                @($lines | Where-Object { $_ -ceq "Number of files successfully ${Verb}: 1" }).Count -ne 1 -or
                @($lines | Where-Object { $_ -ceq 'Number of warnings: 1' }).Count -ne 1) {
              throw "SignTool failed or reported a warning outside the existing VBS allowlist; see $Log"
            }
          }

          try {
            $result.stage = 'Build'
            $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests\neverc\Inputs\VBSEnclave'
            $runtime = Join-Path $env:GITHUB_WORKSPACE 'runtime\windows\arm64\msvc'
            $python = (Get-Command python.exe -ErrorAction Stop).Source
            $cl = (Get-Command cl.exe -ErrorAction Stop).Source
            $link = (Get-Command link.exe -ErrorAction Stop).Source
            if ($env:VSCMD_ARG_TGT_ARCH -ine 'arm64' -or $cl -notmatch '\\arm64\\cl\.exe$') {
              throw 'MSVC must target ARM64.'
            }
            $sdk = $env:WindowsSDKVersion.TrimEnd('\', '/')
            $sdkRoot = $env:WindowsSdkDir.TrimEnd('\', '/')
            $onecore = Require-File (Join-Path $sdkRoot "Lib\$sdk\um\arm64\onecore.lib")
            # SDK utility architecture is independent of the native host/DLL under test.
            $sdkTools = @{}
            foreach ($name in @('veiid', 'signtool')) {
              foreach ($toolArch in @('arm64', 'x64')) {
                $path = Join-Path $sdkRoot "Bin\$sdk\$toolArch\$name.exe"
                if (Test-Path -LiteralPath $path -PathType Leaf) { $sdkTools[$name] = $path; break }
              }
              if (-not $sdkTools.ContainsKey($name)) { throw "SDK tool missing: $name" }
            }
            $script:signTool = $sdkTools.signtool
            $tools = [ordered]@{cl=$cl; link=$link; python=$python; onecore=$onecore; veiid=$sdkTools.veiid; signtool=$script:signTool; sdk=$sdk; lib=$env:LIB}
            $tools | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'tools.json') | Out-Host
            @($cl, $link, $python, $sdkTools.veiid, $script:signTool) | ForEach-Object {
              $item = Get-Item -LiteralPath $_
              [ordered]@{path=$_; version=$item.VersionInfo.FileVersion; sha256=(Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash}
            } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'tool-identities.json') | Out-Host
            $objects = @()
            foreach ($source in @('enclave.cpp', 'guarded.cpp', 'legacy.cpp')) {
              $object = Join-Path $root "$source.obj"
              $flags = @('/nologo', '/c', '/std:c++17', '/GS-', "/Fo$object", (Join-Path $fixture $source))
              if ($source -cne 'legacy.cpp') { $flags += '/guard:cf' }
              Invoke-Bounded $cl $flags (Join-Path $root "build-$source.log") | Out-Null
              $objects += $object
            }
            $libraries = @(
              'sdk\lib\um\vertdll.lib', 'sdk\lib\um\bcrypt.lib',
              'crt\lib\enclave\libcmt.lib', 'crt\lib\enclave\libvcruntime.lib',
              'sdk\lib\ucrt_enclave\ucrt.lib'
            ) | ForEach-Object { Require-File (Join-Path $runtime $_) }
            $unsigned = Join-Path $root 'msvc-msvc-arm64.dll'
            $map = Join-Path $root 'msvc-msvc-arm64.map'
            $linkArguments = @('/NOLOGO', '/DLL', '/INCREMENTAL:NO', '/NODEFAULTLIB', '/ENCLAVE', '/INTEGRITYCHECK', '/GUARD:MIXED', '/DYNAMICBASE', '/MACHINE:ARM64', '/WX:4229', "/OUT:$unsigned", "/IMPLIB:$unsigned.lib", "/MAP:$map") + $objects + $libraries
            Invoke-Bounded $link $linkArguments (Join-Path $root 'link-reference.log') | Out-Null
            $hostImage = Join-Path $root 'vbs-enclave-host-arm64.exe'
            $hostObject = Join-Path $root 'host.obj'
            Invoke-Bounded $cl @('/nologo', '/std:c++17', (Join-Path $fixture 'host.cpp'), "/Fo$hostObject", "/Fe$hostImage", '/link', '/INCREMENTAL:NO', '/MACHINE:ARM64', $onecore) (Join-Path $root 'build-host.log') | Out-Null
            Assert-Arm64Image $hostImage
            Assert-Arm64Image $unsigned
            $peVerifier = Join-Path $env:GITHUB_WORKSPACE 'utils\ci\verify-vbs-enclave-pe.py'
            $runtimeVerifier = Join-Path $env:GITHUB_WORKSPACE 'utils\ci\verify-vbs-enclave-runtime.py'
            Invoke-Bounded $python @('-I', '-B', $runtimeVerifier, 'self-test') (Join-Path $root 'runtime-verifier-self-test.log') | Out-Null
            Invoke-Bounded $python @('-I', '-B', $peVerifier, 'inspect', $unsigned, '--machine', 'arm64', '--linker', 'microsoft', '--map', $map, '--json', (Join-Path $root 'reference-pe.json')) (Join-Path $root 'reference-pe.log') | Out-Null
            $staticRoot = Join-Path $root 'static-inputs'
            $imageSources = [ordered]@{}
            $candidateMaps = [ordered]@{}
            $candidateUnsigned = [ordered]@{}
            foreach ($name in @('neverc-msvc-arm64', 'neverc-neverc-arm64')) {
              $candidateUnsigned[$name] = Require-File (Join-Path $staticRoot "unsigned\$name.dll")
              $candidateMaps[$name] = Require-File (Join-Path $staticRoot "maps\$name.map")
              $linkerKind = if ($name -ceq 'neverc-msvc-arm64') { 'microsoft' } else { 'integrated' }
              Invoke-Bounded $python @('-I', '-B', $peVerifier, 'inspect', $candidateUnsigned[$name], '--machine', 'arm64', '--linker', $linkerKind, '--map', $candidateMaps[$name], '--json', (Join-Path $root "$name-pe.json")) (Join-Path $root "$name-pe.log") | Out-Null
            }
            Invoke-Bounded $python @('-I', '-B', $peVerifier, 'compare', $candidateUnsigned['neverc-msvc-arm64'], $candidateUnsigned['neverc-neverc-arm64'], '--reference-map', $candidateMaps['neverc-msvc-arm64'], '--candidate-map', $candidateMaps['neverc-neverc-arm64']) (Join-Path $root 'compare-neverc-arm64.log') | Out-Null
            $script:signed = Join-Path $root 'msvc-msvc-arm64-signed.dll'
            Copy-Item -LiteralPath $unsigned -Destination $script:signed
            Invoke-Bounded $sdkTools.veiid @($script:signed) (Join-Path $root 'veiid.log') | Out-Null
            $imageSources['msvc-msvc-arm64'] = $script:signed
            foreach ($name in @('neverc-msvc-arm64', 'neverc-neverc-arm64')) {
              $source = Require-File (Join-Path $staticRoot "runtime\$name.dll")
              $destination = Join-Path $root "$name-signed.dll"
              Copy-Item -LiteralPath $source -Destination $destination
              if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash) {
                throw 'A candidate runtime copy differs from its verified static input.'
              }
              $imageSources[$name] = $destination
            }
            $preSignImages = foreach ($entry in $imageSources.GetEnumerator()) {
              Assert-Arm64Image $entry.Value
              [ordered]@{name=$entry.Key; path=$entry.Value; machine='0xAA64'; size=(Get-Item -LiteralPath $entry.Value).Length; sha256=(Get-FileHash -LiteralPath $entry.Value -Algorithm SHA256).Hash}
            }
            $preSignImages | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'presign-images.json') | Out-Host

            $result.stage = 'Certificate'
            $helper = Join-Path $env:GITHUB_WORKSPACE 'utils\ci\new-vbs-enclave-test-certificate.ps1'
            $certificatePath = Join-Path $root 'certificate.cer'
            $thumbprintPath = Join-Path $root 'certificate-thumbprint.txt'
            'Certificate helper started; identity must be confirmed for precise cleanup.' | Set-Content (Join-Path $root 'certificate-started.txt')
            Invoke-Bounded (Get-Command pwsh.exe).Source @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', $helper, '-CertificatePath', $certificatePath, '-ThumbprintPath', $thumbprintPath, '-StageLogPath', (Join-Path $root 'certificate-stages.log')) (Join-Path $root 'certificate-bootstrap.log') -Seconds 90 | Out-Null
            $thumbprint = (Get-Content -LiteralPath $thumbprintPath -Raw).Trim()
            if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') { throw 'Invalid signing identity.' }
            $public = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
            try {
              if ($public.Thumbprint -cne $thumbprint -or $public.HasPrivateKey) { throw 'Public certificate identity mismatch.' }
            } finally { $public.Dispose() }
            $personal = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint"
            if (-not $personal.HasPrivateKey) { throw 'Signing certificate has no private key.' }
            if (Test-Path -LiteralPath "Cert:\LocalMachine\TrustedPeople\$thumbprint") { throw 'Trust entry already exists; refusing to claim ownership.' }
            'Trust installation attempted for this exact identity.' | Set-Content (Join-Path $root 'trust-started.txt')
            Invoke-Bounded (Get-Command certutil.exe).Source @('-f', '-addstore', 'TrustedPeople', $certificatePath) (Join-Path $root 'certificate-trust.log') -Seconds 60 | Out-Null
            $trusted = Get-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$thumbprint"
            if ($trusted.Thumbprint -cne $thumbprint -or $trusted.HasPrivateKey) { throw 'Trusted public certificate mismatch.' }

            $result.stage = 'Signing'
            $signedImages = foreach ($entry in $imageSources.GetEnumerator()) {
              $script:signed = $entry.Value
              Invoke-VbsSignTool @('sign', '/ph', '/fd', 'SHA256', '/sha1', $thumbprint, $script:signed) 'Signed' (Join-Path $root "sign-$($entry.Key).log")
              Invoke-VbsSignTool @('verify', '/pa', '/v', $script:signed) 'Verified' (Join-Path $root "verify-signature-$($entry.Key).log")
              Assert-Arm64Image $script:signed
              [ordered]@{name=$entry.Key; path=$script:signed; machine='0xAA64'; size=(Get-Item -LiteralPath $script:signed).Length; sha256=(Get-FileHash -LiteralPath $script:signed -Algorithm SHA256).Hash; certificate_thumbprint=$thumbprint}
            }
            $signedImages | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'signed-images.json') | Out-Host
            Assert-Arm64Image $hostImage
            $inputs = @($hostImage, $unsigned, $helper, $runtimeVerifier, $peVerifier, (Join-Path $root 'validate-inputs.py')) + $libraries + @(Get-ChildItem -LiteralPath $fixture -File | ForEach-Object { $_.FullName })
            $inputs | ForEach-Object { Get-FileHash -LiteralPath $_ -Algorithm SHA256 | Select-Object Path, Algorithm, Hash } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'input-hashes.json') | Out-Host

            $result.stage = 'Runtime'
            $results = foreach ($entry in $imageSources.GetEnumerator()) {
              $name = $entry.Key
              $runtimeLog = Join-Path $root "runtime-$name.log"
              $exitCode = Invoke-Bounded $hostImage @($entry.Value) $runtimeLog -Seconds 180 -AllowFailure
              $verdictPath = Join-Path $root "runtime-$name-verdict.json"
              $arguments = @('-I', '-B', $runtimeVerifier, 'inspect', '--log', $runtimeLog, "--exit-code=$exitCode", '--require-runtime')
              if ($name -ceq 'msvc-msvc-arm64') { $arguments += '--reference' }
              Invoke-Bounded $python $arguments (Join-Path $root "runtime-$name-verifier.log") -Seconds 60 -StdoutPath $verdictPath | Out-Null
              Invoke-Bounded $python @('-I', '-B', (Join-Path $root 'validate-inputs.py'), 'verdict', $verdictPath) (Join-Path $root "runtime-$name-strict-json.log") -Seconds 60 | Out-Null
              [ordered]@{image=$name; host_exit_code=$exitCode; verdict=(Get-Content -LiteralPath $verdictPath -Raw | ConvertFrom-Json)}
            }
            $results | ConvertTo-Json -Depth 5 | Tee-Object -FilePath (Join-Path $root 'runtime-results.json') | Out-Host
            $result.stage = 'CleanupPending'
            $result.message = 'Reference and both fixed NeverC ARM64 images passed all 48 stages. Cleanup remains required; this was not a fresh NeverC compiler build.'
          } catch {
            $result.message = $_.Exception.Message
            throw
          } finally {
            $result | ConvertTo-Json | Set-Content -LiteralPath $resultPath
          }

      - name: Remove only this probe's certificate and private key
        if: always()
        timeout-minutes: 2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not $env:VBS_REPLAY_ROOT) { Write-Host 'Certificate helper was never reached.'; exit 0 }
          $root = $env:VBS_REPLAY_ROOT
          $cleanup = [ordered]@{status='NOT_NEEDED'; message='Certificate helper was not started.'}
          $errors = [Collections.Generic.List[string]]::new()
          if (Test-Path -LiteralPath (Join-Path $root 'certificate-started.txt')) {
            $cleanup.status = 'CLEANUP_NOT_PROVEN'
            $cleanup.message = 'The unchanged helper may persist a key before recording identity; the ephemeral runner is the final disposal boundary.'
            try {
              $thumbprint = (Get-Content -LiteralPath (Join-Path $root 'certificate-thumbprint.txt') -Raw).Trim()
              if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') { throw 'Missing or invalid exact certificate identity; no guessed deletion.' }
              $public = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Join-Path $root 'certificate.cer'))
              try {
                if ($public.Thumbprint -cne $thumbprint -or $public.HasPrivateKey) { throw 'Public identity does not match; no certificate deletion.' }
              } finally { $public.Dispose() }
              $cleanup['thumbprint'] = $thumbprint
              $personalPath = "Cert:\CurrentUser\My\$thumbprint"
              try {
                if (-not (Test-Path -LiteralPath $personalPath)) { throw 'Personal certificate missing; private-key cleanup cannot be proved.' }
                if (-not (Get-Item -LiteralPath $personalPath).HasPrivateKey) { throw 'Personal certificate lost its key association; private-key cleanup cannot be proved.' }
                Remove-Item -LiteralPath $personalPath -DeleteKey -Force
                if (Test-Path -LiteralPath $personalPath) { throw 'Personal certificate survived deletion.' }
              } catch { $errors.Add($_.Exception.Message) }
              if (Test-Path -LiteralPath (Join-Path $root 'trust-started.txt')) {
                $trustPath = "Cert:\LocalMachine\TrustedPeople\$thumbprint"
                try {
                  if (Test-Path -LiteralPath $trustPath) {
                    if ((Get-Item -LiteralPath $trustPath).HasPrivateKey) { throw 'Trust entry unexpectedly has a private key; refusing deletion.' }
                    Remove-Item -LiteralPath $trustPath -Force
                  }
                  if (Test-Path -LiteralPath $trustPath) { throw 'Public trust entry survived deletion.' }
                } catch { $errors.Add($_.Exception.Message) }
              }
              if ($errors.Count -eq 0) {
                $cleanup.status = 'REMOVED'
                $cleanup.message = 'Exact personal certificate/private key and any probe-created public trust entry removed.'
              }
            } catch { $errors.Add($_.Exception.Message) }
          }
          $cleanup['errors'] = @($errors.ToArray())
          $cleanup | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'cleanup.json') | Out-Host
          $resultPath = Join-Path $root 'result.json'
          if (Test-Path -LiteralPath $resultPath) {
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            if ($cleanup.status -ceq 'REMOVED' -and $result.stage -ceq 'CleanupPending') {
              $result.status = 'ARM64_REPLAY_PASS'
              $result.stage = 'Complete'
              $result.message = 'The fixed c46 NeverC ARM64 images and native MSVC reference passed 48 stages, twelve verified calls and teardown, with exact certificate cleanup. This is artifact replay, not a fresh compiler build or permanent CI gate.'
            }
            $result | ConvertTo-Json | Tee-Object -FilePath $resultPath | Out-Host
            "### ARM64 VBS artifact replay: $($result.status)`n`n$($result.message)" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ($cleanup.status -ceq 'CLEANUP_NOT_PROVEN' -or $errors.Count -ne 0) { throw 'Precise certificate cleanup was not proved; see cleanup.json.' }

      - name: Publish differential evidence, never private keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vbs-arm64-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vbs-arm64-replay-${{ github.run_id }}-${{ github.run_attempt }}/*.json
