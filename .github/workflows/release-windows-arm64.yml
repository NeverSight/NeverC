# Release build for Windows arm64.  Tag push: package + GitHub Release.
# Manual dispatch: artifacts only (no release).
#
# Uses MSVC (cl.exe) via Ninja on a native Windows-11-arm runner.
# LTO is disabled under MSVC; compiler speed comes from:
#   - NEVERC_RELEASE_OPT_LEVEL=3  (/O2 via MSVC defaults)
#   - mimalloc, static linking (NeverC.cmake)
name: windows-arm64-neverc-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release build
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build deps
        run: choco install ninja cmake 7zip -y

      - name: Setup MSVC (native arm64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.7

      - name: Build neverc (Release)
        shell: bash
        run: |
          cmake -S llvm -B build -G Ninja \
            -C neverc/cmake/caches/NeverC.cmake \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target neverc --parallel $NUMBER_OF_PROCESSORS

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Run neverc tests
        shell: bash
        run: cmake --build build --target check-neverc

      - name: Install neverc
        run: cmake --install build --prefix "$env:GITHUB_WORKSPACE\install"

      - name: Package
        run: 7z a windows-arm64-neverc-release.zip install

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-neverc-release
          path: windows-arm64-neverc-release.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-rc') }}
          files: windows-arm64-neverc-release.zip
