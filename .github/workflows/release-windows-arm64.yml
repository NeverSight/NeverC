# Release build producer for Windows arm64.
# Called by release.yml; manual dispatch builds artifacts without publishing.
#
# Uses MSVC (cl.exe) via Ninja on a native Windows-11-arm runner.
# Compiler speed comes from:
#   - NEVERC_RELEASE_OPT_LEVEL=3  (/O2 via MSVC defaults)
#   - mimalloc, static linking (NeverC.cmake)
name: windows-arm64-neverc-release

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  release:
    name: Build + test + package
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up CPython 3.12.10 for official artifacts
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: arm64

      - name: Install ARM64-native CMake & Ninja
        shell: pwsh
        run: |
          $cmakeVer = '3.31.11'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-arm64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-arm64\bin"

          $ninjaVer = '1.13.1'
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v$ninjaVer/ninja-winarm64.zip" -OutFile ninja.zip
          Expand-Archive ninja.zip C:\tools\ninja -Force
          Add-Content $env:GITHUB_PATH "C:\tools\ninja"

          choco install 7zip -y

      - name: Setup MSVC (native arm64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Build neverc (Release)
        shell: bash
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
            -C neverc/cmake/caches/NeverC.cmake \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \
            -DNEVERC_ENABLE_LTO=ON \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target neverc-embed-runtime-bitcode --parallel "$NUMBER_OF_PROCESSORS"

      - name: Build bundled Windows runtime
        shell: bash
        run: cmake --build build --target neverc-runtime-arm64-msvc neverc-runtime-shared-msvc

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Build Plugin SDK
        shell: bash
        run: cmake --build build --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        shell: bash
        run: |
          set -e
          make -C build/pluginsdk/examples \
            "NEVERC=$PWD/build/bin/neverc" \
            "INCLUDE_DIR=$PWD/build/pluginsdk/include" \
            HOST_TARGET=aarch64-pc-windows-msvc
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=aarch64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.dll \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Gate release on std library tests
        shell: bash
        run: cmake --build build --config Release --target check-neverc-std

      - name: Install neverc
        shell: bash
        run: |
          cmake --build build --target install

      - name: Package
        run: 7z a windows-arm64-neverc-release.zip install

      - name: Verify relocated release archive
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" \
            utils/release/test-python-plugin-package.py \
            --archive windows-arm64-neverc-release.zip

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-neverc-release
          path: windows-arm64-neverc-release.zip
