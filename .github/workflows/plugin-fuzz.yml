# Volume 6 task 23: build and exercise the six-volume plugin fuzzers.
#
# On touched PRs it runs the fixed-budget PluginFuzzSmoke.* CTest targets; on a
# nightly schedule and on manual dispatch it runs longer soak sessions.  Fuzzers
# require Clang + libFuzzer, so the build always uses apt.llvm.org clang with
# -DNEVERC_ENABLE_PLUGIN_FUZZERS=ON.  Hostile bytes only drive host
# parsers/builders/verifiers; no native plugin code is generated from fuzz data.
name: plugin-fuzz

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Per-fuzzer soak duration (seconds)"
        default: "120"
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - "fuzz/plugin/**"
      - "neverc/lib/Plugin/**"
      - "neverc/lib/DynCode/**"
      - "neverc/include/neverc/Plugin/**"
      - ".github/workflows/plugin-fuzz.yml"

jobs:
  fuzz:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      # Each of the fuzzers statically links the whole toolchain with debug
      # info, so the runner's stock free space is not enough for the full set.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure with plugin fuzzers enabled
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_PLUGIN_FUZZERS=ON \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build plugin fuzzers
        run: >-
          cmake --build build --config ${{ env.BUILD_TYPE }}
          --target neverc-plugin-fuzzers

      - name: Fuzz smoke tests
        run: ctest --test-dir build -R PluginFuzzSmoke --output-on-failure

      - name: Fuzz soak (dispatch / nightly)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          DUR="${{ github.event.inputs.soak_seconds }}"
          DUR="${DUR:-120}"
          for f in build/bin/plugin-*-fuzzer; do
            echo "=== soak $(basename "$f") for ${DUR}s ==="
            "$f" -max_total_time="$DUR" -max_len=4096 -print_funcs=0 || {
              echo "fuzzer $(basename "$f") found a crash";
              exit 1;
            }
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
