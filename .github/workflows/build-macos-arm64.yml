name: macos-arm64-neverc-build

permissions:
  contents: write

on: [push, pull_request]

jobs:
  build:
    # Version tags use release-pgo-macos.yml (PGO release build).
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    env:
      # RelWithDebInfo so CI artifacts ship with DWARF symbols for crash
      # triage; release-macos-pgo.yml is the symbol-stripped Release path.
      BUILD_TYPE: RelWithDebInfo
      # Turn any parallel-codegen merge/self-verify fallback into a hard CI
      # failure instead of a silent fallback to serial codegen.  A correct merge
      # is unaffected (byte-identical output); only a real merger regression —
      # the historical offset-collapse class, which stayed hidden precisely
      # because the fallback kept builds green — trips this.  Covers both the
      # example builds and the test suite below.
      NEVERC_PCG_STRICT: "1"
      # Runner is pinned to macos-15 (above) for a stable Apple toolchain; this
      # low deployment target makes the produced binary run on macOS 13+ instead
      # of defaulting to minos 15.0.  CMake initializes CMAKE_OSX_DEPLOYMENT_TARGET
      # from this env var; it also keeps neverc's own test-program links on a
      # consistent target.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Select latest stable Xcode (Apple Clang)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          clang --version
          which clang

      - name: Setup build deps
        run: brew install ninja cmake p7zip

      - name: Build neverc
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_INSTALL_PREFIX=install \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DHAVE_STD_IS_TRIVIALLY_COPYABLE=0 \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_STRIP_BINARY=OFF \
            -DNEVERC_ENABLE_LTO=ON \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm
          time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-embed-runtime-bitcode

      # Package + upload neverc immediately after the compiler links, before the
      # plugin-SDK / test steps below, so the binary is always downloadable as
      # an artifact even when a later step fails.
      - name: Install neverc
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

      - name: Package neverc
        run: 7z a macos-arm64-neverc.zip install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-neverc
          path: macos-arm64-neverc.zip

      - name: Package neverc compiler (without runtime)
        run: |
          mv install/runtime install-runtime-stash
          7z a macos-arm64-neverc-compiler.zip install
          mv install-runtime-stash install/runtime

      - name: Upload Compiler Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-neverc-compiler
          path: macos-arm64-neverc-compiler.zip

      - name: Package neverc runtime
        run: 7z a macos-arm64-neverc-runtime.zip install/runtime

      - name: Upload Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-neverc-runtime
          path: macos-arm64-neverc-runtime.zip

      - name: Build Plugin SDK
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        run: |
          set -e
          make -C build/pluginsdk/examples \
            NEVERC=$PWD/build/bin/neverc \
            INCLUDE_DIR=$PWD/build/pluginsdk/include
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.dylib \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Run neverc tests
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target check-neverc
