name: debug-std-bitcode-generator

on:
  push:
    tags:
      - std-red-20260830-bitcode-generator-windows
      - std-fix-20260830-bitcode-generator-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS arm64
            os: macos-14
          - name: Windows x64
            os: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run std bitcode generator tests
        run: python tests/neverc/BuildStdBitcodeTests.py -v
