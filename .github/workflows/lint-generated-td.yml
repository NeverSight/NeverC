name: lint-generated-td

on:
  push:
    paths:
      - 'neverc/include/neverc/Invoke/Options.td.h'
      - 'utils/lint/sort-options-td.py'
      - 'neverc/include/neverc/Foundation/DiagnosticGroups.td.h'
      - 'utils/lint/sort-diagnostic-groups.py'
      - 'llvm/include/llvm/IR/IntrinsicsX86.h'
      - 'llvm/include/llvm/IR/IntrinsicEnums.inc'
      - 'llvm/include/llvm/IR/IntrinsicImpl.inc'
      - 'llvm/lib/Target/X86/X86GenDAGISel.inc'
      - 'llvm/lib/Target/X86/X86GenInstrInfo.inc'
      - 'utils/lint/sort-x86-intrinsics.py'
      - 'utils/lint/test_sort_x86_intrinsics.py'
      - 'utils/lint/test_sync_x86_native_intrinsics.py'
      - 'utils/lint/sync-x86-native-intrinsics.py'
      - 'utils/lint/sync-x86-vmx-effects.py'
      - 'utils/lint/sync-x86-system-effects.py'
      - 'utils/lint/sync-x86-x87-environment.py'
      - 'utils/lint/test_sync_x86_x87_environment.py'
      - 'utils/lint/sync-x86-amx-instructions.py'
      - 'utils/lint/test_sync_x86_amx_instructions.py'
      - 'utils/lint/sync-x86-amx-native-controls.py'
      - 'utils/lint/sync-x86-apx-atomic.py'
      - 'utils/lint/test_sync_x86_apx_atomic.py'
      - 'llvm/include/llvm/IR/X86APXAtomicNative.h'
      - 'utils/lint/test_sync_x86_amx_native_controls.py'
      - 'utils/lint/sync-x86-rep-state.py'
      - 'utils/lint/test_sync_x86_rep_state.py'
      - 'utils/lint/sync-x86-bounded-leaf-state.py'
      - 'utils/lint/test_sync_x86_bounded_leaf_state.py'
      - 'llvm/include/llvm/IR/X86NativeArithmeticFlags.h'
      - 'llvm/include/llvm/IR/X86RepStringState.h'
      - 'utils/lint/sync-x86-mpx-registers.py'
      - 'utils/lint/sync-x86-mpx-instructions.py'
      - 'utils/lint/test_sync_x86_mpx_tables.py'
      - 'llvm/lib/Target/X86/X86GenRegisterInfo.inc'
      - 'llvm/lib/Target/X86/X86GenAsmWriter.inc'
      - 'llvm/lib/Target/X86/X86GenAsmWriter1.inc'
      - 'llvm/lib/Target/X86/X86GenAsmMatcher.inc'
      - 'llvm/lib/Target/X86/X86GenSubtargetInfo.inc'
      - 'llvm/lib/Target/X86/X86GenEVEX2VEXTables.inc'
      - '.github/workflows/lint-generated-td.yml'
  pull_request:
    paths:
      - 'neverc/include/neverc/Invoke/Options.td.h'
      - 'utils/lint/sort-options-td.py'
      - 'neverc/include/neverc/Foundation/DiagnosticGroups.td.h'
      - 'utils/lint/sort-diagnostic-groups.py'
      - 'llvm/include/llvm/IR/IntrinsicsX86.h'
      - 'llvm/include/llvm/IR/IntrinsicEnums.inc'
      - 'llvm/include/llvm/IR/IntrinsicImpl.inc'
      - 'llvm/lib/Target/X86/X86GenDAGISel.inc'
      - 'llvm/lib/Target/X86/X86GenInstrInfo.inc'
      - 'utils/lint/sort-x86-intrinsics.py'
      - 'utils/lint/test_sort_x86_intrinsics.py'
      - 'utils/lint/test_sync_x86_native_intrinsics.py'
      - 'utils/lint/sync-x86-native-intrinsics.py'
      - 'utils/lint/sync-x86-vmx-effects.py'
      - 'utils/lint/sync-x86-system-effects.py'
      - 'utils/lint/sync-x86-x87-environment.py'
      - 'utils/lint/test_sync_x86_x87_environment.py'
      - 'utils/lint/sync-x86-amx-instructions.py'
      - 'utils/lint/test_sync_x86_amx_instructions.py'
      - 'utils/lint/sync-x86-amx-native-controls.py'
      - 'utils/lint/sync-x86-apx-atomic.py'
      - 'utils/lint/test_sync_x86_apx_atomic.py'
      - 'llvm/include/llvm/IR/X86APXAtomicNative.h'
      - 'utils/lint/test_sync_x86_amx_native_controls.py'
      - 'utils/lint/sync-x86-rep-state.py'
      - 'utils/lint/test_sync_x86_rep_state.py'
      - 'utils/lint/sync-x86-bounded-leaf-state.py'
      - 'utils/lint/test_sync_x86_bounded_leaf_state.py'
      - 'llvm/include/llvm/IR/X86NativeArithmeticFlags.h'
      - 'llvm/include/llvm/IR/X86RepStringState.h'
      - 'utils/lint/sync-x86-mpx-registers.py'
      - 'utils/lint/sync-x86-mpx-instructions.py'
      - 'utils/lint/test_sync_x86_mpx_tables.py'
      - 'llvm/lib/Target/X86/X86GenRegisterInfo.inc'
      - 'llvm/lib/Target/X86/X86GenAsmWriter.inc'
      - 'llvm/lib/Target/X86/X86GenAsmWriter1.inc'
      - 'llvm/lib/Target/X86/X86GenAsmMatcher.inc'
      - 'llvm/lib/Target/X86/X86GenSubtargetInfo.inc'
      - 'llvm/lib/Target/X86/X86GenEVEX2VEXTables.inc'
      - '.github/workflows/lint-generated-td.yml'

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  check-options-sorted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Options.td.h is sorted
        run: |
          python3 utils/lint/sort-options-td.py --check
          echo ""
          echo "If this step fails, run locally:"
          echo "  python3 utils/lint/sort-options-td.py --write"
          echo "and commit the result."

  check-diagnostic-groups-sorted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify DiagnosticGroups.td.h is sorted
        run: |
          python3 utils/lint/sort-diagnostic-groups.py --check
          echo ""
          echo "If this step fails, run locally:"
          echo "  python3 utils/lint/sort-diagnostic-groups.py --write"
          echo "and commit the result."

  check-x86-intrinsics-synced:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify x86 intrinsics are sorted and DAGISel IDs are synced
        run: |
          python3 utils/lint/sort-x86-intrinsics.py --check
          echo ""
          echo "If this step fails, run locally:"
          echo "  python3 utils/lint/sort-x86-intrinsics.py --write"
          echo "and commit the result."

      - name: Verify VMX instruction effects
        run: python3 utils/lint/sync-x86-vmx-effects.py

      - name: Verify native AMX instructions
        run: |
          python3 utils/lint/sync-x86-amx-instructions.py
          python3 utils/lint/test_sync_x86_amx_instructions.py

      - name: Verify explicit AMX, APX and REP controls
        run: |
          python3 utils/lint/sync-x86-amx-native-controls.py
          python3 utils/lint/sync-x86-apx-atomic.py
          python3 utils/lint/test_sync_x86_apx_atomic.py
          python3 utils/lint/test_sync_x86_amx_native_controls.py
          python3 utils/lint/sync-x86-rep-state.py
          python3 utils/lint/test_sync_x86_rep_state.py
          python3 utils/lint/sync-x86-bounded-leaf-state.py
          python3 utils/lint/test_sync_x86_bounded_leaf_state.py

      - name: Verify native MPX bank and instructions
        run: |
          python3 utils/lint/sync-x86-mpx-registers.py
          python3 utils/lint/sync-x86-mpx-instructions.py
          python3 utils/lint/test_sync_x86_mpx_tables.py

      - name: Verify native intrinsic signatures
        run: python3 utils/lint/sync-x86-native-intrinsics.py

      - name: Verify system instruction effects
        run: |
          python3 utils/lint/sync-x86-system-effects.py
          python3 utils/lint/sync-x86-x87-environment.py
          python3 utils/lint/test_sync_x86_x87_environment.py

      - name: Verify system instruction pseudos
        run: |
          python3 utils/lint/sync-x86-system-pseudos.py
          python3 utils/lint/test_sync_x86_system_pseudos.py

      - name: Test intrinsic metadata synchronization
        run: |
          python3 utils/lint/test_sort_x86_intrinsics.py
          python3 utils/lint/test_sync_x86_native_intrinsics.py
