                      require(command is not None and _rs_success(command) and
                              tool["exists"] is True and tool["size"] is not None and
                              tool["sha256"] is not None and tool["version"] is not None and
                              all(key in tool for key in ("before", "path_before", "after", "path_after")),
                              "tool_completed_fields")
                      require(_rs_equal(tool["before"], tool["after"]) and
                              _rs_equal(tool["path_before"], tool["path_after"]) and
                              all(tool[key]["size"] == tool["size"] for key in
          NEVERC_CRT_TRUSTED_SOURCE_2
