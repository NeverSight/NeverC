          def _rs_keys(value, required, optional=()):
              require(type(value) is dict, "schema_object")
              require(set(required) <= set(value) <= set(required) | set(optional),
                      "schema_fields")


          def _rs_uint(value):
              require(type(value) is int and value >= 0, "schema_integer")


          def _rs_hash(value):
              require(type(value) is str and
                      _rs_re.fullmatch(r"[0-9a-f]{64}", value) is not None, "schema_hash")


          def _rs_error(value, limit=2880):
              require(type(value) is str and len(value) <= limit and
                      all(32 <= ord(char) < 127 for char in value), "schema_error")


          def _rs_elapsed(value):
              require(type(value) in (int, float) and 0 <= value < float("inf"),
                      "schema_elapsed")


          def _rs_equal(left, right):
              if type(left) is not type(right):
                  return False
              if type(left) is dict:
                  return (set(left) == set(right) and
                          all(_rs_equal(left[key], right[key]) for key in left))
              if type(left) is list:
                  return (len(left) == len(right) and
                          all(_rs_equal(a, b) for a, b in zip(left, right)))
              return left == right


          def _rs_path(value):
              require(type(value) is str and 0 < len(value) <= 32768 and
                      "\0" not in value, "schema_path")
              # PureWindowsPath performs no filesystem lookup on the reader's OS.
              require(_rs_WindowsPath(value).is_absolute(), "schema_absolute_path")


          def _rs_context(value):
              _rs_keys(value, {"schema", "selected_symbols", "private_archive",
                               "host_archives", "private_nm", "private_readobj", "host_nm",
                               "audit_outcome", "source_sha", "run_id", "run_attempt", "target"})
              require(value["schema"] == "neverc.crt-storage-request.v1" and
                      value["audit_outcome"] == "rejected", "request_schema")
              selected = value["selected_symbols"]
              require(type(selected) is list and 1 <= len(selected) <= 3 and
                      all(type(name) is str and name in _RS_SELECTED for name in selected),
                      "request_symbols")
              require(len(set(selected)) == len(selected), "request_duplicate_symbols")
              hosts = value["host_archives"]
              require(type(hosts) is list and 1 <= len(hosts) <= 4096, "request_hosts")
              for path in [value["private_archive"], value["private_nm"], value["host_nm"]] + hosts:
                  _rs_path(path)
              if value["private_readobj"] is not None:
                  _rs_path(value["private_readobj"])
