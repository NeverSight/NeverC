          def _fixed_blob_target(location):
              _fixed_check(type(location) is str and 0 < len(location) <= 8192 and
                           all(33 <= ord(char) <= 126 for char in location),
                           "download_location")
              try:
                  parsed = _fixed_parse.urlsplit(location)
                  host = parsed.hostname
                  port = parsed.port
              except ValueError:
                  raise _FixedFetchError("download_location") from None
              _fixed_check(parsed.scheme == "https" and host is not None and
                           parsed.username is None and parsed.password is None and
                           port in (None, 443) and not parsed.fragment,
                           "download_location")
              _fixed_check(len(host) <= 253 and host.endswith(".blob.core.windows.net"),
                           "download_host")
              labels = host.split(".")
