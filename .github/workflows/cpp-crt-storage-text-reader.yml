          def _rs_identity(value):
              if value is None:
                  return
              _rs_keys(value, {"device", "inode", "size", "mtime_ns", "ctime_ns"})
              require(all(type(item) is int for item in value.values()), "identity_integer")
              for key in ("device", "inode", "size"):
                  _rs_uint(value[key])
