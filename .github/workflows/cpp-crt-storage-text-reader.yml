          def _fixed_fields(value, expected, code):
              _fixed_check(type(value) is dict, code)
              _fixed_check(all(_fixed_equal(value.get(key), item)
                               for key, item in expected.items()), code)


          def _fixed_metadata(token):
              prefix = "/repos/" + SOURCE["repository"] + "/actions/"
              artifact = _fixed_api_json(
                  prefix + "artifacts/" + str(SOURCE["artifact_id"]), token,
                  "artifact_metadata")
              _fixed_fields(artifact, {
