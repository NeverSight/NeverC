      - name: Assemble trusted reader 4 of 4
        shell: bash
        run: |
          reader="$RUNNER_TEMP/neverc-crt-reader-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          if [ ! -f "$reader" ] || [ -L "$reader" ]; then
            exit 1
          fi
          cat >> "$reader" <<'NEVERC_CRT_TRUSTED_SOURCE_4'
                               "error": preview(record["error"]) if "error" in record else None}
                              for record in selected_records]
                  representatives = []
                  for rep in inventory["representatives"]:
                      item = {key: rep[key] for key in ("symbol", "side", "archive_ordinal", "index_source",
                                                        "first_index_ordinal", "member_ordinal", "archive_member_ordinal",
                                                        "header_offset", "payload_offset", "payload_size")}
