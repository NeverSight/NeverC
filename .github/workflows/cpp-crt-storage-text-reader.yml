                               label[-1] != "-" and
                               all(char in "abcdefghijklmnopqrstuvwxyz0123456789-"
                                   for char in label) for label in labels),
                           "download_host")
              target = parsed.path or "/"
              if parsed.query:
                  target += "?" + parsed.query
              return host, target


