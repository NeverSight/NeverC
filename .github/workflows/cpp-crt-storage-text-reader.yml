                  # Never expose HTTPError/SSL/OSError text: it can contain a signed URL.
                  failure = "fixed_fetch_transport"
              finally:
                  token = None
              # Raise outside the except blocks so an uncaught caller exception cannot
              # display a network exception through Python's implicit context chain.
              require(False, failure)
              raise AssertionError("fixed_fetch_rejected") from None

          import json as _rs_json
