                      "archives": {"items": archives, "display_omitted": len(records) - len(archives)},
                      "representatives": _rs_display(representatives),
                  }
              return projection

          def reader_selftests():
              # Trusted synthetic data only. These checks run on GitHub, never locally.
              import io
              import warnings
              import zipfile

              checks = 0
              names = ["manifest.json"] + sorted(TEXT_NAMES)[:12]

              class ForwardOnly(io.BytesIO):
                  def seek(self, *args):
                      raise io.UnsupportedOperation("synthetic-forward-only")

              def fixture(entry_names=None, method=0, creator=3, mode=None, streaming=False, extra=b""):
                  sink = ForwardOnly() if streaming else io.BytesIO()
                  with warnings.catch_warnings():
                      warnings.simplefilter("ignore", UserWarning)
                      with zipfile.ZipFile(sink, "w", compression=method, allowZip64=False) as archive:
                          for name in names if entry_names is None else entry_names:
                              entry = zipfile.ZipInfo(name)
                              entry.create_system = creator
                              entry.compress_type = method
                              entry.external_attr = (stat.S_IFREG | 0o600) << 16 if mode is None else mode
                              entry.extra = extra
                              archive.writestr(entry, b"{}\n")
                  return sink.getvalue()

              def rejects(callback):
                  nonlocal checks
                  rejected = False
                  try:
                      callback()
                  except ReaderFailure:
                      rejected = True
                  require(rejected, "selftest-expected-rejection")
                  checks += 1

              for archive in (fixture(), fixture(method=8), fixture(creator=0, mode=0x20),
                              fixture(streaming=True), fixture(method=8, streaming=True)):
                  require(read_text_zip(archive) == {name: b"{}\n" for name in names}, "selftest-valid-zip")
                  checks += 1
              for entry_names in (names[:-1], names + ["worker-stderr.txt"],
                                  names[:-1] + [names[1]], ["MANIFEST.JSON"] + names[1:],
                                  ["../manifest.json"] + names[1:]):
                  archive = fixture(entry_names)
                  rejects(lambda archive=archive: read_text_zip(archive))
              rejects(lambda: read_text_zip(fixture(mode=(stat.S_IFLNK | 0o777) << 16)))
              rejects(lambda: read_text_zip(fixture(creator=0, mode=0x10)))
              rejects(lambda: read_text_zip(fixture(extra=struct.pack("<HHQQ", 1, 16, 3, 3))))
              archive = fixture().replace(b"request.txt", b"request\0txt")
              rejects(lambda: read_text_zip(archive))
              archive = fixture() + b"unexpected-trailing-data"
              rejects(lambda: read_text_zip(archive))

              archive = bytearray(fixture())
              central_offset = struct.unpack_from("<L", archive, len(archive) - 6)[0]
              archive[central_offset + 8] |= 1
              rejects(lambda: read_text_zip(bytes(archive)))
              archive = bytearray(fixture())
              archive[len(archive) - 18] = 1
              rejects(lambda: read_text_zip(bytes(archive)))
              archive = bytearray(fixture())
              archive[14] ^= 1
              archive[central_offset + 16] ^= 1
              rejects(lambda: read_text_zip(bytes(archive)))

              compressor = zlib.compressobj(wbits=-15)
              compressed = compressor.compress(b"example") + compressor.flush()
              crc = zlib.crc32(b"example") & 0xFFFFFFFF
              require(_inflate(compressed, 8, 7, crc, 7) == b"example", "selftest-deflate")
              checks += 1
              rejects(lambda: _inflate(compressed[:-1], 8, 7, crc, 7))
              rejects(lambda: _inflate(compressed + b"extra", 8, 7, crc, 7))
              rejects(lambda: _inflate(compressed, 8, 6, crc, 6))

              require(strict_json(b'{"valid":[1,true,null]}', "selftest", 1024) ==
                      {"valid": [1, True, None]}, "selftest-valid-json")
              checks += 1
              for raw in (b'{"a":{"x":1,"x":2}}', b'{"n":NaN}', b'{"n":Infinity}',
                          b'{"n":1e999}', b'{"n":"\\u0000"}', b'{"n":"\\ud800"}',
                          b"[" * 33 + b"0" + b"]" * 33, b'{} trailing', b'"\xff"'):
                  rejects(lambda raw=raw: strict_json(raw, "selftest", 1024))
              marker = ":" * 2 + "error" + ":" * 2 + "\n" + "#" * 2 + "[warning]" + "\u2603"
              rendered = bounded_result({"value": marker})
              require(b"::" not in rendered and b"##[" not in rendered and rendered.count(b"\n") == 1,
                      "selftest-output-markers")
              require(json.loads(rendered[len(OUTPUT_PREFIX):]) == {"value": marker}, "selftest-output-roundtrip")
              checks += 1
              rendered = bounded_result({"reader_validation": "passed", "report": "\u2603" * OUTPUT_LIMIT})
              decoded = json.loads(rendered[len(OUTPUT_PREFIX):])
              require(len(rendered) <= OUTPUT_LIMIT and decoded["report_omitted"] is True
                      and decoded["display_truncated"] is True, "selftest-output-budget")
              checks += 1
              return checks

          import os as _reader_os
          import time as _reader_time


          def _display_has_omissions(value):
              if type(value) is dict:
                  omitted = value.get("display_omitted")
                  if type(omitted) is int and omitted > 0:
                      return True
                  return any(_display_has_omissions(item) for item in value.values())
              if type(value) is list:
                  return any(_display_has_omissions(item) for item in value)
              return False


          def reader_main():
              global PREVIEW_TRUNCATIONS
              signal.signal(signal.SIGALRM, _reader_timeout)
              deadline = _reader_time.monotonic() + 240
              signal.setitimer(signal.ITIMER_REAL, 240)
              phase = "selftests"
              result = None
              exit_code = 1
              try:
                  checks = reader_selftests()
                  phase = "fetch"
                  raw = fetch_fixed_zip()
                  require(len(raw) == SOURCE["zip_bytes"] and sha256_bytes(raw) == SOURCE["zip_sha256"],
                          "fixed-zip-identity")
                  phase = "zip"
                  entries = read_text_zip(raw)
                  phase = "report"
                  PREVIEW_TRUNCATIONS = 0
                  report = validate_report(entries)
                  result = {
                      "reader_validation": "passed",
                      "source_status": report["status"],
                      "source_audit_outcome": "rejected",
                      "scope": "text-integrity-and-reported-index-representatives-only",
                      "source": SOURCE,
                      "job_association": "fixed-job-run-metadata-and-previously-reviewed-upload-log",
                      "native_hashes": "reported-by-producer-not-recomputed-from-native-files",
                      "selftests_passed": checks,
                      "zip_bytes_verified": len(raw),
                      "zip_sha256_verified": sha256_bytes(raw),
                      "entry_count": len(entries),
                      "preview_truncations": PREVIEW_TRUNCATIONS,
                      "display_truncated": bool(PREVIEW_TRUNCATIONS) or _display_has_omissions(report),
                      "report": report,
                  }
                  exit_code = 0
              except ReaderFailure as error:
                  result = {"reader_validation": "failed", "phase": phase, "error_code": error.code}
              except Exception:
                  # Never print an exception, traceback, URL, arbitrary file, or environment.
                  result = {"reader_validation": "failed", "phase": phase,
                            "error_code": "unexpected-reader-error"}
              try:
                  # The outer timer also covers serialization and stdout flushing. An
                  # already expired budget must not start an unbounded final write.
                  if _reader_time.monotonic() >= deadline:
                      return 1
                  emit_result(result)
                  return exit_code
              except Exception:
                  # Output failure (including timeout) is fatal; no traceback or retry.
                  return 1
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)


          if __name__ == "__main__":
              # emit_result already flushes explicitly. Do not let interpreter shutdown
              # retry a failed or interrupted buffered write after the timer is disabled.
              _reader_os._exit(reader_main())
          NEVERC_CRT_TRUSTED_SOURCE_4
