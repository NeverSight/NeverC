                  require(type(value[key]) in (str, int) and
                          _rs_re.fullmatch(r"[0-9]{1,24}", str(value[key])) is not None and
                          str(value[key]) == str(SOURCE[key]), "request_run")
              require(type(value["target"]) is str and
                      value["target"] in {"x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"}
