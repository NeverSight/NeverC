                  require(type(tool["status"]) is str and
                          tool["status"] in {"complete", "incomplete", "probe-failed",
                                             "version-mismatch"}, "tool_status")
                  require(tool["exists"] is None or type(tool["exists"]) is bool, "tool_exists")
                  if tool["size"] is not None:
