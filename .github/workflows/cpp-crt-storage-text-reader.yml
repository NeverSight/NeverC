          _RS_COUNT_KEYS = {"scope", "processed", "omitted", "eligible_first",
                            "eligible_second", "selected"}
          _RS_LIMITS = {"collection_seconds": 110, "verification_seconds": 10,
                        "file_bytes": 1048576, "total_retained_bytes": 8388608,
                        "representatives_per_side_and_symbol": 1,
