              # exported. Do not invent a cross-API identity proof or truncate st_ino.


          def _rs_command(value):
              _rs_keys(value, {"status", "returncode", "elapsed_seconds", "cleanup", "argv"},
                       {"error"})
              require(type(value["status"]) is str and
                      value["status"] in {"completed", "timeout", "output_limit",
                                         "startup_failed", "error", "cleanup_incomplete"},
                      "command_status")
              require(value["returncode"] is None or type(value["returncode"]) is int,
                      "command_returncode")
              _rs_elapsed(value["elapsed_seconds"])
              cleanup = value["cleanup"]
              _rs_keys(cleanup, {"reaped", "kill_requested", "complete", "error"})
              require(all(type(cleanup[key]) is bool for key in
                          ("reaped", "kill_requested", "complete")), "command_cleanup")
              if cleanup["error"] is not None:
                  # Two independently bounded kill/wait errors, with fixed separators.
                  _rs_error(cleanup["error"], 5774)
              if "error" in value:
                  _rs_error(value["error"])
              require(type(value["argv"]) is list and len(value["argv"]) in (2, 9) and
                      all(type(arg) is str and len(arg) <= 32768 and "\0" not in arg
                          for arg in value["argv"]), "command_argv")


          def _rs_success(command):
              return (command["status"] == "completed" and
                      type(command["returncode"]) is int and command["returncode"] == 0 and
                      command["cleanup"]["complete"] and command["cleanup"]["reaped"] and
                      command["cleanup"]["kill_requested"] is False and
                      command["cleanup"]["error"] is None)


