          """Fixed runner-only transport; SOURCE and three validation helpers are injected.

          No artifact content is executed or written.  The caller owns the outer 240-second
          SIGALRM budget; each scope below preserves the time left on that outer timer.
          """

          import contextlib as _fixed_contextlib
          import http.client as _fixed_http
          import os as _fixed_os
          import signal as _fixed_signal
          import ssl as _fixed_ssl
          import time as _fixed_time
          import urllib.parse as _fixed_parse


          class _FixedFetchError(Exception):
              def __init__(self, code):
                  self.code = code
                  super().__init__(code)


          def _fixed_check(condition, code):
              if not condition:
                  raise _FixedFetchError(code)


          def _fixed_equal(actual, expected):
              return type(actual) is type(expected) and actual == expected


          @_fixed_contextlib.contextmanager
          def _fixed_time_limit(seconds, code):
              old_handler = _fixed_signal.getsignal(_fixed_signal.SIGALRM)
              old_remaining, old_interval = _fixed_signal.getitimer(_fixed_signal.ITIMER_REAL)
              _fixed_check(old_interval == 0.0, "fetch_timer_contract")
              started = _fixed_time.monotonic()
              delay = min(seconds, old_remaining) if old_remaining > 0 else seconds

              def expired(_signum, _frame):
                  raise _FixedFetchError(code)

              _fixed_signal.signal(_fixed_signal.SIGALRM, expired)
              try:
                  _fixed_signal.setitimer(_fixed_signal.ITIMER_REAL, delay)
                  yield started + delay
              finally:
                  _fixed_signal.setitimer(_fixed_signal.ITIMER_REAL, 0)
                  _fixed_signal.signal(_fixed_signal.SIGALRM, old_handler)
                  if old_remaining > 0:
                      remaining = old_remaining - (_fixed_time.monotonic() - started)
                      # An expired enclosing budget must not silently disappear.
                      _fixed_signal.setitimer(_fixed_signal.ITIMER_REAL,
                                              max(remaining, 0.000001))


          def _fixed_remaining(deadline):
              remaining = deadline - _fixed_time.monotonic()
              _fixed_check(remaining > 0, "fetch_deadline")
              return remaining


          def _fixed_single_header(response, name):
              values = response.headers.get_all(name, [])
              _fixed_check(len(values) <= 1, "fetch_duplicate_header")
              return values[0] if values else None


          def _fixed_response_headers(response, ceiling):
              headers = response.getheaders()
              _fixed_check(len(headers) <= 64 and
                           sum(len(k) + len(v) + 4 for k, v in headers) <= 32768,
                           "fetch_headers_limit")
              encoding = _fixed_single_header(response, "Content-Encoding")
              _fixed_check(encoding is None or encoding.strip().lower() == "identity",
                           "fetch_content_encoding")
              transfer = _fixed_single_header(response, "Transfer-Encoding")
              _fixed_check(transfer is None or transfer.strip().lower() == "chunked",
                           "fetch_transfer_encoding")
              length = _fixed_single_header(response, "Content-Length")
              _fixed_check(transfer is None or length is None, "fetch_ambiguous_length")
              if length is not None:
                  _fixed_check(0 < len(length) <= 10 and
                               all("0" <= char <= "9" for char in length),
                               "fetch_invalid_length")
                  _fixed_check(int(length) <= ceiling, "fetch_body_limit")
              return None if length is None else int(length)


          def _fixed_read_body(response, ceiling, deadline):
              body = bytearray()
              while True:
                  _fixed_remaining(deadline)
                  # One extra byte detects overflow without retaining an unbounded body.
                  chunk = response.read(min(16384, ceiling + 1 - len(body)))
                  if not chunk:
                      break
                  body.extend(chunk)
                  _fixed_check(len(body) <= ceiling, "fetch_body_limit")
              return bytes(body)


          def _fixed_open(host, target, headers, deadline):
              # http.client does not follow redirects, load proxy credentials, or retain
              # cookies.  Certificate and hostname verification use the default context.
              connection = None
              try:
                  # Bound the explicit DNS/TCP/TLS connection separately while retaining
                  # whichever enclosing API/download deadline expires first.
                  with _fixed_time_limit(10, "fetch_connect_timeout") as connect_deadline:
                      connection = _fixed_http.HTTPSConnection(
                          host, 443, timeout=_fixed_remaining(connect_deadline),
                          context=_fixed_ssl.create_default_context())
                      connection.connect()
                  connection.timeout = _fixed_remaining(deadline)
                  _fixed_check(connection.sock is not None, "fetch_connect_state")
                  connection.sock.settimeout(connection.timeout)
                  # No implicit reconnection if the explicitly opened socket is lost.
                  connection.auto_open = 0
                  connection.request("GET", target, headers=headers)
                  response = connection.getresponse()
                  return connection, response
              except BaseException:
                  if connection is not None:
                      connection.close()
                  raise


          def _fixed_close(connection, response):
              try:
                  response.close()
              finally:
                  connection.close()


