          def _rs_representative(value, record, selected):
              _rs_keys(value, {"symbol", "index_source", "first_index_ordinal", "member_ordinal",
                               "archive_member_ordinal", "header_offset", "payload_offset",
                               "payload_size", "member_name", "payload_sha256"})
              require(type(value["symbol"]) is str and value["symbol"] in selected and
                      value["index_source"] == "first-linker-member", "representative_symbol")
              for key in ("first_index_ordinal", "member_ordinal", "archive_member_ordinal",
                          "header_offset", "payload_offset", "payload_size"):
                  _rs_uint(value[key])
              require(value["member_ordinal"] < record["member_count"] and
                      value["archive_member_ordinal"] - value["member_ordinal"] in (2, 3) and
                      value["payload_offset"] == value["header_offset"] + 60,
                      "representative_offsets")
              index = record["index"]
              require(bool(index) and value["first_index_ordinal"] < index["first_count"] and
                      index["candidates_by_symbol"][value["symbol"]]["first"] > 0,
                      "representative_index")
              before = record["archive"]["before"]
              require(before is not None and
                      value["payload_offset"] + value["payload_size"] <= before["size"],
                      "representative_extent")
              name = value["member_name"]
              _rs_keys(name, {"preview", "bytes", "sha256"})
              require(type(name["preview"]) is str and len(name["preview"]) <= 643,
                      "member_name_preview")
              _rs_uint(name["bytes"])
              require(name["bytes"] <= 1048576, "member_name_size")
              _rs_hash(name["sha256"])
              _rs_hash(value["payload_sha256"])


          def _rs_archive(record, side, ordinal, path, selected):
              _rs_keys(record, {"status", "side", "archive_ordinal", "archive", "member_count",
                                "member_inventory_sha256", "index", "representatives"}, {"error"})
              require(type(record["status"]) is str and record["status"] in _RS_STATES and
                      record["side"] == side and
                      type(record["archive_ordinal"]) is int and record["archive_ordinal"] == ordinal,
                      "archive_scope_binding")
              if "error" in record:
                  _rs_error(record["error"])
              archive = record["archive"]
              _rs_keys(archive, {"path", "before", "path_before", "after", "path_after", "sha256",
                                 "sha256_status", "identity_stable"})
              _rs_path(archive["path"])
              require(str(_rs_WindowsPath(archive["path"])) == str(_rs_WindowsPath(path)),
                      "archive_path_binding")
              for key in ("before", "path_before", "after", "path_after"):
                  _rs_identity(archive[key])
              require(type(archive["identity_stable"]) is bool and
                      type(archive["sha256_status"]) is str and
                      archive["sha256_status"] in {"unavailable", "computed-unverified",
                                                    "not-selected", "complete"}, "archive_identity_status")
              if archive["sha256"] is not None:
                  _rs_hash(archive["sha256"])
              require((archive["sha256"] is not None) ==
                      (archive["sha256_status"] in {"computed-unverified", "complete"}), "archive_hash_status")
              if archive["identity_stable"]:
                  require(all(archive[key] is not None for key in
                              ("before", "path_before", "after", "path_after")) and
                          _rs_equal(archive["before"], archive["after"]) and
                          _rs_equal(archive["path_before"], archive["path_after"]), "archive_stability_claim")
              _rs_uint(record["member_count"])
              if record["member_inventory_sha256"] is not None:
                  _rs_hash(record["member_inventory_sha256"])
              index = record["index"]
              require(type(index) is dict, "archive_index")
              if index:
                  _rs_keys(index, {"first_count", "second_count", "first_candidate_count",
                                   "second_candidate_count", "first_candidates_sha256",
                                   "second_candidates_sha256", "candidates_by_symbol"})
                  _rs_keys(index["candidates_by_symbol"], selected)
                  for name in selected:
                      _rs_keys(index["candidates_by_symbol"][name], {"first", "second"})
                      for value in index["candidates_by_symbol"][name].values():
                          _rs_uint(value)
                  for label in ("first", "second"):
                      _rs_uint(index[label + "_count"])
                      _rs_uint(index[label + "_candidate_count"])
                      _rs_hash(index[label + "_candidates_sha256"])
                      require(index[label + "_candidate_count"] <= index[label + "_count"] and
                              index[label + "_candidate_count"] == sum(
                                  pair[label] for pair in index["candidates_by_symbol"].values()),
                              "archive_index_count")
                  require(record["member_inventory_sha256"] is not None, "archive_member_inventory")
              reps = record["representatives"]
              require(type(reps) is list and len(reps) <= len(selected), "archive_representatives")
              seen = set()
              for rep in reps:
                  _rs_representative(rep, record, selected)
                  require(rep["symbol"] not in seen, "archive_duplicate_representative")
                  seen.add(rep["symbol"])
              if record["status"] == "complete":
                  require(archive["identity_stable"] and bool(index) and
                          archive["sha256_status"] == ("complete" if reps else "not-selected"),
                          "archive_complete_fields")


          def _rs_inventory(value, context):
              _rs_keys(value, {"schema", "status", "evidence_scope", "archives", "representatives", "counts"},
                       {"scope_sha256", "missing_index_representatives", "error"})
              require(value["schema"] == "neverc.crt-storage-inventory.v1" and
                      value["evidence_scope"] == _RS_SCOPE and type(value["status"]) is str and
                      value["status"] in _RS_STATES,
                      "inventory_schema")
              if "error" in value:
                  _rs_error(value["error"])
              counts = value["counts"]
              _rs_keys(counts, _RS_COUNT_KEYS)
              for number in counts.values():
                  _rs_uint(number)
              records, reps = value["archives"], value["representatives"]
              require(type(records) is list and len(records) <= 4097 and
                      type(reps) is list and len(reps) <= 6, "inventory_lists")
              scope = [("private", 0, context["private_archive"])] + [
                  ("host", ordinal, path) for ordinal, path in enumerate(context["host_archives"])]
              if "scope_sha256" in value:
                  _rs_hash(value["scope_sha256"])
                  encoded = (_rs_json.dumps(scope, sort_keys=True, ensure_ascii=True,
                                            separators=(",", ":")) + "\n").encode("ascii")
                  require(value["scope_sha256"] == sha256_bytes(encoded) and
                          counts["scope"] == len(scope), "inventory_scope_hash")
              else:
                  require(value["status"] == "incomplete" and not records and not reps and
                          all(number == 0 for number in counts.values()), "inventory_unstarted")
              require(counts["processed"] == len(records) and
                      counts["omitted"] == counts["scope"] - len(records) and
                      counts["selected"] == len(reps), "inventory_counts")
              flattened, seen = [], set()
              for position, record in enumerate(records):
                  require(position < len(scope), "inventory_scope_overflow")
                  side, ordinal, path = scope[position]
                  _rs_archive(record, side, ordinal, path, context["selected_symbols"])
                  if position + 1 < len(records):
                      require(record["status"] == "complete", "inventory_after_failed_archive")
                  for rep in record["representatives"]:
                      identity = (side, rep["symbol"])
                      require(identity not in seen, "inventory_duplicate_representative")
                      seen.add(identity)
                      flattened.append(dict(rep, side=side, archive_ordinal=ordinal))
              require(_rs_equal(reps, flattened), "inventory_representative_binding")
              for label in ("first", "second"):
                  require(counts["eligible_" + label] == sum(
                      record["index"].get(label + "_candidate_count", 0) for record in records),
                      "inventory_eligible_count")
              if "missing_index_representatives" in value:
                  missing = value["missing_index_representatives"]
                  _rs_keys(missing, {"private", "host"})
                  require(_rs_equal(missing, {side: sorted(name for name in context["selected_symbols"]
                                                         if (side, name) not in seen)
                                              for side in ("private", "host")}), "inventory_missing_symbols")
              if value["status"] == "complete":
                  require("scope_sha256" in value and counts["omitted"] == 0 and
                          "missing_index_representatives" in value and
                          all(record["status"] == "complete" for record in records),
                          "inventory_complete_fields")


          def _rs_display(items):
              return {"items": items[:64], "display_omitted": max(0, len(items) - 64)}


          def validate_report(entries):
              """Check bounded text and internal consistency, never native ABI or execution."""
              require(type(entries) is dict and "manifest.json" in entries and
                      set(entries) <= set(TEXT_NAMES) | {"manifest.json"}, "report_entries")
              require(all(type(raw) is bytes for raw in entries.values()), "report_bytes")
              require(sum(map(len, entries.values())) <= 8388608, "report_total_bytes")
              for name, raw in entries.items():
                  require(len(raw) <= (262144 if name == "manifest.json" else 1048576),
                          "report_file_bytes")
                  try:
                      raw.decode("utf-8", errors="strict")
                  except UnicodeError:
                      require(False, "report_utf8")
              manifest = strict_json(entries["manifest.json"], "manifest", 262144)
              _rs_keys(manifest, {"schema", "status", "audit_outcome", "evidence_scope", "context",
                                  "tools", "commands", "inventory", "cleanup", "files", "limits",
                                  "elapsed_seconds"}, {"error"})
              require(manifest["schema"] == "neverc.crt-storage-evidence.v1" and
                      type(manifest["status"]) is str and manifest["status"] in _RS_STATES and
                      manifest["audit_outcome"] == "rejected" and
                      manifest["evidence_scope"] == _RS_SCOPE, "manifest_schema")
              require(_rs_equal(manifest["limits"], _RS_LIMITS), "manifest_limits")
              _rs_elapsed(manifest["elapsed_seconds"])
              if "error" in manifest:
                  _rs_error(manifest["error"])
              _rs_context(manifest["context"])
              files = manifest["files"]
              require(type(files) is list and len(files) <= 16, "manifest_files")
              names = set()
              for entry in files:
                  _rs_keys(entry, {"name", "size", "sha256"})
                  name = entry["name"]
                  require(type(name) is str and name in TEXT_NAMES and name not in names and
                          name in entries, "manifest_file_name")
                  _rs_uint(entry["size"])
                  _rs_hash(entry["sha256"])
                  require(entry["size"] == len(entries[name]) and
                          entry["sha256"] == sha256_bytes(entries[name]), "manifest_file_integrity")
                  names.add(name)
              require(names == set(entries) - {"manifest.json"} and "request.txt" in names,
                      "manifest_file_bijection")
              request = strict_json(entries["request.txt"], "request", 1048576)
              _rs_context(request)
              require(_rs_equal(request, manifest["context"]), "request_manifest_binding")
              worker = _rs_tools(manifest, request)
              _rs_keys(manifest["cleanup"], {"complete"})
              require(type(manifest["cleanup"]["complete"]) is bool and
                      manifest["cleanup"]["complete"] == all(command["cleanup"]["complete"]
                                                             for command in manifest["commands"]),
                      "manifest_cleanup")
              inventory = None
              if "inventory.txt" in names:
                  inventory = strict_json(entries["inventory.txt"], "inventory", 1048576)
                  _rs_inventory(inventory, request)
              summary = manifest["inventory"]
              if summary is not None:
                  _rs_keys(summary, {"file", "status", "counts"})
                  require(inventory is not None and summary["file"] == "inventory.txt" and
                          summary["status"] == inventory["status"] and
                          _rs_equal(summary["counts"], inventory["counts"]) and
                          worker is not None and _rs_success(worker), "manifest_inventory_summary")
              if manifest["status"] == "complete":
                  require(names == set(TEXT_NAMES), "manifest_complete_files")
                  require(summary is not None and summary["status"] == "complete" and
                          len(manifest["tools"]) == 6 and len(manifest["commands"]) == 7 and
                          all(tool["status"] == "complete" for tool in manifest["tools"]) and
                          all(_rs_success(command) for command in manifest["commands"]) and
                          manifest["cleanup"]["complete"], "manifest_complete_stages")
              projection = {
                  "status": manifest["status"], "audit_outcome": "rejected", "evidence_scope": _RS_SCOPE,
                  "error": preview(manifest["error"]) if "error" in manifest else None,
                  "cleanup": {"complete": manifest["cleanup"]["complete"], "scope": "direct-child-only"},
                  "tools": _rs_display([{
                      "role": tool["role"], "status": tool["status"], "exists": tool["exists"],
                      "path_preview": preview(tool["path"]) if tool["path"] is not None else None,
                      "reported_size": tool["size"], "reported_sha256": tool["sha256"],
                      "version": preview(tool["version"]) if tool["version"] is not None else None,
                      "expected_version": preview(tool["expected_version"]) if tool["expected_version"] is not None else None,
                      "error": preview(tool["error"]) if "error" in tool else None,
                  } for tool in manifest["tools"]]),
                  "commands": _rs_display([{
                      "status": command["status"], "returncode": command["returncode"],
                      "elapsed_seconds": command["elapsed_seconds"],
                      "cleanup": {**{key: command["cleanup"][key] for key in
                                     ("complete", "reaped", "kill_requested")},
                                  "error": preview(command["cleanup"]["error"])
                                  if command["cleanup"]["error"] is not None else None},
                      "error": preview(command["error"]) if "error" in command else None,
                  } for command in manifest["commands"]]),
                  "inventory": None,
                  "evidence_limit": "Text consistency only; native hashes are reported, not recomputed. "
                                    "Index representatives do not prove full definitions, ABI equality, or execution.",
              }
              if inventory is not None:
                  records = inventory["archives"]
                  important = [record for record in records if record["status"] != "complete" or record["representatives"]]
                  others = [record for record in records if record["status"] == "complete" and not record["representatives"]]
                  selected_records = (important + others)[:64]
                  archives = [{"side": record["side"], "archive_ordinal": record["archive_ordinal"],
                               "status": record["status"], "path_preview": preview(record["archive"]["path"]),
                               "member_count": record["member_count"],
                               "reported_member_inventory_sha256": record["member_inventory_sha256"],
                               "reported_index": record["index"],
                               "reported_sha256": record["archive"]["sha256"],
                               "reported_sha256_status": record["archive"]["sha256_status"],
                               "reported_identity_stable": record["archive"]["identity_stable"],
