          class ReaderFailure(Exception):
              def __init__(self, code):
                  self.code = code
                  super().__init__(code)


          def require(condition, code):
              if not condition:
                  raise ReaderFailure(code)


          def sha256_bytes(raw):
              return hashlib.sha256(raw).hexdigest()


          def preview(value):
              global PREVIEW_TRUNCATIONS
              require(type(value) is str, "preview-type")
              if len(value) > 240:
                  PREVIEW_TRUNCATIONS += 1
              return value[:240]


          def strict_json(raw, label, limit):
              require(type(raw) is bytes and len(raw) <= limit, "json-byte-limit")
              require(b"\0" not in raw, "json-nul")
              try:
                  text = raw.decode("utf-8", errors="strict")
              except UnicodeError:
                  raise ReaderFailure("json-utf8") from None
              depth = 0
              quoted = escaped = False
              for char in text:
                  if quoted:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          quoted = False
                  elif char == '"':
                      quoted = True
                  elif char in "[{":
                      depth += 1
                      require(depth <= 32, "json-depth")
                  elif char in "]}":
                      depth -= 1
                      require(depth >= 0, "json-depth")
              require(depth == 0 and not quoted, "json-structure")

              def pairs(items):
                  result = {}
                  for key, value in items:
                      require(key not in result, "json-duplicate-key")
                      result[key] = value
                  return result

              def integer(value):
                  require(len(value) <= 128, "json-integer-size")
                  return int(value)

              def floating(value):
                  number = float(value)
                  require(math.isfinite(number), "json-nonfinite")
                  return number

              def constant(value):
                  raise ReaderFailure("json-nonfinite")

              try:
                  value = json.loads(text, object_pairs_hook=pairs, parse_int=integer,
                                     parse_float=floating, parse_constant=constant)
              except (ValueError, RecursionError):
                  raise ReaderFailure("json-syntax") from None
              pending = [value]
              while pending:
                  item = pending.pop()
                  if type(item) is str:
                      require("\0" not in item, "json-decoded-nul")
                      require(not any(0xD800 <= ord(c) <= 0xDFFF for c in item),
                              "json-unpaired-surrogate")
                  elif type(item) is dict:
                      pending.extend(item.keys())
                      pending.extend(item.values())
                  elif type(item) is list:
                      pending.extend(item)
              return value


          def _zip_extra(raw):
              offset = 0
              while offset < len(raw):
                  require(offset + 4 <= len(raw), "zip-extra-header")
                  tag, size = struct.unpack_from("<HH", raw, offset)
                  offset += 4
                  require(tag != 0x0001, "zip64-not-supported")
                  require(offset + size <= len(raw), "zip-extra-size")
                  offset += size


          def _inflate(raw, method, size, crc, limit):
              require(0 <= size <= limit, "zip-expanded-size")
              if method == 0:
                  data = raw
              else:
                  require(method == 8, "zip-compression")
                  decoder = zlib.decompressobj(-15)
                  failed = False
                  try:
                      data = decoder.decompress(raw, limit + 1)
                  except zlib.error:
                      failed = True
                  require(not failed, "zip-deflate-invalid")
                  require(len(data) <= limit, "zip-expanded-size")
                  require(decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail,
                          "zip-deflate-boundary")
              require(len(data) == size and len(data) <= limit, "zip-expanded-size")
              require(zlib.crc32(data) & 0xFFFFFFFF == crc, "zip-crc")
              require(b"\0" not in data, "zip-text-nul")
              try:
                  data.decode("utf-8", errors="strict")
              except UnicodeError:
                  raise ReaderFailure("zip-text-utf8") from None
              return data


          def read_text_zip(raw):
              # Container parsing only. Native archive/object formats are never interpreted.
              require(type(raw) is bytes and 22 <= len(raw) <= SOURCE["zip_bytes"], "zip-byte-limit")
              end = len(raw) - 22
              signature, disk, central_disk, disk_count, count, central_size, central_offset, comment = (
                  struct.unpack_from("<4s4H2LH", raw, end)
              )
              require(signature == b"PK\x05\x06" and comment == 0, "zip-end-record")
              require(disk == central_disk == 0 and disk_count == count == 13, "zip-disk-or-count")
              require(central_offset + central_size == end, "zip-central-boundary")
              central = struct.Struct("<4s6H3L5H2L")
              local = struct.Struct("<4s5H3L2H")
              cursor = central_offset
              members = []
              names = set()
              folded = set()
              expanded = 0
              for unused in range(count):
                  require(cursor + central.size <= end, "zip-central-header")
                  (magic, made, needed, flags, method, clock, date, crc, compressed, size,
                   name_size, extra_size, comment_size, disk_start, internal, external, offset) = (
                      central.unpack_from(raw, cursor)
                  )
                  require(magic == b"PK\x01\x02", "zip-central-header")
                  require(disk_start == 0 and 10 <= needed <= 20, "zip-version-or-disk")
                  require(method in (0, 8) and flags & ~0x080E == 0, "zip-method-or-flags")
                  require(method == 8 or flags & 0x0006 == 0, "zip-stored-flags")
                  require(comment_size == 0 and name_size > 0, "zip-entry-comment-or-name")
                  require(size <= TEXT_LIMIT and compressed <= SOURCE["zip_bytes"], "zip-entry-size")
                  start = cursor + central.size
                  stop = start + name_size + extra_size + comment_size
                  require(stop <= end, "zip-central-entry-boundary")
                  raw_name = raw[start:start + name_size]
                  require(all(0x21 <= c <= 0x7E for c in raw_name), "zip-name-ascii")
                  name = raw_name.decode("ascii")
                  require("/" not in name and "\\" not in name and ":" not in name
                          and name not in (".", ".."), "zip-name-path")
                  require(name == "manifest.json" or name in TEXT_NAMES, "zip-name-allowlist")
                  require(name not in names and name.lower() not in folded, "zip-name-duplicate")
                  names.add(name)
                  folded.add(name.lower())
                  limit = MANIFEST_LIMIT if name == "manifest.json" else TEXT_LIMIT
                  require(size <= limit, "zip-entry-size")
                  creator = made >> 8
                  kind = stat.S_IFMT(external >> 16)
                  require(creator in (0, 3), "zip-creator")
                  require(kind == stat.S_IFREG or (creator == 0 and kind == 0), "zip-not-regular")
                  require(external & 0x18 == 0, "zip-dos-directory-or-volume")
                  _zip_extra(raw[start + name_size:stop])
                  require(offset < central_offset, "zip-local-offset")
                  expanded += size
                  require(expanded <= TOTAL_TEXT_LIMIT, "zip-total-expanded-size")
                  members.append((offset, name, raw_name, flags, method, clock, date, crc,
                                  compressed, size, needed, limit))
                  cursor = stop
              require(cursor == end and "manifest.json" in names and len(names - {"manifest.json"}) == 12,
                      "zip-central-size-or-membership")
              members.sort(key=lambda value: value[0])
              cursor = 0
              entries = {}
              for index, member in enumerate(members):
                  (offset, name, raw_name, flags, method, clock, date, crc,
                   compressed, size, needed, limit) = member
                  require(offset == cursor and offset + local.size <= central_offset, "zip-local-layout")
                  (magic, local_needed, local_flags, local_method, local_clock, local_date,
                   local_crc, local_compressed, local_size, name_size, extra_size) = local.unpack_from(raw, offset)
                  require(magic == b"PK\x03\x04", "zip-local-header")
                  require((local_needed, local_flags, local_method, local_clock, local_date) ==
                          (needed, flags, method, clock, date), "zip-local-central-mismatch")
                  start = offset + local.size
                  body = start + name_size + extra_size
                  stop = body + compressed
                  boundary = members[index + 1][0] if index + 1 < len(members) else central_offset
                  require(start <= body <= stop <= boundary, "zip-local-data-boundary")
                  require(raw[start:start + name_size] == raw_name, "zip-local-name")
                  _zip_extra(raw[start + name_size:body])
                  if flags & 8:
                      require(local_crc in (0, crc) and local_compressed in (0, compressed)
                              and local_size in (0, size), "zip-local-descriptor-values")
                      descriptor = raw[stop:boundary]
                      if len(descriptor) == 16:
                          require(descriptor[:4] == b"PK\x07\x08", "zip-data-descriptor")
                          descriptor = descriptor[4:]
                      require(len(descriptor) == 12, "zip-data-descriptor-size")
                      require(struct.unpack("<3L", descriptor) == (crc, compressed, size),
                              "zip-data-descriptor-values")
                  else:
                      require((local_crc, local_compressed, local_size) == (crc, compressed, size),
                              "zip-local-sizes")
                      require(stop == boundary, "zip-unclaimed-data")
                  entries[name] = _inflate(raw[body:stop], method, size, crc, limit)
                  cursor = boundary
              require(cursor == central_offset, "zip-local-end")
              return entries


          def bounded_result(result):
              def encode(value):
                  text = json.dumps(value, ensure_ascii=True, allow_nan=False, separators=(",", ":"))
                  # These markers can occur only inside strings in valid JSON. Preserve
                  # decoded values while removing both modern and legacy CI command markers.
                  text = text.replace("#", "\\u0023").replace("::", "\\u003a\\u003a")
                  return (OUTPUT_PREFIX + text + "\n").encode("utf-8")

              raw = encode(result)
              if len(raw) > OUTPUT_LIMIT:
                  result = {key: value for key, value in result.items() if key != "report"}
                  result.update({"report_omitted": True, "display_truncated": True,
                                 "display_reason": "projected-report-exceeds-output-budget"})
                  raw = encode(result)
              require(len(raw) <= OUTPUT_LIMIT, "output-byte-limit")
              return raw


          def emit_result(result):
              raw = bounded_result(result)
              # Emit only after byte bounds and CI marker escaping have both been applied.
              print(raw.decode("ascii"), end="", flush=True)


          def _reader_timeout(signum, frame):
