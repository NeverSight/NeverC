name: VBS enclave ARM64 reference feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

# This manual probe neither cancels existing CI nor accepts NeverC runtime coverage.
concurrency:
  group: vbs-arm64-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference:
    name: Native ARM64 Microsoft reference (not NeverC acceptance)
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reference inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/vbs-enclave-arm64-reference.yml
            /tests/neverc/Inputs/VBSEnclave/
            /utils/ci/new-vbs-enclave-test-certificate.ps1
            /utils/ci/verify-vbs-enclave-pe.py
            /utils/ci/verify-vbs-enclave-runtime.py
            /runtime/windows/arm64/msvc/crt/lib/enclave/
            /runtime/windows/arm64/msvc/sdk/lib/ucrt_enclave/
            /runtime/windows/arm64/msvc/sdk/lib/um/vertdll.lib
            /runtime/windows/arm64/msvc/sdk/lib/um/bcrypt.lib

      - name: Read native architecture, VBS and current signing configuration
        timeout-minutes: 2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "vbs-arm64-reference-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          "VBS_REFERENCE_ROOT=$root" | Add-Content $env:GITHUB_ENV
          $result = [ordered]@{
            scope = 'msvc-reference-feasibility'
            status = 'NOT_VALIDATED'
            stage = 'Preflight'
            architecture = 'arm64'
            source_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            message = 'No runtime reference has been executed.'
          }
          $result | ConvertTo-Json | Set-Content (Join-Path $root 'result.json')
          try {
            if ($env:GITHUB_REF -cne 'refs/heads/dev') { throw 'Dispatch this probe on dev.' }
            $osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            $processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            $os = Get-CimInstance Win32_OperatingSystem
            $environment = [ordered]@{
              runner = $env:RUNNER_NAME
              runner_arch = $env:RUNNER_ARCH
              image_os = $env:ImageOS
              image_version = $env:ImageVersion
              os_caption = $os.Caption
              os_version = $os.Version
              os_build = $os.BuildNumber
              os_architecture = $osArchitecture
              process_architecture = $processArchitecture
            }
            try {
              $guard = Get-CimInstance Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard
              $environment['device_guard'] = $guard | Select-Object VirtualizationBasedSecurityStatus, SecurityServicesConfigured, SecurityServicesRunning
            } catch {
              $environment['device_guard_error'] = $_.Exception.Message
            }
            $boot = & bcdedit.exe /enum '{current}' 2>&1
            $bootExit = $LASTEXITCODE
            $boot | Tee-Object -FilePath (Join-Path $root 'boot-configuration.txt') | Out-Host
            $environment['boot_query_exit_code'] = $bootExit
            $environment['testsigning_configured'] = [bool](@($boot | Where-Object { "$_" -cmatch '^testsigning\s+Yes\s*$' }).Count -eq 1)
            # Telemetry and BCD configuration alone are not execution evidence.
            $environment | ConvertTo-Json -Depth 5 | Tee-Object -FilePath (Join-Path $root 'environment.json') | Out-Host
            if ($osArchitecture -cne 'Arm64' -or $processArchitecture -cne 'Arm64') {
              throw 'Native ARM64 OS and PowerShell are required; emulated x64 is not ARM64 evidence.'
            }
            if ([int]$os.BuildNumber -lt 26100) { throw 'The runner OS is below the VBS enclave baseline.' }
            if ($bootExit -ne 0 -or -not $environment.testsigning_configured) {
              throw 'Test-signing configuration was not confirmed. No boot or security setting will be changed.'
            }
            Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          public static class VbsArm64Availability {
            [DllImport("kernel32.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool IsEnclaveTypeSupported(uint enclaveType);
          }
          '@
            $supported = [VbsArm64Availability]::IsEnclaveTypeSupported(0x10)
            $environment['vbs_enclave_type_supported'] = $supported
            $environment | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $root 'environment.json')
            if (-not $supported) { throw 'The native runner reports VBS enclaves unavailable.' }
            $result.stage = 'BuildPending'
            $result.message = 'Read-only preflight passed; runtime execution remains unvalidated.'
          } catch {
            $result.message = $_.Exception.Message
            throw
          } finally {
            $result | ConvertTo-Json | Set-Content (Join-Path $root 'result.json')
          }

      - name: Set up native ARM64 MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64

      - name: Set up ARM64 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: arm64

      - name: Build, sign and execute the ARM64 Microsoft reference
        timeout-minutes: 12
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = $env:VBS_REFERENCE_ROOT
          $resultPath = Join-Path $root 'result.json'
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json

          function Invoke-Bounded {
            param([string]$File, [string[]]$Arguments, [string]$Log,
                  [int]$Seconds = 120, [switch]$AllowFailure,
                  [string]$StdoutPath = '')
            $command = "COMMAND: $File $($Arguments -join ' ')"
            $command | Set-Content -LiteralPath $Log
            Write-Host $command
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $File
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $Arguments) { [void]$start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            try {
              if (-not $process.Start()) { throw "Cannot start $File" }
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit($Seconds * 1000)) {
                try { $process.Kill($true) } catch { Write-Warning $_.Exception.Message }
                [void]$process.WaitForExit(5000)
                $exitCode = 124
                "PROCESS_TIMEOUT_SECONDS=$Seconds" | Add-Content -LiteralPath $Log
              } else {
                $process.WaitForExit()
                $exitCode = $process.ExitCode
              }
              # Descendants can inherit pipes after the parent exits. Bound EOF
              # collection independently, including after a process-tree kill.
              $drained = $false
              try {
                $readers = [Threading.Tasks.Task]::WhenAll([Threading.Tasks.Task[]]@($stdout, $stderr))
                $drained = $readers.Wait(5000)
              } catch {
                "PROCESS_OUTPUT_ERROR=$($_.Exception.Message)" | Add-Content -LiteralPath $Log
              }
              if (-not $drained) {
                $exitCode = 124
                'PROCESS_OUTPUT_DRAIN_TIMEOUT_SECONDS=5' | Add-Content -LiteralPath $Log
                $process.StandardOutput.Dispose()
                $process.StandardError.Dispose()
              } else {
                $outputText = $stdout.GetAwaiter().GetResult()
                $outputText | Tee-Object -FilePath $Log -Append | Out-Host
                $stderr.GetAwaiter().GetResult() | Tee-Object -FilePath $Log -Append | Out-Host
                if ($StdoutPath) { $outputText | Set-Content -LiteralPath $StdoutPath }
              }
            } finally {
              $process.Dispose()
            }
            if ($exitCode -ne 0 -and -not $AllowFailure) { throw "$File exited $exitCode; see $Log" }
            return [int]$exitCode
          }

          function Require-File([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "Missing input: $Path" }
            return (Resolve-Path -LiteralPath $Path).Path
          }

          function Assert-Arm64Image([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes((Require-File $Path))
            if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5a4d) {
              throw "Invalid DOS header: $Path"
            }
            $pe = [long][BitConverter]::ToUInt32($bytes, 0x3c)
            if ($pe -lt 64 -or $pe -gt $bytes.Length - 26 -or
                [BitConverter]::ToUInt32($bytes, [int]$pe) -ne 0x4550 -or
                [BitConverter]::ToUInt16($bytes, [int]$pe + 4) -ne 0xaa64 -or
                [BitConverter]::ToUInt16($bytes, [int]$pe + 24) -ne 0x20b) {
              throw "Expected a pure ARM64 PE32+ image, not x64/ARM64EC/ARM64X: $Path"
            }
          }

          function Invoke-VbsSignTool([string[]]$Arguments, [string]$Verb, [string]$Log) {
            $code = Invoke-Bounded $script:signTool $Arguments $Log -Seconds 60 -AllowFailure
            if ($code -eq 0) { return }
            $lines = @(Get-Content -LiteralPath $Log | ForEach-Object { $_.Trim() })
            $warning = 'SignTool Warning: Note that VBS enclave support is changing and updating your VBS enclave may cause you to lose support on older OSes. Please visit https://go.microsoft.com/fwlink/?linkid=2312918 for details.'
            $warnings = @($lines | Where-Object { $_ -clike 'SignTool Warning:*' })
            if ($code -ne 2 -or $warnings.Count -ne 1 -or $warnings[0] -cne $warning -or
                @($lines | Where-Object { $_ -clike 'SignTool Error:*' }).Count -ne 0 -or
                @($lines | Where-Object { $_ -ceq "Successfully $($Verb.ToLowerInvariant()): $script:signed" }).Count -ne 1 -or
                @($lines | Where-Object { $_ -ceq "Number of files successfully ${Verb}: 1" }).Count -ne 1 -or
                @($lines | Where-Object { $_ -ceq 'Number of warnings: 1' }).Count -ne 1) {
              throw "SignTool failed or reported a warning outside the existing VBS allowlist; see $Log"
            }
          }

          try {
            $result.stage = 'Build'
            $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests\neverc\Inputs\VBSEnclave'
            $runtime = Join-Path $env:GITHUB_WORKSPACE 'runtime\windows\arm64\msvc'
            $python = (Get-Command python.exe -ErrorAction Stop).Source
            $cl = (Get-Command cl.exe -ErrorAction Stop).Source
            $link = (Get-Command link.exe -ErrorAction Stop).Source
            if ($env:VSCMD_ARG_TGT_ARCH -ine 'arm64' -or $cl -notmatch '\\arm64\\cl\.exe$') {
              throw 'MSVC must target ARM64.'
            }
            $sdk = $env:WindowsSDKVersion.TrimEnd('\', '/')
            $sdkRoot = $env:WindowsSdkDir.TrimEnd('\', '/')
            $onecore = Require-File (Join-Path $sdkRoot "Lib\$sdk\um\arm64\onecore.lib")
            # SDK utility architecture is independent of the native host/DLL under test.
            $sdkTools = @{}
            foreach ($name in @('veiid', 'signtool')) {
              foreach ($toolArch in @('arm64', 'x64')) {
                $path = Join-Path $sdkRoot "Bin\$sdk\$toolArch\$name.exe"
                if (Test-Path -LiteralPath $path -PathType Leaf) { $sdkTools[$name] = $path; break }
              }
              if (-not $sdkTools.ContainsKey($name)) { throw "SDK tool missing: $name" }
            }
            $script:signTool = $sdkTools.signtool
            $tools = [ordered]@{cl=$cl; link=$link; python=$python; onecore=$onecore; veiid=$sdkTools.veiid; signtool=$script:signTool; sdk=$sdk; lib=$env:LIB}
            $tools | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'tools.json') | Out-Host
            $objects = @()
            foreach ($source in @('enclave.cpp', 'guarded.cpp', 'legacy.cpp')) {
              $object = Join-Path $root "$source.obj"
              $flags = @('/nologo', '/c', '/std:c++17', '/GS-', "/Fo$object", (Join-Path $fixture $source))
              if ($source -cne 'legacy.cpp') { $flags += '/guard:cf' }
              Invoke-Bounded $cl $flags (Join-Path $root "build-$source.log") | Out-Null
              $objects += $object
            }
            $libraries = @(
              'sdk\lib\um\vertdll.lib', 'sdk\lib\um\bcrypt.lib',
              'crt\lib\enclave\libcmt.lib', 'crt\lib\enclave\libvcruntime.lib',
              'sdk\lib\ucrt_enclave\ucrt.lib'
            ) | ForEach-Object { Require-File (Join-Path $runtime $_) }
            $unsigned = Join-Path $root 'msvc-msvc-arm64.dll'
            $map = Join-Path $root 'msvc-msvc-arm64.map'
            $linkArguments = @('/NOLOGO', '/DLL', '/INCREMENTAL:NO', '/NODEFAULTLIB', '/ENCLAVE', '/INTEGRITYCHECK', '/GUARD:MIXED', '/DYNAMICBASE', '/MACHINE:ARM64', '/WX:4229', "/OUT:$unsigned", "/IMPLIB:$unsigned.lib", "/MAP:$map") + $objects + $libraries
            Invoke-Bounded $link $linkArguments (Join-Path $root 'link-reference.log') | Out-Null
            $hostImage = Join-Path $root 'vbs-enclave-host-arm64.exe'
            $hostObject = Join-Path $root 'host.obj'
            Invoke-Bounded $cl @('/nologo', '/std:c++17', (Join-Path $fixture 'host.cpp'), "/Fo$hostObject", "/Fe$hostImage", '/link', '/INCREMENTAL:NO', '/MACHINE:ARM64', $onecore) (Join-Path $root 'build-host.log') | Out-Null
            Assert-Arm64Image $hostImage
            Assert-Arm64Image $unsigned
            $peVerifier = Join-Path $env:GITHUB_WORKSPACE 'utils\ci\verify-vbs-enclave-pe.py'
            $runtimeVerifier = Join-Path $env:GITHUB_WORKSPACE 'utils\ci\verify-vbs-enclave-runtime.py'
            Invoke-Bounded $python @($runtimeVerifier, 'self-test') (Join-Path $root 'runtime-verifier-self-test.log') | Out-Null
            Invoke-Bounded $python @($peVerifier, 'inspect', $unsigned, '--machine', 'arm64', '--linker', 'microsoft', '--map', $map, '--json', (Join-Path $root 'reference-pe.json')) (Join-Path $root 'reference-pe.log') | Out-Null
            $script:signed = Join-Path $root 'msvc-msvc-arm64-signed.dll'
            Copy-Item -LiteralPath $unsigned -Destination $script:signed
            Invoke-Bounded $sdkTools.veiid @($script:signed) (Join-Path $root 'veiid.log') | Out-Null

            $result.stage = 'Certificate'
            $helper = Join-Path $env:GITHUB_WORKSPACE 'utils\ci\new-vbs-enclave-test-certificate.ps1'
            $certificatePath = Join-Path $root 'certificate.cer'
            $thumbprintPath = Join-Path $root 'certificate-thumbprint.txt'
            'Certificate helper started; identity must be confirmed for precise cleanup.' | Set-Content (Join-Path $root 'certificate-started.txt')
            Invoke-Bounded (Get-Command pwsh.exe).Source @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', $helper, '-CertificatePath', $certificatePath, '-ThumbprintPath', $thumbprintPath, '-StageLogPath', (Join-Path $root 'certificate-stages.log')) (Join-Path $root 'certificate-bootstrap.log') -Seconds 90 | Out-Null
            $thumbprint = (Get-Content -LiteralPath $thumbprintPath -Raw).Trim()
            if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') { throw 'Invalid signing identity.' }
            $public = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
            try {
              if ($public.Thumbprint -cne $thumbprint -or $public.HasPrivateKey) { throw 'Public certificate identity mismatch.' }
            } finally { $public.Dispose() }
            $personal = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint"
            if (-not $personal.HasPrivateKey) { throw 'Signing certificate has no private key.' }
            if (Test-Path -LiteralPath "Cert:\LocalMachine\TrustedPeople\$thumbprint") { throw 'Trust entry already exists; refusing to claim ownership.' }
            'Trust installation attempted for this exact identity.' | Set-Content (Join-Path $root 'trust-started.txt')
            Invoke-Bounded (Get-Command certutil.exe).Source @('-f', '-addstore', 'TrustedPeople', $certificatePath) (Join-Path $root 'certificate-trust.log') -Seconds 60 | Out-Null
            $trusted = Get-Item -LiteralPath "Cert:\LocalMachine\TrustedPeople\$thumbprint"
            if ($trusted.Thumbprint -cne $thumbprint -or $trusted.HasPrivateKey) { throw 'Trusted public certificate mismatch.' }

            $result.stage = 'Signing'
            Invoke-VbsSignTool @('sign', '/ph', '/fd', 'SHA256', '/sha1', $thumbprint, $script:signed) 'Signed' (Join-Path $root 'sign.log')
            Invoke-VbsSignTool @('verify', '/pa', '/v', $script:signed) 'Verified' (Join-Path $root 'verify-signature.log')
            Assert-Arm64Image $hostImage
            Assert-Arm64Image $script:signed
            $inputs = @($hostImage, $unsigned, $script:signed, $helper, $runtimeVerifier, $peVerifier) + $libraries + @(Get-ChildItem -LiteralPath $fixture -File | ForEach-Object { $_.FullName })
            $inputs | ForEach-Object { Get-FileHash -LiteralPath $_ -Algorithm SHA256 | Select-Object Path, Algorithm, Hash } | ConvertTo-Json | Set-Content (Join-Path $root 'input-hashes.json')

            $result.stage = 'Runtime'
            $runtimeLog = Join-Path $root 'runtime-reference.log'
            $exitCode = Invoke-Bounded $hostImage @($script:signed) $runtimeLog -Seconds 180 -AllowFailure
            $verdictPath = Join-Path $root 'runtime-verdict.json'
            Invoke-Bounded $python @($runtimeVerifier, 'inspect', '--log', $runtimeLog, "--exit-code=$exitCode", '--reference', '--require-runtime') (Join-Path $root 'runtime-verifier.log') -Seconds 60 -StdoutPath $verdictPath | Out-Null
            $verdict = Get-Content -LiteralPath $verdictPath -Raw | ConvertFrom-Json
            if ($verdict.status -cne 'PASS' -or $verdict.stage -cne 'Complete' -or $verdict.error -ne 0) {
              throw "ARM64 reference did not pass: $($verdict.status)/$($verdict.stage)/$($verdict.error): $($verdict.message)"
            }
            $result.stage = 'CleanupPending'
            $result.message = 'Native ARM64 Microsoft reference completed all 16 stages. Cleanup remains required; NeverC candidates were not tested.'
          } catch {
            $result.message = $_.Exception.Message
            throw
          } finally {
            $result | ConvertTo-Json | Set-Content -LiteralPath $resultPath
          }

      - name: Remove only this probe's certificate and private key
        if: always()
        timeout-minutes: 2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not $env:VBS_REFERENCE_ROOT) { Write-Host 'Certificate helper was never reached.'; exit 0 }
          $root = $env:VBS_REFERENCE_ROOT
          $cleanup = [ordered]@{status='NOT_NEEDED'; message='Certificate helper was not started.'}
          $errors = [Collections.Generic.List[string]]::new()
          if (Test-Path -LiteralPath (Join-Path $root 'certificate-started.txt')) {
            $cleanup.status = 'CLEANUP_NOT_PROVEN'
            $cleanup.message = 'The unchanged helper may persist a key before recording identity; the ephemeral runner is the final disposal boundary.'
            try {
              $thumbprint = (Get-Content -LiteralPath (Join-Path $root 'certificate-thumbprint.txt') -Raw).Trim()
              if ($thumbprint -cnotmatch '^[0-9A-F]{40}$') { throw 'Missing or invalid exact certificate identity; no guessed deletion.' }
              $public = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Join-Path $root 'certificate.cer'))
              try {
                if ($public.Thumbprint -cne $thumbprint -or $public.HasPrivateKey) { throw 'Public identity does not match; no certificate deletion.' }
              } finally { $public.Dispose() }
              $cleanup['thumbprint'] = $thumbprint
              $personalPath = "Cert:\CurrentUser\My\$thumbprint"
              try {
                if (-not (Test-Path -LiteralPath $personalPath)) { throw 'Personal certificate missing; private-key cleanup cannot be proved.' }
                if (-not (Get-Item -LiteralPath $personalPath).HasPrivateKey) { throw 'Personal certificate lost its key association; private-key cleanup cannot be proved.' }
                Remove-Item -LiteralPath $personalPath -DeleteKey -Force
                if (Test-Path -LiteralPath $personalPath) { throw 'Personal certificate survived deletion.' }
              } catch { $errors.Add($_.Exception.Message) }
              if (Test-Path -LiteralPath (Join-Path $root 'trust-started.txt')) {
                $trustPath = "Cert:\LocalMachine\TrustedPeople\$thumbprint"
                try {
                  if (Test-Path -LiteralPath $trustPath) {
                    if ((Get-Item -LiteralPath $trustPath).HasPrivateKey) { throw 'Trust entry unexpectedly has a private key; refusing deletion.' }
                    Remove-Item -LiteralPath $trustPath -Force
                  }
                  if (Test-Path -LiteralPath $trustPath) { throw 'Public trust entry survived deletion.' }
                } catch { $errors.Add($_.Exception.Message) }
              }
              if ($errors.Count -eq 0) {
                $cleanup.status = 'REMOVED'
                $cleanup.message = 'Exact personal certificate/private key and any probe-created public trust entry removed.'
              }
            } catch { $errors.Add($_.Exception.Message) }
          }
          $cleanup['errors'] = @($errors.ToArray())
          $cleanup | ConvertTo-Json | Tee-Object -FilePath (Join-Path $root 'cleanup.json') | Out-Host
          $resultPath = Join-Path $root 'result.json'
          if (Test-Path -LiteralPath $resultPath) {
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            if ($cleanup.status -ceq 'REMOVED' -and $result.stage -ceq 'CleanupPending') {
              $result.status = 'REFERENCE_PASS'
              $result.stage = 'Complete'
              $result.message = 'Native ARM64 Microsoft reference passed 16 stages with four verified calls and teardown. NeverC ARM64 runtime acceptance remains pending.'
            }
            $result | ConvertTo-Json | Tee-Object -FilePath $resultPath | Out-Host
            "### ARM64 VBS reference feasibility: $($result.status)`n`n$($result.message)" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ($cleanup.status -ceq 'CLEANUP_NOT_PROVEN' -or $errors.Count -ne 0) { throw 'Precise certificate cleanup was not proved; see cleanup.json.' }

      - name: Publish reference evidence, never private keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vbs-arm64-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vbs-arm64-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/vbs-arm64-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/vbs-arm64-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            ${{ runner.temp }}/vbs-arm64-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.cer
          if-no-files-found: warn
          retention-days: 14
