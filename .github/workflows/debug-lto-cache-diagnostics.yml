name: debug-lto-cache-diagnostics

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-lto-cache-diagnostics-red-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc

      - name: Setup build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          llvm_bin="$(llvm-config-${LLVM_APT_VER} --bindir)"
          test -x "$llvm_bin/llvm-nm"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Configure focused test build
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build LTO cache test binary
        run: |
          cmake --build build --config "$BUILD_TYPE" --target neverc-tests

      - name: Require LTO cache diagnostic contracts
        run: |
          build/bin/neverc-tests \
            --gtest_filter='LTOTest.LtoCacheDoesNotSilenceBackendWarnings:LTOTest.SuppressedLtoWarningCannotBypassLaterFatalWarnings:LTOTest.LtoCachePreservesConsoleOptimizationRemarks:LTOTest.LtoPartitionCache' \
            --gtest_color=no
