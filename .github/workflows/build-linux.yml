name: linux-x64-neverc-build

permissions:
  contents: write

on: [push, pull_request]

jobs:
  build:
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository))
    # Pin to 22.04 (glibc 2.35) rather than ubuntu-latest (24.04/glibc 2.39) so
    # the neverc artifact runs in glibc>=2.35 containers (Ubuntu 22.04 / 24.04),
    # matching the target Docker test environment. Build low, run high.
    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: RelWithDebInfo
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc

    - name: Setup build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake p7zip-full clang lld

    - name: Build neverc
      run: |
        cmake -GNinja -Bbuild \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_INSTALL_PREFIX=install \
        -DLLVM_ENABLE_ASSERTIONS=OFF \
        -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
        -DNEVERC_INCLUDE_TESTS=ON \
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
        -C neverc/neverc/cmake/caches/NeverC.cmake \
        neverc/llvm
        time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc

    # Package + upload neverc immediately after the compiler links, before the
    # plugin-SDK / test / debug steps below (which may crash). Guarantees the
    # neverc binary is always downloadable for local Docker reproduction even
    # when a later step fails.
    - name: Install neverc
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

    - name: Package neverc
      run: 7z a linux-x64-neverc.zip install

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64-neverc
        path: linux-x64-neverc.zip

    - name: Build Plugin SDK
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

    - name: Test Plugin SDK (build + load)
      run: |
        set -e
        make -C build/pluginsdk/examples \
          NEVERC=$PWD/build/bin/neverc \
          INCLUDE_DIR=$PWD/build/pluginsdk/include
        printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
        for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
          echo "--- Testing $plugin ---"
          build/bin/neverc \
            --target=x86_64-pc-windows-msvc \
            -fplugin-pass=build/pluginsdk/examples/${plugin}.so \
            -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
          echo "--- $plugin OK ---"
        done

    - name: Run neverc tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target check-neverc
