name: debug-x64-crash

# Lightweight, on-demand reproduction harness for the intermittent x86_64-only
# StdLibTest segfaults (e.g. time / netip).  It downloads an already-built
# linux-x64 neverc artifact (no 1h compiler rebuild) and, on a native runner,
# repeatedly compiles + runs the failing std tests to:
#   1) detect non-deterministic codegen (per-compile binary sha256), and
#   2) capture a real backtrace (gdb on the core dump) when a crash happens,
#      distinguishing a compiler crash from a test-binary crash.
#
# Trigger manually:  gh workflow run debug-x64-crash.yml --ref dev
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-linux-x64 run id to pull the linux-x64-neverc artifact from (blank = latest completed)'
        required: false
        default: '27428528053'
      iterations:
        description: 'compile iterations per test'
        required: false
        default: '60'

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libatomic1 gdb p7zip-full file binutils

      - name: Download neverc artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          RID="${{ github.event.inputs.run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow build-linux-x64.yml -L 30 \
                    --json databaseId,status \
                    -q '[.[]|select(.status=="completed")][0].databaseId' \
                    -R "${{ github.repository }}")
          fi
          echo "Using build run id: $RID"
          gh run download "$RID" -n linux-x64-neverc -D dl -R "${{ github.repository }}"
          7z x dl/linux-x64-neverc.zip -o. >/dev/null
          chmod +x install/bin/neverc
          file install/bin/neverc
          ./install/bin/neverc --version

      - name: High-iteration compile+run (exact harness flags, no -g)
        run: |
          set +e
          ITERS="${{ github.event.inputs.iterations }}"
          NCC="$PWD/install/bin/neverc"
          SD="$PWD/src/std"
          T="$PWD/src/tests/neverc/std"
          ulimit -c unlimited
          echo "$PWD/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          echo "nproc=$(nproc)  iters=$ITERS"
          # EXACT flags from StdLibTest::compileAndRunStdTest (no -g).
          FLAGS="-I$SD/include -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -O1 -fno-builtin-std"

          bt() {  # $1=binary $2=core
            echo "  === gdb backtrace ==="
            gdb -batch -ex 'bt' -ex 'info registers rip rsp' -ex 'x/i $rip' "$1" "$2" 2>&1 | head -40
          }

          repro() {
            local name="$1" src="$2"
            echo "================= $name : $ITERS x (compile+run) ================="
            declare -A H
            local comp_fail=0 run_fail=0
            for i in $(seq 1 "$ITERS"); do
              local bin="/tmp/${name}"
              rm -f "$bin" core.*
              $NCC $FLAGS -o "$bin" $src -lm -lpthread 2>/tmp/ce
              if [ $? -ne 0 ]; then
                echo "[$name #$i] COMPILER FAIL: $(head -2 /tmp/ce | tr '\n' ' ')"
                for c in core.neverc.*; do [ -f "$c" ] || continue; bt "$NCC" "$c"; rm -f "$c"; done
                comp_fail=$((comp_fail+1)); continue
              fi
              H["$(sha256sum "$bin" | cut -c1-16)"]=1
              "$bin" >/tmp/o 2>/tmp/e
              local rc=$?
              if [ $rc -ne 0 ]; then
                echo "[$name #$i] RUN exit=$rc  out-tail: $(tail -1 /tmp/o)"
                for c in core.*; do [ -f "$c" ] || continue; bt "$bin" "$c"; rm -f "$c"; done
                run_fail=$((run_fail+1))
              fi
            done
            echo "[$name] distinct hashes=${#H[@]}  compile_fails=$comp_fail  run_fails=$run_fail"
          }

          repro time  "$T/test_time.c $SD/src/time/time.c"
          repro netip "$T/test_netip.c $SD/src/net/netip/netip.c"

          echo "================= PARALLEL stress (shared cache, 6 workers) ================="
          worker() {
            local id=$1
            for i in $(seq 1 "$ITERS"); do
              for pair in "ti:$T/test_time.c $SD/src/time/time.c" "ne:$T/test_netip.c $SD/src/net/netip/netip.c"; do
                local nm=${pair%%:*}; local s=${pair#*:}
                local b="/tmp/w${id}_${nm}"
                rm -f "$b"
                $NCC $FLAGS -o "$b" $s -lm -lpthread 2>/dev/null || { echo "W$id $nm #$i COMPILE-FAIL"; continue; }
                "$b" >/dev/null 2>&1 || echo "W$id $nm #$i RUN-FAIL exit=$?"
              done
            done
          }
          for w in 1 2 3 4 5 6; do worker $w & done
          wait
          echo "=== DONE ==="
