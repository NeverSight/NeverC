name: debug-x64-crash

# Lightweight, on-demand reproduction harness for the intermittent x86_64-only
# StdLibTest segfaults (e.g. time / netip).  It downloads an already-built
# linux-x64 neverc artifact (no 1h compiler rebuild) and, on a native runner,
# repeatedly compiles + runs the failing std tests to:
#   1) detect non-deterministic codegen (per-compile binary sha256), and
#   2) capture a real backtrace (gdb on the core dump) when a crash happens,
#      distinguishing a compiler crash from a test-binary crash.
#
# Trigger manually:  gh workflow run debug-x64-crash.yml --ref dev
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-linux-x64 run id to pull the linux-x64-neverc artifact from (blank = latest completed)'
        required: false
        default: '27428528053'
      iterations:
        description: 'compile iterations per test'
        required: false
        default: '12'

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libatomic1 gdb p7zip-full file binutils

      - name: Download neverc artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          RID="${{ github.event.inputs.run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow build-linux-x64.yml -L 30 \
                    --json databaseId,status \
                    -q '[.[]|select(.status=="completed")][0].databaseId' \
                    -R "${{ github.repository }}")
          fi
          echo "Using build run id: $RID"
          gh run download "$RID" -n linux-x64-neverc -D dl -R "${{ github.repository }}"
          7z x dl/linux-x64-neverc.zip -o. >/dev/null
          chmod +x install/bin/neverc
          file install/bin/neverc
          ./install/bin/neverc --version

      - name: Reproduce and capture backtrace
        run: |
          set +e
          ITERS="${{ github.event.inputs.iterations }}"
          NCC="$PWD/install/bin/neverc"
          SD="$PWD/src/std"
          T="$PWD/src/tests/neverc/std"
          # Core dumps to a known path (overrides apport).
          ulimit -c unlimited
          echo "$PWD/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          echo "nproc=$(nproc)"

          # Exact flags used by the StdLibTest harness, plus -g for symbols.
          COMMON="-I$SD/include -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -O1 -fno-builtin-std -g"

          repro() {
            local name="$1"; shift
            echo "==================================================================="
            echo "===== $name :: $ITERS compiles, run each 3x ====="
            echo "==================================================================="
            declare -A HASHES
            local crashed=0
            for i in $(seq 1 "$ITERS"); do
              local bin="/tmp/${name}_${i}"
              rm -f "$bin"
              $NCC $COMMON -o "$bin" "$@" -lm -lpthread 2> "/tmp/${name}_${i}.cerr"
              local crc=$?
              if [ $crc -ne 0 ]; then
                echo "[$name #$i] COMPILER exit=$crc  <-- neverc itself failed"
                echo "  --- neverc stderr (head) ---"
                head -40 "/tmp/${name}_${i}.cerr"
                # core from neverc?
                for c in core.neverc.*; do [ -f "$c" ] || continue
                  echo "  === gdb bt (neverc core) ==="
                  gdb -batch -ex 'thread apply all bt' "$NCC" "$c" 2>&1 | head -80
                  rm -f "$c"
                done
                crashed=1
                continue
              fi
              local h=$(sha256sum "$bin" | cut -c1-16)
              HASHES["$h"]=1
              for r in 1 2 3; do
                rm -f core.*
                "$bin" >/tmp/o 2>/tmp/e
                local rc=$?
                if [ $rc -ne 0 ]; then
                  echo "[$name #$i hash=$h] RUN exit=$rc (signal? $((rc-128)))  tail-out: $(tail -1 /tmp/o)"
                  for c in core.*; do [ -f "$c" ] || continue
                    echo "  === gdb backtrace (test-binary core) ==="
                    gdb -batch -ex 'bt' -ex 'info registers rsp rip' \
                        -ex 'x/i $rip' -ex 'thread apply all bt' "$bin" "$c" 2>&1 | head -60
                    rm -f "$c"
                  done
                  crashed=1
                fi
              done
            done
            echo "[$name] distinct binary hashes across $ITERS compiles: ${#HASHES[@]} -> ${!HASHES[@]}"
            if [ ${#HASHES[@]} -gt 1 ]; then
              echo "[$name] *** NON-DETERMINISTIC CODEGEN on native x86_64 ***"
            fi
            if [ $crashed -eq 0 ]; then
              echo "[$name] no crash reproduced in this attempt"
            fi
          }

          repro time  "$T/test_time.c"  "$SD/src/time/time.c"
          repro netip "$T/test_netip.c" "$SD/src/net/netip/netip.c"
          echo "=== DONE ==="
