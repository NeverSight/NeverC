name: debug-x64-crash

# Lightweight, on-demand reproduction harness for the intermittent x86_64-only
# StdLibTest segfaults (e.g. time / netip).  It downloads an already-built
# linux-x64 neverc artifact (no 1h compiler rebuild) and, on a native runner,
# repeatedly compiles + runs the failing std tests to:
#   1) detect non-deterministic codegen (per-compile binary sha256), and
#   2) capture a real backtrace (gdb on the core dump) when a crash happens,
#      distinguishing a compiler crash from a test-binary crash.
#
# Trigger manually:  gh workflow run debug-x64-crash.yml --ref dev
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-linux-x64 run id to pull the linux-x64-neverc artifact from (blank = latest completed)'
        required: false
        default: '27428528053'
      iterations:
        description: 'compile iterations per test'
        required: false
        default: '12'

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libatomic1 gdb p7zip-full file binutils

      - name: Download neverc artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          RID="${{ github.event.inputs.run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow build-linux-x64.yml -L 30 \
                    --json databaseId,status \
                    -q '[.[]|select(.status=="completed")][0].databaseId' \
                    -R "${{ github.repository }}")
          fi
          echo "Using build run id: $RID"
          gh run download "$RID" -n linux-x64-neverc -D dl -R "${{ github.repository }}"
          7z x dl/linux-x64-neverc.zip -o. >/dev/null
          chmod +x install/bin/neverc
          file install/bin/neverc
          ./install/bin/neverc --version

      - name: Determinism matrix (locate the non-deterministic stage)
        run: |
          set +e
          NCC="$PWD/install/bin/neverc"
          SD="$PWD/src/std"
          T="$PWD/src/tests/neverc/std"
          echo "nproc=$(nproc)"
          SRC="$T/test_time.c $SD/src/time/time.c"
          BASE="-I$SD/include -fno-builtin-std"

          # Compile the same source N times under a given config and report how
          # many DISTINCT output binaries result.  >1 == non-deterministic.
          det() {
            local label="$1"; local flags="$2"; local env="$3"
            declare -A H
            for i in $(seq 1 8); do
              rm -f /tmp/b
              env $env $NCC $BASE $flags -o /tmp/b $SRC -lm -lpthread 2>/tmp/ce
              if [ $? -ne 0 ]; then echo "[$label] COMPILE FAIL: $(head -1 /tmp/ce)"; return; fi
              H["$(sha256sum /tmp/b | cut -c1-16)"]=1
            done
            local n=${#H[@]}
            printf '%-46s distinct=%s %s\n' "$label" "$n" "$([ $n -gt 1 ] && echo NON-DETERMINISTIC || echo deterministic)"
          }

          echo "==== determinism per config (8 compiles each) ===="
          det "O1 auto-LTO (baseline)"               "-O1" ""
          det "O2 auto-LTO"                           "-O2" ""
          det "O0 auto-LTO"                           "-O0" ""
          det "O1 -fno-lto"                           "-O1 -fno-lto" ""
          det "O1 -fno-lto -fno-parallel-codegen"     "-O1 -fno-lto -fno-parallel-codegen" ""
          det "O1 -fno-lto -fparallel-codegen=1"      "-O1 -fno-lto -fparallel-codegen=1" ""
          det "O1 -fno-parallel-codegen"              "-O1 -fno-parallel-codegen" ""
          det "O1 NEVERC_LTO_CACHE=0"                 "-O1" "NEVERC_LTO_CACHE=0"
          det "O1 NEVERC_LTO_CACHE=0 PCACHE=0"        "-O1" "NEVERC_LTO_CACHE=0 NEVERC_LTO_PCACHE=0"
          echo "==== single-cpu experiment (taskset) ===="
          for ts in 1 2; do
            unset HT; declare -A HT
            for i in $(seq 1 8); do
              rm -f /tmp/b
              taskset -c 0-$((ts-1)) $NCC $BASE -O1 -o /tmp/b $SRC -lm -lpthread 2>/dev/null
              HT["$(sha256sum /tmp/b | cut -c1-16)"]=1
            done
            printf '%-46s distinct=%s\n' "O1 taskset ${ts}cpu" "${#HT[@]}"
          done
          echo "=== DONE ==="
