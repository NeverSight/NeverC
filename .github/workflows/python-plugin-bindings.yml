name: python-plugin-bindings

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "neverc/CMakeLists.txt"
      - "neverc/cmake/**"
      - "neverc/include/neverc/Plugin/**"
      - "neverc/lib/Plugin/**"
      - "pluginsdk/**"
      - "tests/neverc/**"
      - "docs/plugin-api/**"
      - "utils/ci/check-python-plugin-artifacts.py"
      - "utils/plugin-api/**"
      - "utils/release/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "neverc/CMakeLists.txt"
      - "neverc/cmake/**"
      - "neverc/include/neverc/Plugin/**"
      - "neverc/lib/Plugin/**"
      - "pluginsdk/**"
      - "tests/neverc/**"
      - "docs/plugin-api/**"
      - "utils/ci/check-python-plugin-artifacts.py"
      - "utils/plugin-api/**"
      - "utils/release/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  policy:
    name: Official artifact policy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Check every compiler artifact producer
        run: python3 utils/ci/check-python-plugin-artifacts.py

      - name: Check managed CPython artifact map
        run: cmake -P neverc/cmake/tests/ManagedCPythonContract.cmake

  bindings:
    needs: policy
    name: ${{ matrix.host }} / build Python ${{ matrix.python-version }} / plugin CPython 3.12.10
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            runs-on: ubuntu-22.04
            python-version: "3.10"
            python-arch: x64
            managed-python: build/python/bin/python3.12
            compiler: build/bin/neverc
          - host: linux-arm64
            runs-on: ubuntu-22.04-arm
            python-version: "3.12.10"
            python-arch: arm64
            managed-python: build/python/bin/python3.12
            compiler: build/bin/neverc
          - host: macos-x64
            runs-on: macos-15-intel
            python-version: "3.10"
            python-arch: x64
            managed-python: build/python/bin/python3.12
            compiler: build/bin/neverc
          - host: macos-arm64
            runs-on: macos-15
            python-version: "3.10"
            python-arch: arm64
            managed-python: build/python/bin/python3.12
            compiler: build/bin/neverc
          - host: windows-x64
            runs-on: windows-latest
            python-version: "3.10"
            python-arch: x64
            msvc-arch: x64
            cmake-arch: x86_64
            ninja-archive: ninja-win.zip
            managed-python: build/python/python.exe
            compiler: build/bin/neverc.exe
            cmake_extra: ""
          - host: windows-arm64
            runs-on: windows-11-arm
            python-version: "3.12.10"
            python-arch: arm64
            msvc-arch: arm64
            cmake-arch: arm64
            ninja-archive: ninja-winarm64.zip
            managed-python: build/python/python.exe
            compiler: build/bin/neverc.exe
            cmake_extra: -DCMAKE_SYSTEM_PROCESSOR=ARM64
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Set up build-tool Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-arch }}

      - name: Setup build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake patchelf
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Select latest stable Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Setup build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmakeVer = '3.31.11'
          $cmakeArch = '${{ matrix.cmake-arch }}'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-$cmakeArch.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-$cmakeArch\bin"

          $ninjaVer = '1.13.1'
          $ninjaArchive = '${{ matrix.ninja-archive }}'
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v$ninjaVer/$ninjaArchive" -OutFile ninja.zip
          Expand-Archive ninja.zip C:\tools\ninja -Force
          Add-Content $env:GITHUB_PATH "C:\tools\ninja"

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Configure Python-enabled build
        run: |
          cmake -GNinja -Bbuild \
            ${CC:+-DCMAKE_C_COMPILER=$CC} \
            ${CXX:+-DCMAKE_CXX_COMPILER=$CXX} \
            ${{ matrix.cmake_extra }} \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_STRIP_BINARY=OFF \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Verify Python roles and default feature contract
        run: |
          grep -Fx 'NEVERC_ENABLE_PYTHON_PLUGINS:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'NEVERC_BUNDLE_PYTHON_RUNTIME:BOOL=ON' build/CMakeCache.txt
          "${{ steps.python.outputs.python-path }}" --version
          "${{ matrix.managed-python }}" -I -c \
            'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:3] == (3, 12, 10); print(sys.base_prefix)'

      - name: Build compiler, Python bridge, core tests and SDK
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} \
            --target neverc neverc-plugin-core-tests neverc-pluginsdk

      - name: Run Python lifecycle and SDK tests
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(PythonPluginTest\.|PluginPythonPhaseBindings$|PluginPythonABIGeneration$|PluginPythonABILayout$|PluginPythonSDKTests$)'

      - name: Run Python OLLVM end-to-end smoke
        run: |
          ollvm_plugin="$PWD/neverc/pluginsdk/python/examples/ollvm/ollvm_plugin.py"
          ollvm_source="$PWD/neverc/tests/neverc/Inputs/Plugin/Python/OLLVMInput.c"
          ollvm_args=(
            "-fplugin=$ollvm_plugin"
            --ollvm-sub --ollvm-bcf --ollvm-fla
            --ollvm-seed 42 --ollvm-include ollvm_transform
          )
          executable_suffix=""
          if [ "${{ runner.os }}" = Windows ]; then
            executable_suffix=".exe"
          fi
          for optimization in O0 O2; do
            output="$PWD/ollvm-${optimization}${executable_suffix}"
            "${{ matrix.compiler }}" "${ollvm_args[@]}" \
              "-${optimization}" "$ollvm_source" -o "$output"
            "$output"
          done
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            output="$PWD/ollvm-${target}.ll"
            "${{ matrix.compiler }}" "${ollvm_args[@]}" \
              "--target=${target}" -O0 -fno-discard-value-names \
              -S -emit-llvm \
              "$ollvm_source" -o "$output"
            grep -F 'ollvm.sub' "$output"
            grep -F 'ollvm.bcf.gate' "$output"
            grep -F 'ollvm.fla.dispatch' "$output"
          done
          "${{ matrix.compiler }}" "${ollvm_args[@]}" \
            --target=x86_64-unknown-linux-gnu -O0 \
            -fno-discard-value-names -S -emit-llvm \
            "$ollvm_source" -o "$PWD/ollvm-x86_64-repeat.ll"
          cmp "$PWD/ollvm-x86_64-unknown-linux-gnu.ll" \
            "$PWD/ollvm-x86_64-repeat.ll"

      - name: Run native Python bridge integration tests (Linux x64)
        if: matrix.host == 'linux-x64'
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} \
            --target neverc-tests
          build/bin/neverc-tests \
            --gtest_filter='PluginPythonBridgeTest.*' \
            --gtest_color=no

      - name: Run sanitized managed-runtime smoke
        run: |
          env -u PYTHONHOME -u PYTHONPATH -u PYTHONUSERBASE \
            PYTHONDONTWRITEBYTECODE=1 \
            "${{ matrix.compiler }}" \
            -fplugin=neverc/tests/neverc/Inputs/Plugin/Python/RuntimeVersionPlugin.py \
            -fsyntax-only neverc/tests/neverc/override/lib_foo.c

      - name: Verify Linux managed loader path
        if: runner.os == 'Linux'
        run: |
          ldd "${{ matrix.compiler }}" | grep -E 'libpython3\.12'
          readelf -d "${{ matrix.compiler }}" | grep -F "$PWD/build/python/lib"

      - name: Verify macOS managed loader path
        if: runner.os == 'macOS'
        run: |
          otool -L "${{ matrix.compiler }}" | grep -F '@rpath/libpython3.12.dylib'
          otool -l "${{ matrix.compiler }}" | grep -F "$PWD/build/python/lib"

      - name: Verify Windows managed loader path
        if: runner.os == 'Windows'
        run: |
          test -f build/bin/python312.dll
          MSYS2_ARG_CONV_EXCL='*' dumpbin.exe /dependents \
            "${{ matrix.compiler }}" | grep -i 'python312.dll'

      - name: Run full driver smoke (Linux x64)
        if: matrix.host == 'linux-x64'
        run: |
          env -u PYTHONPATH PYTHONDONTWRITEBYTECODE=1 \
            build/bin/neverc \
            -fplugin=neverc/tests/neverc/Inputs/Plugin/Python/DriverTracePlugin.py \
            --python-driver-trace --python-driver-mode compact \
            -fsyntax-only neverc/tests/neverc/override/lib_foo.c \
            2>python-driver.log
          grep -F "python raw arguments (before): mode=compact" python-driver.log

      - name: Check plugin global state (Linux)
        if: matrix.host == 'linux-x64'
        run: |
          "${{ steps.python.outputs.python-path }}" \
            neverc/utils/plugin-api/check-global-state.py \
            --build-dir build --strict

      - name: Verify read-only offline runtime override (Linux x64)
        if: matrix.host == 'linux-x64'
        run: |
          prepared="$PWD/prepared python"
          cp -R build/python "$prepared"
          before=$(sha256sum "$prepared/lib/libpython3.12.so.1.0")
          cmake -Bbuild \
            -DNEVERC_MANAGED_PYTHON_ROOT="$prepared" \
            neverc/llvm
          after=$(sha256sum "$prepared/lib/libpython3.12.so.1.0")
          test "$before" = "$after"
          cmake --build build --config "${{ env.BUILD_TYPE }}" --target neverc
          env -u PYTHONHOME -u PYTHONPATH -u PYTHONUSERBASE \
            build/bin/neverc \
            -fplugin=neverc/tests/neverc/Inputs/Plugin/Python/RuntimeVersionPlugin.py \
            -fsyntax-only neverc/tests/neverc/override/lib_foo.c

      - name: Verify native source install is relocated and self-contained
        run: |
          install_prefix="$PWD/install prefix"
          cmake --install build \
            --config "${{ env.BUILD_TYPE }}" \
            --component neverc \
            --prefix "$install_prefix"
          cmake --install build \
            --config "${{ env.BUILD_TYPE }}" \
            --component neverc-pluginsdk \
            --prefix "$install_prefix"
          test -f "$install_prefix/python/runtime.json"
          "${{ steps.python.outputs.python-path }}" -c \
            'import json, pathlib, sys; data=json.loads((pathlib.Path(sys.argv[1]) / "python" / "runtime.json").read_text()); assert data["version"] == "3.12.10"' \
            "$install_prefix"
          "${{ steps.python.outputs.python-path }}" -c \
            'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", root_dir=sys.argv[2])' \
            "$PWD/default-source-install-${{ matrix.host }}" "$install_prefix"
          "${{ steps.python.outputs.python-path }}" \
            neverc/utils/release/test-python-plugin-package.py \
            --archive "default-source-install-${{ matrix.host }}.zip"

      - name: Verify DESTDIR source install semantics (Linux x64)
        if: matrix.host == 'linux-x64'
        run: |
          stage_root="$PWD/destdir stage"
          logical_prefix="/neverc prefix"
          physical_prefix="${stage_root}${logical_prefix}"
          DESTDIR="$stage_root" cmake --install build \
            --config "${{ env.BUILD_TYPE }}" \
            --component neverc \
            --prefix "$logical_prefix"
          test -f "$physical_prefix/python/runtime.json"
          "${{ steps.python.outputs.python-path }}" -c \
            'import json, pathlib, sys; assert json.loads(pathlib.Path(sys.argv[1]).read_text())["version"] == "3.12.10"' \
            "$physical_prefix/python/runtime.json"

      - name: Upload driver log
        if: always() && matrix.host == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: python-plugin-driver-log
          path: python-driver.log
          if-no-files-found: ignore

  python-disabled:
    name: Linux x64 / Python plugins explicitly OFF
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Set up build-time Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Setup build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure explicitly disabled build
        run: |
          cmake -GNinja -Bbuild-off \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERC_BUNDLE_PYTHON_RUNTIME=OFF \
            -DNEVERC_STRIP_BINARY=OFF \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build compiler and core tests
        run: |
          cmake --build build-off --config ${{ env.BUILD_TYPE }} \
            --target neverc neverc-plugin-core-tests

      - name: Verify disabled diagnostic and link contract
        run: |
          ctest --test-dir build-off --output-on-failure \
            -R '^PluginRegistryTest\.PythonPluginReportsDisabledBuildFeature$'
          set +e
          diagnostic=$(build-off/bin/neverc \
            -fplugin=neverc/pluginsdk/python/examples/minimal.py \
            -fsyntax-only neverc/tests/neverc/override/lib_foo.c 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "Python plugin support disabled" <<<"$diagnostic"
          grep -F "NEVERC_ENABLE_PYTHON_PLUGINS=ON" <<<"$diagnostic"
          if ldd build-off/bin/neverc | tee neverc-off.ldd | grep -qi libpython; then
            echo "Python-disabled neverc unexpectedly links libpython" >&2
            exit 1
          fi
