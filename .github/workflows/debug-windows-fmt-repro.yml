name: debug-windows-fmt-repro

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source revision whose fmt implementation/tests are compiled
        required: true
        default: da91c220663452c3b1af35bb7e42f22152f55e18
      artifact_id:
        description: Exact Windows x64 full-compiler artifact ID
        required: true
        default: "9541433661"
      artifact_sha256:
        description: Expected SHA-256 of the GitHub artifact archive
        required: true
        default: 768d01028997b66654785f53cf22c9853956d90554d17fda81581af9c3b23c32
      expected_result:
        description: Whether both focused fmt cases should pass or at least one should fail
        required: true
        type: choice
        options:
          - fail
          - pass

jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "32779204495"
      SOURCE_HEAD_SHA: da91c220663452c3b1af35bb7e42f22152f55e18
      SOURCE_ARTIFACT_NAME: windows-x64-neverc

    steps:
      - name: Checkout requested std source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: neverc
          fetch-depth: 1

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and verify exact failed-run artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p diag artifact-download artifact

          gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" \
            --jq '{id,name,size_in_bytes,digest,workflow_run}' \
            | tee diag/artifact-metadata.json

          metadata_id=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" \
            --jq '.id')
          metadata_name=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" \
            --jq '.name')
          metadata_run=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" \
            --jq '.workflow_run.id')
          metadata_head=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID" \
            --jq '.workflow_run.head_sha')

          test "$metadata_id" = "$ARTIFACT_ID"
          test "$metadata_name" = "$SOURCE_ARTIFACT_NAME"
          test "$metadata_run" = "$SOURCE_RUN_ID"
          test "$metadata_head" = "$SOURCE_HEAD_SHA"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            > artifact-download/github-artifact.zip

          actual_sha256=$(sha256sum artifact-download/github-artifact.zip \
            | cut -d' ' -f1)
          printf '%s  %s\n' "$actual_sha256" \
            artifact-download/github-artifact.zip \
            | tee diag/artifact-sha256.txt
          test "$actual_sha256" = "$EXPECTED_SHA256"

          7z x artifact-download/github-artifact.zip -oartifact-download/outer
          inner=artifact-download/outer/windows-x64-neverc.zip
          test -f "$inner"
          7z x "$inner" -oartifact
          test -x artifact/install/bin/neverc.exe

          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_name=$RUNNER_NAME"
            echo "source_ref=${{ inputs.source_ref }}"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_head_sha=$SOURCE_HEAD_SHA"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_name=$SOURCE_ARTIFACT_NAME"
            echo "artifact_sha256=$actual_sha256"
          } | tee diag/provenance.txt

      - name: Compile and run focused fmt cases without rebuilding compiler
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p diag/fmt-children
          NCC=$(cygpath -m "$PWD/artifact/install/bin/neverc.exe")
          STDROOT=$(cygpath -m "$PWD/neverc/std")
          TESTROOT=$(cygpath -m "$PWD/neverc/tests/neverc/std")
          OUTROOT=$(cygpath -m "$PWD/diag/fmt-children")
          common=(
            "-I$STDROOT/include"
            "-I$STDROOT/src/net"
            -Wall -Wextra -Wno-unused-parameter -Wno-unused-function
            -O1 -fno-builtin-std -Wno-deprecated-declarations
          )

          compile_and_run() {
            local label=$1
            shift
            local exe="$OUTROOT/$label.exe"

            "$NCC" "${common[@]}" -o "$exe" "$@" \
              >"diag/fmt-children/$label-compile.stdout.txt" \
              2>"diag/fmt-children/$label-compile.stderr.txt"
            local compile_status=$?
            echo "$compile_status" \
              >"diag/fmt-children/$label-compile.exit.txt"
            if [ "$compile_status" -ne 0 ]; then
              return 1
            fi

            "diag/fmt-children/$label.exe" \
              >"diag/fmt-children/$label-run.stdout.txt" \
              2>"diag/fmt-children/$label-run.stderr.txt"
            local run_status=$?
            echo "$run_status" >"diag/fmt-children/$label-run.exit.txt"
            return "$run_status"
          }

          overall=0
          compile_and_run fmt \
            "$TESTROOT/test_fmt.c" \
            "$STDROOT/src/fmt/fmt.c" \
            "$STDROOT/src/strconv/format_float.c" \
            "$STDROOT/src/strconv/parse_float.c" \
            "$STDROOT/src/strconv/parse_int.c" || overall=1

          compile_and_run fmt_oom \
            "$TESTROOT/test_fmt_oom.c" \
            "$STDROOT/src/strconv/format_float.c" \
            "$STDROOT/src/strconv/parse_float.c" \
            "$STDROOT/src/strconv/parse_int.c" || overall=1

          echo "exit_code=$overall" >> "$GITHUB_OUTPUT"
          exit "$overall"

      - name: Upload focused reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-windows-fmt-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: diag/**

      - name: Require the requested outcome
        if: always()
        shell: bash
        env:
          ACTUAL_EXIT: ${{ steps.focused.outputs.exit_code }}
          EXPECTED_RESULT: ${{ inputs.expected_result }}
        run: |
          echo "expected=$EXPECTED_RESULT actual_exit=$ACTUAL_EXIT"
          if [ "$EXPECTED_RESULT" = pass ]; then
            test "$ACTUAL_EXIT" = 0
          else
            test -n "$ACTUAL_EXIT"
            test "$ACTUAL_EXIT" != 0
          fi
