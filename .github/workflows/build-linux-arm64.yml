name: linux-arm64-neverc-build

permissions:
  contents: write

on: [push, pull_request]

jobs:
  build:
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository))
    # Native arm64 runner (GitHub-hosted). Pinned to 22.04 (glibc 2.35) to match
    # the x64 build's portability target.
    runs-on: ubuntu-22.04-arm
    env:
      BUILD_TYPE: RelWithDebInfo
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc

    - name: Setup build deps
      run: sudo apt-get update && sudo apt-get install -y ninja-build cmake p7zip-full gdb elfutils

    - name: Resolve latest LLVM version
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LLVM_VERIFY_ASSET_SUFFIX: Linux-ARM64.tar.xz
      run: bash neverc/.github/scripts/resolve-llvm-version.sh

    - name: Cache LLVM toolchain
      uses: actions/cache@v4
      with:
        path: /tmp/llvm-pgo
        key: llvm-${{ env.LLVM_VER }}-linux-arm64

    - name: Install latest LLVM
      run: bash neverc/.github/scripts/install-llvm-linux.sh

    - name: Build neverc
      run: |
        cmake -GNinja -Bbuild \
        -DCMAKE_C_COMPILER=$CC \
        -DCMAKE_CXX_COMPILER=$CXX \
        -DCMAKE_INSTALL_PREFIX=install \
        -DLLVM_ENABLE_ASSERTIONS=OFF \
        -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
        -DNEVERC_INCLUDE_TESTS=ON \
        -DNEVERC_STRIP_BINARY=OFF \
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
        -C neverc/neverc/cmake/caches/NeverC.cmake \
        neverc/llvm
        time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc

    - name: Install neverc
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

    - name: Package neverc
      run: 7z a linux-arm64-neverc.zip install

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-neverc
        path: linux-arm64-neverc.zip

    - name: Package neverc compiler (without runtime)
      run: |
        mv install/runtime install-runtime-stash
        7z a linux-arm64-neverc-compiler.zip install
        mv install-runtime-stash install/runtime

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-neverc-compiler
        path: linux-arm64-neverc-compiler.zip

    - name: Package neverc runtime
      run: 7z a linux-arm64-neverc-runtime.zip install/runtime

    - name: Upload Runtime Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-neverc-runtime
        path: linux-arm64-neverc-runtime.zip

    - name: Build Plugin SDK
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

    - name: Test Plugin SDK (build + load)
      run: |
        set -e
        make -C build/pluginsdk/examples \
          NEVERC=$PWD/build/bin/neverc \
          INCLUDE_DIR=$PWD/build/pluginsdk/include \
          HOST_TARGET=aarch64-unknown-linux-gnu
        printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
        for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
          echo "--- Testing $plugin ---"
          build/bin/neverc \
            --target=x86_64-pc-windows-msvc \
            -fplugin-pass=build/pluginsdk/examples/${plugin}.so \
            -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
          echo "--- $plugin OK ---"
        done

    - name: Run neverc tests
      id: tests
      continue-on-error: true
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target check-neverc

    - name: Diagnose crashes
      if: steps.tests.outcome == 'failure'
      run: |
        set -x
        NCC=$PWD/build/bin/neverc
        TESTDIR=$PWD/neverc/tests/neverc

        # Enable core dumps
        ulimit -c unlimited
        echo "$PWD/cores/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
        mkdir -p cores

        diagnose() {
          local label=$1 src=$2 flags=$3
          echo "=== [$label] step 1: compile to .o ==="
          $NCC $flags -c "$src" -o /tmp/diag_${label}.o 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 2: link .o to exe ==="
          $NCC $flags /tmp/diag_${label}.o -o /tmp/diag_${label} 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 3: compile+link (one shot) ==="
          $NCC $flags "$src" -o /tmp/diag_${label}_oneshot 2>&1 && echo "OK" || echo "EXIT=$?"

          # Build sorted symbol table once
          nm -n --defined-only -C $NCC 2>/dev/null | awk 'NF>=3{print $1,$3}' > /tmp/nm_syms.txt
          echo "Symbol table: $(wc -l < /tmp/nm_syms.txt) symbols"

          for core in cores/core.*; do
            [ -f "$core" ] || continue

            echo "=== eu-stack backtrace from $core ==="
            eu-stack -e $NCC --core="$core" 2>&1 | head -40

            echo "=== GDB full backtrace from $core ==="
            gdb -batch -ex "bt full 30" -ex "info registers" $NCC "$core" 2>&1 | head -60

            # Get crash PC
            PC=$(gdb -batch -ex "print/x \$pc" $NCC "$core" 2>&1 | grep -oP '0x[0-9a-f]+' | tail -1)

            # Get load base from core's LOAD segments
            LOAD_BASE=$(readelf -l "$core" 2>/dev/null | awk '/LOAD/{print $3; exit}')
            echo "PC=$PC LOAD_BASE=$LOAD_BASE"

            if [ -n "$PC" ] && [ -n "$LOAD_BASE" ]; then
              FILE_OFF=$(printf "0x%x" $(($PC - $LOAD_BASE)))
              echo "File offset: $FILE_OFF"

              # Look up all stack frames in nm
              echo "=== symbolized stack ==="
              eu-stack -e $NCC --core="$core" 2>&1 | grep '^ *#' | head -22 | while read line; do
                ADDR=$(echo "$line" | grep -oP '0x[0-9a-f]+')
                if [ -n "$ADDR" ]; then
                  OFF=$(printf "%x" $(($ADDR - $LOAD_BASE)))
                  FUNC=$(awk -v off="$OFF" 'BEGIN{target=strtonum("0x"off)} {a=strtonum("0x"$1); if(a<=target){name=$2;fa=a}} END{if(name)printf "%s+0x%x",name,target-fa; else print "??"}' /tmp/nm_syms.txt)
                  echo "$line  =>  $FUNC"
                fi
              done
            fi
            rm -f "$core"
          done
        }

        # ---- Sort test codegen isolation ----
        STDDIR=$PWD/neverc/std
        SORT_FLAGS="-I$STDDIR/include -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -fno-builtin-std"
        SORT_TEST="$TESTDIR/std/test_sort.c"
        SORT_SRC="$STDDIR/src/sort/sort.c"

        run_sort_variant() {
          local label=$1 flags=$2
          echo "=== [sort:$label] compiling ==="
          if $NCC $flags -o /tmp/sort_${label} $SORT_TEST $SORT_SRC -lm -lpthread 2>&1; then
            echo "=== [sort:$label] running ==="
            /tmp/sort_${label} 2>&1 && echo "PASS" || echo "EXIT=$?"
          else
            echo "COMPILE_FAIL"
          fi
        }

        run_sort_variant "O1"           "$SORT_FLAGS -O1"
        run_sort_variant "O0"           "$SORT_FLAGS -O0"
        run_sort_variant "O1_nopcg"     "$SORT_FLAGS -O1 -fno-parallel-codegen"
        run_sort_variant "O2"           "$SORT_FLAGS -O2"
        run_sort_variant "O2_nopcg"     "$SORT_FLAGS -O2 -fno-parallel-codegen"

        echo "=== [sort:O1] dumping introsort/swap_bytes assembly ==="
        $NCC $SORT_FLAGS -O1 -S -o /tmp/sort_O1.s $SORT_SRC 2>&1 || true
        if [ -f /tmp/sort_O1.s ]; then
          echo "--- swap_bytes ---"
          awk '/^swap_bytes/,/^\./' /tmp/sort_O1.s | head -40
          echo "--- neverc_sort_ints ---"
          awk '/^neverc_sort_ints/,/^\./' /tmp/sort_O1.s | head -60
        fi

        echo "=== [sort:O1] LLVM IR ==="
        $NCC $SORT_FLAGS -O1 -S -emit-llvm -o /tmp/sort_O1.ll $SORT_SRC 2>&1 || true
        if [ -f /tmp/sort_O1.ll ]; then
          echo "--- swap_bytes ---"
          awk '/@swap_bytes\(/,/^}/' /tmp/sort_O1.ll | head -40
          echo "--- introsort ---"
          awk '/@introsort\(/,/^}/' /tmp/sort_O1.ll | head -80
          echo "--- neverc_sort_ints ---"
          awk '/@neverc_sort_ints\(/,/^}/' /tmp/sort_O1.ll | head -30
        fi

    - name: Fail if tests failed
      if: steps.tests.outcome == 'failure'
      run: exit 1
