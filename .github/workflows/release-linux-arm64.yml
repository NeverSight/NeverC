# Release build for Linux arm64 (non-PGO).
# Called by release.yml; manual dispatch builds artifacts without publishing.
name: linux-arm64-neverc-release

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  release:
    name: Build + test + package
    runs-on: ubuntu-22.04-arm
    env:
      BUILD_TYPE: Release
      LLVM_APT_VER: '22'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      # The LTO link of the final neverc binary needs more memory than the
      # 4-vCPU arm64 runner provides; without swap the VM thrashes and the
      # runner loses communication with GitHub (job dies with exit code 143).
      - name: Create swap
        run: |
          if ! swapon --show | grep -q /mnt/swapfile; then
            sudo swapoff /mnt/swapfile 2>/dev/null || true
            sudo rm -f /mnt/swapfile
            sudo fallocate -l 4G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -h

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc

      - name: Set up CPython 3.12 for official artifacts
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake p7zip-full zip unzip patchelf

      - name: Install Clang (apt.llvm.org, non-PGO)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          "clang-${LLVM_APT_VER}" --version

      - name: Build neverc
        run: |
          cmake -GNinja -Bbuild \
          "-DCMAKE_C_COMPILER=$CC" \
          "-DCMAKE_CXX_COMPILER=$CXX" \
          -DCMAKE_INSTALL_PREFIX=install \
          -DLLVM_ENABLE_ASSERTIONS=OFF \
          -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
          -DNEVERC_INCLUDE_TESTS=OFF \
          -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
          -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \
          -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \
          -DNEVERC_STRIP_BINARY=ON \
          -DNEVERC_ENABLE_LTO=OFF \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -C neverc/neverc/cmake/caches/NeverC.cmake \
          neverc/llvm
          time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-embed-runtime-bitcode

      - name: Build Plugin SDK
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        run: |
          set -e
          make -C build/pluginsdk/examples \
            "NEVERC=$PWD/build/bin/neverc" \
            "INCLUDE_DIR=$PWD/build/pluginsdk/include" \
            HOST_TARGET=aarch64-unknown-linux-gnu
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.so \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Install neverc
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --target install

      - name: Package (full, with runtime)
        run: 7z a linux-arm64-neverc.zip install

      - name: Verify relocated full release archive
        run: |
          "${{ steps.python.outputs.python-path }}" \
            neverc/utils/release/test-python-plugin-package.py \
            --archive linux-arm64-neverc.zip

      # runtime/ is deliberately absent: it is fetched on demand by
      # `neverc runtime install <target>`.  pluginsdk/ has no such fallback,
      # so leaving it out would make the SDK reachable only from the full
      # archive, which install.sh never downloads.
      - name: Package (binary + headers + plugin SDK, for curl installer)
        run: cd install && zip -r ../neverc-linux-arm64.zip bin lib pluginsdk python

      # Consumes the archive a curl install actually receives, from a clean
      # prefix and with a compiler that is not neverc, so a packaging gap fails
      # here rather than on a user's first `find_package(NevercPluginSDK)`.
      - name: Verify the curl-installer archive carries a usable SDK
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/pkg-check"
          unzip -q neverc-linux-arm64.zip -d "$RUNNER_TEMP/pkg-check"
          python3 neverc/utils/plugin-api/test-installed-sdk.py \
            --prefix "$RUNNER_TEMP/pkg-check"

      - name: Verify relocated curl-installer archive
        run: |
          "${{ steps.python.outputs.python-path }}" \
            neverc/utils/release/test-python-plugin-package.py \
            --archive neverc-linux-arm64.zip

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-neverc
          path: |
            linux-arm64-neverc.zip
            neverc-linux-arm64.zip
