name: debug-windows-clang-unwind-policy

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "debug-win-clang-unwind-policy-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 25e045213bd6c174826fe38116d65caa375c0534
  CANDIDATE_PARENT_SHA: f4f013acf9e30caa18aa589d0eb132ff5fd29bfb
  LLVM_VER: 22.1.8

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x64-default-on
            label: Windows x64 ThinLTO with candidate default
            runner: windows-2022
            arch: x64
            python_arch: x64
            msvc_arch: x64
            compiler_target: x86_64-pc-windows-msvc
            explicit_unwind: ""
            expected_unwind: "ON"
            expected_runtime: success
            linker_flags: "-Wl,//debug"
          - id: arm64-default-on
            label: Windows arm64 ThinLTO with candidate default
            runner: windows-11-arm
            arch: arm64
            python_arch: arm64
            msvc_arch: arm64
            compiler_target: aarch64-pc-windows-msvc
            explicit_unwind: ""
            expected_unwind: "ON"
            expected_runtime: success
            linker_flags: ""
          - id: x64-explicit-off
            label: Windows x64 ThinLTO with explicit unwind OFF
            runner: windows-2022
            arch: x64
            python_arch: x64
            msvc_arch: x64
            compiler_target: x86_64-pc-windows-msvc
            explicit_unwind: "OFF"
            expected_unwind: "OFF"
            expected_runtime: baseline-failure
            linker_flags: "-Wl,//debug"
    env:
      BUILD_DIR: build-${{ matrix.id }}
      CASE_ID: ${{ matrix.id }}
      CASE_ARCH: ${{ matrix.arch }}
      COMPILER_TARGET: ${{ matrix.compiler_target }}
      EXPLICIT_UNWIND: ${{ matrix.explicit_unwind }}
      EXPECTED_UNWIND: ${{ matrix.expected_unwind }}
      EXPECTED_RUNTIME: ${{ matrix.expected_runtime }}
      LINKER_FLAGS: ${{ matrix.linker_flags }}
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2

      - name: Verify exact production candidate
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) {
            throw "expected $env:CANDIDATE_SHA, checked out $actual"
          }
          $parent = (git rev-parse 'HEAD^').Trim()
          if ($parent -ne $env:CANDIDATE_PARENT_SHA) {
            throw "expected parent $env:CANDIDATE_PARENT_SHA, found $parent"
          }
          $subject = (git show -s --format=%s HEAD).Trim()
          if ($subject -ne 'cmake: preserve Windows unwind tables for crash recovery') {
            throw "unexpected production subject: $subject"
          }
          $changed = @(git diff --name-only 'HEAD^' HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'neverc/cmake/caches/NeverC.cmake') {
            throw "unexpected production boundary: $($changed -join ', ')"
          }

      - name: Set up CPython 3.12.10
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.python_arch }}

      - name: Install x64 build dependencies
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          choco install ninja 7zip -y --no-progress

          $cmakeVer = '3.31.11'
          Invoke-WebRequest `
            "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip" `
            -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-x86_64\bin"

      - name: Install arm64-native build dependencies
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress

          $cmakeVer = '3.31.11'
          Invoke-WebRequest `
            "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-arm64.zip" `
            -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-arm64\bin"

          $ninjaVer = '1.13.1'
          Invoke-WebRequest `
            "https://github.com/ninja-build/ninja/releases/download/v$ninjaVer/ninja-winarm64.zip" `
            -OutFile ninja.zip
          Expand-Archive ninja.zip C:\tools\ninja -Force
          Add-Content $env:GITHUB_PATH "C:\tools\ninja"

      - name: Cache LLVM toolchain
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: llvm-${{ env.LLVM_VER }}-win64

      - name: Install the formal-run LLVM toolchain
        shell: pwsh
        run: ./.github/scripts/install-llvm-windows.ps1

      - name: Verify the pinned LLVM toolchain
        shell: pwsh
        run: |
          $version = (& C:\LLVM\bin\clang.exe --version | Out-String)
          $version
          if ($version -notmatch 'clang version 22\.1\.8') {
            throw 'expected Clang 22.1.8'
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.7

      - name: Configure the exact candidate
        shell: bash
        run: |
          set -euxo pipefail

          target_args=()
          if [[ "$CASE_ARCH" == arm64 ]]; then
            target_args+=(
              -DCMAKE_SYSTEM_PROCESSOR=ARM64
              -DCMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc
              -DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc
              -DCMAKE_ASM_COMPILER_TARGET=aarch64-pc-windows-msvc
              -DNEVERC_NATIVE_ARCH=OFF
            )
          fi

          unwind_args=()
          if [[ -n "$EXPLICIT_UNWIND" ]]; then
            unwind_args+=("-DLLVM_ENABLE_UNWIND_TABLES=$EXPLICIT_UNWIND")
          fi

          cmake -S llvm -B "$BUILD_DIR" -G Ninja \
            "${target_args[@]}" \
            -C neverc/cmake/caches/NeverC.cmake \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAGS" \
            "${unwind_args[@]}"

      - name: Verify cache and focused compile commands
        shell: bash
        run: |
          set -euxo pipefail
          diag_dir="diagnostics-$CASE_ID"
          mkdir -p "$diag_dir"

          printf '' | C:/LLVM/bin/clang++.exe --target="$COMPILER_TARGET" \
            -dM -E -x c++ - > "$diag_dir/clang-predefined-macros.txt"
          grep -E '^#define (_MSC_VER|_WIN32|__SEH__|__EXCEPTIONS|__clang__)' \
            "$diag_dir/clang-predefined-macros.txt" || true

          actual="$(sed -n 's/^LLVM_ENABLE_UNWIND_TABLES:BOOL=//p' \
            "$BUILD_DIR/CMakeCache.txt")"
          printf 'LLVM_ENABLE_UNWIND_TABLES=%s\n' "$actual" | \
            tee "$diag_dir/cache-unwind.txt"
          [[ "$actual" == "$EXPECTED_UNWIND" ]]

          ninja -C "$BUILD_DIR" -t commands neverc-plugin-link-tests \
            > "$diag_dir/ninja-commands.txt"
          sources=(
            tests/neverc/PluginCOFFContextIsolationTests.cpp
            neverc/lib/Linker/Core/Driver/Dispatcher.cpp
            neverc/lib/Linker/Core/Runtime/Diagnostic.cpp
            neverc/lib/Linker/Backends/COFF/Driver/CoffDriver.cpp
          )
          : > "$diag_dir/focused-commands.txt"
          for source in "${sources[@]}"; do
            line="$(grep -F -m1 "$source" "$diag_dir/ninja-commands.txt")"
            printf '%s\n' "$line" | tee -a "$diag_dir/focused-commands.txt"
            [[ "$line" == *"-flto=thin"* ]]
            [[ "$line" != *"-fno-lto"* ]]
            if [[ "$CASE_ARCH" == arm64 ]]; then
              [[ "$line" == *"--target=aarch64-pc-windows-msvc"* ]]
            fi
            if [[ "$EXPECTED_UNWIND" == ON ]]; then
              [[ "$line" == *"-funwind-tables"* ]]
              [[ "$line" != *"-fno-unwind-tables"* ]]
              [[ "$line" != *"-fno-asynchronous-unwind-tables"* ]]
            else
              [[ "$line" != *"-funwind-tables"* ]]
              [[ "$line" == *"-fno-unwind-tables"* ]]
              [[ "$line" == *"-fno-asynchronous-unwind-tables"* ]]
            fi
          done

      - name: Build only the two regression tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build "$BUILD_DIR" --target neverc-plugin-link-tests \
            --parallel "$NUMBER_OF_PROCESSORS"
          ls -l "$BUILD_DIR/bin/neverc-plugin-link-tests.exe"
          ls -l "$BUILD_DIR/bin/neverc-plugin-link-tests.pdb" || true

      - name: Verify the test binary architecture
        shell: pwsh
        run: |
          $testExe = (Resolve-Path "$env:BUILD_DIR\bin\neverc-plugin-link-tests.exe").Path
          $diagDir = Join-Path $PWD "diagnostics-$env:CASE_ID"
          $headers = (& C:\LLVM\bin\llvm-readobj.exe --file-headers $testExe |
            Out-String)
          $headers | Set-Content (Join-Path $diagDir 'file-headers.txt')
          $expectedMachine = if ($env:CASE_ARCH -eq 'arm64') {
            'IMAGE_FILE_MACHINE_ARM64'
          } else {
            'IMAGE_FILE_MACHINE_AMD64'
          }
          if (-not $headers.Contains($expectedMachine)) {
            throw "expected $expectedMachine in PE headers"
          }

      - name: Verify both exact filters three times
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testExe = (Resolve-Path "$env:BUILD_DIR\bin\neverc-plugin-link-tests.exe").Path
          $diagDir = Join-Path $PWD "diagnostics-$env:CASE_ID"
          $filters = [ordered]@{
            dispatcher = 'PluginCOFFContextIsolationTest.DispatcherFatalTimeTraceDoesNotPoisonNextLink'
            direct = 'PluginCOFFContextIsolationTest.DirectFatalTimeTraceDoesNotPoisonNextLink'
          }

          foreach ($entry in $filters.GetEnumerator()) {
            for ($round = 1; $round -le 3; ++$round) {
              $stdout = Join-Path $diagDir "$($entry.Key)-$round.stdout.txt"
              $stderr = Join-Path $diagDir "$($entry.Key)-$round.stderr.txt"
              $process = Start-Process -FilePath $testExe `
                -ArgumentList @("--gtest_filter=$($entry.Value)", `
                  '--gtest_catch_exceptions=1', '--gtest_color=no') `
                -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
                -Wait -PassThru
              $unsignedExit = [uint64]([int64]$process.ExitCode -band 0xffffffffL)
              $result = '{0} round={1} exit={2} hex=0x{3:X8}' -f `
                $entry.Key, $round, $process.ExitCode, $unsignedExit
              $result | Tee-Object `
                -FilePath (Join-Path $diagDir 'exit-codes.txt') -Append

              $stdoutText = Get-Content $stdout -Raw
              $expectedRun = "[ RUN      ] $($entry.Value)"
              if (-not $stdoutText.Contains($expectedRun)) {
                throw "missing gtest start marker '$expectedRun'"
              }

              if ($env:EXPECTED_RUNTIME -eq 'success') {
                if ($process.ExitCode -ne 0) {
                  throw "expected success: $result"
                }
                $expectedOk = "[       OK ] $($entry.Value)"
                if (-not $stdoutText.Contains($expectedOk)) {
                  throw "missing gtest success marker '$expectedOk'"
                }
              } else {
                foreach ($terminal in @('[       OK ]', '[  FAILED  ]', '[  SKIPPED ]')) {
                  $marker = "$terminal $($entry.Value)"
                  if ($stdoutText.Contains($marker)) {
                    throw "unexpected gtest terminal marker '$marker'"
                  }
                }
                if ($entry.Key -eq 'dispatcher') {
                  $expectedExit = [Convert]::ToUInt64('E0000001', 16)
                } else {
                  $expectedExit = [Convert]::ToUInt64('C0000409', 16)
                }
                if ($unsignedExit -ne $expectedExit) {
                  throw "expected baseline failure 0x$($expectedExit.ToString('X8')): $result"
                }
              }
            }
          }

      - name: Record binary unwind metadata
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $diagDir = Join-Path $PWD "diagnostics-$env:CASE_ID"
          $testExe = "$env:BUILD_DIR\bin\neverc-plugin-link-tests.exe"
          if (Test-Path $testExe) {
            & C:\LLVM\bin\llvm-readobj.exe --unwind --sections `
              --coff-tls-directory $testExe 2>&1 |
              Tee-Object -FilePath (Join-Path $diagDir 'llvm-readobj.txt')
          }
          Get-Content (Join-Path $diagDir 'exit-codes.txt') `
            -ErrorAction SilentlyContinue

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.id }}-unwind-policy-${{ github.run_id }}
          path: |
            diagnostics-${{ matrix.id }}
            ${{ env.BUILD_DIR }}/bin/neverc-plugin-link-tests.exe
            ${{ env.BUILD_DIR }}/bin/neverc-plugin-link-tests.pdb
          if-no-files-found: warn
          retention-days: 7

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true
