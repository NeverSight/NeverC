name: debug-elf-discarded-sentinel

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-elf-discarded-sentinel-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: "Address;Undefined"
            label: asan-ubsan
          - sanitizer: "Thread"
            label: tsan
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc

      - name: Setup build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          llvm_bin="$(llvm-config-${LLVM_APT_VER} --bindir)"
          test -x "$llvm_bin/llvm-nm"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Configure ${{ matrix.label }}
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DLLVM_USE_SANITIZER="${{ matrix.sanitizer }}" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build focused binaries
        run: |
          cmake --build build --config "${{ env.BUILD_TYPE }}" --target \
            neverc-plugin-conformance \
            neverc-plugin-link-tests

      - name: Require sentinel sanitizer and context contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          build/bin/neverc-plugin-conformance \
            --gtest_filter='LinkLTOConformance.LinksNonLTOExecutableAndProbesLinkFullObserver' \
            --gtest_color=no
          build/bin/neverc-plugin-link-tests \
            --gtest_filter='PluginELFContextIsolationTest.*' \
            --gtest_color=no

      - name: Require strict global-state contract
        run: |
          python3 neverc/utils/plugin-api/check-global-state.py \
            --build-dir build --strict

      - name: Require forged sentinel removal
        run: |
          if git -C neverc grep -n -E \
            'InputSection::discarded|DiscardedInputSectionTag'; then
            echo "forged ELF discarded-section sentinel remains" >&2
            exit 1
          fi
