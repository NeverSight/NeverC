name: debug-std-quick-check

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'space-separated STD_TEST names'
        required: true
      sanitize:
        description: "-fsanitize= value, or 'none'"
        required: false
        default: 'address,undefined'
      defines:
        description: 'space-separated extra -D macros'
        required: false
        default: ''
      timeout:
        description: 'per-test run timeout in seconds'
        required: false
        default: '60'
      extra:
        description: 'space-separated extra compiler flags'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  elf-version-script-artifact-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "33930621240"
      SOURCE_SHA: "f1cc957c64e63427c56e86e28a5309918c07c8b1"
      SOURCE_ARTIFACT_ID: "9959802944"
      SOURCE_ARTIFACT_NAME: linux-x64-neverc-compiler
    steps:
      - name: Verify exact formal-green artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_repository.full_name' <<<"$run_json")" = "$GITHUB_REPOSITORY"

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          matching_count="$(jq --arg name "$SOURCE_ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and (.expired | not))] | length' \
            <<<"$artifacts_json")"
          test "$matching_count" = 1
          artifact_id="$(jq -r --arg name "$SOURCE_ARTIFACT_NAME" \
            '.artifacts[] | select(.name == $name and (.expired | not)) | .id' \
            <<<"$artifacts_json")"
          test "$artifact_id" = "$SOURCE_ARTIFACT_ID"
          echo "carrier_sha=${GITHUB_SHA}"
          echo "source_sha=${SOURCE_SHA} source_run=${SOURCE_RUN_ID} artifact_id=${artifact_id}"

      - name: Download exact formal-green compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-x64-neverc-compiler
          path: artifact
          repository: NeverSight/NeverC
          run-id: 33930621240
          github-token: ${{ github.token }}

      - name: Extract relocated compiler
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact/linux-x64-neverc-compiler.zip
          7z x -y artifact/linux-x64-neverc-compiler.zip -ocompiler-root
          test -f compiler-root/install/bin/neverc
          chmod +x compiler-root/install/bin/neverc
          echo "$PWD/compiler-root/install/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/compiler-root/install/lib:$PWD/compiler-root/install/lib/neverc:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          compiler-root/install/bin/neverc --version

      - name: Compare normalized one-token and four-token ELF output
        shell: bash
        env:
          PROBE_ROOT: ${{ runner.temp }}/elf-version-artifact-probe
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_ROOT/serial" "$PROBE_ROOT/parallel"
          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROBE_ROOT"])
          assembly = [".data", ".space 17825792, 0"]
          for group in range(64):
              for index in range(64):
                  name = f"group{group}_symbol{index}"
                  assembly.extend((f".globl {name}", f"{name}:", "  .byte 0"))
          for name, value in (
              ("exact_wins", 1),
              ("overlap_item", 2),
              ("suffix_tail", 3),
              ("bracket_7", 4),
              ("local_only_symbol", 5),
          ):
              assembly.extend((f".globl {name}", f"{name}:", f"  .byte {value}"))
          (root / "large_version_wildcards.s").write_text(
              "\n".join(assembly) + "\n", encoding="utf-8"
          )

          script = [f"V{group} {{ global: group{group}_*; }};" for group in range(64)]
          script.extend(
              (
                  "EXACT { global: exact_wins; };",
                  "WILD_LATE { global: exact_*; };",
                  "OVER_OLD { global: overlap_*; };",
                  "OVER_NEW { global: overlap_*; };",
                  "SUFFIX { global: *_tail; };",
                  "BRACKET { global: bracket_[0-9]; };",
                  "LOCAL { local: local_only_*; *; };",
              )
          )
          (root / "large_version_wildcards.map").write_text(
              "\n".join(script) + "\n", encoding="utf-8"
          )
          PY

          neverc \
            --target=x86_64-linux-gnu \
            -fno-lto \
            -x assembler \
            -c "$PROBE_ROOT/large_version_wildcards.s" \
            -o "$PROBE_ROOT/large_version_wildcards.o"
          test "$(stat -c %s "$PROBE_ROOT/large_version_wildcards.o")" -gt 16777216

          common_args=(
            --target=x86_64-linux-gnu
            -nostdlib
            -shared
            -fno-lto
            -fno-build-id
            -Wl,--soname=large_version.so
            "-Wl,--version-script=$PROBE_ROOT/large_version_wildcards.map"
            "$PROBE_ROOT/large_version_wildcards.o"
          )
          NEVERC_RESOURCE_BUDGET=1 NEVERC_RESOURCE_CPU_TOKENS=1 \
            neverc "${common_args[@]}" -o "$PROBE_ROOT/serial/out.so"
          NEVERC_RESOURCE_BUDGET=1 NEVERC_RESOURCE_CPU_TOKENS=4 \
            neverc "${common_args[@]}" -o "$PROBE_ROOT/parallel/out.so"

          sha256sum "$PROBE_ROOT/serial/out.so" "$PROBE_ROOT/parallel/out.so" \
            | tee "$PROBE_ROOT/sha256.txt"
          stat -c '%n %s bytes' "$PROBE_ROOT/serial/out.so" "$PROBE_ROOT/parallel/out.so" \
            | tee "$PROBE_ROOT/sizes.txt"

          for mode in serial parallel; do
            readelf -W -h -l -S -d -s --dyn-syms -V -r -n -p .dynstr \
              "$PROBE_ROOT/$mode/out.so" > "$PROBE_ROOT/$mode/readelf.txt" 2>&1
            if grep -Fq 'Build ID:' "$PROBE_ROOT/$mode/readelf.txt"; then
              echo "unexpected build ID in $mode output" >&2
              exit 1
            fi
          done

          if ! cmp -s "$PROBE_ROOT/serial/out.so" "$PROBE_ROOT/parallel/out.so"; then
            cmp -l "$PROBE_ROOT/serial/out.so" "$PROBE_ROOT/parallel/out.so" \
              | sed -n '1,64p' > "$PROBE_ROOT/cmp-first-64.txt" || true
            diff -u "$PROBE_ROOT/serial/readelf.txt" "$PROBE_ROOT/parallel/readelf.txt" \
              > "$PROBE_ROOT/readelf.diff" || true
            echo "normalized output differs across token grants" >&2
            exit 1
          fi
          echo "normalized output is byte-identical across token grants" \
            | tee "$PROBE_ROOT/cmp.txt"

      - name: Run exact own-node and quoted-literal RED contracts
        shell: bash
        env:
          PROBE_ROOT: ${{ runner.temp }}/elf-version-artifact-probe
        run: |
          set -euo pipefail
          semantic_root="$PROBE_ROOT/semantics"
          mkdir -p "$semantic_root"

          cat > "$semantic_root/own-node.s" <<'EOF'
          .data
          .globl foreign_exact
          .symver foreign_exact, foreign_exact@@NEW
          foreign_exact:
            .byte 1
          .globl foreign_wild_hidden
          .symver foreign_wild_hidden, foreign_wild_hidden@NEW
          foreign_wild_hidden:
            .byte 5
          .globl own_global_exact
          .symver own_global_exact, own_global_exact@@NEW
          own_global_exact:
            .byte 2
          .globl hidden_single
          .symver hidden_single, hidden_single@NEW
          hidden_single:
            .byte 3
          .globl own_local_wild
          .symver own_local_wild, own_local_wild@@NEW
          own_local_wild:
            .byte 4
          .globl own_exact_local
          .symver own_exact_local, own_exact_local@@NEW
          own_exact_local:
            .byte 6
          EOF
          cat > "$semantic_root/own-node.map" <<'EOF'
          OLD {
            local: foreign_exact; foreign_wild_*;
          };
          NEW {
            global: own_global_*; hidden_*;
            local: own_global_exact; hidden_single; own_local_*; own_exact_local;
          };
          EOF
          neverc --target=x86_64-linux-gnu -fno-lto -x assembler \
            -c "$semantic_root/own-node.s" -o "$semantic_root/own-node.o"
          neverc --target=x86_64-linux-gnu -nostdlib -shared -fno-lto \
            -fno-build-id -Wl,--soname=own-node.so \
            "-Wl,--version-script=$semantic_root/own-node.map" \
            "$semantic_root/own-node.o" -o "$semantic_root/own-node.so"
          readelf -W --dyn-syms -V "$semantic_root/own-node.so" \
            > "$semantic_root/own-node.readelf.txt"

          cat > "$semantic_root/quoted.s" <<'EOF'
          .data
          .globl "literal[abc]"
          "literal[abc]":
            .byte 1
          .globl literala
          literala:
            .byte 2
          EOF
          cat > "$semantic_root/quoted.map" <<'EOF'
          LITERAL {
            global: "literal[abc]";
            local: *;
          };
          EOF
          neverc --target=x86_64-linux-gnu -fno-lto -x assembler \
            -c "$semantic_root/quoted.s" -o "$semantic_root/quoted.o"
          neverc --target=x86_64-linux-gnu -nostdlib -shared -fno-lto \
            -fno-build-id -Wl,--soname=quoted.so \
            "-Wl,--version-script=$semantic_root/quoted.map" \
            "$semantic_root/quoted.o" -o "$semantic_root/quoted.so"
          readelf -W --dyn-syms -V "$semantic_root/quoted.so" \
            > "$semantic_root/quoted.readelf.txt"

          failures=0
          expect_present() {
            local report="$1"
            local symbol="$2"
            if grep -Fq "$symbol" "$report"; then
              echo "PASS present: $symbol" | tee -a "$semantic_root/result.txt"
            else
              echo "FAIL missing: $symbol" | tee -a "$semantic_root/result.txt"
              failures=$((failures + 1))
            fi
          }
          expect_absent() {
            local report="$1"
            local symbol="$2"
            if grep -Fq "$symbol" "$report"; then
              echo "FAIL unexpectedly present: $symbol" \
                | tee -a "$semantic_root/result.txt"
              failures=$((failures + 1))
            else
              echo "PASS absent: $symbol" | tee -a "$semantic_root/result.txt"
            fi
          }

          expect_present "$semantic_root/own-node.readelf.txt" 'foreign_exact@@NEW'
          expect_present "$semantic_root/own-node.readelf.txt" 'foreign_wild_hidden@NEW'
          expect_present "$semantic_root/own-node.readelf.txt" 'own_global_exact@@NEW'
          expect_present "$semantic_root/own-node.readelf.txt" 'hidden_single@NEW'
          expect_absent "$semantic_root/own-node.readelf.txt" 'own_local_wild'
          expect_absent "$semantic_root/own-node.readelf.txt" 'own_exact_local'
          expect_present "$semantic_root/quoted.readelf.txt" 'literal[abc]@@LITERAL'
          expect_absent "$semantic_root/quoted.readelf.txt" 'literala'
          echo "SEMANTIC_FAILURES=$failures" | tee -a "$semantic_root/result.txt"
          test "$failures" -eq 0

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: elf-version-script-artifact-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/elf-version-artifact-probe
          if-no-files-found: warn
          retention-days: 5
