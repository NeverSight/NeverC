name: debug-std-quick-check

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'space-separated STD_TEST names'
        required: true
      sanitize:
        description: "-fsanitize= value, or 'none'"
        required: false
        default: 'address,undefined'
      defines:
        description: 'space-separated extra -D macros'
        required: false
        default: ''
      timeout:
        description: 'per-test run timeout in seconds'
        required: false
        default: '60'
      extra:
        description: 'space-separated extra compiler flags'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  quick-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang p7zip-full

      - name: Compile and run std tests with clang
        env:
          GH_TOKEN: ${{ github.token }}
          QUICK_TESTS: ${{ inputs.tests }}
          QUICK_SANITIZE: ${{ inputs.sanitize }}
          QUICK_DEFINES: ${{ inputs.defines }}
          QUICK_TIMEOUT: ${{ inputs.timeout }}
          QUICK_EXTRA: ${{ inputs.extra }}
        run: |
          if [[ "$QUICK_TESTS" = "header_contract" ||
                "$QUICK_TESTS" = "bitcode_darwin_x64" ]]; then
            compiler_run_id="$QUICK_DEFINES"
            [[ "$compiler_run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "invalid compiler run id: $compiler_run_id" >&2
              exit 2
            }
            mapfile -t run_metadata < <(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$compiler_run_id" \
              --jq '.status, .conclusion, .event, .path, .head_repository.full_name, .head_branch')
            [[ "${run_metadata[*]}" = \
              "completed success push .github/workflows/build-linux-x64.yml $GITHUB_REPOSITORY dev" ]] || {
              echo "untrusted compiler run metadata: ${run_metadata[*]}" >&2
              exit 1
            }

            artifact_dir="$RUNNER_TEMP/neverc-artifact"
            compiler_dir="$RUNNER_TEMP/neverc-compiler"
            mkdir -p "$artifact_dir" "$compiler_dir"
            gh run download "$compiler_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name linux-x64-neverc \
              --dir "$artifact_dir"
            7z x -y "$artifact_dir/linux-x64-neverc.zip" \
              "-o$compiler_dir" >/dev/null
            ncc="$compiler_dir/install/bin/neverc"
            chmod +x "$ncc"
            unset GH_TOKEN
            "$ncc" --version

            if [[ "$QUICK_TESTS" = "header_contract" ]]; then
              header_failures=0
              for probe in $(seq 1 10); do
                if ! "$ncc" --no-default-config \
                    -std=gnu11 -fno-builtin-std -fsyntax-only \
                    -I"$GITHUB_WORKSPACE/std/include" \
                    -DNEVERC_HEADER_PROBE="$probe" \
                    "$GITHUB_WORKSPACE/tests/neverc/std/header_dot_syntax_probe.c"; then
                  echo "header contract probe $probe failed" >&2
                  header_failures=$((header_failures + 1))
                fi
              done
              [[ "$header_failures" = 0 ]]
              exit
            fi

            bitcode_dir="$RUNNER_TEMP/std-bitcode"
            mkdir -p "$bitcode_dir"
            generator_args=()
            if [[ "$QUICK_EXTRA" = "with-sysroot" ]]; then
              generator_args+=(
                --sysroot "$compiler_dir/install/runtime/macos/arm64")
            elif [[ -n "$QUICK_EXTRA" ]]; then
              echo "invalid bitcode mode: $QUICK_EXTRA" >&2
              exit 2
            fi
            python3 neverc/lib/Foundation/Std/build_std_bitcode.py \
              "$ncc" std/src std/include \
              --target x86_64-apple-macosx11.0 \
              --tag darwin_x64 \
              "${generator_args[@]}" \
              -o "$bitcode_dir/first.h" \
              2> >(tee "$bitcode_dir/first.log" >&2)
            expected=$(find std/src -type f -name '*.c' | wc -l | tr -d ' ')
            actual=$(sed -n \
              's/^static const unsigned int kStdBitcodeEntryCount_darwin_x64 = \([0-9][0-9]*\);$/\1/p' \
              "$bitcode_dir/first.h")
            [[ -n "$actual" && "$actual" = "$expected" ]] || {
              echo "darwin_x64 std bitcode incomplete: $actual/$expected" >&2
              exit 1
            }
            ! grep -q 'module(s) unavailable' "$bitcode_dir/first.log"

            if [[ "$QUICK_EXTRA" = "with-sysroot" ]]; then
              python3 neverc/lib/Foundation/Std/build_std_bitcode.py \
                "$ncc" std/src std/include \
                --target x86_64-apple-macosx11.0 \
                --tag darwin_x64 \
                "${generator_args[@]}" \
                -o "$bitcode_dir/second.h"
              cmp "$bitcode_dir/first.h" "$bitcode_dir/second.h"
              sha256sum "$bitcode_dir/first.h"
            fi
            exit 0
          fi

          define_args=()
          for macro in $QUICK_DEFINES; do
            define_args+=(--define "$macro")
          done
          for flag in $QUICK_EXTRA; do
            define_args+=("--extra=$flag")
          done
          python3 utils/ci/std-quick-check.py \
            --cc clang \
            --sanitize "$QUICK_SANITIZE" \
            --timeout "$QUICK_TIMEOUT" \
            --tests "$QUICK_TESTS" \
            "${define_args[@]}"
