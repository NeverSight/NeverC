name: debug-std-quick-check

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'space-separated STD_TEST names'
        required: true
      sanitize:
        description: "-fsanitize= value, or 'none'"
        required: false
        default: 'address,undefined'
      defines:
        description: 'space-separated extra -D macros'
        required: false
        default: ''
      timeout:
        description: 'per-test run timeout in seconds'
        required: false
        default: '60'
      extra:
        description: 'space-separated extra compiler flags'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  elf-version-script-green:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: assertions
            sanitizer: ""
          - label: asan-ubsan
            sanitizer: "Address;Undefined"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      CANDIDATE_SHA: de283a6bc2c3d6ff428c74b8f23eb091eb133a34
    steps:
      - name: Checkout exact diagnostic carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: neverc
          fetch-depth: 3

      - name: Verify candidate boundary
        working-directory: neverc
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD~2)" = "$CANDIDATE_SHA"
          test "$(git diff --name-only "$CANDIDATE_SHA"..HEAD)" = \
            ".github/workflows/debug-std-quick-check.yml"
          git show -s --format='%H %P %s' HEAD
          git show -s --format='%H %P %s' "$CANDIDATE_SHA"

      - name: Install build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.label }} build
        shell: bash
        run: |
          set -euo pipefail
          sanitizer_args=()
          if [[ -n '${{ matrix.sanitizer }}' ]]; then
            sanitizer_args+=("-DLLVM_USE_SANITIZER=${{ matrix.sanitizer }}")
          fi
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            "${sanitizer_args[@]}" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build linker test binary under ${{ matrix.label }}
        run: |
          cmake --build build --config "$BUILD_TYPE" --target neverc-tests

      - name: Run exact GREEN contracts under ${{ matrix.label }}
        shell: bash
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/neverc/.github/plugin-sanitizers.lsan
        run: |
          set +e
          build/bin/neverc-tests \
            --gtest_color=no \
            --gtest_filter='LinkerTest.ELFVersionedDefinitionsUseOnlyOwnVersionNodePatterns:LinkerTest.ELFQuotedVersionScriptNamesAreLiteral:LinkerTest.ELFLargeVersionScriptWildcardAssignmentIsDeterministicAcrossBudgets' \
            2>&1 | tee "elf-version-script-${{ matrix.label }}.log"
          test_status=${PIPESTATUS[0]}
          set -e
          echo "EXACT_GTEST_EXIT=$test_status"
          exit "$test_status"

      - name: Upload exact test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: elf-version-script-green-${{ matrix.label }}-${{ github.run_id }}
          path: elf-version-script-${{ matrix.label }}.log
          if-no-files-found: warn
          retention-days: 5
