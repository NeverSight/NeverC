name: debug-std-quick-check

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'space-separated STD_TEST names'
        required: true
      sanitize:
        description: "-fsanitize= value, or 'none'"
        required: false
        default: 'address,undefined'
      defines:
        description: 'space-separated extra -D macros'
        required: false
        default: ''
      timeout:
        description: 'per-test run timeout in seconds'
        required: false
        default: '60'
      extra:
        description: 'space-separated extra compiler flags'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  quick-check:
    if: inputs.tests != 'tzdata_arm64_artifact'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Compile and run std tests with clang
        env:
          QUICK_TESTS: ${{ inputs.tests }}
          QUICK_SANITIZE: ${{ inputs.sanitize }}
          QUICK_DEFINES: ${{ inputs.defines }}
          QUICK_TIMEOUT: ${{ inputs.timeout }}
          QUICK_EXTRA: ${{ inputs.extra }}
        run: |
          define_args=()
          for macro in $QUICK_DEFINES; do
            define_args+=(--define "$macro")
          done
          for flag in $QUICK_EXTRA; do
            define_args+=("--extra=$flag")
          done
          python3 utils/ci/std-quick-check.py \
            --cc clang \
            --sanitize "$QUICK_SANITIZE" \
            --timeout "$QUICK_TIMEOUT" \
            --tests "$QUICK_TESTS" \
            "${define_args[@]}"

  arm64-tzdata:
    if: inputs.tests == 'tzdata_arm64_artifact'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install archive tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Reuse failing arm64 compiler artifact and run tzdata contract
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILER_RUN_ID: ${{ inputs.defines }}
        run: |
          [[ "$COMPILER_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "invalid compiler run id: $COMPILER_RUN_ID" >&2
            exit 2
          }

          mapfile -t run_metadata < <(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILER_RUN_ID" \
            --jq '.status, .conclusion, .event, .path, .head_repository.full_name, .head_branch, .head_sha')
          [[ "${run_metadata[*]}" = \
            "completed failure push .github/workflows/build-linux-arm64.yml $GITHUB_REPOSITORY dev ba78c099d461a6fc799116ce1a56b540b770c9e0" ]] || {
            echo "untrusted compiler run metadata: ${run_metadata[*]}" >&2
            exit 1
          }

          artifact_dir="$RUNNER_TEMP/neverc-artifact"
          compiler_dir="$RUNNER_TEMP/neverc-compiler"
          mkdir -p "$artifact_dir" "$compiler_dir"
          gh run download "$COMPILER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name linux-arm64-neverc \
            --dir "$artifact_dir"
          7z x -y "$artifact_dir/linux-arm64-neverc.zip" \
            "-o$compiler_dir" >/dev/null

          ncc="$compiler_dir/install/bin/neverc"
          chmod +x "$ncc"
          sha256sum "$ncc"
          unset GH_TOKEN
          "$ncc" --version
          python3 utils/ci/std-quick-check.py \
            --cc "$ncc" \
            --sanitize none \
            --timeout 60 \
            --tests tzdata_zone_abi \
            --extra=-fno-builtin-std
