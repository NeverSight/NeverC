name: debug-std-quick-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malformed-linker-glob-red:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      TEST_SHA: 9fa94234b88af355cbe24e39dda9f2d3837e043f
    steps:
      - name: Checkout exact diagnostic carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: neverc
          fetch-depth: 3

      - name: Verify test-only boundary
        working-directory: neverc
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD~2)" = "$TEST_SHA"
          test "$(git diff --name-only "$TEST_SHA"..HEAD)" = ".github/workflows/debug-std-quick-check.yml"
          test "$(git diff --name-only "$TEST_SHA^".."$TEST_SHA")" = "tests/neverc/PluginLinkInputTests.cpp"
          git show -s --format='%H %P %s' HEAD
          git show -s --format='%H %P %s' "$TEST_SHA"

      - name: Install build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure asan-ubsan build
        shell: bash
        run: |
          cmake -GNinja -Bbuild -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_USE_SANITIZER="Address;Undefined" -DLLVM_TOOL_LLVM_SHLIB_BUILD=off -DNEVERC_INCLUDE_TESTS=ON -DNEVERC_ENABLE_LTO=OFF -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -C neverc/neverc/cmake/caches/NeverC.cmake neverc/llvm

      - name: Build exact plugin-link test binary
        run: |
          cmake --build build --config "$BUILD_TYPE" --target neverc-plugin-link-tests

      - name: Run malformed-glob RED contract
        shell: bash
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/neverc/.github/plugin-sanitizers.lsan
        run: |
          set +e
          build/bin/neverc-plugin-link-tests --gtest_color=no --gtest_filter='PluginLinkInputMatcherTest.MalformedGlobPatternFailsClosed' 2>&1 | tee malformed-linker-glob-red.log
          test_status=${PIPESTATUS[0]}
          set -e
          echo "EXACT_GTEST_EXIT=$test_status"
          exit "$test_status"

      - name: Upload exact RED log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: malformed-linker-glob-red-${{ github.run_id }}
          path: malformed-linker-glob-red.log
          if-no-files-found: warn
          retention-days: 5
