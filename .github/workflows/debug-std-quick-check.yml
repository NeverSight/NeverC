name: debug-std-quick-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linker-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: "Address;Undefined"
            label: asan-ubsan
          - sanitizer: "Thread"
            label: tsan
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Check global-state policy source contracts
        run: |
          python3 neverc/utils/plugin-api/tests/test-check-global-state.py
          python3 neverc/utils/plugin-api/check-global-state.py --strict

      - name: Configure (${{ matrix.label }})
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DLLVM_USE_SANITIZER="${{ matrix.sanitizer }}" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_PLUGIN_FUZZERS=OFF \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build focused test binaries
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --target \
            neverc-tests \
            neverc-plugin-link-tests \
            neverc-merge-tests

      - name: Run focused contracts under ${{ matrix.label }}
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/neverc/.github/plugin-sanitizers.lsan
          NEVERC_PCG_STRICT: "1"
        run: |
          build/bin/neverc-merge-tests \
            --gtest_filter='ParallelCodeGenCacheTest.ExhaustedWholeModuleCodeGenRoutesReportErrorWithoutAborting:ParallelCodeGenCacheTest.WholeModuleBarrierRunsStatefulMachineHooksExactlyOnce' \
            --gtest_color=no
          build/bin/neverc-plugin-link-tests \
            --gtest_filter='PluginMachOContextIsolationTest.AutomaticThreadsIncludeLateAutoLinkedAndCommandLineArchives' \
            --gtest_color=no
          build/bin/neverc-tests \
            --gtest_filter='DriverTest.DarwinWarningPolicyUsesStructuredLinkerConfig' \
            --gtest_color=no
          python3 neverc/utils/plugin-api/tests/test-check-global-state.py
          python3 neverc/utils/plugin-api/check-global-state.py --strict
