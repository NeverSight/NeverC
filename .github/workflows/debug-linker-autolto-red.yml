name: debug-linker-autolto-red

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-linker-autolto-red-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: "Address;Undefined"
            label: asan-ubsan
          - sanitizer: "Thread"
            label: tsan
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.label }}
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DLLVM_USE_SANITIZER="${{ matrix.sanitizer }}" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build focused test binaries
        run: |
          cmake --build build --config "${{ env.BUILD_TYPE }}" --target \
            neverc-tests \
            neverc-plugin-link-tests

      - name: Require three independent RED contracts
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/neverc/.github/plugin-sanitizers.lsan
        run: |
          expect_red() {
            local name="$1"
            local binary="$2"
            local filter="$3"
            local marker="$4"

            set +e
            "$binary" --gtest_filter="$filter" --gtest_color=no \
              2>&1 | tee "${name}-${{ matrix.label }}.log"
            local status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              echo "expected RED but ${name} exited successfully" >&2
              exit 1
            fi
            grep -F '[ RUN      ]' "${name}-${{ matrix.label }}.log"
            grep -F "$marker" "${name}-${{ matrix.label }}.log"
            echo "VALID_RED ${name} exit=${status}"
          }

          expect_red \
            macho-icf \
            build/bin/neverc-tests \
            LinkerTest.MachOIcfDistinguishesOffsetsWithinOneReferentSection \
            "ICF must compare each relocation's referent offset"

          expect_red \
            parallel-sort \
            build/bin/neverc-plugin-link-tests \
            'PluginParallelLinkTest.ParallelSort*' \
            'parallelSortWithContext kept a large sort on the caller thread'

          expect_red \
            globalopt \
            build/bin/neverc-tests \
            LTOTest.AutoLtoGlobalOptHandlesSelfReferentialGlobal \
            'GlobalOpt crashed while rewriting a self-referential global'
