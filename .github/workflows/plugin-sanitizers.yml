# ASan/UBSan and TSan coverage for the plugin runtime.
#
# The address/undefined job builds the plugin unit tests, the standalone
# conformance suite and the fuzz smoke corpus under ASan+UBSan.  The thread job
# builds the plugin unit tests and conformance suite under TSan to catch data
# races in the multi-Session frontend / LTO / link / dyncode paths and in the
# shared/exclusive LLVMOption lease.  Intentional process-lifetime allocations
# in third-party runtimes use a small, commented suppression file rather than a
# blanket suppression.
name: plugin-sanitizers

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
  pull_request:
    paths:
      - "neverc/lib/Plugin/**"
      - "neverc/lib/DynCode/**"
      - "neverc/lib/Linker/**"
      - "neverc/include/neverc/Plugin/**"
      - "tests/plugin-conformance/**"
      - ".github/workflows/plugin-sanitizers.yml"
      - ".github/plugin-sanitizers.lsan"

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  sanitize:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: "Address;Undefined"
            label: asan-ubsan
            enable_fuzzers: "ON"
          - sanitizer: "Thread"
            label: tsan
            enable_fuzzers: "OFF"
    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure (${{ matrix.label }})
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DLLVM_USE_SANITIZER="${{ matrix.sanitizer }}" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_PLUGIN_FUZZERS=${{ matrix.enable_fuzzers }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build plugin tests and conformance suite
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --target \
            neverc-plugin-core-tests \
            neverc-plugin-io-tests \
            neverc-plugin-frontend-tests \
            neverc-plugin-ir-tests \
            neverc-plugin-target-mc-tests \
            neverc-plugin-dyncode-tests \
            neverc-plugin-object-merge-tests \
            neverc-plugin-conformance

      - name: Run plugin tests under ${{ matrix.label }}
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/neverc/.github/plugin-sanitizers.lsan
        run: |
          # This job builds only the plugin unit-test / conformance targets, not
          # the full neverc-tests binary.  Exclude the "plugin-meta" label so the
          # Python generator/consistency checks -- and especially
          # PluginCoverageManifest, which validates against the full CTest
          # inventory -- do not fail on the intentionally partial build.  Those
          # checks are covered by the normal full build and the release-SDK gate.
          # PluginFuzzSmoke matches -R 'Plugin' but its binaries are built by a
          # later step, so exclude it here and let that step run it.
          ctest --test-dir build \
            -R 'Plugin|PluginConformance' -E 'PluginFuzzSmoke' \
            -LE plugin-meta --output-on-failure

      - name: Build and smoke fuzzers under ${{ matrix.label }}
        if: matrix.enable_fuzzers == 'ON'
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} \
            --target neverc-plugin-fuzzers
          ctest --test-dir build -R PluginFuzzSmoke --output-on-failure
