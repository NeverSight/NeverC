# On-demand debug workflow for windows-x64-clang-lto __fastfail (0xC0000409)
# in LTOTest #135 / #137 caps-off LTO links.  Does NOT rebuild the LTO
# toolchain: downloads the neverc artifact from a prior clang-lto CI run,
# builds only the gtest harness (NEVERC_EXTERNAL_BINARY), runs the two failing
# tests, then captures WER dumps + cdb __fastfail reason codes.
#
# workflow_dispatch only.  Commit with "[skip ci]" so pushing this file does
# not kick the heavy matrix; trigger manually:
#   gh workflow run debug-x64-clang-lto-fastfail.yml --ref dev
name: debug-x64-clang-lto-fastfail

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'windows-x64-clang-lto run id (blank = newest failed, else newest completed)'
        required: false
        default: ''
      also_try_pdb:
        description: 'Also download windows-x64-neverc-clang-lto-pdb artifact if present'
        required: false
        default: 'true'

permissions:
  contents: read
  actions: read

jobs:
  repro:
    name: Repro fast-fail with prebuilt neverc
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NEVERC_LTO_CACHE: '0'
      NEVERC_LTO_PCACHE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: choco install ninja cmake 7zip -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download prebuilt neverc (no LTO rebuild)
        shell: bash
        run: |
          set -euxo pipefail
          RID="${{ github.event.inputs.run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow build-windows-x64-clang-lto.yml -L 40 \
                  --json databaseId,status,conclusion -R "${{ github.repository }}" \
                  -q '([.[]|select(.conclusion=="failure")]|.[0].databaseId) // ([.[]|select(.status=="completed")]|.[0].databaseId)')
          fi
          echo "Using clang-lto run id: $RID"
          echo "RUN_ID=$RID" >> "$GITHUB_ENV"
          gh run download "$RID" -n windows-x64-neverc-clang-lto -D dl/nc -R "${{ github.repository }}"
          7z x dl/nc/windows-x64-neverc-clang-lto.zip -o. >/dev/null
          NCC=$(cygpath -m "$PWD/install/bin/neverc.exe")
          test -f "$NCC"
          echo "NEVERC_EXTERNAL_BINARY=$NCC" >> "$GITHUB_ENV"
          ls -la install/bin/

          if [ "${{ github.event.inputs.also_try_pdb }}" = "true" ]; then
            if gh run download "$RID" -n windows-x64-neverc-clang-lto-pdb -D dl/pdb -R "${{ github.repository }}" 2>/dev/null; then
              7z x dl/pdb/windows-x64-neverc-clang-lto-pdb.zip -opdb >/dev/null 2>&1 || true
              find pdb -name '*.pdb' -exec cp {} install/bin/ \; 2>/dev/null || true
              ls -la install/bin/*.pdb 2>/dev/null || echo "(no PDB in artifact)"
            else
              echo "(no PDB artifact on run $RID)"
            fi
          fi

      - name: Build gtest harness only (MSVC, external neverc)
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S llvm -B build -G Ninja \
            -C neverc/cmake/caches/NeverC.cmake \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEVERC_EXTERNAL_BINARY="$NEVERC_EXTERNAL_BINARY"
          cmake --build build --target neverc-tests --parallel "$NUMBER_OF_PROCESSORS"
          ls -la build/bin/neverc-tests.exe

      - name: Enable WER local dumps
        shell: pwsh
        run: |
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $wer -Force | Out-Null
          New-ItemProperty -Path $wer -Name DumpFolder -Value 'C:\crashdumps' -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $wer -Name DumpCount  -Value 30 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $wer -Name DumpType   -Value 2  -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\crashdumps' | Out-Null

      - name: Run failing LTO tests (#135 / #137)
        id: tests
        shell: bash
        continue-on-error: true
        run: |
          set -x
          ./build/bin/neverc-tests.exe \
            --gtest_filter='LTOTest.AutoLtoLoopDenseNoCompileCliff:LTOTest.AutoLtoInlineCapSemanticsPreserved'

      - name: Analyze fast-fail dumps (cdb)
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dumps = Get-ChildItem 'C:\crashdumps' -Filter *.dmp -ErrorAction SilentlyContinue
          Write-Host "=== dumps captured: $($dumps.Count) ==="
          $dumps | Format-Table Name,Length | Out-String | Write-Host

          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          }
          Write-Host "cdb: $($cdb.FullName)"
          $bin = (Resolve-Path 'install/bin').Path
          $env:_NT_SYMBOL_PATH = "$bin;srv*C:\symcache*https://msdl.microsoft.com/download/symbols"
          Write-Host "neverc.pdb present: $([bool](Test-Path "$bin\neverc.pdb"))"

          if ($cdb -and $dumps) {
            foreach ($d in $dumps) {
              Write-Host "================= $($d.Name) ================="
              & $cdb.FullName -z $d.FullName -y "$env:_NT_SYMBOL_PATH" `
                -c '.reload /f; .exr -1; .ecxr; !analyze -v; kP 120; ~*kb 60; lmvm neverc; q'
            }
          } else {
            Write-Host 'cdb or dumps unavailable'
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-x64-clang-lto-fastfail-diag
          path: |
            C:\crashdumps
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: exit 1
