# Release build for Linux x86_64 (non-PGO).
# Tag push: build + test + GitHub Release upload.
# Manual dispatch: same pipeline but artifacts only (no release).
name: linux-x64-neverc-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build + test + release
    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: Release
      LLVM_APT_VER: '22'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake p7zip-full

      - name: Install Clang (apt.llvm.org, non-PGO)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          clang-${LLVM_APT_VER} --version

      - name: Build neverc
        run: |
          cmake -GNinja -Bbuild \
          -DCMAKE_C_COMPILER=$CC \
          -DCMAKE_CXX_COMPILER=$CXX \
          -DCMAKE_INSTALL_PREFIX=install \
          -DLLVM_ENABLE_ASSERTIONS=OFF \
          -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
          -DNEVERC_INCLUDE_TESTS=OFF \
          -DNEVERC_STRIP_BINARY=ON \
          -DNEVERC_ENABLE_LTO=OFF \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -C neverc/neverc/cmake/caches/NeverC.cmake \
          neverc/llvm
          time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc

      - name: Build Plugin SDK
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        run: |
          set -e
          make -C build/pluginsdk/examples \
            NEVERC=$PWD/build/bin/neverc \
            INCLUDE_DIR=$PWD/build/pluginsdk/include
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.so \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Install neverc
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

      - name: Package (full, with runtime)
        run: 7z a linux-x64-neverc.zip install

      - name: Package (binary + headers, for curl installer)
        run: cd install && zip -r ../neverc-linux-x64.zip bin lib

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-neverc
          path: |
            linux-x64-neverc.zip
            neverc-linux-x64.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-rc') }}
          files: |
            linux-x64-neverc.zip
            neverc-linux-x64.zip
