name: debug-plugin-sanitizer-repro

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Setup build deps
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gdb zstd
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure ASan UBSan assertions build
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DLLVM_USE_SANITIZER="Address;Undefined" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_PLUGIN_FUZZERS=OFF \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build only failing targets
        run: |
          cmake --build build --config "$BUILD_TYPE" --target \
            neverc-plugin-ir-tests \
            neverc-plugin-conformance

      - name: Package exact failing binaries
        run: |
          git -C neverc rev-parse HEAD > debug-plugin-sanitizer-sha.txt
          ldd build/bin/neverc > debug-plugin-sanitizer-ldd.txt
          tar --zstd -cf debug-plugin-sanitizer-binaries.tar.zst \
            build/bin/neverc \
            build/bin/neverc-plugin-ir-tests \
            build/bin/neverc-plugin-conformance

      - name: Upload exact failing binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-plugin-sanitizer-linux-x64
          path: |
            debug-plugin-sanitizer-binaries.tar.zst
            debug-plugin-sanitizer-sha.txt
            debug-plugin-sanitizer-ldd.txt

      - name: Capture MIR invalidation backtrace
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set +e
          gdb --return-child-result -batch \
            -ex "set pagination off" \
            -ex "set confirm off" \
            -ex "run --gtest_filter=PluginMIRHandleTest.InvalidatesInstructionAndOperandTogether" \
            -ex "thread apply all bt full" \
            --args build/bin/neverc-plugin-ir-tests
          echo "gdb_exit=$?"
          exit 0

      - name: Capture object pre-write compiler backtrace
        env:
          ASAN_OPTIONS: detect_leaks=0
          REAL_NEVERC: ${{ github.workspace }}/build/bin/neverc
        run: |
          set -e
          cat >/tmp/neverc-gdb-wrapper <<'EOF'
          #!/usr/bin/env bash
          exec gdb --return-child-result -batch \
            -ex "set pagination off" \
            -ex "set confirm off" \
            -ex "run" \
            -ex "thread apply all bt full" \
            --args "$REAL_NEVERC" "$@" 1>&2
          EOF
          chmod +x /tmp/neverc-gdb-wrapper
          set +e
          NEVERC_UNDER_TEST=/tmp/neverc-gdb-wrapper \
            build/bin/neverc-plugin-conformance \
              --gtest_filter=TargetObjectConformance.ObjectPreWriteInterceptorAddsSection
          echo "conformance_exit=$?"
          exit 0
