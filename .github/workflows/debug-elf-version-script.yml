name: debug-elf-version-script

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64-red:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: neverc

      - name: Verify exact checkout
        working-directory: neverc
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git show -s --format='%H %s' HEAD

      - name: Install build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Configure assertions build
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_LTO=OFF \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build linker test binary
        run: cmake --build build --config "$BUILD_TYPE" --target neverc-tests

      - name: Run exact RED contract
        shell: bash
        run: |
          set +e
          build/bin/neverc-tests \
            --gtest_color=no \
            --gtest_filter='LinkerTest.ELFVersionedDefinitionsUseOnlyOwnVersionNodePatterns:LinkerTest.ELFQuotedVersionScriptNamesAreLiteral:LinkerTest.ELFLargeVersionScriptWildcardAssignmentIsDeterministicAcrossBudgets' \
            2>&1 | tee version-script-red.log
          test_status=${PIPESTATUS[0]}
          set -e
          echo "EXACT_GTEST_EXIT=$test_status"
          exit "$test_status"
