name: cpp-frontend-tools

on:
  push:
    paths:
      - 'neverc/lib/Translate/Cpp/Frontend/**'
      - 'neverc/cmake/modules/BuiltinCppFrontend.cmake'
      - 'tests/neverc/HostCoffSymbolsTests.py'
      - '.github/workflows/test-cpp-frontend-tools.yml'
  pull_request:
    paths:
      - 'neverc/lib/Translate/Cpp/Frontend/**'
      - 'neverc/cmake/modules/BuiltinCppFrontend.cmake'
      - 'tests/neverc/HostCoffSymbolsTests.py'
      - '.github/workflows/test-cpp-frontend-tools.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  archive-audit:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify COFF linker indexes and ABI collision checks
        shell: bash
        run: |
          python -I -B tests/neverc/HostCoffSymbolsTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/AuditArchiveTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/MsvcRuntimeSymbolsTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/CoffWeakAliasesTests.py
