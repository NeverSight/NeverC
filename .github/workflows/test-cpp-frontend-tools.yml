name: cpp-frontend-tools

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  archive-audit:
    strategy:
      # Leave runner slots for the main builds in the shared organization pool.
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up the Windows configure compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Verify COFF linker indexes and ABI collision checks
        shell: bash
        run: |
          python -I -B tests/neverc/HostCoffSymbolsTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/AuditArchiveTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/MsvcRuntimeSymbolsTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/CoffWeakAliasesTests.py
          python -E -B neverc/lib/Translate/Cpp/Frontend/RewriteSetupCoffSymbolsTests.py
          python -I -B tests/neverc/CppFrontendToolchainTests.py --report-self-tests
          python -I -B neverc/lib/Translate/Cpp/Frontend/CollectCrtStorageEvidenceTests.py
          python -I -B neverc/lib/Translate/Cpp/Frontend/BuiltinCppFrontendCMakeTests.py
  registered-formal-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify registered golden source and original124 extraction
        run: python -I -B tests/neverc/NotFnRegisteredGTestsTests.py
      - name: Verify replay protocol matches the real private entry driver
        run: python -I -B tests/neverc/FrontendReplayProtocolTests.py
