name: debug-lto-strict-cache

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-lto-strict-cache-red-*"
      - "debug-lto-strict-cache-green-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc
          fetch-depth: 4

      - name: Verify exact diagnostic tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C neverc branch --show-current)" = ""
          test "$(git -C neverc rev-parse HEAD^)" = "a001198a7310ecc5a8419fd31d9d82a5832368ad"
          git -C neverc diff --exit-code
          git -C neverc diff --cached --exit-code
          printf '%s\n' \
            '.github/workflows/debug-lto-strict-cache.yml' |
            sort -u > expected-files.txt
          git -C neverc diff-tree --no-commit-id --name-only -r HEAD^ HEAD |
            sort -u > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          git -C neverc checkout --detach \
            a001198a7310ecc5a8419fd31d9d82a5832368ad
          test "$(git -C neverc rev-parse HEAD)" = \
            "a001198a7310ecc5a8419fd31d9d82a5832368ad"
          printf '%s\n' \
            '.github/workflows/debug-lto-strict-cache.yml' \
            'neverc/lib/Linker/Core/Driver/LTOCache.cpp' \
            'tests/neverc/MergeTests.cpp' | sort -u > expected-range-files.txt
          git -C neverc diff --name-only \
            7d7a6ee2ebdadd12d9b39f5465d9246fb64ede1c..HEAD |
            sort -u > actual-range-files.txt
          diff -u expected-range-files.txt actual-range-files.txt

      - name: Setup build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-$LLVM_APT_VER" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_APT_VER" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Configure focused test build
        shell: bash
        run: |
          set -euo pipefail
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            '-DLLVM_USE_SANITIZER=Address;Undefined' \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build focused strict-cache test
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config "$BUILD_TYPE" \
            --target neverc-merge-tests

      - name: Require fault-injected strict-cache contract
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          set +e
          build/bin/neverc-merge-tests \
            --gtest_filter='MergeParallelCodegenStrict.MultiFileAutoLtoSerialFallbackProducesCorrectBinary' \
            --gtest_color=no 2>&1 | tee strict-cache-sanitizer.log
          test_status=${PIPESTATUS[0]}
          set -e
          test "$test_status" -eq 0
          grep -F '[ RUN      ] MergeParallelCodegenStrict.MultiFileAutoLtoSerialFallbackProducesCorrectBinary' \
            strict-cache-sanitizer.log
          grep -F '[       OK ] MergeParallelCodegenStrict.MultiFileAutoLtoSerialFallbackProducesCorrectBinary' \
            strict-cache-sanitizer.log
          if grep -F '[  SKIPPED ]' strict-cache-sanitizer.log; then
            exit 1
          fi
          if grep -E 'AddressSanitizer|LeakSanitizer|UndefinedBehaviorSanitizer|runtime error:|ERROR: .*Sanitizer' \
            strict-cache-sanitizer.log; then
            exit 1
          fi
