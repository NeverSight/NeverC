name: http2-grpc-interop

permissions:
  contents: read

on:
  push:
    paths:
      - 'std/include/neverc/std/net/grpc.h'
      - 'std/include/neverc/std/net/http/http2.h'
      - 'std/src/net/grpc/**'
      - 'std/src/net/http/http2/**'
      - 'tests/neverc/std/h2_grpc_interop_server.c'
      - 'tests/neverc/interop/go-grpc/**'
      - 'utils/ci/run-http2-grpc-interop.sh'
      - '.github/workflows/http2-grpc-interop.yml'
  pull_request:
    paths:
      - 'std/include/neverc/std/net/grpc.h'
      - 'std/include/neverc/std/net/http/http2.h'
      - 'std/src/net/grpc/**'
      - 'std/src/net/http/http2/**'
      - 'tests/neverc/std/h2_grpc_interop_server.c'
      - 'tests/neverc/interop/go-grpc/**'
      - 'utils/ci/run-http2-grpc-interop.sh'
      - '.github/workflows/http2-grpc-interop.yml'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: http2-grpc-interop-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  interop:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          bash .github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update && sudo apt-get install -y clang nghttp2-client netcat-openbsd ripgrep

      - name: Install current Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache-dependency-path: tests/neverc/interop/go-grpc/go.sum

      - name: Run h2spec, nghttp2, and gRPC-Go interoperability
        env:
          NEVERC_RUN_H2SPEC: '1'
        run: utils/ci/run-http2-grpc-interop.sh "$PWD" clang 19091
