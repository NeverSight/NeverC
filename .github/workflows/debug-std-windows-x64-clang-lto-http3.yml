name: debug-std-windows-x64-clang-lto-http3

on:
  push:
    tags:
      - 'std-http3-startup-diag-*'
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of natural focused repetitions
        required: true
        default: '8'
      timeout_seconds:
        description: Per-process watchdog in seconds
        required: true
        default: '30'
      poll_ms:
        description: Socket sampling interval in milliseconds
        required: true
        default: '100'

permissions:
  actions: read
  contents: read

concurrency:
  group: debug-std-windows-x64-clang-lto-http3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      FORMAL_RUN_ID: '33335526920'
      FORMAL_SHA: c8ce8a38d3bed0ad35e4d7db2e4664ee1bc4fa4e
      FORMAL_ARTIFACT_ID: '9739946451'
      FORMAL_ARTIFACT_NAME: windows-x64-neverc-clang-lto
      FORMAL_ARTIFACT_DIGEST: sha256:a029f319025e8aecdd896b681b0c960adfca163c5cf6a36c74ae2bbab8366588
      EXPECTED_STD_SOURCE_COUNT: '246'

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify formal run and artifact provenance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $sourceSha = (& git rev-parse HEAD).Trim()
          if ($sourceSha -ne $env:GITHUB_SHA) {
            throw "tagged source SHA mismatch: $sourceSha"
          }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:FORMAL_RUN_ID"
          $run = Invoke-RestMethod -Headers $headers -Uri $runUrl
          if ([string]$run.head_sha -ne $env:FORMAL_SHA) {
            throw "formal run SHA mismatch: $($run.head_sha)"
          }
          if ([string]$run.event -ne 'push' -or
              [string]$run.path -ne '.github/workflows/build-windows-x64-clang-lto.yml') {
            throw "unexpected formal run provenance: $($run.event) $($run.path)"
          }
          if ([string]$run.repository.full_name -ne $env:GITHUB_REPOSITORY -or
              [string]$run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'formal run repository mismatch'
          }

          $artifactUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:FORMAL_ARTIFACT_ID"
          $artifact = Invoke-RestMethod -Headers $headers -Uri $artifactUrl
          if ([string]$artifact.name -ne $env:FORMAL_ARTIFACT_NAME -or
              [string]$artifact.digest -ne $env:FORMAL_ARTIFACT_DIGEST -or
              [bool]$artifact.expired -or
              [string]$artifact.workflow_run.id -ne $env:FORMAL_RUN_ID -or
              [string]$artifact.workflow_run.head_sha -ne $env:FORMAL_SHA) {
            throw 'formal artifact provenance mismatch'
          }
          [ordered]@{
            run_id = [string]$run.id
            source_sha = $sourceSha
            head_sha = [string]$run.head_sha
            event = [string]$run.event
            workflow = [string]$run.path
            artifact_id = [string]$artifact.id
            artifact_name = [string]$artifact.name
            artifact_size = [long]$artifact.size_in_bytes
            artifact_digest = [string]$artifact.digest
            runner_image = $env:ImageVersion
          } | ConvertTo-Json | Set-Content evidence/provenance.json

      - name: Download exact formal compiler artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64-neverc-clang-lto
          path: formal-artifact
          run-id: ${{ env.FORMAL_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Set up MSVC and Windows SDK environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Restore exact formal compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'formal-artifact/windows-x64-neverc-clang-lto.zip'
          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "missing inner artifact archive: $archive"
          }
          Expand-Archive -Path $archive -DestinationPath formal-toolchain -Force
          $compiler = (Resolve-Path 'formal-toolchain/install/bin/neverc.exe').Path
          if (-not (Test-Path 'formal-toolchain/install/runtime')) {
            throw 'full artifact is missing its runtime tree'
          }
          & $compiler --version 2>&1 | Set-Content evidence/compiler-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'formal compiler did not start' }

      - name: Record focused regression source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-FileHash tests/neverc/std/test_http3_e2e.c `
            -Algorithm SHA256 | Format-List | Out-String |
            Set-Content evidence/source.sha256.txt

      - name: Build tagged std and focused test with the exact formal compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force `
            diagnostic-bin/std-objects | Out-Null
          $compiler = (Resolve-Path 'formal-toolchain/install/bin/neverc.exe').Path
          $archiverCommand = Get-Command lib.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $archiverCommand) {
            throw 'lib.exe is unavailable after MSVC setup'
          }
          $archiver = $archiverCommand.Source
          (Get-Item $archiver).VersionInfo | Format-List | Out-String |
            Set-Content evidence/archiver-version.txt

          & git diff --quiet --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'tagged tracked source is modified' }
          & git diff --cached --quiet --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'tagged index is modified' }
          $sourceStatus = @(& git status --porcelain=v1 `
            --untracked-files=all -- std/src std/include `
            tests/neverc/std/test_http3_e2e.c)
          if ($LASTEXITCODE -ne 0 -or $sourceStatus.Count -ne 0) {
            $sourceStatus | Set-Content evidence/unexpected-source-status.txt
            throw 'tagged std/test source tree is not pristine'
          }
          $sources = @(& git ls-files -- ':(glob)std/src/**/*.c')
          if ($LASTEXITCODE -ne 0 -or
              $sources.Count -ne [int]$env:EXPECTED_STD_SOURCE_COUNT) {
            throw "unexpected tracked std source count: $($sources.Count)"
          }
          $diskSources = @(Get-ChildItem std/src -Recurse -File -Filter '*.c')
          if ($diskSources.Count -ne $sources.Count) {
            throw "tracked/on-disk std source mismatch: $($sources.Count)/$($diskSources.Count)"
          }
          $sources | Set-Content evidence/std-sources.txt
          foreach ($source in $sources) {
            $blob = (& git hash-object -- $source).Trim()
            if ($LASTEXITCODE -ne 0 -or -not $blob) {
              throw "could not hash tagged std source: $source"
            }
            $headBlob = (& git rev-parse "HEAD:$source").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $headBlob) {
              throw "could not resolve tagged std blob: $source"
            }
            "$headBlob $blob $source" |
              Add-Content evidence/std-source-blobs.txt
          }

          $stdFlags = @(
            '--target=x86_64-pc-windows-msvc',
            "-I$PWD/std/include",
            "-I$PWD/std/src/net",
            '-fno-builtin-std',
            '-fno-builtin-mimalloc',
            '-fno-lto',
            '-ffreestanding',
            '-std=gnu11',
            '-O2',
            '-gline-tables-only',
            '-w'
          )
          $objects = [System.Collections.Generic.List[string]]::new()
          for ($index = 0; $index -lt $sources.Count; $index++) {
            $source = (Resolve-Path $sources[$index]).Path
            $object = Join-Path $PWD (
              'diagnostic-bin/std-objects/std-{0:d4}.obj' -f $index)
            $arguments = @($stdFlags) + @('-c', $source, '-o', $object)
            ($compiler + ' ' + ($arguments -join ' ')) |
              Add-Content evidence/std-compile-commands.txt
            & $compiler @arguments 1>> evidence/std-compile.stdout.txt `
                                  2>> evidence/std-compile.stderr.txt
            if ($LASTEXITCODE -ne 0 -or
                -not (Test-Path $object -PathType Leaf) -or
                (Get-Item $object).Length -eq 0) {
              throw "tagged std compile failed: $($sources[$index])"
            }
            $objects.Add($object)
          }

          $archive = Join-Path $PWD 'diagnostic-bin/neverc-std-current.lib'
          $response = Join-Path $PWD 'diagnostic-bin/std-objects.rsp'
          $objects | ForEach-Object { '"' + $_ + '"' } |
            Set-Content -Encoding ascii $response
          Copy-Item $response evidence/std-objects.rsp
          & $archiver /NOLOGO /MACHINE:X64 "/OUT:$archive" "@$response" `
            1> evidence/archive.stdout.txt 2> evidence/archive.stderr.txt
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive -PathType Leaf)) {
            throw 'tagged std archive creation failed'
          }
          $memberOutput = @(& $archiver /NOLOGO /LIST $archive 2>&1)
          $memberExit = $LASTEXITCODE
          $memberOutput | Set-Content evidence/archive-members-raw.txt
          $members = @($memberOutput | Where-Object { $_ -match '\.obj$' })
          if ($memberExit -ne 0 -or $members.Count -ne $sources.Count) {
            throw "unexpected tagged std archive member count: $($members.Count)"
          }
          $members | Set-Content evidence/archive-members.txt
          Get-FileHash $archive -Algorithm SHA256 |
            Format-List | Out-String | Set-Content evidence/archive.sha256.txt

          $output = Join-Path $PWD 'diagnostic-bin/test_http3_e2e.exe'
          $arguments = @(
            '--target=x86_64-pc-windows-msvc',
            "-I$PWD/std/include",
            "-I$PWD/std/src/net",
            "-I$PWD/tests/neverc/std",
            '-fno-builtin-std',
            '-fno-builtin-mimalloc',
            '-fno-lto',
            '-Wall',
            '-Wextra',
            '-Wno-unused-parameter',
            '-Wno-unused-function',
            '-O1',
            '-o', $output,
            (Join-Path $PWD 'tests/neverc/std/test_http3_e2e.c'),
            $archive,
            '-Wno-deprecated-declarations'
          )
          ($compiler + ' ' + ($arguments -join ' ')) |
            Set-Content evidence/compile-command.txt
          & $compiler @arguments 1> evidence/compile.stdout.txt `
                                2> evidence/compile.stderr.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content evidence/compile.stdout.txt
            Get-Content evidence/compile.stderr.txt
            throw "focused compile failed with exit $LASTEXITCODE"
          }
          Get-FileHash $output -Algorithm SHA256 |
            Format-List | Out-String | Set-Content evidence/binary.sha256.txt

      - name: Run focused HTTP3 regression repetitions
        id: diagnose
        continue-on-error: true
        shell: pwsh
        env:
          DIAG_ITERATIONS: ${{ inputs.iterations || '8' }}
          DIAG_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '30' }}
          DIAG_POLL_MS: ${{ inputs.poll_ms || '100' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'diagnostic-bin/test_http3_e2e.exe').Path
          $binDir = (Resolve-Path 'formal-toolchain/install/bin').Path
          $env:PATH = "$binDir;$env:PATH"
          $iterations = [int]$env:DIAG_ITERATIONS
          $timeoutSeconds = [int]$env:DIAG_TIMEOUT_SECONDS
          $pollMs = [int]$env:DIAG_POLL_MS
          if ($iterations -lt 1 -or $iterations -gt 100 -or
              $timeoutSeconds -lt 5 -or $timeoutSeconds -gt 120 -or
              $pollMs -lt 25 -or $pollMs -gt 1000) {
            throw 'diagnostic inputs are outside their safe bounds'
          }

          $summary = [System.Collections.Generic.List[object]]::new()
          $naturalFailures = 0

          function Invoke-Http3Case {
            param(
              [string]$Name,
              [string]$Mode,
              [int]$Timeout
            )
            $caseDir = Join-Path $PWD "evidence/$Name"
            New-Item -ItemType Directory -Force $caseDir | Out-Null
            $stdout = Join-Path $caseDir 'stdout.txt'
            $stderr = Join-Path $caseDir 'stderr.txt'
            $socketLog = Join-Path $caseDir 'sockets.jsonl'
            $forcedPort = 0
            $blocker = $null
            if ($Mode -eq 'udp-occupied') {
              $blocker = [System.Net.Sockets.UdpClient]::new()
              $blocker.Client.ExclusiveAddressUse = $true
              $blocker.Client.Bind([System.Net.IPEndPoint]::new(
                  [System.Net.IPAddress]::Loopback, 0))
              $forcedPort = $blocker.Client.LocalEndPoint.Port
            } elseif ($Mode -eq 'tcp-occupied') {
              $blocker = [System.Net.Sockets.TcpListener]::new(
                  [System.Net.IPAddress]::Loopback, 0)
              $blocker.Server.ExclusiveAddressUse = $true
              $blocker.Start()
              $forcedPort = $blocker.LocalEndpoint.Port
            }

            if ($forcedPort -gt 0) {
              $env:NEVERC_HTTP3_DIAG_PORT = [string]$forcedPort
            } else {
              Remove-Item Env:NEVERC_HTTP3_DIAG_PORT -ErrorAction SilentlyContinue
            }
            $process = Start-Process -FilePath $exe -WorkingDirectory $caseDir `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
              -PassThru
            Remove-Item Env:NEVERC_HTTP3_DIAG_PORT -ErrorAction SilentlyContinue

            $watch = [System.Diagnostics.Stopwatch]::StartNew()
            $timedOut = $false
            $sawBoth = $false
            do {
              $process.Refresh()
              $tcp = @()
              $udp = @()
              if (-not $process.HasExited) {
                $tcp = @(Get-NetTCPConnection -OwningProcess $process.Id `
                    -ErrorAction SilentlyContinue |
                    Select-Object LocalAddress,LocalPort,RemoteAddress,
                                  RemotePort,State)
                $udp = @(Get-NetUDPEndpoint -OwningProcess $process.Id `
                    -ErrorAction SilentlyContinue |
                    Select-Object LocalAddress,LocalPort)
              }
              $tcpListenPorts = @($tcp | Where-Object State -eq 'Listen' |
                  ForEach-Object LocalPort)
              $udpPorts = @($udp | ForEach-Object LocalPort)
              if (@($tcpListenPorts |
                    Where-Object { $udpPorts -contains $_ }).Count -gt 0) {
                $sawBoth = $true
              }
              [ordered]@{
                elapsed_ms = $watch.ElapsedMilliseconds
                pid = $process.Id
                tcp = $tcp
                udp = $udp
              } | ConvertTo-Json -Depth 5 -Compress |
                  Add-Content -Encoding utf8 $socketLog
              if ($process.HasExited) { break }
              Start-Sleep -Milliseconds $pollMs
            } while ($watch.Elapsed.TotalSeconds -lt $Timeout)

            $process.Refresh()
            if (-not $process.HasExited) {
              $timedOut = $true
              Get-Process -Id $process.Id -ErrorAction SilentlyContinue |
                Format-List * | Out-String |
                Set-Content (Join-Path $caseDir 'timeout-process.txt')
              & netstat.exe -ano 2>&1 |
                Set-Content (Join-Path $caseDir 'timeout-netstat.txt')
              $process.Refresh()
              if (-not $process.HasExited) {
                try {
                  & taskkill.exe /PID $process.Id /T /F 2>&1 |
                    Set-Content (Join-Path $caseDir 'taskkill.txt')
                } catch {
                  $_ | Out-String |
                    Set-Content (Join-Path $caseDir 'taskkill-error.txt')
                }
              }
              if (-not $process.WaitForExit(5000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                if (-not $process.WaitForExit(5000)) {
                  throw "diagnostic process $($process.Id) survived forced termination"
                }
              }
            } else {
              $process.WaitForExit()
            }
            $watch.Stop()
            $exitCode = $null
            try {
              $process.Refresh()
              if ($process.HasExited) { $exitCode = $process.ExitCode }
            } catch {
              $_ | Out-String | Set-Content `
                (Join-Path $caseDir 'exit-code-error.txt')
            }
            if ($blocker) {
              if ($Mode -eq 'tcp-occupied') { $blocker.Stop() }
              else { $blocker.Dispose() }
            }

            [string]$outText = if (Test-Path $stdout) {
              [string](Get-Content $stdout -Raw)
            } else { '' }
            [string]$errText = if (Test-Path $stderr) {
              [string](Get-Content $stderr -Raw)
            } else { '' }
            $passed = -not $timedOut -and $exitCode -eq 0 -and
                      $outText -match '(?m)^passed\r?$'
            $sawReady = $outText -match 'DIAG readiness saw=1'
            $exitCodeText = if ($timedOut) {
              'TIMEOUT'
            } elseif ($null -eq $exitCode) {
              'UNKNOWN'
            } else {
              [string]$exitCode
            }
            $caseFormat = (
              'CASE name={0} mode={1} port={2} elapsed_ms={3} ' +
              'exit={4} passed={5} ready={6} tcp_udp={7}'
            )
            $caseSummary = $caseFormat -f `
              $Name, $Mode, $forcedPort, $watch.ElapsedMilliseconds,
              $exitCodeText, $passed, $sawReady, $sawBoth
            Write-Host $caseSummary
            $stdoutError = ($outText -split "`r?`n" |
              Where-Object { $_ -match 'error:|FAIL|DIAG' }) -join ' | '
            $stderrSummary = $errText.Trim()
            $record = [pscustomobject]@{
              name = $Name
              mode = $Mode
              forced_port = $forcedPort
              pid = $process.Id
              elapsed_ms = $watch.ElapsedMilliseconds
              exit_code = $exitCodeText
              passed = $passed
              saw_reported_readiness = $sawReady
              saw_tcp_udp_same_port = $sawBoth
              stdout_error = $stdoutError
              stderr = $stderrSummary
            }
            $script:summary.Add($record)
            if ($Mode -eq 'natural' -and -not $passed) {
              $script:naturalFailures++
            }
          }

          for ($index = 1; $index -le $iterations; $index++) {
            Invoke-Http3Case -Name ('natural-{0:d3}' -f $index) `
              -Mode 'natural' -Timeout $timeoutSeconds
          }
          $summary | Export-Csv evidence/summary.csv -NoTypeInformation
          $summary | Format-Table -AutoSize | Out-String -Width 300 |
            Set-Content evidence/summary.txt
          Get-Content evidence/summary.txt
          [ordered]@{
            natural_failures = $naturalFailures
          } | ConvertTo-Json | Set-Content evidence/gate.json
          if ($naturalFailures -gt 0) { exit 1 }

      - name: Upload exact-run HTTP3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-clang-lto-http3-evidence
          path: evidence
          retention-days: 14
          if-no-files-found: error

      - name: Apply diagnostic gate after evidence upload
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.diagnose.outcome }}' -ne 'success') {
            throw 'focused HTTP3 regression failed'
          }
