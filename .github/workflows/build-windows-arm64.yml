name: windows-arm64-neverc-build

permissions:
  contents: write

on: [push, pull_request]

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  build:
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository))
    # Native arm64 Windows runner (GitHub-hosted, Windows 11 on ARM).
    runs-on: windows-11-arm
    env:
      BUILD_TYPE: RelWithDebInfo
      # Make any parallel-codegen merge/self-verify fallback a hard CI failure
      # rather than a silent fallback to serial codegen that would mask a merger
      # regression.  Exercises the COFF merge path (the gtest strict end-to-end
      # tests are POSIX-only, so the example builds here are Windows' enforcement
      # of the same invariant).  A correct merge is byte-identical / unaffected.
      NEVERC_PCG_STRICT: "1"
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc

    - name: Install ARM64-native CMake & Ninja
      shell: pwsh
      run: |
        $cmakeVer = '3.31.11'
        Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-arm64.zip" -OutFile cmake.zip
        Expand-Archive cmake.zip C:\tools -Force
        Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-arm64\bin"

        $ninjaVer = '1.13.1'
        Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v$ninjaVer/ninja-winarm64.zip" -OutFile ninja.zip
        Expand-Archive ninja.zip C:\tools\ninja -Force
        Add-Content $env:GITHUB_PATH "C:\tools\ninja"

        choco install 7zip -y

    - name: Setup MSVC (native arm64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Build neverc
      shell: bash
      run: |
        cmake -GNinja -Bbuild \
        -DCMAKE_SYSTEM_PROCESSOR=ARM64 \
        -DCMAKE_INSTALL_PREFIX=install \
        -DLLVM_ENABLE_ASSERTIONS=OFF \
        -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
        -DNEVERC_INCLUDE_TESTS=ON \
        -DNEVERC_STRIP_BINARY=OFF \
        -DNEVERC_ENABLE_LTO=ON \
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
        -C neverc/neverc/cmake/caches/NeverC.cmake \
        neverc/llvm
        cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-embed-runtime-bitcode

    - name: Build bundled Windows runtime
      shell: bash
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-runtime-arm64-msvc neverc-runtime-shared-msvc

    - name: Install neverc
      shell: bash
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

    - name: Package neverc
      run: 7z a windows-arm64-neverc.zip install

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-neverc
        path: windows-arm64-neverc.zip

    - name: Package neverc compiler (without runtime)
      shell: bash
      run: |
        mv install/runtime install-runtime-stash
        7z a windows-arm64-neverc-compiler.zip install
        mv install-runtime-stash install/runtime

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-neverc-compiler
        path: windows-arm64-neverc-compiler.zip

    - name: Package neverc runtime
      run: 7z a windows-arm64-neverc-runtime.zip install/runtime

    - name: Upload Runtime Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-neverc-runtime
        path: windows-arm64-neverc-runtime.zip

    # Package link-time PDBs (neverc.pdb etc.) for windbg/VS crash triage.
    # Only build/bin/*.pdb — per-target compile PDBs under build/lib/** are
    # already merged into the link-time PDB and would push the zip past
    # GitHub's 2 GB artifact limit.
    - name: Package PDBs
      shell: bash
      run: 7z a windows-arm64-neverc-pdb.zip ./build/bin/*.pdb

    - name: Upload PDB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-neverc-pdb
        path: windows-arm64-neverc-pdb.zip

    - name: Build Plugin SDK
      shell: bash
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

    - name: Build network product examples
      shell: bash
      run: neverc/utils/ci/build-network-product-examples.sh "$PWD/build/bin/neverc.exe" "$PWD/neverc" aarch64-pc-windows-msvc

    - name: Test Plugin SDK (build + load)
      shell: bash
      run: |
        set -e
        make -C build/pluginsdk/examples \
          NEVERC=$PWD/build/bin/neverc \
          INCLUDE_DIR=$PWD/build/pluginsdk/include \
          HOST_TARGET=aarch64-pc-windows-msvc
        printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
        for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
          echo "--- Testing $plugin ---"
          build/bin/neverc \
            --target=aarch64-pc-windows-msvc \
            -fplugin-pass=build/pluginsdk/examples/${plugin}.dll \
            -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
          echo "--- $plugin OK ---"
        done

    - name: Run neverc tests
      id: tests
      shell: bash
      continue-on-error: true
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target check-neverc

    - name: Run network concurrency gates
      if: steps.tests.outcome == 'success'
      shell: bash
      run: neverc/utils/ci/run-network-core-gates.sh "$PWD/build/bin/neverc.exe" "$PWD/neverc" 25

    - name: Run network transport soak
      if: steps.tests.outcome == 'success'
      shell: bash
      run: neverc/utils/ci/run-network-transport-soak.sh "$PWD/build/bin/neverc.exe" "$PWD/neverc" 5000

    - name: Diagnose crashes
      if: steps.tests.outcome == 'failure'
      shell: bash
      run: |
        set -x
        NCC=$(cygpath -m "$PWD/build/bin/neverc.exe")
        TESTDIR=$(cygpath -m "$PWD/neverc/tests/neverc")
        WDIAG=$(cygpath -m "$PWD/diag_out")
        BDIAG="$PWD/diag_out"
        mkdir -p "$BDIAG"

        # ── Environment & SDK diagnostics ──
        echo "=== MSVC / SDK environment ==="
        echo "LIB=$LIB"
        echo "INCLUDE=$INCLUDE"
        echo "VCToolsInstallDir=$VCToolsInstallDir"
        echo "WindowsSdkDir=$WindowsSdkDir"
        echo "WindowsSDKVersion=$WindowsSDKVersion"
        echo "VSCMD_ARG_TGT_ARCH=$VSCMD_ARG_TGT_ARCH"
        echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"

        echo "=== Check ARM64 CRT & SDK libs exist ==="
        for lib in libcmt.lib libvcruntime.lib libucrt.lib kernel32.lib bcryptprimitives.lib; do
          found=false
          IFS=';' read -ra LIBDIRS <<< "$LIB"
          for dir in "${LIBDIRS[@]}"; do
            wdir=$(cygpath -u "$dir" 2>/dev/null || echo "$dir")
            if [ -f "$wdir/$lib" ]; then
              echo "  FOUND: $dir/$lib ($(wc -c < "$wdir/$lib") bytes)"
              found=true
              break
            fi
          done
          $found || echo "  MISSING: $lib"
        done

        echo "=== Linker search paths (neverc -v) ==="
        "$NCC" -std=c11 -v "$TESTDIR/standards/test_c_stdlib_patterns.c" \
          -o "$WDIAG/diag_verbose.exe" 2>&1 | head -80 || true

        diagnose() {
          local label=$1 src=$2 flags=$3
          echo "=== [$label] step 1: compile to .obj ==="
          "$NCC" $flags -c "$src" -o "$WDIAG/diag_${label}.obj" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 2: link .obj to exe (with .pdata validation) ==="
          "$NCC" $flags -v "$WDIAG/diag_${label}.obj" -o "$WDIAG/diag_${label}.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 3a: compile+link (one shot, LTO) ==="
          "$NCC" $flags "$src" -o "$WDIAG/diag_${label}_oneshot.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 3b: compile+link (one shot, NO LTO) ==="
          "$NCC" $flags -fno-lto "$src" -o "$WDIAG/diag_${label}_nolto.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 3c: compile+link (save LTO temps) ==="
          "$NCC" $flags -save-temps "$src" -o "$WDIAG/diag_${label}_temps.exe" 2>&1 && echo "OK" || echo "EXIT=$?"
          ls -la "$WDIAG"/diag_${label}_temps.*.obj 2>/dev/null || echo "(no LTO temps)"

          echo "=== [$label] check output files ==="
          ls -la "$BDIAG"/diag_${label}* 2>&1 || echo "NO FILES FOUND"
          file "$BDIAG"/diag_${label}_oneshot.exe 2>&1 || true

          echo "=== [$label] DLL dependencies ==="
          dumpbin //DEPENDENTS "$BDIAG/diag_${label}_oneshot.exe" 2>&1 || true

          echo "=== [$label] IMPORTS (function names) ==="
          dumpbin //IMPORTS "$BDIAG/diag_${label}_oneshot.exe" 2>&1 || true

          echo "=== [$label] PE headers ==="
          dumpbin //HEADERS "$BDIAG/diag_${label}_oneshot.exe" 2>&1 | head -60 || true

          echo "=== [$label] UNWIND INFO (.pdata/.xdata content) ==="
          dumpbin //UNWINDINFO "$BDIAG/diag_${label}_oneshot.exe" 2>&1 | head -200 || true

          echo "=== [$label] .pdata raw hex (first 256 bytes) ==="
          dumpbin //RAWDATA:.pdata "$BDIAG/diag_${label}_oneshot.exe" 2>&1 | head -40 || true

          echo "=== [$label] step 4: run LTO exe ==="
          powershell.exe -NoProfile -Command "
            try {
              \$p = Start-Process -FilePath '$WDIAG/diag_${label}_oneshot.exe' \
                -NoNewWindow -Wait -PassThru \
                -RedirectStandardOutput '$WDIAG/diag_${label}_stdout.txt' \
                -RedirectStandardError '$WDIAG/diag_${label}_stderr.txt'
              Write-Host \"EXIT_CODE=\$(\$p.ExitCode)\"
            } catch {
              Write-Host \"EXCEPTION: \$_\"
              Write-Host \"WIN32_ERROR: \$([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())\"
            }
          " 2>&1 || echo "POWERSHELL_EXIT=$?"
          echo "--- stdout ---"
          cat "$BDIAG/diag_${label}_stdout.txt" 2>/dev/null || echo "(empty)"
          echo "--- stderr ---"
          cat "$BDIAG/diag_${label}_stderr.txt" 2>/dev/null || echo "(empty)"

          echo "=== [$label] step 4b: run NO-LTO exe ==="
          powershell.exe -NoProfile -Command "
            try {
              \$p = Start-Process -FilePath '$WDIAG/diag_${label}_nolto.exe' \
                -NoNewWindow -Wait -PassThru \
                -RedirectStandardOutput '$WDIAG/diag_${label}_nolto_stdout.txt' \
                -RedirectStandardError '$WDIAG/diag_${label}_nolto_stderr.txt'
              Write-Host \"NOLTO_EXIT_CODE=\$(\$p.ExitCode)\"
            } catch {
              Write-Host \"NOLTO_EXCEPTION: \$_\"
            }
          " 2>&1 || echo "NOLTO_POWERSHELL_EXIT=$?"

          echo "=== [$label] step 4c: compare LTO vs NO-LTO .pdata ==="
          echo "--- LTO exe .pdata entry count ---"
          dumpbin //UNWINDINFO "$BDIAG/diag_${label}_oneshot.exe" 2>&1 | grep -c "Function:" || echo "0"
          echo "--- NO-LTO exe .pdata entry count ---"
          dumpbin //UNWINDINFO "$BDIAG/diag_${label}_nolto.exe" 2>&1 | grep -c "Function:" || echo "0"
          echo "--- NO-LTO exe IMPORTS (RtlUnwind check) ---"
          dumpbin //IMPORTS "$BDIAG/diag_${label}_nolto.exe" 2>&1 | grep -i "RtlUnwind" || echo "(no RtlUnwind)"

          echo "=== [$label] step 5: auto-LTO .obj .pdata analysis (bitcode wrapper, expect none) ==="
          echo "--- .obj sections with .pdata ---"
          dumpbin //SECTIONS "$WDIAG/diag_${label}.obj" 2>&1 | grep -i "pdata\|xdata" || echo "(none)"
          echo "--- .obj symbols (functions) ---"
          dumpbin //SYMBOLS "$WDIAG/diag_${label}.obj" 2>&1 | grep -E "notype.*\(\)|\.pdata|\.xdata" | head -60 || echo "(none)"

          echo "=== [$label] step 5b: -fno-lto -c REAL machine-code .obj .pdata check ==="
          # The auto-LTO .obj above is a bitcode wrapper, so it never has .pdata.
          # Build a true machine-code object to see whether the AArch64 COFF
          # codegen backend actually emits .pdata/.xdata for user functions.
          "$NCC" $flags -fno-lto -c "$src" -o "$WDIAG/diag_${label}_nolto.obj" 2>&1 && echo "OK" || echo "EXIT=$?"
          echo "--- nolto .obj SECTIONS (head) ---"
          dumpbin //SECTIONS "$WDIAG/diag_${label}_nolto.obj" 2>&1 | head -60 || true
          echo "--- nolto .obj .pdata/.xdata present? ---"
          dumpbin //SECTIONS "$WDIAG/diag_${label}_nolto.obj" 2>&1 | grep -i "pdata\|xdata" || echo "(NONE - codegen not emitting .pdata!)"
          echo "--- nolto .obj UNWINDINFO ---"
          dumpbin //UNWINDINFO "$WDIAG/diag_${label}_nolto.obj" 2>&1 | head -80 || echo "(none)"

          echo "=== [$label] step 5c: uwtable attribute in LLVM IR ==="
          # If the frontend attaches `uwtable` but no .pdata appears, the loss is
          # in the backend / LTO codegen, not the frontend.
          echo "--- non-LTO frontend IR ---"
          "$NCC" $flags -fno-lto -emit-llvm -S "$src" -o "$WDIAG/diag_${label}_nolto.ll" 2>&1 && echo "OK" || echo "EXIT=$?"
          echo "non-LTO uwtable occurrences: $(grep -c "uwtable" "$BDIAG/diag_${label}_nolto.ll" 2>/dev/null)"
          grep -E "^define|^attributes #" "$BDIAG/diag_${label}_nolto.ll" 2>/dev/null | head -40 || echo "(none)"
          echo "--- LTO bitcode IR (pre-link, TY_LTO_IR) ---"
          "$NCC" $flags -flto -S "$src" -o "$WDIAG/diag_${label}_lto.ll" 2>&1 && echo "OK" || echo "EXIT=$?"
          echo "LTO uwtable occurrences: $(grep -c "uwtable" "$BDIAG/diag_${label}_lto.ll" 2>/dev/null)"
          grep -E "^define|^attributes #" "$BDIAG/diag_${label}_lto.ll" 2>/dev/null | head -40 || echo "(none)"

          echo "=== [$label] step 6: MSVC link.exe comparison ==="
          echo "--- link with MSVC link.exe ---"
          link.exe //NOLOGO //MACHINE:ARM64 //SUBSYSTEM:CONSOLE \
            //DEFAULTLIB:libcmt //DEFAULTLIB:libvcruntime //DEFAULTLIB:libucrt \
            //DEFAULTLIB:legacy_stdio_definitions //DEFAULTLIB:oldnames \
            "$WDIAG/diag_${label}.obj" \
            "//OUT:$WDIAG/diag_${label}_msvc.exe" 2>&1 && echo "MSVC_LINK=OK" || echo "MSVC_LINK=FAIL"
          echo "--- run MSVC-linked exe ---"
          if [ -f "$BDIAG/diag_${label}_msvc.exe" ]; then
            powershell.exe -NoProfile -Command "
              try {
                \$p = Start-Process -FilePath '$WDIAG/diag_${label}_msvc.exe' \
                  -NoNewWindow -Wait -PassThru \
                  -RedirectStandardOutput '$WDIAG/diag_${label}_msvc_stdout.txt' \
                  -RedirectStandardError '$WDIAG/diag_${label}_msvc_stderr.txt'
                Write-Host \"MSVC_EXIT_CODE=\$(\$p.ExitCode)\"
              } catch {
                Write-Host \"MSVC_EXCEPTION: \$_\"
              }
            " 2>&1 || echo "MSVC_POWERSHELL_EXIT=$?"
            echo "--- MSVC stdout ---"
            cat "$BDIAG/diag_${label}_msvc_stdout.txt" 2>/dev/null || echo "(empty)"
            echo "--- compare .pdata: neverc-linked vs MSVC-linked ---"
            echo "neverc .pdata entries:"
            dumpbin //UNWINDINFO "$BDIAG/diag_${label}_nolto.exe" 2>&1 | grep -c "Begin" || echo "0"
            echo "MSVC .pdata entries:"
            dumpbin //UNWINDINFO "$BDIAG/diag_${label}_msvc.exe" 2>&1 | grep -c "Begin" || echo "0"
          else
            echo "MSVC link failed, skipping run"
          fi
        }

        diagnose "c_stdlib" \
          "$TESTDIR/standards/test_c_stdlib_patterns.c" \
          "-std=c11"

        # Minimal test: just main() { return 0; } to isolate CRT vs codegen
        echo 'int main(void) { return 0; }' > "$BDIAG/diag_minimal.c"
        diagnose "minimal" \
          "$(cygpath -m "$BDIAG/diag_minimal.c")" \
          "-std=c11"

        diagnose "mc64bit" \
          "$TESTDIR/codegen/test_mc_64bit_format.c" \
          "-std=gnu11 -O2"

        diagnose "arch_cleanup_r2" \
          "$TESTDIR/codegen/test_arch_cleanup_round2.c" \
          "-std=gnu11 -O2"

        # ── Frame pointer forced on ──
        # ARM64 longjmp always does stack unwinding.  If -mframe-pointer=none
        # causes missing/wrong .pdata entries the forced-fp build will pass.
        echo "=== frame-pointer=all comparison ==="
        diagnose "c_stdlib_fp" \
          "$TESTDIR/standards/test_c_stdlib_patterns.c" \
          "-std=c11 -mframe-pointer=all"

        # ── Pure MSVC cl.exe baseline (eliminates neverc entirely) ──
        echo "=== MSVC cl.exe full compile+link baseline ==="
        echo "cl.exe version:"
        cl.exe 2>&1 | head -1 || true
        cl.exe //nologo //W3 //EHsc //TC \
          "$TESTDIR/standards/test_c_stdlib_patterns.c" \
          "//Fe$WDIAG/diag_c_stdlib_msvc_cl.exe" \
          //link //MACHINE:ARM64 //SUBSYSTEM:CONSOLE 2>&1 \
          && echo "MSVC_CL_BUILD=OK" || echo "MSVC_CL_BUILD=FAIL"
        if [ -f "$BDIAG/diag_c_stdlib_msvc_cl.exe" ]; then
          echo "--- run pure-MSVC exe ---"
          powershell.exe -NoProfile -Command "
            try {
              \$p = Start-Process -FilePath '$WDIAG/diag_c_stdlib_msvc_cl.exe' \
                -NoNewWindow -Wait -PassThru \
                -RedirectStandardOutput '$WDIAG/diag_c_stdlib_msvc_cl_stdout.txt' \
                -RedirectStandardError '$WDIAG/diag_c_stdlib_msvc_cl_stderr.txt'
              Write-Host \"MSVC_CL_EXIT_CODE=\$(\$p.ExitCode)\"
            } catch {
              Write-Host \"MSVC_CL_EXCEPTION: \$_\"
            }
          " 2>&1 || echo "MSVC_CL_POWERSHELL_EXIT=$?"
          echo "--- MSVC cl.exe stdout ---"
          cat "$BDIAG/diag_c_stdlib_msvc_cl_stdout.txt" 2>/dev/null || echo "(empty)"
        else
          echo "MSVC cl.exe build failed, skipping run"
        fi

    - name: Fail if tests failed
      if: steps.tests.outcome == 'failure'
      shell: bash
      run: exit 1
