# Profile-guided build for Linux arm64.
# Runs the full PGO pipeline on push/PR to verify the release build compiles
# and tests pass.  No GitHub Release – artifacts only.
#
# Optimisation: profdata is cached across runs (keyed on neverc source hash).
# When the cache hits, the expensive instrumented-build + training phase is
# skipped entirely.  sccache further accelerates compilation on cache misses.
name: linux-arm64-neverc-build-pgo

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      force-rebuild-profdata:
        description: 'Force rebuild PGO profile data (ignore cache)'
        type: boolean
        default: false

jobs:
  pgo-profile:
    name: PGO generate + train
    # Native arm64 runner. Pinned to 22.04 (glibc 2.35) to match the x64
    # build's portability target.
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Resolve latest LLVM version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_VERIFY_ASSET_SUFFIX: Linux-ARM64.tar.xz
        run: bash ./.github/scripts/resolve-llvm-version.sh

      - name: Cache LLVM toolchain
        uses: actions/cache@v4
        with:
          path: /tmp/llvm-pgo
          key: llvm-${{ env.LLVM_VER }}-linux-arm64

      - name: Install PGO-optimised Clang
        run: bash ./.github/scripts/install-llvm-linux.sh

      # ── Profdata cache ────────────────────────────────────────
      - name: Restore cached PGO profile data
        if: inputs.force-rebuild-profdata != true
        id: cache-profdata
        uses: actions/cache/restore@v4
        with:
          path: pgo-profiles/merged.profdata
          key: pgo-profdata-linux-arm64-${{ hashFiles('neverc/lib/**', 'neverc/include/**') }}
          restore-keys: |
            pgo-profdata-linux-arm64-

      - name: Check for usable profdata
        id: check-profdata
        run: |
          if [ -f pgo-profiles/merged.profdata ]; then
            echo "has_profdata=true" >> "$GITHUB_OUTPUT"
            ls -lh pgo-profiles/merged.profdata
            echo "Reusing cached PGO profile data — skipping instrumented build + training"
          else
            echo "has_profdata=false" >> "$GITHUB_OUTPUT"
            echo "No cached profile data — full instrumented build + training required"
          fi

      # ── sccache (only when we actually need to compile) ──────
      - name: Setup sccache
        if: steps.check-profdata.outputs.has_profdata != 'true'
        uses: mozilla/sccache-action@v0.0.7

      # ── Phase 1: instrumented build (skipped on cache hit) ───
      - name: Build instrumented neverc
        if: steps.check-profdata.outputs.has_profdata != 'true'
        run: ./tools/build_pgo.sh generate

      # ── Phase 1b: training (skipped on cache hit) ────────────
      - name: Download PGO training workloads
        if: steps.check-profdata.outputs.has_profdata != 'true'
        run: |
          set -euo pipefail

          SQLITE_VER=3460100
          SQLITE_YEAR=2024
          mkdir -p ci-pgo-workloads/sqlite
          curl -fsSL \
            "https://www.sqlite.org/${SQLITE_YEAR}/sqlite-amalgamation-${SQLITE_VER}.zip" \
            -o /tmp/sqlite-amalgamation.zip
          unzip -j /tmp/sqlite-amalgamation.zip \
            "sqlite-amalgamation-${SQLITE_VER}/sqlite3.c" \
            -d ci-pgo-workloads/sqlite

          REDIS_VER=7.2.5
          curl -fsSL \
            "https://github.com/redis/redis/archive/refs/tags/${REDIS_VER}.tar.gz" \
            -o /tmp/redis.tar.gz
          mkdir -p ci-pgo-workloads/redis
          tar xzf /tmp/redis.tar.gz -C ci-pgo-workloads/redis --strip-components=1

          ZLIB_VER=1.3.1
          curl -fsSL \
            "https://github.com/madler/zlib/releases/download/v${ZLIB_VER}/zlib-${ZLIB_VER}.tar.gz" \
            -o /tmp/zlib.tar.gz
          mkdir -p ci-pgo-workloads/zlib
          tar xzf /tmp/zlib.tar.gz -C ci-pgo-workloads/zlib --strip-components=1

          CURL_VER=8.7.1
          curl -fsSL \
            "https://github.com/curl/curl/releases/download/curl-$(echo $CURL_VER | tr '.' '_')/curl-${CURL_VER}.tar.gz" \
            -o /tmp/curl.tar.gz
          mkdir -p ci-pgo-workloads/curl
          tar xzf /tmp/curl.tar.gz -C ci-pgo-workloads/curl --strip-components=1

      - name: Collect PGO profiles
        if: steps.check-profdata.outputs.has_profdata != 'true'
        run: |
          set -euo pipefail
          NC="${GITHUB_WORKSPACE}/build-pgo-gen/bin/neverc"
          PROFILE_DIR="${GITHUB_WORKSPACE}/pgo-profiles"
          LLVM_PROFDATA="/tmp/llvm-pgo/bin/llvm-profdata"

          SQLITE="${GITHUB_WORKSPACE}/ci-pgo-workloads/sqlite/sqlite3.c"
          REDIS_SRC="${GITHUB_WORKSPACE}/ci-pgo-workloads/redis/src"
          ZLIB_SRC="${GITHUB_WORKSPACE}/ci-pgo-workloads/zlib"
          CURL_SRC="${GITHUB_WORKSPACE}/ci-pgo-workloads/curl"

          rm -rf "$PROFILE_DIR"
          mkdir -p "$PROFILE_DIR"

          train() {
            local profraw="$1"
            shift
            LLVM_PROFILE_FILE="$profraw" "$NC" "$@" 2>/dev/null || true
          }

          echo "Training on SQLite..."
          train "$PROFILE_DIR/sqlite_preproc.profraw" -E -w -fno-neverc-types -o /dev/null "$SQLITE"
          train "$PROFILE_DIR/sqlite_sema.profraw" -fsyntax-only -w -fno-neverc-types "$SQLITE"
          train "$PROFILE_DIR/sqlite_irgen.profraw" -emit-llvm -S -w -fno-neverc-types -o /dev/null "$SQLITE"
          for opt in O0 O2 O3; do
            train "$PROFILE_DIR/sqlite_${opt}.profraw" -c "-${opt}" -w -fno-neverc-types -o /dev/null "$SQLITE"
          done

          if [ -d "$REDIS_SRC" ]; then
            echo "Training on Redis..."
            for f in "$REDIS_SRC"/*.c; do
              train "$PROFILE_DIR/redis_$(basename "$f" .c).profraw" -c -O2 -w -fno-neverc-types -o /dev/null "$f"
            done
          fi

          if [ -d "$ZLIB_SRC" ]; then
            echo "Training on zlib..."
            for f in "$ZLIB_SRC"/*.c; do
              train "$PROFILE_DIR/zlib_$(basename "$f" .c).profraw" -c -O2 -w -fno-neverc-types -o /dev/null "$f"
            done
          fi

          if [ -d "$CURL_SRC/lib" ]; then
            echo "Training on curl..."
            for f in "$CURL_SRC"/lib/*.c; do
              train "$PROFILE_DIR/curl_$(basename "$f" .c).profraw" \
                -c -O2 -w -fno-neverc-types \
                -I"$CURL_SRC/include" -I"$CURL_SRC/lib" -DBUILDING_LIBCURL \
                -o /dev/null "$f"
            done
          fi

          echo "Training on in-repo tests..."
          while IFS= read -r -d '' f; do
            tag=$(echo "$f" | tr '/' '_')
            train "$PROFILE_DIR/test_${tag}.profraw" -c -O2 -w -fno-neverc-types -o /dev/null "$f"
          done < <(find tests -name '*.c' -print0)

          profraw_count=$(find "$PROFILE_DIR" -maxdepth 1 -name '*.profraw' | wc -l | tr -d ' ')
          echo "Merging $profraw_count profiles..."
          bash "${GITHUB_WORKSPACE}/tools/merge_pgo_profiles.sh" \
            --llvm-profdata "$LLVM_PROFDATA" \
            --profile-dir "$PROFILE_DIR" \
            --output "${PROFILE_DIR}/merged.profdata"

      # ── Save profdata to cache for future runs ───────────────
      - name: Save PGO profile cache
        if: steps.check-profdata.outputs.has_profdata != 'true'
        uses: actions/cache/save@v4
        with:
          path: pgo-profiles/merged.profdata
          key: pgo-profdata-linux-arm64-${{ hashFiles('neverc/lib/**', 'neverc/include/**') }}

      - name: Upload profile data
        uses: actions/upload-artifact@v4
        with:
          name: neverc-pgo-profdata-linux-arm64
          path: pgo-profiles/merged.profdata
          retention-days: 7

  pgo-build:
    name: PGO use + test
    needs: pgo-profile
    # Native arm64 runner. Pinned to 22.04 (glibc 2.35) to match the x64
    # build's portability target.
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake p7zip-full gdb elfutils

      - name: Resolve latest LLVM version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_VERIFY_ASSET_SUFFIX: Linux-ARM64.tar.xz
        run: bash ./.github/scripts/resolve-llvm-version.sh

      - name: Cache LLVM toolchain
        uses: actions/cache@v4
        with:
          path: /tmp/llvm-pgo
          key: llvm-${{ env.LLVM_VER }}-linux-arm64

      - name: Install PGO-optimised Clang
        run: bash ./.github/scripts/install-llvm-linux.sh

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.7

      - name: Download profile data
        uses: actions/download-artifact@v4
        with:
          name: neverc-pgo-profdata-linux-arm64
          path: pgo-profiles

      - name: Build PGO-optimised neverc
        run: ./tools/build_pgo.sh use

      - name: Install neverc
        run: cmake --install build-pgo-use --prefix "${GITHUB_WORKSPACE}/install"

      - name: Package neverc
        run: 7z a linux-arm64-neverc-pgo.zip install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-neverc-pgo
          path: linux-arm64-neverc-pgo.zip

      - name: Package neverc compiler (without runtime)
        run: |
          mv install/runtime install-runtime-stash
          7z a linux-arm64-neverc-pgo-compiler.zip install
          mv install-runtime-stash install/runtime

      - name: Upload Compiler Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-neverc-pgo-compiler
          path: linux-arm64-neverc-pgo-compiler.zip

      - name: Package neverc runtime
        run: 7z a linux-arm64-neverc-pgo-runtime.zip install/runtime

      - name: Upload Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-neverc-pgo-runtime
          path: linux-arm64-neverc-pgo-runtime.zip

      - name: Build Plugin SDK
        run: cmake --build build-pgo-use --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        run: |
          set -e
          make -C build-pgo-use/pluginsdk/examples \
            NEVERC=$PWD/build-pgo-use/bin/neverc \
            INCLUDE_DIR=$PWD/build-pgo-use/pluginsdk/include \
            HOST_TARGET=aarch64-unknown-linux-gnu
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build-pgo-use/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build-pgo-use/pluginsdk/examples/${plugin}.so \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Run neverc tests
        id: tests
        continue-on-error: true
        run: |
          cmake -B build-pgo-use -DNEVERC_INCLUDE_TESTS=ON
          cmake --build build-pgo-use --target check-neverc

      - name: Diagnose crashes
        if: steps.tests.outcome == 'failure'
        run: |
          set -x
          NCC=$PWD/build-pgo-use/bin/neverc
          TESTDIR=$PWD/tests/neverc

          # Enable core dumps
          ulimit -c unlimited
          echo "$PWD/cores/core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern
          mkdir -p cores

          diagnose() {
            local label=$1 src=$2 flags=$3
            echo "=== [$label] step 1: compile to .o ==="
            $NCC $flags -c "$src" -o /tmp/diag_${label}.o 2>&1 && echo "OK" || echo "EXIT=$?"

            echo "=== [$label] step 2: link .o to exe ==="
            $NCC $flags /tmp/diag_${label}.o -o /tmp/diag_${label} 2>&1 && echo "OK" || echo "EXIT=$?"

            echo "=== [$label] step 3: compile+link (one shot) ==="
            $NCC $flags "$src" -o /tmp/diag_${label}_oneshot 2>&1 && echo "OK" || echo "EXIT=$?"

            nm -n --defined-only -C $NCC 2>/dev/null | awk 'NF>=3{print $1,$3}' > /tmp/nm_syms.txt
            echo "Symbol table: $(wc -l < /tmp/nm_syms.txt) symbols"

            for core in cores/core.*; do
              [ -f "$core" ] || continue

              echo "=== eu-stack backtrace from $core ==="
              eu-stack -e $NCC --core="$core" 2>&1 | head -40

              echo "=== GDB full backtrace from $core ==="
              gdb -batch -ex "bt full 30" -ex "info registers" $NCC "$core" 2>&1 | head -60

              PC=$(gdb -batch -ex "print/x \$pc" $NCC "$core" 2>&1 | grep -oP '0x[0-9a-f]+' | tail -1)

              LOAD_BASE=$(readelf -l "$core" 2>/dev/null | awk '/LOAD/{print $3; exit}')
              echo "PC=$PC LOAD_BASE=$LOAD_BASE"

              if [ -n "$PC" ] && [ -n "$LOAD_BASE" ]; then
                FILE_OFF=$(printf "0x%x" $(($PC - $LOAD_BASE)))
                echo "File offset: $FILE_OFF"

                echo "=== symbolized stack ==="
                eu-stack -e $NCC --core="$core" 2>&1 | grep '^ *#' | head -22 | while read line; do
                  ADDR=$(echo "$line" | grep -oP '0x[0-9a-f]+')
                  if [ -n "$ADDR" ]; then
                    OFF=$(printf "%x" $(($ADDR - $LOAD_BASE)))
                    FUNC=$(awk -v off="$OFF" 'BEGIN{target=strtonum("0x"off)} {a=strtonum("0x"$1); if(a<=target){name=$2;fa=a}} END{if(name)printf "%s+0x%x",name,target-fa; else print "??"}' /tmp/nm_syms.txt)
                    echo "$line  =>  $FUNC"
                  fi
                done
              fi
              rm -f "$core"
            done
          }

          diagnose "string_qstring" \
            "$TESTDIR/string/test_neverc_string_qstring_parity.c" \
            "-std=c23 -fbuiltin-string"

          diagnose "string_qstring_g" \
            "$TESTDIR/string/test_neverc_string_qstring_parity.c" \
            "-std=c23 -fbuiltin-string -g"

          diagnose "string_qstring_g_nopcg" \
            "$TESTDIR/string/test_neverc_string_qstring_parity.c" \
            "-std=c23 -fbuiltin-string -g -fno-parallel-codegen"

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
