name: debug-macho-icf-wide-referent

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-macho-icf-wide-red-*"
      - "debug-macho-icf-wide-green-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
      RED_SHA: 591e4513eaeefd8eac3f720bc029dbded5f9b4da
      GREEN_SHA: 17d3101161af3658adbf0263cf9248d6d286a0cb
      TEST_FILTER: PluginMachOLinkAdapterTest.IcfDistinguishesReferentOffsetsBeyondHashWidth
    steps:
      - name: Select exact source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            debug-macho-icf-wide-red-*) source_sha="$RED_SHA" ;;
            debug-macho-icf-wide-green-*) source_sha="$GREEN_SHA" ;;
            *) echo "unexpected diagnostic tag: $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: neverc

      - name: Verify source contract
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C neverc rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C neverc branch --show-current)" = ""
          grep -Fq 'IcfDistinguishesReferentOffsetsBeyondHashWidth' \
            neverc/tests/neverc/PluginMachOLinkAdapterTests.cpp
          grep -Fq '.zerofill __DATA,__bss,_near_data,0x100000000,3' \
            neverc/tests/neverc/PluginMachOLinkAdapterTests.cpp
          if [[ "$GITHUB_REF_NAME" == debug-macho-icf-wide-red-* ]]; then
            grep -Fq 'return ra.addend == rb.addend;' \
              neverc/neverc/lib/Linker/Backends/MachO/Transforms/ICF.cpp
          else
            grep -Fq 'return valueA + ra.addend == valueB + rb.addend;' \
              neverc/neverc/lib/Linker/Backends/MachO/Transforms/ICF.cpp
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-$LLVM_APT_VER" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_APT_VER" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Configure ASan and UBSan build
        shell: bash
        run: |
          set -euo pipefail
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=OFF \
            -DLLVM_USE_SANITIZER="Address;Undefined" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_LTO=OFF \
            -DNEVERC_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERC_BUNDLE_PYTHON_RUNTIME=OFF \
            -DNEVERC_NATIVE_ARCH=OFF \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build focused test binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config "$BUILD_TYPE" --target neverc-tests

      - name: Run Mach-O ICF contract
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          build/bin/neverc-tests \
            --gtest_color=no \
            --gtest_filter="$TEST_FILTER"
