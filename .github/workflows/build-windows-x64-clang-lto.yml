# Clang + LTO build for Windows x86_64.
# Manual dispatch only.  Verifies the Clang-based release pipeline compiles
# and tests pass.  Uses a PGO-optimised Clang from the official LLVM releases.
name: windows-x64-neverc-build-clang-lto

permissions:
  contents: write

on: [push, pull_request]

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  build:
    name: Clang + LTO build
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CPython 3.12.10 for official artifacts
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Setup build deps
        shell: pwsh
        run: |
          choco install ninja 7zip -y

          # Pin CMake to the version the arm64 runner uses. CMake 4.4's
          # gtest_discover_tests only appends to the generated CTest file, where
          # 3.31 truncated it first, so any target whose POST_BUILD discovery
          # runs twice registers its tests twice and the suite inventory stops
          # being reproducible across runs.
          $cmakeVer = '3.31.11'
          Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip" -OutFile cmake.zip
          Expand-Archive cmake.zip C:\tools -Force
          Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-x86_64\bin"

      - name: Resolve latest LLVM version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_VERIFY_ASSET_SUFFIX: win64.exe
        run: bash ./.github/scripts/resolve-llvm-version.sh

      - name: Cache LLVM toolchain
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: llvm-${{ env.LLVM_VER }}-win64

      - name: Install PGO-optimised Clang
        shell: pwsh
        run: ./.github/scripts/install-llvm-windows.ps1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # ── sccache ──────────────────────────────────────────────
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.7

      - name: Verify sccache
        shell: bash
        run: |
          echo "sccache location: $(which sccache || echo 'NOT FOUND')"
          sccache --version || true

      # ── Build ────────────────────────────────────────────────
      - name: Build neverc (Clang + LTO)
        shell: bash
        run: |
          cmake -S llvm -B build -G Ninja \
            -C neverc/cmake/caches/NeverC.cmake \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -flto=thin -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,//debug"
          cmake --build build --target neverc-embed-runtime-bitcode --parallel $NUMBER_OF_PROCESSORS

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Build bundled Windows runtime
        shell: bash
        run: cmake --build build --target neverc-runtime-x64-msvc neverc-runtime-shared-msvc

      # ── Package + upload ─────────────────────────────────────
      - name: Install neverc
        shell: bash
        run: |
          cmake --build build --target install

      - name: Package neverc
        run: 7z a windows-x64-neverc-clang-lto.zip install

      - name: Verify relocated full compiler archive
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" \
            utils/release/test-python-plugin-package.py \
            --archive windows-x64-neverc-clang-lto.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-neverc-clang-lto
          path: windows-x64-neverc-clang-lto.zip

      - name: Package neverc compiler (without runtime)
        shell: bash
        run: |
          mv install/runtime install-runtime-stash
          7z a windows-x64-neverc-clang-lto-compiler.zip install
          mv install-runtime-stash install/runtime

      - name: Verify relocated compiler-only archive
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" \
            utils/release/test-python-plugin-package.py \
            --archive windows-x64-neverc-clang-lto-compiler.zip

      - name: Upload Compiler Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-neverc-clang-lto-compiler
          path: windows-x64-neverc-clang-lto-compiler.zip

      - name: Package neverc runtime
        run: 7z a windows-x64-neverc-clang-lto-runtime.zip install/runtime

      - name: Upload Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-neverc-clang-lto-runtime
          path: windows-x64-neverc-clang-lto-runtime.zip

      - name: Package PDBs
        shell: bash
        run: 7z a windows-x64-neverc-clang-lto-pdb.zip ./build/bin/*.pdb 2>/dev/null || echo "No PDB files found (expected with Clang)"

      - name: Upload PDB Artifact
        if: hashFiles('windows-x64-neverc-clang-lto-pdb.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-neverc-clang-lto-pdb
          path: windows-x64-neverc-clang-lto-pdb.zip

      # ── Plugin SDK ───────────────────────────────────────────
      - name: Build Plugin SDK
        shell: bash
        run: cmake --build build --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        shell: bash
        run: |
          set -e
          make -C build/pluginsdk/examples \
            NEVERC=$PWD/build/bin/neverc \
            INCLUDE_DIR=$PWD/build/pluginsdk/include
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.dll \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      # ── Tests + diagnostics ──────────────────────────────────
      - name: Run neverc tests
        id: tests
        shell: bash
        continue-on-error: true
        run: cmake --build build --target check-neverc

      - name: Diagnose crashes
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          set -x
          NCC=$(cygpath -m "$PWD/build/bin/neverc.exe")
          TESTDIR=$(cygpath -m "$PWD/tests/neverc")
          WDIAG=$(cygpath -m "$PWD/diag_out")
          BDIAG="$PWD/diag_out"
          mkdir -p "$BDIAG"

          echo "=== MSVC / SDK environment ==="
          echo "LIB=$LIB"
          echo "INCLUDE=$INCLUDE"
          echo "VCToolsInstallDir=$VCToolsInstallDir"
          echo "WindowsSdkDir=$WindowsSdkDir"
          echo "WindowsSDKVersion=$WindowsSDKVersion"
          echo "VSCMD_ARG_TGT_ARCH=$VSCMD_ARG_TGT_ARCH"
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"

          echo "=== Check CRT & SDK libs exist ==="
          for lib in libcmt.lib libvcruntime.lib libucrt.lib kernel32.lib bcryptprimitives.lib; do
            found=false
            IFS=';' read -ra LIBDIRS <<< "$LIB"
            for dir in "${LIBDIRS[@]}"; do
              wdir=$(cygpath -u "$dir" 2>/dev/null || echo "$dir")
              if [ -f "$wdir/$lib" ]; then
                echo "  FOUND: $dir/$lib ($(wc -c < "$wdir/$lib") bytes)"
                found=true
                break
              fi
            done
            $found || echo "  MISSING: $lib"
          done

          echo "=== Linker search paths (neverc -v) ==="
          "$NCC" -std=c11 -v "$TESTDIR/standards/test_c_stdlib_patterns.c" \
            -o "$WDIAG/diag_verbose.exe" 2>&1 | head -80 || true

          diagnose() {
            local label=$1 src=$2 flags=$3
            echo "=== [$label] step 1: compile to .obj ==="
            "$NCC" $flags -c "$src" -o "$WDIAG/diag_${label}.obj" 2>&1 && echo "OK" || echo "EXIT=$?"

            echo "=== [$label] step 2: link .obj to exe ==="
            "$NCC" $flags "$WDIAG/diag_${label}.obj" -o "$WDIAG/diag_${label}.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

            echo "=== [$label] step 3: compile+link (one shot) ==="
            "$NCC" $flags "$src" -o "$WDIAG/diag_${label}_oneshot.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

            echo "=== [$label] check output files ==="
            ls -la "$BDIAG"/diag_${label}* 2>&1 || echo "NO FILES FOUND"
            file "$BDIAG"/diag_${label}_oneshot.exe 2>&1 || true

            echo "=== [$label] DLL dependencies ==="
            dumpbin //DEPENDENTS "$BDIAG/diag_${label}_oneshot.exe" 2>&1 || true

            echo "=== [$label] IMPORTS (function names) ==="
            dumpbin //IMPORTS "$BDIAG/diag_${label}_oneshot.exe" 2>&1 || true

            echo "=== [$label] PE headers ==="
            dumpbin //HEADERS "$BDIAG/diag_${label}_oneshot.exe" 2>&1 | head -60 || true

            echo "=== [$label] step 4: run exe (powershell with detailed error) ==="
            powershell.exe -NoProfile -Command "
              try {
                \$p = Start-Process -FilePath '$WDIAG/diag_${label}_oneshot.exe' \
                  -NoNewWindow -Wait -PassThru \
                  -RedirectStandardOutput '$WDIAG/diag_${label}_stdout.txt' \
                  -RedirectStandardError '$WDIAG/diag_${label}_stderr.txt'
                Write-Host \"EXIT_CODE=\$(\$p.ExitCode)\"
              } catch {
                Write-Host \"EXCEPTION: \$_\"
                Write-Host \"WIN32_ERROR: \$([System.Runtime.InteropServices.Marshal]::GetLastWin32Error())\"
              }
            " 2>&1 || echo "POWERSHELL_EXIT=$?"
            echo "--- stdout ---"
            cat "$BDIAG/diag_${label}_stdout.txt" 2>/dev/null || echo "(empty)"
            echo "--- stderr ---"
            cat "$BDIAG/diag_${label}_stderr.txt" 2>/dev/null || echo "(empty)"

            echo "=== [$label] step 4b: run exe (direct) ==="
            "$BDIAG/diag_${label}_oneshot.exe" 2>&1 && echo "RUN OK" || echo "RUN EXIT=$?"
          }

          diagnose "c_stdlib" \
            "$TESTDIR/standards/test_c_stdlib_patterns.c" \
            "-std=c11"

          echo 'int main(void) { return 0; }' > "$BDIAG/diag_minimal.c"
          diagnose "minimal" \
            "$(cygpath -m "$BDIAG/diag_minimal.c")" \
            "-std=c11"

      # The child neverc.exe link job fast-fails with 0xC0000409 (__fastfail),
      # which bypasses LLVM's crash handler -- the test only sees the exit code,
      # never a stack.  Capture a full user-mode dump via WER LocalDumps and pull
      # out the __fastfail *reason code* (exception parameter[0]); that number
      # alone classifies the failure even without neverc PDBs: 2 = /GS stack
      # cookie / buffer overrun, 3 = corrupt LIST_ENTRY, 0x1a = heap metadata
      # corruption, 5 = invalid argument, etc.  Microsoft's symbol server then
      # names the system caller frame (__report_gsfailure vs RtlReportFatalFailure
      # vs RtlpHeapHandleError) so we know stack-overrun vs heap corruption.
      - name: Capture fast-fail crash dump (root-cause #135/#137)
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $wer -Force | Out-Null
          New-ItemProperty -Path $wer -Name DumpFolder -Value 'C:\crashdumps' -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $wer -Name DumpCount  -Value 30 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $wer -Name DumpType   -Value 2  -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory -Force -Path 'C:\crashdumps' | Out-Null

          Write-Host '=== re-running the two crashing tests to provoke a dump ==='
          & ctest --test-dir build/neverc/tests -R 'AutoLtoLoopDenseNoCompileCliff|AutoLtoInlineCapSemanticsPreserved' --output-on-failure
          Write-Host "ctest exit: $LASTEXITCODE"

          $dumps = Get-ChildItem 'C:\crashdumps' -Filter *.dmp -ErrorAction SilentlyContinue
          Write-Host "=== dumps captured: $($dumps.Count) ==="
          $dumps | Format-Table Name,Length | Out-String | Write-Host

          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          }
          Write-Host "cdb: $($cdb.FullName)"
          # neverc.pdb (public symbols, emitted by the link-only /debug flag --
          # no codegen change) sits next to build\bin\neverc.exe; add it plus the
          # MS symbol server so cdb names both neverc and system caller frames.
          $bin = (Resolve-Path 'build/bin').Path
          $env:_NT_SYMBOL_PATH = "$bin;srv*C:\symcache*https://msdl.microsoft.com/download/symbols"
          Write-Host "neverc.pdb present: $([bool](Test-Path "$bin\neverc.pdb"))"

          if ($cdb -and $dumps) {
            foreach ($d in $dumps) {
              Write-Host "================= $($d.Name) ================="
              & $cdb.FullName -z $d.FullName -y "$env:_NT_SYMBOL_PATH" `
                -c '.reload /f; .exr -1; .ecxr; !analyze -v; kP 120; ~*kb 60; lmvm neverc; q'
            }
          } else {
            Write-Host 'cdb or dumps unavailable; raw dumps uploaded as artifact below'
          }

      - name: Upload crash dumps
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: x64-clang-lto-crashdumps
          path: C:\crashdumps
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: exit 1
