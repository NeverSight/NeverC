name: debug-frontend-crash-lsan-red

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-frontend-crash-lsan-red-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc

      - name: Setup build dependencies
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-${LLVM_APT_VER}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${LLVM_APT_VER}" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Configure ASan and UBSan
        run: |
          cmake -GNinja -Bbuild \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
            -DLLVM_USE_SANITIZER="Address;Undefined" \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -C neverc/neverc/cmake/caches/NeverC.cmake \
            neverc/llvm

      - name: Build focused test binary
        run: |
          cmake --build build --config "${{ env.BUILD_TYPE }}" --target \
            neverc-plugin-frontend-tests

      - name: Reproduce mutable cleanup-list failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/neverc/.github/plugin-sanitizers.lsan
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          build/bin/neverc-plugin-frontend-tests \
            --gtest_filter='PluginFrontendTimeTraceInteropTest.FiredCleanupRemainsObservableUntilRegistrarOwnerIsDestroyed:PluginFrontendTimeTraceInteropTest.RecoveryRereadsHeadAfterCleanupUnregistersItsSuccessor' \
            --gtest_color=no
