name: debug-eh-frame-zero-range

permissions:
  contents: read

on:
  push:
    tags:
      - "debug-eh-frame-zero-range-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      BUILD_TYPE: RelWithDebInfo
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout diagnostic tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc
          fetch-depth: 0

      - name: Verify exact test-only tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C neverc branch --show-current)" = ""
          test "$(git -C neverc rev-parse 718b7b37b160494bc51158accc3ee444dfe37534^)" = "d17684892e3616764cca0a1123a4c3752b31498b"
          git -C neverc merge-base --is-ancestor \
            718b7b37b160494bc51158accc3ee444dfe37534 HEAD
          git -C neverc diff --exit-code
          git -C neverc diff --cached --exit-code
          printf '%s\n' '.github/workflows/debug-eh-frame-zero-range.yml' |
            sort -u > expected-files.txt
          git -C neverc diff-tree --no-commit-id --name-only -r HEAD^ HEAD |
            sort -u > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          printf '%s\n' 'tests/neverc/LinkerTests.cpp' |
            sort -u > expected-test-files.txt
          git -C neverc diff-tree --no-commit-id --name-only -r \
            718b7b37b160494bc51158accc3ee444dfe37534^ \
            718b7b37b160494bc51158accc3ee444dfe37534 |
            sort -u > actual-test-files.txt
          diff -u expected-test-files.txt actual-test-files.txt
          printf '%s\n' '.github/workflows/debug-eh-frame-zero-range.yml' \
            'tests/neverc/LinkerTests.cpp' |
            sort -u > expected-range-files.txt
          git -C neverc diff --name-only \
            f782a6ff7716912223e2df6cc2d6552c814b9747..HEAD |
            sort -u > actual-range-files.txt
          diff -u expected-range-files.txt actual-range-files.txt
          if git -C neverc cat-file -e \
              f782a6ff7716912223e2df6cc2d6552c814b9747:.github/workflows/debug-eh-frame-zero-range.yml 2>/dev/null
          then
            echo "temporary workflow unexpectedly exists in the parent" >&2
            exit 1
          fi

      - name: Setup sccache
        uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      - name: Setup build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          echo "CC=clang-$LLVM_APT_VER" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_APT_VER" >> "$GITHUB_ENV"

      - name: Configure focused ASan and UBSan build
        shell: bash
        run: |
          set -euo pipefail
          cmake_args=(
            -GNinja
            -Bbuild
            "-DCMAKE_C_COMPILER=$CC"
            "-DCMAKE_CXX_COMPILER=$CXX"
            -DLLVM_ENABLE_ASSERTIONS=ON
            -DLLVM_TOOL_LLVM_SHLIB_BUILD=off
            "-DLLVM_USE_SANITIZER=Address;Undefined"
            -DNEVERC_INCLUDE_TESTS=ON
            "-DCMAKE_BUILD_TYPE=$BUILD_TYPE"
            -C
            neverc/neverc/cmake/caches/NeverC.cmake
            neverc/llvm
          )
          cmake "${cmake_args[@]}"

      - name: Build focused linker contract
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config "$BUILD_TYPE" \
            --target neverc-tests --parallel 2

      - name: Run zero-range FDE header contract
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          build/bin/neverc-tests \
            --gtest_filter=LinkerTest.EhFrameHeaderOmitsZeroRangeFDEs \
            --gtest_color=no
