name: cpp-template-source-diagnostics
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}
jobs:
  inspect-source-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install Clang 20 development libraries for the diagnostic probe
      run: 'curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"

        sudo bash "$RUNNER_TEMP/llvm.sh" 20

        sudo apt-get install -y libclang-20-dev libclang-cpp20-dev llvm-20-dev

        clang++-20 --version

        '
    - name: Build the upstream diagnostic probe
      id: build_probe
      run: "clang++-20 -std=c++17 \\\n  -I/usr/lib/llvm-20/include \\\n  utils/translate-frontends/cpp/diagnostics/template-source.cpp\
        \ \\\n  -L/usr/lib/llvm-20/lib -lclang-cpp -lLLVM-20 \\\n  -o \"$RUNNER_TEMP/template-source\"\n"
    - name: Inspect template qualifiers, friend bodies and callback initializers
      run: "status=0\n# Separate processes retain evidence for every fixture after a crash.\nfor fixture in nested-method\
        \ nested-static nested-pack \\\n  own-member-friend-function own-member-friend-type \\\n  visible-copied-friend\
        \ visible-copied-friend-context \\\n  callback-array-field qualified-friend-class \\\n  static-temporary-values\
        \ static-reference-fillers \\\n  static-reference-single-filler automatic-reference-fillers \\\n  aggregate-member-cleanup\
        \ static-forward-reference-copy \\\n  static-prior-reference-copy static-constexpr-reference-copy \\\n \
        \ runtime-array-initializers native-heap-declarations \\\n  native-heap-definitions global-allocation-attributes;\
        \ do\n  if \"$RUNNER_TEMP/template-source\" \"$fixture\"; then\n    result=0\n  else\n    result=$?\n  fi\n\
        \  expected=0\n  case \"$fixture\" in\n    own-member-friend-function|own-member-friend-type) expected=139\
        \ ;;\n    visible-copied-friend) expected=1 ;;\n  esac\n  echo \"$fixture: result $result, expected $expected\"\
        \n  if [ \"$result\" -ne \"$expected\" ]; then\n    status=1\n  fi\ndone\nexit \"$status\"\n"
    - name: Inspect operation query and materialized specialization identities
      if: ${{ !cancelled() && steps.build_probe.outcome == 'success' }}
      run: "\"$RUNNER_TEMP/template-source\" --source-file \\\n  tests/neverc/Inputs/translate/cpp/defined-operation-traits.cpp\n"
    - name: Inspect unary transform input and substituted source identities
      if: ${{ !cancelled() && steps.build_probe.outcome == 'success' }}
      run: "\"$RUNNER_TEMP/template-source\" --source-file \\\n  tests/neverc/Inputs/translate/cpp/unary-type-transforms.cpp\n"
    - name: Record upstream array-filler runtime identity and cleanup
      if: ${{ !cancelled() && steps.build_probe.outcome == 'success' }}
      run: "for fixture in static-reference-fillers static-reference-single-filler \\\n  automatic-reference-fillers\
        \ aggregate-member-cleanup; do\n  \"$RUNNER_TEMP/template-source\" \"$fixture\" --source-only > \"$RUNNER_TEMP/$fixture.cpp\"\
        \n  for optimization in 0 2; do\n    clang++-20 -std=c++17 -O\"$optimization\" \"$RUNNER_TEMP/$fixture.cpp\"\
        \ -o \"$RUNNER_TEMP/$fixture\"\n    if \"$RUNNER_TEMP/$fixture\"; then\n      result=0\n    else\n     \
        \ result=$?\n    fi\n    echo \"$fixture O$optimization upstream result: $result\"\n    # This is a diagnostic\
        \ baseline, not the translated-program oracle.\n    # 1 means shared/missing/early-destroyed temporaries;\
        \ 2 means a\n    # wrong owner address or temporaries surviving the full-expression.\n    if [ \"$fixture\"\
        \ = static-reference-single-filler ] && \\\n       [ \"$optimization\" -eq 2 ]; then\n      if [ \"$result\"\
        \ -ne 139 ]; then\n        exit 1\n      fi\n    elif [ \"$result\" -gt 2 ]; then\n      exit 1\n    fi\n\
        \  done\ndone\n"
    - name: Check upstream constant array allocation and cleanup baseline
      if: ${{ !cancelled() && steps.build_probe.outcome == 'success' }}
      run: "clang-20 -std=c17 -c tests/neverc/Inputs/translate/cpp/array-allocation-harness.c -o \"$RUNNER_TEMP/array-client.o\"\
        \nstatus=0\nfor optimization in 0 2; do\n  clang++-20 -std=c++17 -O\"$optimization\" -fstrict-aliasing \\\
        \n    tests/neverc/Inputs/translate/cpp/array-allocation.cpp \\\n    \"$RUNNER_TEMP/array-client.o\" -o\
        \ \"$RUNNER_TEMP/array-allocation\"\n  if \"$RUNNER_TEMP/array-allocation\"; then\n    result=0\n  else\n\
        \    result=$?\n  fi\n  if [ \"$optimization\" -eq 0 ]; then expected=22; else expected=5; fi\n  echo \"\
        array-allocation O$optimization upstream result: $result, expected $expected\"\n  if [ \"$result\" -ne \"\
        $expected\" ]; then\n    status=1\n  fi\ndone\nexit \"$status\"\n"
    - name: Check upstream source fixtures with matching runtime behavior
      if: ${{ !cancelled() && steps.build_probe.outcome == 'success' }}
      run: "status=0\nfor fixture in nullptr-template-values builtin-type-classification \\\n  scalar-operation-traits\
        \ trivial-record-operation-traits \\\n  defined-operation-traits unary-type-transforms \\\n  bare-function-metadata\
        \ empty-base-chains; do\n  for optimization in 0 2; do\n    if clang++-20 -std=c++17 -O\"$optimization\"\
        \ -fstrict-aliasing \\\n      \"tests/neverc/Inputs/translate/cpp/$fixture.cpp\" -o \"$RUNNER_TEMP/$fixture\"\
        ; then\n      if \"$RUNNER_TEMP/$fixture\"; then\n        result=0\n      else\n        result=$?\n    \
        \  fi\n      echo \"$fixture O$optimization upstream result: $result\"\n      if [ \"$result\" -ne 0 ];\
        \ then\n        status=1\n      fi\n    else\n      status=1\n    fi\n  done\ndone\nexit \"$status\"\n"
    - name: Check known upstream array-query and aggregate divergences
      if: ${{ !cancelled() && steps.build_probe.outcome == 'success' }}
      run: "status=0\nfor optimization in 0 2; do\n  log=\"$RUNNER_TEMP/array-type-queries-O$optimization.log\"\n\
        \  if clang++-20 -std=c++17 -O\"$optimization\" -fstrict-aliasing \\\n    tests/neverc/Inputs/translate/cpp/array-type-queries.cpp\
        \ \\\n    -o \"$RUNNER_TEMP/array-type-queries\" >\"$log\" 2>&1; then\n    echo \"array-type-queries O$optimization\
        \ unexpectedly compiled\"\n    status=1\n  else\n    result=$?\n    cat \"$log\"\n    echo \"array-type-queries\
        \ O$optimization upstream compile result: $result\"\n    if ! grep -q \"dimension expression does not evaluate\
        \ to a constant unsigned int\" \"$log\"; then\n      status=1\n    fi\n  fi\n\n  clang++-20 -std=c++17 -O\"\
        $optimization\" -fstrict-aliasing \\\n    tests/neverc/Inputs/translate/cpp/runtime-aggregate-array.cpp\
        \ \\\n    -o \"$RUNNER_TEMP/runtime-aggregate-array\"\n  if \"$RUNNER_TEMP/runtime-aggregate-array\"; then\n\
        \    result=0\n  else\n    result=$?\n  fi\n  echo \"runtime-aggregate-array O$optimization upstream result:\
        \ $result, expected 10\"\n  if [ \"$result\" -ne 10 ]; then\n    status=1\n  fi\ndone\nexit \"$status\"\n"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.fixture_group != 'ci-recovery' && inputs.fixture_group
      != 'windows-arm-network' }}
  recovery-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
    env:
      BUILD_TYPE: RelWithDebInfo
      NEVERC_PCG_STRICT: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc
    - name: Set up CPython 3.12.10 for official artifacts
      id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - name: Select latest stable Xcode SDK
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Show Apple SDK
      run: 'xcodebuild -version

        xcrun --show-sdk-path

        '
    - name: Setup build deps
      run: brew install ninja cmake p7zip openssl@3 llvm@22 lld@22
    - name: Select matching Homebrew LLVM 22 toolchain
      run: 'LLVM_PREFIX="$(brew --prefix llvm@22)"

        LLD_PREFIX="$(brew --prefix lld@22)"

        echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"

        echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

        echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

        echo "${LLD_PREFIX}/bin" >> "$GITHUB_PATH"

        "${LLVM_PREFIX}/bin/clang" --version

        "${LLD_PREFIX}/bin/ld64.lld" --version

        '
    - name: Build neverc
      run: "cmake -GNinja -Bbuild \\\n  -DCMAKE_INSTALL_PREFIX=install \\\n  -DCMAKE_C_COMPILER=\"$CC\" \\\n  -DCMAKE_CXX_COMPILER=\"\
        $CXX\" \\\n  -DLLVM_ENABLE_ASSERTIONS=OFF \\\n  -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \\\n  -DHAVE_STD_IS_TRIVIALLY_COPYABLE=0\
        \ \\\n  -DNEVERC_INCLUDE_TESTS=ON \\\n  -DPython3_EXECUTABLE=\"${{ steps.python.outputs.python-path }}\"\
        \ \\\n  -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \\\n  -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \\\n  -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST\
        \ \\\n  -DNEVERC_STRIP_BINARY=OFF \\\n  -DNEVERC_ENABLE_LTO=ON \\\n  -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE\
        \ }} \\\n  -C neverc/neverc/cmake/caches/NeverC.cmake \\\n  neverc/llvm\ntime cmake --build build --config\
        \ ${{ env.BUILD_TYPE }} --target neverc-embed-runtime-bitcode\n"
      id: compiler_build
    - name: Validate native SDK and Mach-O recovery boundaries
      id: recovery
      shell: bash
      run: "\"${{ steps.python.outputs.python-path }}\" neverc/utils/ci/check-cpp-ci-recovery.py \\\n  --repo \"\
        $PWD/neverc\" --compiler \"$PWD/build/bin/neverc\" \\\n  --output \"$RUNNER_TEMP/cpp-ci-recovery\"\n"
    - name: Upload focused recovery evidence
      if: ${{ !cancelled() && steps.compiler_build.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: cpp-ci-recovery-macos-${{ github.sha }}
        path: ${{ runner.temp }}/cpp-ci-recovery
        if-no-files-found: error
        retention-days: 14
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_group == 'ci-recovery' }}
  recovery-windows:
    runs-on: windows-2022
    env:
      BUILD_TYPE: RelWithDebInfo
      NEVERC_PCG_STRICT: '1'
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc
    - name: Set up CPython 3.12.10 for official artifacts
      id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - name: Setup build deps
      shell: pwsh
      run: 'choco install ninja 7zip -y


        # Pin CMake to the version the arm64 runner uses. CMake 4.4''s

        # gtest_discover_tests only appends to the generated CTest file, where

        # 3.31 truncated it first, so any target whose POST_BUILD discovery runs

        # twice registers its tests twice and the suite inventory stops being

        # reproducible across runs.

        $cmakeVer = ''3.31.11''

        Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip"
        -OutFile cmake.zip

        Expand-Archive cmake.zip C:\tools -Force

        Add-Content $env:GITHUB_PATH "C:\tools\cmake-$cmakeVer-windows-x86_64\bin"

        '
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build neverc
      shell: bash
      run: 'cmake -GNinja -Bbuild \

        -DCMAKE_INSTALL_PREFIX=install \

        -DLLVM_ENABLE_ASSERTIONS=OFF \

        -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \

        -DNEVERC_INCLUDE_TESTS=ON \

        -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \

        -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \

        -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \

        -DNEVERC_STRIP_BINARY=OFF \

        -DNEVERC_ENABLE_LTO=ON \

        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \

        -C neverc/neverc/cmake/caches/NeverC.cmake \

        neverc/llvm

        cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-embed-runtime-bitcode

        '
      id: compiler_build
    - name: Validate native SDK and Mach-O recovery boundaries
      id: recovery
      shell: bash
      run: "\"${{ steps.python.outputs.python-path }}\" neverc/utils/ci/check-cpp-ci-recovery.py \\\n  --repo \"\
        $PWD/neverc\" --compiler \"$PWD/build/bin/neverc\" \\\n  --output \"$RUNNER_TEMP/cpp-ci-recovery\"\n"
    - name: Upload focused recovery evidence
      if: ${{ !cancelled() && steps.compiler_build.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: cpp-ci-recovery-windows-${{ github.sha }}
        path: ${{ runner.temp }}/cpp-ci-recovery
        if-no-files-found: error
        retention-days: 14
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_group == 'ci-recovery' }}
  inspect-windows-arm-network:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture_group == 'windows-arm-network' }}
    permissions:
      contents: read
      actions: read
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      NEVERC_PCG_STRICT: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.10
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64
    - name: Prepare retained ARM64 crash diagnosis
      shell: pwsh
      run: "New-Item -ItemType Directory -Force -Path \"$env:RUNNER_TEMP/windows-arm-network-bootstrap\" | Out-Null\n\
        \ git rev-parse HEAD | Out-File -Encoding utf8 \"$env:RUNNER_TEMP/windows-arm-network-bootstrap/revision.txt\"\
        \n python --version | Out-File -Encoding utf8 \"$env:RUNNER_TEMP/windows-arm-network-bootstrap/python.log\"\
        \n $wer = 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\Windows Error Reporting\\LocalDumps\\neverc.exe'\n New-Item\
        \ -Path $wer -Force | Out-Null\n New-ItemProperty -Path $wer -Name DumpFolder -Value \"$env:RUNNER_TEMP/windows-arm-network-dumps\"\
        \ -PropertyType ExpandString -Force | Out-Null\n New-ItemProperty -Path $wer -Name DumpCount -Value 8 -PropertyType\
        \ DWord -Force | Out-Null\n New-ItemProperty -Path $wer -Name DumpType -Value 1 -PropertyType DWord -Force\
        \ | Out-Null\n New-Item -ItemType Directory -Force -Path \"$env:RUNNER_TEMP/windows-arm-network-dumps\"\
        \ | Out-Null\n "
    - name: Download authenticated failing ARM64 compiler with runtime
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "python utils/ci/download-windows-arm-network-baseline.py --run-id 39304339088 --revision 89574033312b3bf5946cecf4a3d59903792c99d5\
        \ --output \"$env:RUNNER_TEMP/windows-arm-network-prior\" 2>&1 | Tee-Object \"$env:RUNNER_TEMP/windows-arm-network-bootstrap/download.log\"\
        \n if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n "
    - name: Reproduce exact network codegen crash and retain bounded controls
      shell: pwsh
      run: "python utils/ci/check-windows-arm-network-crash.py --repo \"$env:GITHUB_WORKSPACE\" --baseline \"$env:RUNNER_TEMP/windows-arm-network-prior/provenance.json\"\
        \ --output \"$env:RUNNER_TEMP/windows-arm-network\"\n if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n "
    - name: Upload actual ARM64 crash diagnosis
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm-network-${{ github.sha }}
        path: '${{ runner.temp }}/windows-arm-network

          ${{ runner.temp }}/windows-arm-network-bootstrap

          ${{ runner.temp }}/windows-arm-network-dumps

          '
        if-no-files-found: error
        retention-days: 14
'on':
  workflow_dispatch:
    inputs:
      fixture_group:
        description: Choose the diagnostic group
        required: true
        type: choice
        default: template-source
        options:
        - template-source
        - ci-recovery
        - windows-arm-network
  push:
    branches:
    - dev
    paths:
    - .github/workflows/diagnose-cpp-template-source.yml
    - utils/translate-frontends/cpp/diagnostics/template-source.cpp
    - tests/neverc/Inputs/translate/cpp/nullptr-template-values.cpp
    - tests/neverc/Inputs/translate/cpp/runtime-aggregate-array.cpp
    - tests/neverc/Inputs/translate/cpp/array-allocation.cpp
    - tests/neverc/Inputs/translate/cpp/builtin-type-classification.cpp
    - tests/neverc/Inputs/translate/cpp/scalar-operation-traits.cpp
    - tests/neverc/Inputs/translate/cpp/trivial-record-operation-traits.cpp
    - tests/neverc/Inputs/translate/cpp/defined-operation-traits.cpp
    - tests/neverc/Inputs/translate/cpp/array-type-queries.cpp
    - tests/neverc/Inputs/translate/cpp/unary-type-transforms.cpp
    - tests/neverc/Inputs/translate/cpp/bare-function-metadata.cpp
    - tests/neverc/Inputs/translate/cpp/empty-base-chains.cpp
