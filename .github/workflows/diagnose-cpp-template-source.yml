        \ shot, LTO) ===\"\n  \"$NCC\" $flags \"$src\" -o \"$WDIAG/diag_${label}_oneshot.exe\"\
        \ 2>&1 && echo \"OK\" || echo \"EXIT=$?\"\n\n  echo \"=== [$label] step 3b:\
        \ compile+link (one shot, NO LTO) ===\"\n  \"$NCC\" $flags -fno-lto \"$src\"\
        \ -o \"$WDIAG/diag_${label}_nolto.exe\" 2>&1 && echo \"OK\" || echo \"EXIT=$?\"\
        \n\n  echo \"=== [$label] step 3c: compile+link (save LTO temps) ===\"\n \
        \ \"$NCC\" $flags -save-temps \"$src\" -o \"$WDIAG/diag_${label}_temps.exe\"\
        \ 2>&1 && echo \"OK\" || echo \"EXIT=$?\"\n  ls -la \"$WDIAG\"/diag_${label}_temps.*.obj\
        \ 2>/dev/null || echo \"(no LTO temps)\"\n\n  echo \"=== [$label] check output\
        \ files ===\"\n  ls -la \"$BDIAG\"/diag_${label}* 2>&1 || echo \"NO FILES\
        \ FOUND\"\n  file \"$BDIAG\"/diag_${label}_oneshot.exe 2>&1 || true\n\n  echo\
        \ \"=== [$label] DLL dependencies ===\"\n  dumpbin //DEPENDENTS \"$BDIAG/diag_${label}_oneshot.exe\"\
        \ 2>&1 || true\n\n  echo \"=== [$label] IMPORTS (function names) ===\"\n \
        \ dumpbin //IMPORTS \"$BDIAG/diag_${label}_oneshot.exe\" 2>&1 || true\n\n\
        \  echo \"=== [$label] PE headers ===\"\n  dumpbin //HEADERS \"$BDIAG/diag_${label}_oneshot.exe\"\
        \ 2>&1 | head -60 || true\n\n  echo \"=== [$label] UNWIND INFO (.pdata/.xdata\
        \ content) ===\"\n  dumpbin //UNWINDINFO \"$BDIAG/diag_${label}_oneshot.exe\"\
        \ 2>&1 | head -200 || true\n\n  echo \"=== [$label] .pdata raw hex (first\
