        \ -PassThru \\\n        -RedirectStandardOutput '$WDIAG/diag_${label}_stdout.txt'\
        \ \\\n        -RedirectStandardError '$WDIAG/diag_${label}_stderr.txt'\n \
        \     Write-Host \\\"EXIT_CODE=\\$(\\$p.ExitCode)\\\"\n    } catch {\n   \
        \   Write-Host \\\"EXCEPTION: \\$_\\\"\n      Write-Host \\\"WIN32_ERROR:\
