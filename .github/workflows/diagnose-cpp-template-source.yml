        \ [ -f \"$wdir/$lib\" ]; then\n      echo \"  FOUND: $dir/$lib ($(wc -c <\
        \ \"$wdir/$lib\") bytes)\"\n      found=true\n      break\n    fi\n  done\n\
        \  $found || echo \"  MISSING: $lib\"\ndone\n\necho \"=== Linker search paths\
        \ (neverc -v) ===\"\n\"$NCC\" -std=c11 -v \"$TESTDIR/standards/test_c_stdlib_patterns.c\"\
