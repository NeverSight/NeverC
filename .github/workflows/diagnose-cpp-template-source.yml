        \ #\" \"$BDIAG/diag_${label}_nolto.ll\" 2>/dev/null | head -40 || echo \"\
        (none)\"\n  echo \"--- LTO bitcode IR (pre-link, TY_LTO_IR) ---\"\n  \"$NCC\"\
        \ $flags -flto -S \"$src\" -o \"$WDIAG/diag_${label}_lto.ll\" 2>&1 && echo\
        \ \"OK\" || echo \"EXIT=$?\"\n  echo \"LTO uwtable occurrences: $(grep -c\
        \ \"uwtable\" \"$BDIAG/diag_${label}_lto.ll\" 2>/dev/null)\"\n  grep -E \"\
        ^define|^attributes #\" \"$BDIAG/diag_${label}_lto.ll\" 2>/dev/null | head\
        \ -40 || echo \"(none)\"\n\n  echo \"=== [$label] step 6: MSVC link.exe comparison\
        \ ===\"\n  echo \"--- link with MSVC link.exe ---\"\n  link.exe //NOLOGO //MACHINE:ARM64\
        \ //SUBSYSTEM:CONSOLE \\\n    //DEFAULTLIB:libcmt //DEFAULTLIB:libvcruntime\
        \ //DEFAULTLIB:libucrt \\\n    //DEFAULTLIB:legacy_stdio_definitions //DEFAULTLIB:oldnames\
        \ \\\n    \"$WDIAG/diag_${label}.obj\" \\\n    \"//OUT:$WDIAG/diag_${label}_msvc.exe\"\
        \ 2>&1 && echo \"MSVC_LINK=OK\" || echo \"MSVC_LINK=FAIL\"\n  echo \"--- run\
        \ MSVC-linked exe ---\"\n  if [ -f \"$BDIAG/diag_${label}_msvc.exe\" ]; then\n\
        \    powershell.exe -NoProfile -Command \"\n      try {\n        \\$p = Start-Process\
        \ -FilePath '$WDIAG/diag_${label}_msvc.exe' \\\n          -NoNewWindow -Wait\
        \ -PassThru \\\n          -RedirectStandardOutput '$WDIAG/diag_${label}_msvc_stdout.txt'\
