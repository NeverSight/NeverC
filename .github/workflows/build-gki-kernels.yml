# Build every supported GKI kernel, including same-series Android-generation
# splits (android12-5.10 / android13-5.10 and android13-5.15 / android14-5.15),
# verify struct module offsets against the checked profile catalog, then
# publish the artifacts.
#
# Manual only: heavy (repo sync ~10-20GB + build ~10-20GB per version), so it
# never runs automatically.
name: build-gki-kernels

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "build gki kernels"
        type: choice
        options:
          - all
          - "510"
          - "51013"
          - "515"
          - "51514"
          - "601"
          - "606"
          - "612"
          - "618"
          - "703"
        default: all
      release_tag:
        description: "Optional standalone GKI release tag (must start with gki-)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: gki-${{ github.ref }}-${{ github.event.inputs.kernel_version }}
  cancel-in-progress: false

jobs:
  setup:
    name: Select versions
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build matrix from input
        id: gen
        run: |
          set -euo pipefail
          all='[
            {"key":"510","android":"android12","kernel":"5.10","branch":"common-android12-5.10","build_system":"make","verify_mode":"compare"},
            {"key":"51013","android":"android13","kernel":"5.10","branch":"common-android13-5.10","build_system":"make","verify_mode":"compare"},
            {"key":"515","android":"android13","kernel":"5.15","branch":"common-android13-5.15","build_system":"make","verify_mode":"compare"},
            {"key":"51514","android":"android14","kernel":"5.15","branch":"common-android14-5.15","build_system":"bazel","verify_mode":"compare"},
            {"key":"601","android":"android14","kernel":"6.1","branch":"common-android14-6.1","build_system":"bazel","verify_mode":"compare"},
            {"key":"606","android":"android15","kernel":"6.6","branch":"common-android15-6.6","build_system":"bazel","verify_mode":"compare"},
            {"key":"612","android":"android16","kernel":"6.12","branch":"common-android16-6.12","build_system":"bazel","verify_mode":"compare"},
            {"key":"618","android":"android17","kernel":"6.18","branch":"common-android17-6.18","build_system":"bazel","verify_mode":"compare"},
            {"key":"703","android":"android18","kernel":"7.3","branch":"common-android18-7.3","build_system":"bazel","verify_mode":"compare"}
          ]'
          sel='${{ inputs.kernel_version }}'
          if [ -z "$sel" ] || [ "$sel" = all ]; then
            inc=$(printf '%s' "$all" | jq -c .)
          else
            inc=$(printf '%s' "$all" | jq -c --arg k "$sel" '[.[] | select(.key==$k)]')
          fi
          echo "Selected matrix: $inc"
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  preflight:
    name: Check profile catalog
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout neverc repo
        uses: actions/checkout@v4
      - name: Catalog, lock, and matrix must query
        env:
          MATRIX: ${{ needs.setup.outputs.matrix }}
        run: |
          set -euo pipefail
          python3 runtime/android/kernel/tools/generate-compat-table.py --check
          python3 runtime/android/kernel/tools/test-gen-offsets.py
          python3 runtime/android/kernel/tools/test-gki-release-publish.py
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          matrix = json.loads(os.environ["MATRIX"])
          entries = matrix["include"]
          if not entries:
              raise SystemExit("preflight: empty build matrix")
          for entry in entries:
              key = entry["key"]
              if entry["verify_mode"] == "print":
                  print(f"{key}: discover ABI evidence; runtime profile is not certified")
                  continue
              query = subprocess.run(
                  [
                      sys.executable,
                      "runtime/android/kernel/tools/generate-compat-table.py",
                      "--query-profile",
                      key,
                  ],
                  capture_output=True,
                  text=True,
              )
              if query.returncode != 0:
                  sys.stderr.write(query.stderr)
                  raise SystemExit(f"preflight: --query-profile {key} failed")
              contract = json.loads(query.stdout)
              print(
                  f"{key}: init={contract['module_init_offset']} "
                  f"exit={contract['module_exit_offset']} "
                  f"size={contract['module_size']}"
              )
          PY

  build:
    name: GKI ${{ matrix.android }}-${{ matrix.kernel }}
    needs:
      - setup
      - preflight
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      KEY: ${{ matrix.key }}
      BRANCH: ${{ matrix.branch }}
      BUILD_SYSTEM: ${{ matrix.build_system }}
      VERIFY_MODE: ${{ matrix.verify_mode }}
      TAG: gki-${{ matrix.android }}-${{ matrix.kernel }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/hostedtoolcache \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/share/miniconda \
            /usr/share/az_* \
            /usr/share/gradle-* \
            /usr/share/sbt \
            /usr/local/graalvm \
            /usr/local/julia* || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          df -h /

      - name: Create swap for LTO link
        run: |
          swap_size=4G
          if [ "${{ matrix.key }}" = "51514" ]; then
            # ThinLTO + CFI still spikes during the vmlinux link.
            swap_size=8G
          fi
          sudo fallocate -l "$swap_size" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h /

      - name: Checkout neverc repo
        uses: actions/checkout@v4
        with:
          path: neverc

      - name: Install build dependencies
        run: |
          set -euo pipefail
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python-is-python3 \
            bc bison flex cpio libelf-dev libssl-dev libdw-dev pkg-config \
            binutils llvm jq rsync zip xz-utils dwarves python3-pyelftools
          mkdir -p "$HOME/.bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/.bin/repo"
          chmod a+x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@neverc.local"
          git config --global user.name "neverc-ci"
          git config --global color.ui false

      - name: Repo init + sync
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p kernel
          cd kernel
          repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest -b "$BRANCH"
          for attempt in 1 2 3; do
            echo "::group::repo sync attempt $attempt"
            if repo sync -c --no-tags --optimized-fetch --prune -j4; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              echo "repo sync failed (attempt $attempt), retrying with --force-sync..."
              sleep 5
              repo sync -c --no-tags --optimized-fetch --prune --force-sync -j2 || true
            else
              echo "repo sync failed after $attempt attempts"
              df -h /
              du -sh .repo/projects/* 2>/dev/null | sort -rh | head -20 || true
              exit 1
            fi
          done
          df -h /

      - name: Configure Android 18 production preview
        if: matrix.key == '703'
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          # This RC family is measured at one source/configuration snapshot.
          commit=d05bec5ef839dbeca434de1f27e79dd62eee39e9
          git -C common fetch --depth=1 origin "$commit"
          git -C common checkout --detach "$commit"
          cp "$GITHUB_WORKSPACE/neverc/runtime/android/kernel/arm64/android18-7.3-production.fragment" \
            common/arch/arm64/configs/neverc-production.fragment
          python3 - <<'PY'
          from pathlib import Path
          path = Path("common/BUILD.bazel")
          text = path.read_text()
          target = '    name = "kernel_aarch64",\n'
          if text.count(target) != 1:
              raise SystemExit("missing unique kernel_aarch64 target")
          text = text.replace(target, target +
              '    post_defconfig_fragments = ["arch/arm64/configs/neverc-production.fragment"],\n')
          path.write_text(text)
          PY

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          if [ "$BUILD_SYSTEM" = make ]; then
            # Legacy build.sh (ThinLTO + CFI, matching nvkmod_version.h assumptions).
            # Limit ThinLTO backend threads to keep peak memory under ~10GB
            # (standard runner: 7GB RAM + 4GB swap).
            export KCFLAGS="-Wl,--thinlto-jobs=1"
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          else
            # Bazel/KLEAF picks up its own toolchain from prebuilts/.
            # --lto must come before `--`.
            if [ "$KEY" = "51514" ]; then
              # Official android14-5.15 is CFI + LTO + kmi_symbol_list_strict_mode.
              # gki_defconfig defaults to full LTO, which OOMs the 7GB runner.
              # ThinLTO is still LTO: it instruments classic CFI and links
              # __cfi_slowpath_diag / __ubsan_handle_cfi_check_fail_abort, so
              # the official KMI check stays on. Same contract as the make-based
              # 5.15 GKI jobs. CONFIG_CFI_CLANG and struct layouts are unchanged.
              printf '\nKBUILD_LDFLAGS += --thinlto-jobs=1 --threads=1\n' >> common/Makefile
              tools/bazel run --lto=thin //common:kernel_aarch64_dist -- --destdir="$PWD/dist"
            elif [ "$KEY" = "703" ]; then
              # A deterministic RC token, including the production marker.
              tools/bazel run --nostamp --lto=none //common:kernel_aarch64_dist -- --destdir="$PWD/dist"
            else
              # android14-6.1+ gki_defconfig is already LTO=none (KCFI).
              tools/bazel run --lto=none //common:kernel_aarch64_dist -- --destdir="$PWD/dist"
            fi
          fi
          df -h /

      - name: Build offset probe module
        if: matrix.build_system == 'make'
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          # Some GKI configs (notably 5.10) have zero loadable modules, so the
          # verify script finds no .ko/.mod.o to extract struct module offsets
          # from.  Build a trivial out-of-tree module against the kernel tree.
          # Find the kernel build output dir via Module.symvers (always present
          # after a successful build, regardless of output directory layout).
          kdir=$(find out -maxdepth 5 -name 'Module.symvers' -type f \
                   -printf '%h\n' -quit 2>/dev/null || true)
          if [ -z "$kdir" ]; then
            echo "No kernel build directory found, skipping probe"
            exit 0
          fi
          echo "Kernel build dir: $kdir"
          clang=$(find prebuilts prebuilts-master -maxdepth 8 -path '*/bin/clang' -type f -print -quit 2>/dev/null || true)
          if [ -z "$clang" ]; then
            echo "No prebuilt clang found, skipping probe"
            exit 0
          fi
          clang_bin=$(cd "$(dirname "$clang")" && pwd)
          probe="$GITHUB_WORKSPACE/probe"
          mkdir -p "$probe"
          cat > "$probe/neverc_probe.c" <<'PROBE'
          #include <linux/module.h>
          MODULE_LICENSE("GPL");
          static int __init p_init(void) { return 0; }
          static void __exit p_exit(void) {}
          module_init(p_init);
          module_exit(p_exit);
          PROBE
          echo 'obj-m := neverc_probe.o' > "$probe/Kbuild"
          PATH="$clang_bin:$PATH" \
            make -C "$kdir" M="$probe" LLVM=1 LLVM_IAS=1 \
              ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          ls -l "$probe"/*.ko 2>/dev/null && echo "Probe module built" \
            || echo "Probe build produced no .ko (non-fatal)"

      - name: Verify struct module offsets
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          # Prefer the kernel's own prebuilt llvm-readelf (exact toolchain match).
          re=$(find prebuilts prebuilts-master -maxdepth 8 -path '*/bin/llvm-readelf' -type f -print -quit 2>/dev/null || true)
          # Likely artifact roots; .repo is intentionally excluded from the scan.
          # Also include the probe directory for GKI configs with no built-in modules.
          dirs=()
          for d in out dist common bazel-bin "$GITHUB_WORKSPACE/probe"; do
            [ -e "$d" ] && dirs+=("$d")
          done
          args=()
          [ -n "$re" ] && args+=(--readelf "$re")
          if [ "$VERIFY_MODE" = print ]; then
            # A new family needs measured evidence before it can be registered
            # as a runtime profile. Keep discovery separate from verification.
            args+=(--print "${dirs[@]}")
          else
            args+=("$KEY" "${dirs[@]}")
          fi
          echo "verify args: ${args[*]}"
          bash "$GITHUB_WORKSPACE/neverc/utils/build/verify_gki_offsets.sh" "${args[@]}" \
            | tee "$GITHUB_WORKSPACE/verify-$KEY.txt"

      - name: Cross-check via gen_struct_module_offsets.c
        working-directory: ${{ github.workspace }}/kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          clang=$(find prebuilts prebuilts-master -maxdepth 8 -path '*/bin/clang' -type f -print -quit 2>/dev/null || true)
          autoconf=$(find . -path '*/include/generated/autoconf.h' -type f -print -quit 2>/dev/null || true)
          if [ -z "$clang" ] || [ -z "$autoconf" ]; then
            echo "skip (clang='$clang' autoconf='$autoconf')"
            exit 0
          fi
          gendir=${autoconf%/include/generated/autoconf.h}
          echo "clang=$clang gendir=$gendir"
          NEVERC="$clang" python3 \
            "$GITHUB_WORKSPACE/neverc/runtime/android/kernel/tools/gen-offsets.py" \
            common "$gendir" || echo "cross-check probe failed (informational only)"

      - name: Verify Android 18 production preview evidence
        if: matrix.key == '703'
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          common/scripts/extract-ikconfig dist/Image > "$GITHUB_WORKSPACE/config-703"
          clang=prebuilts/clang/host/linux-x86/clang-r596125/bin/clang
          test -x "$clang"
          symvers=dist/vmlinux.symvers
          [ -f "$symvers" ] || symvers=dist/Module.symvers
          python3 "$GITHUB_WORKSPACE/neverc/runtime/android/kernel/tools/generate-gki-manifest.py" \
            --profile 703 --kernel-name android18-7.3 --compiler "$clang" \
            --config "$GITHUB_WORKSPACE/config-703" --vmlinux dist/vmlinux \
            --symvers "$symvers" --output "$GITHUB_WORKSPACE/703.measured.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          measured = json.loads((root / "703.measured.json").read_text())
          checked = json.loads((root / "neverc/runtime/android/kernel/arm64/gki-manifests/703.json").read_text())
          for field in ("config", "layouts", "module_memory_layout", "sdk_exports"):
              if measured[field] != checked[field]:
                  raise SystemExit(f"703 production preview {field} changed; recertify before publishing")
          PY

      - name: Collect artifacts
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/stage-$KEY"
          mkdir -p "$stage"
          if [ "$KEY" = "703" ]; then
            cp "$GITHUB_WORKSPACE/703.measured.json" "$stage/" 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/config-703" "$stage/" 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/neverc/runtime/android/kernel/arm64/android18-7.3-production.fragment" "$stage/"
            git -C common rev-parse HEAD > "$stage/source-commit.txt"
          fi

          # Locate the dist directory (make: out/<branch>/dist, bazel: dist/).
          dist_dir=$(find out dist -maxdepth 4 -name 'Image' -type f \
                       -printf '%h\n' -quit 2>/dev/null || true)
          if [ -n "$dist_dir" ]; then
            echo "dist dir: $dist_dir"
            mkdir -p "$stage/dist"
            for f in Image Image.lz4 Image.gz System.map vmlinux \
                     Module.symvers vmlinux.symvers modules.builtin modules.builtin.modinfo; do
              [ -f "$dist_dir/$f" ] && cp "$dist_dir/$f" "$stage/dist/" || true
            done
            # All .ko modules from dist.
            find "$dist_dir" -name '*.ko' -type f -exec cp {} "$stage/dist/" \; 2>/dev/null || true
          fi

          # Locate the kernel build tree (where Module.symvers lives).
          # Make builds put it under out/; bazel/KLEAF puts it in dist/.
          kbuild=""
          for search_root in out dist bazel-bin; do
            [ -d "$search_root" ] || continue
            kbuild=$(find "$search_root" -maxdepth 5 -name 'Module.symvers' -type f \
                       -printf '%h\n' -quit 2>/dev/null || true)
            [ -n "$kbuild" ] && break
          done
          sdk="$stage/sdk"
          mkdir -p "$sdk"
          if [ -n "$kbuild" ]; then
            echo "kbuild dir: $kbuild"
            [ -f "$kbuild/.config" ] && cp "$kbuild/.config" "$stage/config-$KEY" || true
            for d in include/generated include/config \
                     arch/arm64/include/generated; do
              [ -d "$kbuild/$d" ] && mkdir -p "$sdk/$d" && \
                cp -r "$kbuild/$d/." "$sdk/$d/" || true
            done
            for f in scripts/basic/fixdep scripts/mod/modpost scripts/module.lds; do
              if [ -f "$kbuild/$f" ]; then
                mkdir -p "$sdk/$(dirname "$f")"
                cp "$kbuild/$f" "$sdk/$f" || true
              fi
            done
            [ -f "$kbuild/Module.symvers" ] && cp "$kbuild/Module.symvers" "$sdk/" || true
          fi

          # Bazel builds may store generated headers outside the Module.symvers
          # directory. Fall back to a workspace-wide search when needed.
          if [ ! -f "$sdk/include/generated/autoconf.h" ]; then
            autoconf=$(find . -path '*/include/generated/autoconf.h' \
                         -not -path './.repo/*' -type f -print -quit 2>/dev/null || true)
            if [ -n "$autoconf" ]; then
              gen_root="${autoconf%/include/generated/autoconf.h}"
              echo "generated headers root: $gen_root"
              for d in include/generated include/config \
                       arch/arm64/include/generated; do
                [ -d "$gen_root/$d" ] && mkdir -p "$sdk/$d" && \
                  cp -r "$gen_root/$d/." "$sdk/$d/" || true
              done
            fi
          fi

          # Collect .mod.o intermediate objects (for offline struct module
          # offset analysis with verify_gki_offsets.sh).
          obj_dir="$stage/obj"
          mkdir -p "$obj_dir"
          obj_count=0
          for search_root in out dist bazel-bin "$GITHUB_WORKSPACE/probe"; do
            [ -d "$search_root" ] || continue
            while IFS= read -r f; do
              [ "$obj_count" -ge 20 ] && break
              cp "$f" "$obj_dir/" 2>/dev/null || true
              obj_count=$((obj_count + 1))
            done < <(find "$search_root" -name '*.mod.o' -type f 2>/dev/null)
          done
          [ -z "$(ls -A "$obj_dir" 2>/dev/null)" ] && rmdir "$obj_dir" || true

          # Probe module .ko for offline offset checks.
          probe_ko="$GITHUB_WORKSPACE/probe/neverc_probe.ko"
          [ -f "$probe_ko" ] && cp "$probe_ko" "$stage/" || true
          cp "$GITHUB_WORKSPACE/verify-$KEY.txt" "$stage/" 2>/dev/null || true

          discovery_status=0
          if [ "$VERIFY_MODE" = print ] && [ -f "$stage/dist/vmlinux" ]; then
            # This output is deliberately not a checked gki-manifests entry.
            # The SDK and runtime still need to be ported and verified against it.
            config="$stage/config-$KEY"
            if [ ! -f "$config" ]; then
              # Kleaf's dist may contain only vmlinux.symvers, without the
              # build tree. GKI embeds the exact configured file in Image.
              if common/scripts/extract-ikconfig "$stage/dist/Image" > "$config.tmp"; then
                mv "$config.tmp" "$config"
              else
                rm -f "$config.tmp"
              fi
            fi
            symvers="$stage/sdk/Module.symvers"
            if [ ! -f "$symvers" ]; then
              symvers="$stage/dist/Module.symvers"
            fi
            if [ ! -f "$symvers" ]; then
              symvers="$stage/dist/vmlinux.symvers"
            fi
            python3 "$GITHUB_WORKSPACE/neverc/runtime/android/kernel/tools/generate-gki-manifest.py" \
              --profile "$KEY" --kernel-name "${{ matrix.android }}-${{ matrix.kernel }}" \
              --config "$config" --vmlinux "$stage/dist/vmlinux" \
              --symvers "$symvers" --discovery \
              --output "$stage/$KEY.discovery.json" || discovery_status=$?
            git -C common rev-parse HEAD > "$stage/source-commit.txt"
          fi

          if [ -z "$(ls -A "$stage" 2>/dev/null)" ]; then
            echo "(build failed before producing artifacts)" > "$stage/EMPTY.txt"
          fi
          tar -czf "$GITHUB_WORKSPACE/$TAG-build.tar.gz" -C "$stage" .
          ls -lh "$GITHUB_WORKSPACE/$TAG-build.tar.gz"
          echo "Contents:"
          tar -tzf "$GITHUB_WORKSPACE/$TAG-build.tar.gz" | head -50 || true
          exit "$discovery_status"

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: ${{ github.workspace }}/${{ env.TAG }}-build.tar.gz
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update Release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts to publish."
            exit 0
          fi
          tag=${RELEASE_TAG:-gki-build-$(date -u +%Y%m%d)}
          [[ "$tag" =~ ^gki-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "Invalid GKI release tag: $tag" >&2
            exit 1
          }
          title="GKI prebuilt kernels $(date -u +%Y-%m-%d)"
          flags=(--latest=false)
          if [ "$KERNEL_VERSION" = 703 ]; then
            title="GKI android18-7.3 production preview (KMI0)"
            flags+=(--prerelease)
            cat > release-notes.md <<'NOTES'
          Standalone Android 18 / Linux 7.3 GKI production preview for NeverC `NVK_KERNEL=703`.

          - AOSP common commit: `d05bec5ef839dbeca434de1f27e79dd62eee39e9`, KMI generation **0**.
          - Actual kernel release: `7.2.0-rc9-android18-0-maybe-dirty-neverc-preview-4k` (the upstream branch temporarily reports Linux 7.2-rc9).
          - Configuration: GKI defconfig plus `android18-7.3-production.fragment`, with lockdep/debug locks disabled and CFI/Rust retained.
          - The archive contains Image, vmlinux, module artifacts, exact config, source commit, fragment and measured BTF/SDK export evidence. Module offsets and the measured manifest must match the checked 703 profile before publication.
          - This is an RC production preview. The stock debug configuration needs a separate profile; the existing C Binder transaction filter is unavailable with Rust Binder.

          Verify the downloaded archive against `SHA256SUMS` before use.
          NOTES
          else
            cat > release-notes.md <<'NOTES'
          Automated GKI builds with struct module offset verification against the checked profile catalog. Android18-7.3 (703), when selected, uses the pinned production preview fragment with lock debugging disabled.
          NOTES
          fi
          printf '\nNeverC workflow source: %s.\n' "$SOURCE_SHA" >> release-notes.md
          python3 - "${files[@]}" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          with Path("SHA256SUMS").open("w", encoding="utf-8") as output:
              for filename in sys.argv[1:]:
                  path = Path(filename)
                  digest = hashlib.sha256()
                  with path.open("rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  output.write(f"{digest.hexdigest()}  {path.name}\n")
          PY
          files+=(SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}"
          else
            gh release create "$tag" "${files[@]}" \
              --title "$title" --notes-file release-notes.md \
              --target "$SOURCE_SHA" "${flags[@]}"
          fi
          echo "Published ${#files[@]} asset(s) to release $tag"
