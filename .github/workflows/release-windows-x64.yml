# Release build for Windows x86_64.  Tag push: package + GitHub Release.
# Manual dispatch: artifacts only (no release).
#
# Uses MSVC (cl.exe) via Ninja for reliable Windows builds.
# Compiler speed comes from:
#   - NEVERC_RELEASE_OPT_LEVEL=3  (/O2 via MSVC defaults)
#   - mimalloc, static linking (NeverC.cmake)
name: windows-x64-neverc-release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build deps
        run: choco install ninja cmake 7zip -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.7

      - name: Build neverc (Release)
        shell: bash
        run: |
          cmake -S llvm -B build -G Ninja \
            -C neverc/cmake/caches/NeverC.cmake \
            -DNEVERC_INCLUDE_TESTS=ON \
            -DNEVERC_ENABLE_LTO=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target neverc --parallel $NUMBER_OF_PROCESSORS

      - name: Build bundled Windows runtime
        shell: bash
        run: cmake --build build --target neverc-runtime-x64-msvc neverc-runtime-shared-msvc

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Build Plugin SDK
        shell: bash
        run: cmake --build build --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        shell: bash
        run: |
          set -e
          make -C build/pluginsdk/examples \
            NEVERC=$PWD/build/bin/neverc \
            INCLUDE_DIR=$PWD/build/pluginsdk/include
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.dll \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Install neverc
        run: cmake --install build --prefix "$env:GITHUB_WORKSPACE\install"

      - name: Package
        run: 7z a windows-x64-neverc-release.zip install

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-neverc-release
          path: windows-x64-neverc-release.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-pre') || contains(github.ref, '-rc') }}
          files: windows-x64-neverc-release.zip
