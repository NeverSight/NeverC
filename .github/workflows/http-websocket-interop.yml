name: http-websocket-interop

permissions:
  contents: read

on:
  push:
    paths:
      - 'std/include/neverc/std/net/http.h'
      - 'std/include/neverc/std/net/websocket.h'
      - 'std/src/net/http/**'
      - 'std/src/net/websocket/**'
      - 'tests/neverc/std/network_interop_server.c'
      - 'tests/neverc/interop/**'
      - 'utils/ci/run-http-websocket-interop.sh'
      - '.github/workflows/http-websocket-interop.yml'
  pull_request:
    paths:
      - 'std/include/neverc/std/net/http.h'
      - 'std/include/neverc/std/net/websocket.h'
      - 'std/src/net/http/**'
      - 'std/src/net/websocket/**'
      - 'tests/neverc/std/network_interop_server.c'
      - 'tests/neverc/interop/**'
      - 'utils/ci/run-http-websocket-interop.sh'
      - '.github/workflows/http-websocket-interop.yml'
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: http-websocket-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang golang-go curl ripgrep

      - name: Run curl, Go, and Autobahn interoperability
        env:
          NEVERC_RUN_AUTOBAHN: '1'
        run: utils/ci/run-http-websocket-interop.sh "$PWD" clang 19090
