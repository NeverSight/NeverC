name: http-websocket-interop

permissions:
  contents: read

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

# Cancel stale runs on the same ref when a newer commit is pushed. Set repo
# variable CI_CANCEL_IN_PROGRESS=false to keep overlapping runs (legacy mode).
concurrency:
  group: http-websocket-interop-${{ github.ref }}
  cancel-in-progress: ${{ vars.CI_CANCEL_IN_PROGRESS != 'false' }}

jobs:
  interop:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          bash .github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update && sudo apt-get install -y clang golang-go curl ripgrep

      - name: Run curl, Go, and Autobahn interoperability
        env:
          NEVERC_RUN_AUTOBAHN: '1'
        run: utils/ci/run-http-websocket-interop.sh "$PWD" clang 19090
