name: debug-win-arm64-stdlib

# Manual only. Downloads a prebuilt windows-arm64 neverc and compiles just
# StdLibTest.tls / http_stage5 — no toolchain rebuild.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'windows-arm64-neverc-build run id to pull compiler from'
        required: false
        default: '32607167492'
      green_run_id:
        description: 'last-green windows-arm64-neverc-build run id'
        required: false
        default: '32595477221'

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC (native arm64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Download prebuilt neverc (no rebuild)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          RID="${{ github.event.inputs.run_id }}"
          GRID="${{ github.event.inputs.green_run_id }}"
          [ -n "$RID" ] || RID=32607167492
          [ -n "$GRID" ] || GRID=32595477221
          gh run download "$RID" -n windows-arm64-neverc -D dl-new -R "${{ github.repository }}"
          python - <<'PY'
          import glob, zipfile, os
          z = glob.glob('dl-new/*.zip')[0]
          os.makedirs('compiler-new', exist_ok=True)
          zipfile.ZipFile(z).extractall('compiler-new')
          PY
          test -f compiler-new/install/bin/neverc.exe
          compiler-new/install/bin/neverc.exe --version
          mkdir -p oldtls
          git show 1fa02f6ecd4d2ec25af2d4223da16abc7224b64d:std/src/crypto/tls/tls_handshake.c > oldtls/tls_handshake.c
          git show 1fa02f6ecd4d2ec25af2d4223da16abc7224b64d:std/src/crypto/tls/tls_config.c > oldtls/tls_config.c
          git show 1fa02f6ecd4d2ec25af2d4223da16abc7224b64d:std/src/crypto/tls/tls_internal.h > oldtls/tls_internal.h

      - name: Enable local crash dumps
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps' -Name DumpFolder -Value "$env:GITHUB_WORKSPACE\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps' -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps' -Name DumpCount -Value 10 -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dumps" | Out-Null

      - name: Find cdb
        shell: bash
        run: |
          set +e
          echo "=== search cdb ==="
          ls -la "/c/Program Files (x86)/Windows Kits/10/Debuggers/" 2>/dev/null
          ls -la "/c/Program Files/Windows Kits/10/Debuggers/" 2>/dev/null
          find "/c/Program Files (x86)/Windows Kits/10/Debuggers" "/c/Program Files/Windows Kits/10/Debuggers" \
            -name 'cdb.exe' 2>/dev/null
          find "/c/Program Files/Microsoft Visual Studio" -name 'cdb.exe' 2>/dev/null | head

      - name: Patch tests with progress + crash hook
        shell: python
        run: |
          from pathlib import Path
          hook = r'''
          #include <stdio.h>
          #ifdef _WIN32
          #include <windows.h>
          static LONG neverc_debug_crash(EXCEPTION_POINTERS *ep) {
              char buf[768];
              int n = snprintf(buf, sizeof(buf),
                               "CRASH code=%08lx addr=%p info0=%p info1=%p\n",
                               (unsigned long)ep->ExceptionRecord->ExceptionCode,
                               (void *)ep->ExceptionRecord->ExceptionAddress,
                               (void *)ep->ExceptionRecord->ExceptionInformation[0],
                               (void *)ep->ExceptionRecord->ExceptionInformation[1]);
              HANDLE f = CreateFileA("crash.txt", GENERIC_WRITE, FILE_SHARE_READ,
                                     NULL, CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, NULL);
              if (f != INVALID_HANDLE_VALUE) {
                  DWORD w = 0;
                  if (n > 0)
                      WriteFile(f, buf, (DWORD)n, &w, NULL);
                  void *stack[16];
                  USHORT frames = CaptureStackBackTrace(0, 16, stack, NULL);
                  for (USHORT i = 0; i < frames; i++) {
                      n = snprintf(buf, sizeof(buf), "  #%u %p\n",
                                   (unsigned)i, stack[i]);
                      if (n > 0)
                          WriteFile(f, buf, (DWORD)n, &w, NULL);
                  }
                  CloseHandle(f);
              }
              HANDLE err = GetStdHandle(STD_ERROR_HANDLE);
              if (err && err != INVALID_HANDLE_VALUE && n > 0) {
                  DWORD w = 0;
                  WriteFile(err, buf, (DWORD)n, &w, NULL);
              }
              return EXCEPTION_CONTINUE_SEARCH;
          }
          static void neverc_debug_install(void) {
              setvbuf(stdout, NULL, _IONBF, 0);
              setvbuf(stderr, NULL, _IONBF, 0);
              AddVectoredExceptionHandler(1, neverc_debug_crash);
          }
          #else
          static void neverc_debug_install(void) {
              setvbuf(stdout, NULL, _IONBF, 0);
              setvbuf(stderr, NULL, _IONBF, 0);
          }
          #endif
          '''
          def wrap_calls(src, names):
              for name in names:
                  src = src.replace(
                      f'    {name}();',
                      f'    printf("BEGIN {name}\\n"); {name}(); printf("END {name}\\n");')
              return src
          tls = Path('tests/neverc/std/test_tls.c')
          src = hook + tls.read_text()
          src = src.replace(
              'int main(void) {\n    printf("=== NeverC TLS Tests ===\\n");',
              'int main(void) {\n    neverc_debug_install();\n    printf("=== NeverC TLS Tests ===\\n");')
          src = wrap_calls(src, [
              'test_config', 'test_cipher_suites',
              'test_certificate_chain_verification',
              'test_certificate_verify_signing', 'test_certificate_verify',
              'test_dial_errors', 'test_client_server',
              'test_session_resumption', 'test_alpn_no_overlap',
              'test_concurrent_record_io', 'test_mutual_tls',
              'test_dial_infers_sni', 'test_dial_does_not_persist_inferred_sni',
              'test_unexpected_server_record_alert',
              'test_malformed_server_hello_alert',
              'test_plaintext_record_version_ignored',
              'test_hello_retry_request_alert',
              'test_trailing_plaintext_after_server_hello',
              'test_oversized_server_handshake_alert',
              'test_malformed_client_hello_alert',
              'test_tls12_client_hello_alert',
              'test_oversized_client_handshake_alert',
              'test_malformed_handshake_alert',
              'test_application_io_before_handshake'])
          src = src.replace(
              '    printf("[client_server]\\n");',
              '    printf("[client_server]\\n"); printf("STEP enter\\n");')
          src = src.replace(
              '    check_int("create_tls_pipe",\n              neverc_tcp_pipe(&client_tcp, &server_tcp), 0);',
              '    printf("STEP pipe\\n");\n'
              '    check_int("create_tls_pipe",\n'
              '              neverc_tcp_pipe(&client_tcp, &server_tcp), 0);\n'
              '    printf("STEP pipe_done\\n");')
          src = src.replace(
              '    HANDLE thread = CreateThread(\n        NULL, 0, tls_server_thread, &ctx, 0, NULL);',
              '    printf("STEP thread\\n");\n'
              '    HANDLE thread = CreateThread(\n'
              '        NULL, 0, tls_server_thread, &ctx, 0, NULL);\n'
              '    printf("STEP thread_started\\n");')
          src = src.replace(
              '        neverc_tls_conn_t *client =\n            neverc_tls_client(client_tcp, client_config, &err);',
              '        printf("STEP client_hs\\n");\n'
              '        neverc_tls_conn_t *client =\n'
              '            neverc_tls_client(client_tcp, client_config, &err);\n'
              '        printf("STEP client_hs_done client=%p err=%s\\n",\n'
              '               (void *)client, err ? err : "null");')
          src = src.replace(
              '    neverc_tls_conn_t *conn =\n        neverc_tls_server(ctx->tcp, ctx->config, &err);\n    if (conn) {\n        ctx->handshake_ok = 1;',
              '    printf("STEP server_hs\\n");\n'
              '    neverc_tls_conn_t *conn =\n'
              '        neverc_tls_server(ctx->tcp, ctx->config, &err);\n'
              '    printf("STEP server_hs_done conn=%p err=%s\\n",\n'
              '           (void *)conn, err ? err : "null");\n'
              '    if (conn) {\n'
              '        ctx->handshake_ok = 1;')
          src = src.replace(
              '            check_int("client_negotiated_server_preferred_alpn",',
              '            printf("STEP client_alpn %s\\n",\n'
              '                   neverc_tls_alpn(client) ? neverc_tls_alpn(client) : "null");\n'
              '            check_int("client_negotiated_server_preferred_alpn",')
          src = src.replace(
              '            check_int("client_outbound_sni_state",',
              '            printf("STEP client_sni %s\\n",\n'
              '                   neverc_tls_server_name(client) ? neverc_tls_server_name(client) : "null");\n'
              '            check_int("client_outbound_sni_state",')
          src = src.replace(
              '            check_int("reject_invalid_key_update_request",\n                      neverc_tls_key_update(client, 2) != 0, 1);',
              '            printf("STEP client_key_update2\\n");\n'
              '            check_int("reject_invalid_key_update_request",\n'
              '                      neverc_tls_key_update(client, 2) != 0, 1);\n'
              '            printf("STEP client_key_update2_done\\n");')
          src = src.replace(
              '            check_int("client_write",\n                      neverc_tls_write(client, "ping", 4), 4);',
              '            printf("STEP client_write\\n");\n'
              '            check_int("client_write",\n'
              '                      neverc_tls_write(client, "ping", 4), 4);\n'
              '            printf("STEP client_write_done\\n");')
          src = src.replace(
              '        ctx->key_update_ok =\n            neverc_tls_key_update(conn, 1) == 0;',
              '        printf("STEP server_key_update\\n");\n'
              '        ctx->key_update_ok =\n            neverc_tls_key_update(conn, 1) == 0;\n'
              '        printf("STEP server_key_update_done %d\\n", ctx->key_update_ok);')
          tls.write_text(src)
          h5 = Path('tests/neverc/std/test_http_stage5.c')
          htext = hook + h5.read_text()
          htext = htext.replace(
              'int main(void) {\n    puts("HTTP stage 5 production API test suite:");',
              'int main(void) {\n    neverc_debug_install();\n    puts("HTTP stage 5 production API test suite:");')
          htext = wrap_calls(htext, [
              'http_stage5_plain_e2e', 'http_stage5_response_framing',
              'http_stage5_client_security', 'http_stage5_tls_e2e'])
          htext = htext.replace(
              '    CHECK(neverc_network_test_write_certs("http-stage5", &files) == 0);',
              '    printf("STEP write_certs\\n");\n'
              '    CHECK(neverc_network_test_write_certs("http-stage5", &files) == 0);\n'
              '    printf("STEP write_certs_done\\n");')
          htext = htext.replace(
              '    test.server = neverc_http_server_new(mux, &server_config);',
              '    printf("STEP server_new\\n");\n'
              '    test.server = neverc_http_server_new(mux, &server_config);\n'
              '    printf("STEP server_new_done\\n");')
          htext = htext.replace(
              '        ? http_stage5_start_server(&test) : NULL;',
              '        ? (printf("STEP start_server\\n"), http_stage5_start_server(&test)) : NULL;')
          htext = htext.replace(
              '    int port = executor ? http_stage5_wait_for_port(test.server) : -1;',
              '    printf("STEP wait_port\\n");\n'
              '    int port = executor ? http_stage5_wait_for_port(test.server) : -1;\n'
              '    printf("STEP wait_port_done %d\\n", port);')
          h5.write_text(htext)
          print('patched')

      - name: Reproduce tls and http_stage5
        shell: bash
        run: |
          set +e
          STD=$(cygpath -m "$PWD/std")
          FLAGS="-I$STD/include -I$STD/src/net -I$STD/src/crypto/tls -Wall -Wextra -Wno-unused-parameter -Wno-unused-function -O1 -g -fno-builtin-std -Wno-deprecated-declarations"
          NEW_NCC=$(cygpath -m "$PWD/compiler-new/install/bin/neverc.exe")

          TLS_SRCS=(
            src/compress/gzip/gzip.c
            src/compress/flate/flate.c
            src/hash/crc32/crc32.c
            src/thread/thread.c
            src/crypto/tls/tls.c
            src/crypto/tls/tls_config.c
            src/crypto/tls/tls_record.c
            src/crypto/tls/tls_handshake.c
            src/crypto/tls/tls_verify.c
            src/crypto/tls/tls_key.c
            src/crypto/tls/tls_key_schedule.c
            src/crypto/ecdh/ecdh.c
            src/crypto/aes/aes.c
            src/crypto/gcm/gcm.c
            src/crypto/chacha20/chacha20.c
            src/crypto/poly1305/poly1305.c
            src/crypto/chacha20poly1305/chacha20poly1305.c
            src/crypto/sha256/sha256.c
            src/crypto/sha512/sha512.c
            src/crypto/sha384/sha384.c
            src/crypto/sha1/sha1.c
            src/crypto/md5/md5.c
            src/crypto/hmac/hmac.c
            src/crypto/hkdf/hkdf.c
            src/crypto/rand/rand.c
            src/crypto/subtle/subtle.c
            src/crypto/x509/x509.c
            src/crypto/x509/x509_verify.c
            src/crypto/x509/x509_pool.c
            src/crypto/x509/x509_system.c
            src/crypto/rsa/rsa.c
            src/crypto/ecdsa/ecdsa.c
            src/crypto/ed25519/ed25519.c
            src/crypto/elliptic/elliptic.c
            src/math/big/big.c
            src/encoding/base64/base64.c
            src/encoding/pem/pem.c
            src/net/tcp/tcp.c
            src/net/tcp/tcp_context.c
            src/context/context.c
          )

          abs_srcs() {
            local s
            for s in "$@"; do
              if [ "$s" = "src/crypto/tls/tls_handshake.c" ] && [ -n "${OLD_TLS:-}" ]; then
                echo "$(cygpath -m "$PWD/oldtls/tls_handshake.c")"
              elif [ "$s" = "src/crypto/tls/tls_config.c" ] && [ -n "${OLD_TLS:-}" ]; then
                echo "$(cygpath -m "$PWD/oldtls/tls_config.c")"
              else
                echo "$(cygpath -m "$PWD/std/$s")"
              fi
            done
          }

          CDB=""
          echo "CDB=$CDB (skipped; STEPs + crash.txt are enough)"

          run_exe() {
            local exe=$1
            local label=$2
            rm -f crash.txt
            echo "=== run $label ==="
            python - "$exe" "$label" <<'PY'
          import subprocess, sys, os
          exe, label = sys.argv[1], sys.argv[2]
          env = os.environ.copy()
          env["PYTHONUNBUFFERED"] = "1"
          p = subprocess.run([exe], stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                             text=True, errors="replace", env=env)
          print(f"run_{label}_exit={p.returncode} unsigned={p.returncode & 0xffffffff:#x}")
          print("--- stdout ---")
          print(p.stdout if p.stdout else "(empty)")
          print("--- stderr ---")
          print(p.stderr if p.stderr else "(empty)")
          sys.exit(0)
          PY
            if [ -f crash.txt ]; then
              echo "--- crash.txt ---"
              cat crash.txt
            else
              echo "(no crash.txt)"
            fi
            if [ -n "$CDB" ] && [ -f "$exe" ]; then
              echo "=== cdb $label ==="
              "$CDB" -c "g; .ecxr; kn 40; q" "$exe" < /dev/null 2>&1 | tail -120
            fi
          }

          compile_tls() {
            local ncc=$1
            local out=$2
            local extra=$3
            echo "=== compile $out extra='$extra' oldtls='${OLD_TLS:-}' ncc=$ncc ==="
            "$ncc" $FLAGS $extra -o "$out" \
              "$(cygpath -m "$PWD/tests/neverc/std/test_tls.c")" \
              $(abs_srcs "${TLS_SRCS[@]}")
            echo "compile_${out}_exit=$?"
          }

          echo "===== A: ce296be neverc + HEAD tls source ====="
          TLS_OUT=$(cygpath -m "$PWD/test_tls.exe")
          compile_tls "$NEW_NCC" "$TLS_OUT" ""
          run_exe "$TLS_OUT" tls_head_newcc

          echo "===== B: ce296be neverc + 1fa02f6 tls_{handshake,config,internal} ====="
          OLD_TLS=1
          TLS_OLD=$(cygpath -m "$PWD/test_tls_oldsrc.exe")
          compile_tls "$NEW_NCC" "$TLS_OLD" ""
          run_exe "$TLS_OLD" tls_oldsrc_newcc
          unset OLD_TLS

          echo "===== D: http_stage5 HEAD / ce296be neverc ====="
          H5_OUT=$(cygpath -m "$PWD/test_http_stage5.exe")
          H5_SRCS=(
            src/net/http/http.c
            src/net/http/http_client.c
            src/net/http/http2/http2.c
            src/net/http/http2/http2_server.c
            src/net/http/http2/http2_client.c
            src/time/time.c
            src/net/url/url.c
            src/net/netip/netip.c
            "${TLS_SRCS[@]}"
          )
          echo "=== compile http_stage5 ==="
          "$NEW_NCC" $FLAGS -o "$H5_OUT" \
            "$(cygpath -m "$PWD/tests/neverc/std/test_http_stage5.c")" \
            $(abs_srcs "${H5_SRCS[@]}")
          echo "compile_http_stage5_exit=$?"
          run_exe "$H5_OUT" http_stage5

          echo "=== done ==="
