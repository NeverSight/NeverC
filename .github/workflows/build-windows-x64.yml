name: windows-x64-neverc-build

permissions:
  contents: write

on: [push, pull_request]

jobs:
  build:
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: windows-latest
    env:
      BUILD_TYPE: RelWithDebInfo
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        path: neverc

    - name: Setup build deps
      run: choco install ninja cmake 7zip -y

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build neverc
      shell: bash
      run: |
        cmake -GNinja -Bbuild \
        -DCMAKE_INSTALL_PREFIX=install \
        -DLLVM_ENABLE_ASSERTIONS=OFF \
        -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
        -DNEVERC_INCLUDE_TESTS=ON \
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
        -C neverc/neverc/cmake/caches/NeverC.cmake \
        neverc/llvm
        cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc

    - name: Build bundled Windows runtime
      shell: bash
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-runtime-x64-msvc neverc-runtime-shared-msvc

    - name: Install neverc
      shell: bash
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target install

    - name: Package neverc
      run: 7z a windows-x64-neverc.zip install

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-neverc
        path: windows-x64-neverc.zip

    - name: Package neverc compiler (without runtime)
      shell: bash
      run: |
        mv install/runtime install-runtime-stash
        7z a windows-x64-neverc-compiler.zip install
        mv install-runtime-stash install/runtime

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-neverc-compiler
        path: windows-x64-neverc-compiler.zip

    - name: Package neverc runtime
      run: 7z a windows-x64-neverc-runtime.zip install/runtime

    - name: Upload Runtime Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-neverc-runtime
        path: windows-x64-neverc-runtime.zip

    # Package link-time PDBs (neverc.pdb etc.) for windbg/VS crash triage.
    # Only build/bin/*.pdb — per-target compile PDBs under build/lib/** are
    # already merged into the link-time PDB and would push the zip past
    # GitHub's 2 GB artifact limit.
    - name: Package PDBs
      shell: bash
      run: 7z a windows-x64-neverc-pdb.zip ./build/bin/*.pdb

    - name: Upload PDB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-neverc-pdb
        path: windows-x64-neverc-pdb.zip

    - name: Build Plugin SDK
      shell: bash
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

    - name: Test Plugin SDK (build + load)
      shell: bash
      run: |
        set -e
        make -C build/pluginsdk/examples \
          NEVERC=$PWD/build/bin/neverc \
          INCLUDE_DIR=$PWD/build/pluginsdk/include
        printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
        for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
          echo "--- Testing $plugin ---"
          build/bin/neverc \
            --target=x86_64-pc-windows-msvc \
            -fplugin-pass=build/pluginsdk/examples/${plugin}.dll \
            -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
          echo "--- $plugin OK ---"
        done

    - name: Run neverc tests
      id: tests
      shell: bash
      continue-on-error: true
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --target check-neverc

    - name: Diagnose crashes
      if: steps.tests.outcome == 'failure'
      shell: bash
      run: |
        set -x
        NCC=$PWD/build/bin/neverc.exe
        TESTDIR=$PWD/neverc/tests/neverc

        diagnose() {
          local label=$1 src=$2 flags=$3
          echo "=== [$label] step 1: compile to .obj ==="
          $NCC $flags -c "$src" -o "$TEMP/diag_${label}.obj" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 2: link .obj to exe ==="
          $NCC $flags "$TEMP/diag_${label}.obj" -o "$TEMP/diag_${label}.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 3: compile+link (one shot) ==="
          $NCC $flags "$src" -o "$TEMP/diag_${label}_oneshot.exe" 2>&1 && echo "OK" || echo "EXIT=$?"

          echo "=== [$label] step 4: run exe ==="
          "$TEMP/diag_${label}_oneshot.exe" 2>&1 && echo "OK" || echo "EXIT=$?"
        }

        # Smoke diagnostics for Windows x64
        diagnose "c_stdlib" \
          "$TESTDIR/codegen/test_c_stdlib_patterns.c" \
          "-std=gnu11 -O2"

    - name: Fail if tests failed
      if: steps.tests.outcome == 'failure'
      shell: bash
      run: exit 1
