name: debug-rpc-deadline-tsan

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of deadline test repetitions
        required: false
        default: "50"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      LLVM_APT_VER: "22"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: neverc

      - name: Install Clang
        run: |
          bash neverc/.github/scripts/configure-apt-ubuntu.sh
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_APT_VER"
          clang-"$LLVM_APT_VER" --version

      - name: Build focused RPC TSan test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("neverc/tests/neverc/std/test_rpc.c")
          source = path.read_text()
          assertion = "        CHECK(result == NEVERC_RPC_IO_CANCELLED);\n"
          diagnostic = (
              "        fprintf(stderr, \"RPC_DEADLINE_RESULT result=%d "
              "status=%d done=%d\\n\", result, (int)status.code, "
              "neverc_context_done(deadline));\n"
              + assertion
          )
          if source.count(assertion) != 1:
              raise SystemExit("deadline assertion anchor changed")
          source = source.replace(assertion, diagnostic)
          main = source.index("int main(void) {")
          source = source[:main] + """int main(void) {
              printf("NRPC focused deadline test:\\n");
              rpc_test_call_deadline();
              printf("rpc deadline: %d checks, %d failed\\n",
                     tests_run, tests_failed);
              return tests_failed == 0 ? 0 : 1;
          }
          """
          path.write_text(source)
          PY

          mapfile -t sources < <(
            git -C neverc ls-files ':(glob)std/src/**/*.c' |
              while IFS= read -r source; do
                printf 'neverc/%s\n' "$source"
              done
          )
          clang-"$LLVM_APT_VER" \
            -std=gnu11 -O1 -g -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -Wno-unused-parameter \
            -Wno-unused-function -fsanitize=thread \
            -Ineverc/std/include -Ineverc/std/src/net \
            -Ineverc/std/src/net/quic \
            neverc/tests/neverc/std/test_rpc.c "${sources[@]}" \
            -pthread -lm -lresolv -ldl -o rpc-deadline-tsan

      - name: Reproduce deadline result
        env:
          ITERATIONS: ${{ inputs.iterations }}
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: |
          failures=0
          for iteration in $(seq 1 "$ITERATIONS"); do
            echo "RPC_DEADLINE_ITERATION=$iteration"
            set +e
            timeout 20s ./rpc-deadline-tsan 2>&1 | tee iteration.log
            status=${PIPESTATUS[0]}
            set -e
            if (( status != 0 )); then
              echo "RPC_DEADLINE_FAILURE iteration=$iteration status=$status"
              failures=$((failures + 1))
            fi
          done
          echo "RPC_DEADLINE_SUMMARY iterations=$ITERATIONS failures=$failures"
          (( failures == 0 ))
