# Release build for macOS arm64 (non-PGO).
# Called by release.yml; manual dispatch builds signed artifacts without publishing.
name: macos-arm64-neverc-release

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  release:
    name: Build + test + sign + package
    if: github.repository == 'NeverSight/NeverC'
    runs-on: macos-15
    env:
      BUILD_TYPE: Release
      # Runner is pinned to macos-15 (above) for a stable Apple toolchain; this
      # low deployment target makes the shipped binary run on macOS 13+ instead
      # of defaulting to the runner OS (minos 15.0).
      # CMake initializes CMAKE_OSX_DEPLOYMENT_TARGET from this env var.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: neverc

      - name: Set up CPython 3.12 for official artifacts
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Select latest stable Xcode (Apple Clang)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          clang --version

      - name: Install deps
        run: brew install ninja cmake p7zip

      # ── Apple Developer ID signing + notarization ───────────
      # Imported before the build, not after it: the credentials do not depend
      # on anything the build produces, and a bad one previously surfaced only
      # once the hour-long compile had already been paid for -- taking the
      # binaries with it, since packaging and artifact upload sit downstream of
      # signing.  Failing here costs a minute instead.
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 is empty or not set."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          if ! printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"; then
            echo "::error::APPLE_CERTIFICATE_BASE64 is not valid base64. Re-create it with: base64 -i cert.p12 | pbcopy"
            exit 1
          fi

          CERT_SIZE=$(wc -c < "$CERT_PATH" | tr -d ' ')
          echo "Decoded certificate: ${CERT_SIZE} bytes"
          if [ "$CERT_SIZE" -lt 512 ]; then
            echo "::error::Decoded certificate is only ${CERT_SIZE} bytes, so the secret is truncated or holds something other than a .p12."
            exit 1
          fi

          # Homebrew's OpenSSL 3 where available: the system LibreSSL cannot
          # rewrite a PKCS#12 into the legacy encryption security(1) accepts.
          OPENSSL=/opt/homebrew/opt/openssl@3/bin/openssl
          [ -x "$OPENSSL" ] || OPENSSL=$(command -v openssl)
          echo "Using $("$OPENSSL" version)"

          # Separate a wrong password from an unreadable file up front, so the
          # import failure below can only mean an encryption-algorithm mismatch.
          if ! "$OPENSSL" pkcs12 -in "$CERT_PATH" -passin "pass:${APPLE_CERTIFICATE_PASSWORD}" \
                 -nokeys -noout 2> "$RUNNER_TEMP/p12.err"; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD does not open the .p12, or the file is not a PKCS#12 archive."
            sed 's/^/  openssl: /' "$RUNNER_TEMP/p12.err"
            exit 1
          fi
          echo "PKCS#12 opens with the configured password."

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$("$OPENSSL" rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          import_cert() {
            security import "$1" \
              -k "$KEYCHAIN_PATH" \
              -P "${APPLE_CERTIFICATE_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          }

          if ! import_cert "$CERT_PATH"; then
            # The password already opened the archive above, so the only thing
            # left for security(1) to object to is the encryption itself: it
            # cannot read the AES-256-CBC/PBKDF2 PKCS#12 that OpenSSL 3 writes
            # by default, and reports that as "MAC verification failed (wrong
            # password?)".  Re-encrypt with the algorithms it does accept.
            echo "Direct import failed; re-encrypting the archive with legacy PKCS#12 algorithms."
            PLAIN_PATH="$RUNNER_TEMP/certificate-plain.pem"
            LEGACY_PATH="$RUNNER_TEMP/certificate-legacy.p12"
            trap 'rm -f "$PLAIN_PATH" "$LEGACY_PATH"' EXIT

            "$OPENSSL" pkcs12 -in "$CERT_PATH" -passin "pass:${APPLE_CERTIFICATE_PASSWORD}" \
              -nodes -out "$PLAIN_PATH"
            # -legacy exists only on OpenSSL 3; LibreSSL both lacks the flag and
            # already defaults to the older algorithms, so plain -export is the
            # right call there.
            "$OPENSSL" pkcs12 -export -legacy -in "$PLAIN_PATH" -out "$LEGACY_PATH" \
                -passout "pass:${APPLE_CERTIFICATE_PASSWORD}" 2>/dev/null \
              || "$OPENSSL" pkcs12 -export -in "$PLAIN_PATH" -out "$LEGACY_PATH" \
                   -passout "pass:${APPLE_CERTIFICATE_PASSWORD}"
            rm -f "$PLAIN_PATH"

            import_cert "$LEGACY_PATH"
            rm -f "$LEGACY_PATH"
          fi
          rm -f "$CERT_PATH"

          # Dumps the whole keychain to stdout on success; only failures matter.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          # find-identity exits 0 even when it matched nothing, so the identity
          # the signing step needs has to be checked for by name.
          echo "Available signing identities:"
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          echo "$IDENTITIES"
          if ! printf '%s' "$IDENTITIES" | grep -q "Developer ID Application"; then
            echo "::error::The certificate imported, but it is not a 'Developer ID Application' certificate, which is the only kind that can sign software for distribution outside the App Store."
            exit 1
          fi

      - name: Build neverc
        run: |
          cmake -GNinja -Bbuild \
          -DCMAKE_INSTALL_PREFIX=install \
          -DLLVM_ENABLE_ASSERTIONS=OFF \
          -DLLVM_TOOL_LLVM_SHLIB_BUILD=off \
          -DHAVE_STD_IS_TRIVIALLY_COPYABLE=0 \
          -DNEVERC_INCLUDE_TESTS=OFF \
          -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
          -DNEVERC_ENABLE_PYTHON_PLUGINS=ON \
          -DNEVERC_BUNDLE_PYTHON_RUNTIME=ON \
          -DNEVERC_STRIP_BINARY=ON \
          -DNEVERC_ENABLE_LTO=ON \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -C neverc/neverc/cmake/caches/NeverC.cmake \
          neverc/llvm
          time cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-embed-runtime-bitcode

      - name: Build Plugin SDK
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target neverc-pluginsdk

      - name: Test Plugin SDK (build + load)
        run: |
          set -e
          make -C build/pluginsdk/examples \
            "NEVERC=$PWD/build/bin/neverc" \
            "INCLUDE_DIR=$PWD/build/pluginsdk/include"
          printf 'int main(void) { return 0; }\n' > /tmp/plugin_test.c
          for plugin in ExamplePlugin CrtShimPlugin BenchPlugin; do
            echo "--- Testing $plugin ---"
            build/bin/neverc \
              --target=x86_64-pc-windows-msvc \
              -fplugin-pass=build/pluginsdk/examples/${plugin}.dylib \
              -c /tmp/plugin_test.c -o /tmp/plugin_test.obj
            echo "--- $plugin OK ---"
          done

      - name: Install neverc
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --target install

      - name: Sign neverc binaries
        if: github.repository == 'NeverSight/NeverC'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IDENTITY="Developer ID Application: NEVERSIGHT LLC ($APPLE_TEAM_ID)"
          INSTALL_DIR="${GITHUB_WORKSPACE}/install"
          SIGNED=0

          while IFS= read -r -d '' bin; do
            filetype=$(file -b "$bin")
            case "$filetype" in
              *Mach-O*)
                echo "Signing: $bin"
                codesign --force --timestamp --options runtime \
                  --sign "$IDENTITY" \
                  --keychain "$SIGNING_KEYCHAIN" \
                  "$bin"
                SIGNED=$((SIGNED + 1))
                ;;
            esac
          done < <(find "$INSTALL_DIR" -type f -print0)

          echo "Signed $SIGNED Mach-O binaries"
          [ "$SIGNED" -gt 0 ] || { echo "ERROR: no binaries were signed" >&2; exit 1; }

          echo "Verifying signatures..."
          find "$INSTALL_DIR" -type f -print0 | while IFS= read -r -d '' bin; do
            if file -b "$bin" | grep -q 'Mach-O'; then
              codesign --verify --deep --strict "$bin"
              echo "  ✓ $(basename "$bin")"
            fi
          done

      - name: Notarize neverc
        if: github.repository == 'NeverSight/NeverC'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          NOTARIZE_ZIP="$RUNNER_TEMP/neverc-notarize.zip"

          ditto -c -k --keepParent "${GITHUB_WORKSPACE}/install" "$NOTARIZE_ZIP"

          echo "Submitting to Apple for notarization..."
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m

          echo "Notarization complete"
          rm -f "$NOTARIZE_ZIP"

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
      # ── End signing ─────────────────────────────────────────

      - name: Package (full, with runtime)
        run: 7z a macos-arm64-neverc.zip install

      - name: Verify relocated full release archive
        run: |
          "${{ steps.python.outputs.python-path }}" \
            neverc/utils/release/test-python-plugin-package.py \
            --archive macos-arm64-neverc.zip

      # runtime/ is deliberately absent: it is fetched on demand by
      # `neverc runtime install <target>`.  pluginsdk/ has no such fallback,
      # so leaving it out would make the SDK reachable only from the full
      # archive, which install.sh never downloads.
      - name: Package (binary + headers + plugin SDK, for curl installer)
        run: cd install && zip -r ../neverc-macos-arm64.zip bin lib pluginsdk python

      # Consumes the archive a curl install actually receives, from a clean
      # prefix and with a compiler that is not neverc, so a packaging gap fails
      # here rather than on a user's first `find_package(NevercPluginSDK)`.
      - name: Verify the curl-installer archive carries a usable SDK
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/pkg-check"
          unzip -q neverc-macos-arm64.zip -d "$RUNNER_TEMP/pkg-check"
          python3 neverc/utils/plugin-api/test-installed-sdk.py \
            --prefix "$RUNNER_TEMP/pkg-check"

      - name: Verify relocated curl-installer archive
        run: |
          "${{ steps.python.outputs.python-path }}" \
            neverc/utils/release/test-python-plugin-package.py \
            --archive neverc-macos-arm64.zip

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-neverc
          path: |
            macos-arm64-neverc.zip
            neverc-macos-arm64.zip
