name: debug-std-windows-timer-callbacks

on:
  push:
    tags:
      - 'std-red-20260830-net-timer-callback-mutations-win'
      - 'std-fix-20260830-net-timer-callback-mutations-win'

permissions:
  actions: read
  contents: read

jobs:
  timer-callbacks:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact RED source
        if: github.ref_name == 'std-red-20260830-net-timer-callback-mutations-win'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1602a68d64dec2ad46bbd046a09b14f8e97aabae
          path: source

      - name: Checkout exact GREEN source
        if: github.ref_name == 'std-fix-20260830-net-timer-callback-mutations-win'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c2a32f0856b376dca0db091bc4c02342af62891a
          path: source

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Download exact failed-run compiler artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-neverc-compiler
          path: artifact
          github-token: ${{ github.token }}
          repository: NeverSight/NeverC
          run-id: 33303699381

      - name: Extract exact compiler artifact
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath artifact -Filter '*.zip' |
            Select-Object -First 1
          if (-not $archive) {
            throw 'windows-x64-neverc-compiler.zip was not downloaded'
          }
          7z x $archive.FullName "-o$PWD/compiler" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -LiteralPath compiler -Recurse `
            -Filter neverc.exe | Where-Object FullName -Match `
            '[\\/]install[\\/]bin[\\/]neverc\.exe$' | Select-Object -First 1
          if (-not $compiler) {
            throw 'install/bin/neverc.exe is absent from the compiler artifact'
          }
          Write-Host "compiler=$($compiler.FullName)"
          Get-FileHash -Algorithm SHA256 -LiteralPath $compiler.FullName

      - name: Compile and stress timer callback mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            std-red-20260830-net-timer-callback-mutations-win)
              expected=1602a68d64dec2ad46bbd046a09b14f8e97aabae
              ;;
            std-fix-20260830-net-timer-callback-mutations-win)
              expected=c2a32f0856b376dca0db091bc4c02342af62891a
              ;;
            *)
              echo "unexpected diagnostic tag: $GITHUB_REF_NAME"
              exit 2
              ;;
          esac
          actual=$(git -C "$PWD/source" rev-parse HEAD)
          test "$actual" = "$expected"
          echo "source_sha=$actual"

          ncc=$(find "$PWD/compiler" -path '*/install/bin/neverc.exe' \
            -print -quit)
          test -n "$ncc"
          "$ncc" --version
          work="$RUNNER_TEMP/neverc-timer-callbacks"
          mkdir -p "$work"
          "$ncc" \
            -I"$PWD/source/std/include" \
            -I"$PWD/source/std/src/net" \
            -std=gnu11 -Wall -Wextra -Werror -O1 -fno-builtin-std \
            -Wno-unused-parameter -Wno-unused-function \
            -Wno-deprecated-declarations -Wno-ignored-attributes \
            "$PWD/source/tests/neverc/std/test_net_internals.c" \
            "$PWD/source/std/src/net/tcp/tcp.c" \
            -o "$work/net_internals.exe"
          for ((round = 1; round <= 500; ++round)); do
            if ! output=$("$work/net_internals.exe" 2>&1); then
              echo "timer callback failure at round $round/500"
              printf '%s\n' "$output"
              exit 1
            fi
            if [[ "$output" != *'ALL PASSED'* ]]; then
              echo "missing pass marker at round $round/500"
              printf '%s\n' "$output"
              exit 1
            fi
            if ((round % 50 == 0)); then
              echo "timer callback rounds passed: $round/500"
            fi
          done
