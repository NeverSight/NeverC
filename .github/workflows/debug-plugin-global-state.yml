name: debug-plugin-global-state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker-self-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run plugin global-state checker self-test
        run: python3 utils/plugin-api/tests/test-check-global-state.py
