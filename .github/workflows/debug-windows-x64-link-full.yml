name: debug-windows-x64-link-full

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the exact Windows x64 LTO artifact
        required: true
        default: "30883194231"
      expected_sha:
        description: Exact source SHA that the artifact must come from
        required: true
        default: "504b0d786a3939fcbfa5ec66d22a264466766a27"

permissions:
  actions: read
  contents: read

jobs:
  link-full-regression:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Wait for exact fixed compiler artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" |
            ConvertFrom-Json
          if ($run.head_sha -ne $env:EXPECTED_SHA) {
            throw "run $env:SOURCE_RUN_ID has SHA $($run.head_sha), expected $env:EXPECTED_SHA"
          }

          $artifactName = 'windows-x64-neverc-clang-lto'
          $available = $false
          for ($attempt = 1; $attempt -le 180; $attempt++) {
            $artifacts = gh api `
              "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts" |
              ConvertFrom-Json
            if ($artifacts.artifacts.name -contains $artifactName) {
              $available = $true
              break
            }
            Write-Host "artifact not available yet (attempt $attempt/180)"
            Start-Sleep -Seconds 20
          }
          if (-not $available) {
            throw "artifact $artifactName was not uploaded within 60 minutes"
          }

          gh run download $env:SOURCE_RUN_ID `
            --name $artifactName `
            --dir artifacts/compiler `
            --repo $env:GITHUB_REPOSITORY
          New-Item -ItemType Directory -Force extracted | Out-Null
          7z x artifacts/compiler/windows-x64-neverc-clang-lto.zip `
            -oextracted | Out-Null

          $compiler = Resolve-Path extracted/install/bin/neverc.exe
          "NEVERC_FOCUSED_BINARY=$compiler" | Out-File `
            -FilePath $env:GITHUB_ENV -Append
          Write-Host "compiler_sha256=$((Get-FileHash $compiler -Algorithm SHA256).Hash)"
          & $compiler --version

      - name: Build coarse link observer plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          clang-cl /nologo /LD /std:c11 `
            /I neverc/include `
            /DNCF_OBSERVE_DRIVER_ARGS `
            /DNCF_OBSERVE_LINK_FULL `
            /Fodiag/domain-conformance.obj `
            /Fe:diag/domain-conformance.dll `
            tests/plugin-conformance/fixtures/DomainConformancePlugin.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'int main(void) { return 0; }' |
            Set-Content -Encoding Ascii diag/minimal.c

      - name: Verify coarse observer links stay fast
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = $env:NEVERC_FOCUSED_BINARY
          $plugin = (Resolve-Path diag/domain-conformance.dll).Path
          $source = (Resolve-Path diag/minimal.c).Path

          for ($round = 1; $round -le 3; $round++) {
            $stdout = Join-Path $PWD "diag/round-$round.stdout.txt"
            $stderr = Join-Path $PWD "diag/round-$round.stderr.txt"
            $log = Join-Path $PWD "diag/round-$round.events.txt"
            $output = Join-Path $PWD "diag/round-$round.exe"
            $arguments = @(
              "-fplugin=$plugin",
              '--no-default-config',
              '-fno-lto',
              '-fno-builtin-mimalloc',
              $source,
              '-o',
              $output
            )
            $environment = @{
              NEVERC_CONFORMANCE_LOG = $log
            }
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $compiler `
              -ArgumentList $arguments -PassThru `
              -Environment $environment `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            if (-not $process.WaitForExit(30000)) {
              taskkill /pid $process.Id /t /f 2>&1 | Write-Host
              throw "round $round exceeded the 30-second regression deadline"
            }
            $process.WaitForExit()
            $watch.Stop()
            $seconds = [math]::Round($watch.Elapsed.TotalSeconds, 2)
            Write-Host "TIMING round=$round seconds=$seconds exit=$($process.ExitCode)"
            if ($process.ExitCode -ne 0) {
              Get-Content $stderr | ForEach-Object { Write-Host $_ }
              throw "round $round failed with exit code $($process.ExitCode)"
            }
            if (-not (Test-Path $output)) {
              throw "round $round did not produce an executable"
            }
            if (-not (Select-String -Quiet -Path $log -Pattern '^observe:driver_args$')) {
              throw "round $round did not load the observer plugin"
            }
          }

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-link-full-regression
          path: diag
          if-no-files-found: warn
