<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="neverc-logo-title">
  <title id="neverc-logo-title">NeverC</title>

  <!-- Palette is VS Code Dark+: #1E1E1E editor background, #4EC9B0 type,
       #569CD6 keyword, #DCDCAA function, #3C3C3C panel border. -->
  <defs>
    <linearGradient id="tile" x1="72" y1="48" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252526"/>
      <stop offset="0.55" stop-color="#1E1E1E"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>

    <radialGradient id="sheen" cx="184" cy="120" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arc" x1="150" y1="372" x2="344" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EC9B0"/>
      <stop offset="1" stop-color="#569CD6"/>
    </linearGradient>

    <linearGradient id="core" x1="354" y1="236" x2="388" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8E8BE"/>
      <stop offset="1" stop-color="#DCDCAA"/>
    </linearGradient>

    <radialGradient id="glow" cx="370" cy="256" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0.44" stop-color="#DCDCAA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#DCDCAA" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="tileClip">
      <rect x="32" y="32" width="448" height="448" rx="104"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- The C is left open and a separate core sits in the gap: the language is
       the arc, what NeverC adds is the piece that was never part of it. -->
  <g clip-path="url(#tileClip)">
    <path d="M 326.19 166.16 A 114 114 0 1 0 326.19 345.84"
          fill="none" stroke="url(#arc)" stroke-width="44"/>

    <circle cx="370" cy="256" r="50" fill="url(#glow)"/>
    <circle cx="370" cy="256" r="23" fill="url(#core)"/>
  </g>

  <rect x="32.75" y="32.75" width="446.5" height="446.5" rx="103.25"
        fill="none" stroke="#3C3C3C" stroke-width="1.5"/>
</svg>
